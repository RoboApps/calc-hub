const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "Statistics Calculator", "sub": "Mean, median, mode, range, quartiles and standard deviation of your numbers, with the formulas.", "h1": "What the values mean", "p1": "Statistics describes a list of numbers with a few values: where the centre is (mean, median, mode) and how spread out the numbers are (range, quartiles, standard deviation). Press Example and follow the explanations below on the numbers 2 4 4 4 5 5 7 9.", "h2": "Population or sample?", "p2": "Use the population formulas (divide by n) when your numbers are the whole group, and the sample formulas (divide by n − 1) when they are a sample from a larger group. If you are unsure, the sample version is the usual choice for measured data. For the example numbers the population variance is 32 / 8 = 4 and the sample variance is 32 / 7 ≈ 4.571.", "note": "Everything is calculated in your browser and nothing you enter is stored or sent anywhere.", "h4": "Terms explained", "lim": "<li><b>Mean</b> (x̄ = Σx / n): Add all values and divide by how many there are. Example: (2+4+4+4+5+5+7+9) / 8 = 40 / 8 = 5. It is the balance point of the numbers, but a single very large or small value pulls it strongly.</li><li><b>Median</b>: Sort the values and take the middle one; with an even count take the average of the two middle values. Example: the middle values are 4 and 5, so the median is 4.5. Half of the values are below it and half above, and extreme values hardly affect it.</li><li><b>Mode</b>: The value that occurs most often. Example: 4 occurs three times. There can be several modes, or none if every value occurs once.</li><li><b>Range</b>: Largest value minus smallest value: 9 − 2 = 7. It is the simplest measure of spread, but depends on only two numbers.</li><li><b>Quartiles (Q1, Q3) and interquartile range</b>: Q1 splits off the lowest quarter of the sorted values and Q3 the top quarter. Here Q1 = 4 and Q3 = 6. The interquartile range Q3 − Q1 = 2 is the width of the middle half and ignores extreme values.</li><li><b>Variance</b> (σ² = Σ(x − x̄)² / n): How far the values are from the mean on average, measured in squares: subtract the mean from each value, square the differences, add them up and divide. Example: the squares are 9, 1, 1, 1, 0, 0, 4, 16, their sum is 32 and 32 / 8 = 4.</li><li><b>Standard deviation</b> (σ = √σ²): The square root of the variance, so it is in the same unit as your data. Example: √4 = 2. A small value means the numbers are close to the mean, a large one means they are spread out.</li><li>Quartiles are the medians of the lower and upper half of the sorted values (the middle value is left out when the count is odd).</li><li>Separate numbers with spaces, semicolons or new lines; a single comma is read as a decimal comma (1,5), several commas as a list (1,2,3).</li>"}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Štatistická kalkulačka", "sub": "Priemer, medián, modus, rozpätie, kvartily a smerodajná odchýlka tvojich čísel, so vzorcami.", "h1": "Čo hodnoty znamenajú", "p1": "Štatistika opisuje zoznam čísel niekoľkými hodnotami: kde je stred (priemer, medián, modus) a ako sú čísla rozptýlené (rozpätie, kvartily, smerodajná odchýlka). Stlač Príklad a sleduj vysvetlenia nižšie na číslach 2 4 4 4 5 5 7 9.", "h2": "Základný súbor alebo výber?", "p2": "Vzorce pre základný súbor (delenie n) použi, keď tvoje čísla tvoria celú skupinu, a vzorce pre výber (delenie n − 1), keď ide o vzorku z väčšej skupiny. Ak si nie si istý, pri nameraných dátach sa zvyčajne používa výberová verzia. Pri príkladových číslach je rozptyl základného súboru 32 / 8 = 4 a výberový rozptyl 32 / 7 ≈ 4,571.", "note": "Všetko sa počíta v tvojom prehliadači a nič, čo zadáš, sa neukladá ani neodosiela.", "h4": "Vysvetlenie pojmov", "lim": "<li><b>Priemer</b> (x̄ = Σx / n): Sčítaj všetky hodnoty a vydeľ ich počtom. Príklad: (2+4+4+4+5+5+7+9) / 8 = 40 / 8 = 5. Je to ťažisko čísel, ale jedna veľmi veľká alebo malá hodnota ho výrazne ťahá.</li><li><b>Medián</b>: Hodnoty zoraď a vezmi prostrednú; pri párnom počte vezmi priemer dvoch stredných. Príklad: stredné hodnoty sú 4 a 5, medián je teda 4,5. Polovica hodnôt je pod ním a polovica nad ním a extrémne hodnoty ho takmer neovplyvnia.</li><li><b>Modus</b>: Hodnota, ktorá sa vyskytuje najčastejšie. Príklad: 4 sa vyskytuje trikrát. Modusov môže byť viac, alebo žiadny, ak sa každá hodnota vyskytuje raz.</li><li><b>Rozpätie</b>: Najväčšia hodnota mínus najmenšia: 9 − 2 = 7. Je to najjednoduchšia miera rozptýlenia, ale závisí len od dvoch čísel.</li><li><b>Kvartily (Q1, Q3) a medzikvartilové rozpätie</b>: Q1 oddelí najnižšiu štvrtinu zoradených hodnôt a Q3 najvyššiu štvrtinu. Tu je Q1 = 4 a Q3 = 6. Medzikvartilové rozpätie Q3 − Q1 = 2 je šírka strednej polovice a extrémne hodnoty ignoruje.</li><li><b>Rozptyl</b> (σ² = Σ(x − x̄)² / n): V priemere, ako ďaleko sú hodnoty od priemeru, merané v štvorcoch: od každej hodnoty odpočítaj priemer, rozdiely umocni na druhú, sčítaj a vydeľ. Príklad: štvorce sú 9, 1, 1, 1, 0, 0, 4, 16, ich súčet je 32 a 32 / 8 = 4.</li><li><b>Smerodajná odchýlka</b> (σ = √σ²): Druhá odmocnina z rozptylu, takže je v rovnakej jednotke ako tvoje údaje. Príklad: √4 = 2. Malá hodnota znamená, že čísla sú blízko priemeru, veľká, že sú rozptýlené.</li><li>Kvartily sú mediány dolnej a hornej polovice zoradených hodnôt (pri nepárnom počte sa stredná hodnota vynecháva).</li><li>Čísla oddeľ medzerami, bodkočiarkami alebo novými riadkami; jedna čiarka sa číta ako desatinná čiarka (1,5), viac čiarok ako zoznam (1,2,3).</li>"}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Statistikrechner", "sub": "Mittelwert, Median, Modus, Spannweite, Quartile und Standardabweichung deiner Zahlen, mit Formeln.", "h1": "Was die Werte bedeuten", "p1": "Die Statistik beschreibt eine Zahlenliste mit wenigen Werten: wo die Mitte liegt (Mittelwert, Median, Modus) und wie weit die Zahlen streuen (Spannweite, Quartile, Standardabweichung). Drücke Beispiel und verfolge die Erklärungen unten an den Zahlen 2 4 4 4 5 5 7 9.", "h2": "Grundgesamtheit oder Stichprobe?", "p2": "Verwende die Formeln der Grundgesamtheit (Teilen durch n), wenn deine Zahlen die ganze Gruppe sind, und die Stichprobenformeln (Teilen durch n − 1), wenn sie eine Stichprobe aus einer größeren Gruppe sind. Im Zweifel ist die Stichprobenversion bei gemessenen Daten üblich. Bei den Beispielzahlen ist die Varianz der Grundgesamtheit 32 / 8 = 4 und die Stichprobenvarianz 32 / 7 ≈ 4,571.", "note": "Alles wird in deinem Browser berechnet; nichts, was du eingibst, wird gespeichert oder gesendet.", "h4": "Begriffe erklärt", "lim": "<li><b>Mittelwert</b> (x̄ = Σx / n): Addiere alle Werte und teile durch die Anzahl. Beispiel: (2+4+4+4+5+5+7+9) / 8 = 40 / 8 = 5. Er ist der Schwerpunkt der Zahlen, wird aber von einem sehr großen oder kleinen Wert stark verschoben.</li><li><b>Median</b>: Sortiere die Werte und nimm den mittleren; bei gerader Anzahl den Durchschnitt der beiden mittleren. Beispiel: Die mittleren Werte sind 4 und 5, der Median ist also 4,5. Die Hälfte der Werte liegt darunter, die Hälfte darüber, und Extremwerte beeinflussen ihn kaum.</li><li><b>Modus</b>: Der Wert, der am häufigsten vorkommt. Beispiel: 4 kommt dreimal vor. Es kann mehrere Modi geben oder keinen, wenn jeder Wert nur einmal vorkommt.</li><li><b>Spannweite</b>: Größter Wert minus kleinster Wert: 9 − 2 = 7. Sie ist das einfachste Streuungsmaß, hängt aber nur von zwei Zahlen ab.</li><li><b>Quartile (Q1, Q3) und Quartilsabstand</b>: Q1 trennt das untere Viertel der sortierten Werte ab, Q3 das obere Viertel. Hier ist Q1 = 4 und Q3 = 6. Der Quartilsabstand Q3 − Q1 = 2 ist die Breite der mittleren Hälfte und ignoriert Extremwerte.</li><li><b>Varianz</b> (σ² = Σ(x − x̄)² / n): Wie weit die Werte im Durchschnitt vom Mittelwert entfernt sind, gemessen in Quadraten: Ziehe von jedem Wert den Mittelwert ab, quadriere die Differenzen, addiere sie und teile. Beispiel: Die Quadrate sind 9, 1, 1, 1, 0, 0, 4, 16, ihre Summe ist 32 und 32 / 8 = 4.</li><li><b>Standardabweichung</b> (σ = √σ²): Die Quadratwurzel der Varianz, also in derselben Einheit wie deine Daten. Beispiel: √4 = 2. Ein kleiner Wert bedeutet, dass die Zahlen nah am Mittelwert liegen, ein großer, dass sie weit streuen.</li><li>Quartile sind die Mediane der unteren und oberen Hälfte der sortierten Werte (bei ungerader Anzahl bleibt der mittlere Wert außen vor).</li><li>Trenne Zahlen mit Leerzeichen, Semikolons oder Zeilenumbrüchen; ein einzelnes Komma gilt als Dezimalkomma (1,5), mehrere Kommas als Liste (1,2,3).</li>"}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Statistická kalkulačka", "sub": "Průměr, medián, modus, rozpětí, kvartily a směrodatná odchylka tvých čísel, se vzorci.", "h1": "Co hodnoty znamenají", "p1": "Statistika popisuje seznam čísel několika hodnotami: kde je střed (průměr, medián, modus) a jak jsou čísla rozptýlená (rozpětí, kvartily, směrodatná odchylka). Stiskni Příklad a sleduj vysvětlení níže na číslech 2 4 4 4 5 5 7 9.", "h2": "Základní soubor nebo výběr?", "p2": "Vzorce pro základní soubor (dělení n) použij, když tvá čísla tvoří celou skupinu, a vzorce pro výběr (dělení n − 1), když jde o vzorek z větší skupiny. Pokud si nejsi jistý, u naměřených dat se obvykle používá výběrová verze. U příkladových čísel je rozptyl základního souboru 32 / 8 = 4 a výběrový rozptyl 32 / 7 ≈ 4,571.", "note": "Vše se počítá ve tvém prohlížeči a nic, co zadáš, se neukládá ani neodesílá.", "h4": "Vysvětlení pojmů", "lim": "<li><b>Průměr</b> (x̄ = Σx / n): Sečti všechny hodnoty a vyděl je počtem. Příklad: (2+4+4+4+5+5+7+9) / 8 = 40 / 8 = 5. Je to těžiště čísel, ale jedna velmi velká nebo malá hodnota jej výrazně táhne.</li><li><b>Medián</b>: Hodnoty seřaď a vezmi prostřední; při sudém počtu vezmi průměr dvou prostředních. Příklad: prostřední hodnoty jsou 4 a 5, medián je tedy 4,5. Polovina hodnot je pod ním a polovina nad ním a extrémní hodnoty ho téměř neovlivní.</li><li><b>Modus</b>: Hodnota, která se vyskytuje nejčastěji. Příklad: 4 se vyskytuje třikrát. Modů může být více, nebo žádný, pokud se každá hodnota vyskytuje jednou.</li><li><b>Rozpětí</b>: Největší hodnota minus nejmenší: 9 − 2 = 7. Je to nejjednodušší míra rozptýlení, ale závisí jen na dvou číslech.</li><li><b>Kvartily (Q1, Q3) a mezikvartilové rozpětí</b>: Q1 odděluje nejnižší čtvrtinu seřazených hodnot a Q3 nejvyšší čtvrtinu. Zde je Q1 = 4 a Q3 = 6. Mezikvartilové rozpětí Q3 − Q1 = 2 je šířka prostřední poloviny a extrémní hodnoty ignoruje.</li><li><b>Rozptyl</b> (σ² = Σ(x − x̄)² / n): Jak daleko jsou hodnoty v průměru od průměru, měřeno ve čtvercích: od každé hodnoty odečti průměr, rozdíly umocni na druhou, sečti a vyděl. Příklad: čtverce jsou 9, 1, 1, 1, 0, 0, 4, 16, jejich součet je 32 a 32 / 8 = 4.</li><li><b>Směrodatná odchylka</b> (σ = √σ²): Druhá odmocnina z rozptylu, takže je ve stejné jednotce jako tvá data. Příklad: √4 = 2. Malá hodnota znamená, že čísla jsou blízko průměru, velká, že jsou rozptýlená.</li><li>Kvartily jsou mediány dolní a horní poloviny seřazených hodnot (při lichém počtu se prostřední hodnota vynechává).</li><li>Čísla odděl mezerami, středníky nebo novými řádky; jedna čárka se čte jako desetinná čárka (1,5), více čárek jako seznam (1,2,3).</li>"}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Kalkulator statystyczny", "sub": "Średnia, mediana, dominanta, rozstęp, kwartyle i odchylenie standardowe Twoich liczb, ze wzorami.", "h1": "Co oznaczają wartości", "p1": "Statystyka opisuje listę liczb kilkoma wartościami: gdzie jest środek (średnia, mediana, dominanta) i jak rozproszone są liczby (rozstęp, kwartyle, odchylenie standardowe). Naciśnij Przykład i śledź wyjaśnienia poniżej na liczbach 2 4 4 4 5 5 7 9.", "h2": "Populacja czy próba?", "p2": "Wzorów dla populacji (dzielenie przez n) używaj, gdy Twoje liczby to cała grupa, a wzorów dla próby (dzielenie przez n − 1), gdy to próba z większej grupy. Jeśli nie masz pewności, dla danych pomiarowych zwykle stosuje się wersję dla próby. Dla liczb z przykładu wariancja populacji wynosi 32 / 8 = 4, a wariancja z próby 32 / 7 ≈ 4,571.", "note": "Wszystko jest liczone w Twojej przeglądarce, a nic, co wpiszesz, nie jest zapisywane ani wysyłane.", "h4": "Wyjaśnienie pojęć", "lim": "<li><b>Średnia</b> (x̄ = Σx / n): Dodaj wszystkie wartości i podziel przez ich liczbę. Przykład: (2+4+4+4+5+5+7+9) / 8 = 40 / 8 = 5. To środek ciężkości liczb, ale jedna bardzo duża lub mała wartość mocno go przesuwa.</li><li><b>Mediana</b>: Posortuj wartości i weź środkową; przy parzystej liczbie weź średnią dwóch środkowych. Przykład: środkowe wartości to 4 i 5, więc mediana wynosi 4,5. Połowa wartości jest poniżej niej, a połowa powyżej, a wartości skrajne prawie jej nie zmieniają.</li><li><b>Dominanta</b>: Wartość występująca najczęściej. Przykład: 4 występuje trzy razy. Dominant może być kilka albo wcale, jeśli każda wartość występuje raz.</li><li><b>Rozstęp</b>: Największa wartość minus najmniejsza: 9 − 2 = 7. To najprostsza miara rozproszenia, ale zależy tylko od dwóch liczb.</li><li><b>Kwartyle (Q1, Q3) i rozstęp międzykwartylowy</b>: Q1 oddziela najniższą ćwiartkę posortowanych wartości, a Q3 najwyższą. Tutaj Q1 = 4 i Q3 = 6. Rozstęp międzykwartylowy Q3 − Q1 = 2 to szerokość środkowej połowy i pomija wartości skrajne.</li><li><b>Wariancja</b> (σ² = Σ(x − x̄)² / n): Średnio jak daleko wartości są od średniej, mierzone w kwadratach: odejmij średnią od każdej wartości, podnieś różnice do kwadratu, dodaj je i podziel. Przykład: kwadraty to 9, 1, 1, 1, 0, 0, 4, 16, ich suma to 32, a 32 / 8 = 4.</li><li><b>Odchylenie standardowe</b> (σ = √σ²): Pierwiastek kwadratowy z wariancji, więc jest w tej samej jednostce co dane. Przykład: √4 = 2. Mała wartość oznacza, że liczby są blisko średniej, duża, że są rozproszone.</li><li>Kwartyle to mediany dolnej i górnej połowy posortowanych wartości (przy nieparzystej liczbie środkowa wartość jest pomijana).</li><li>Liczby oddzielaj spacjami, średnikami lub nowymi wierszami; pojedynczy przecinek to przecinek dziesiętny (1,5), kilka przecinków to lista (1,2,3).</li>"}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calculateur de statistiques", "sub": "Moyenne, médiane, mode, étendue, quartiles et écart type de vos nombres, avec les formules.", "h1": "Ce que signifient les valeurs", "p1": "La statistique décrit une liste de nombres par quelques valeurs : où se trouve le centre (moyenne, médiane, mode) et à quel point les nombres sont dispersés (étendue, quartiles, écart type). Appuyez sur Exemple et suivez les explications ci-dessous sur les nombres 2 4 4 4 5 5 7 9.", "h2": "Population ou échantillon ?", "p2": "Utilisez les formules de population (division par n) lorsque vos nombres forment tout le groupe, et celles d’échantillon (division par n − 1) lorsqu’ils proviennent d’un groupe plus large. En cas de doute, la version échantillon est la plus courante pour des données mesurées. Pour les nombres de l’exemple, la variance de population vaut 32 / 8 = 4 et celle d’échantillon 32 / 7 ≈ 4,571.", "note": "Tout est calculé dans votre navigateur et rien de ce que vous saisissez n’est enregistré ni envoyé.", "h4": "Termes expliqués", "lim": "<li><b>Moyenne</b> (x̄ = Σx / n): Additionnez toutes les valeurs et divisez par leur nombre. Exemple : (2+4+4+4+5+5+7+9) / 8 = 40 / 8 = 5. C’est le point d’équilibre des nombres, mais une valeur très grande ou très petite la tire fortement.</li><li><b>Médiane</b>: Triez les valeurs et prenez celle du milieu ; si le nombre est pair, prenez la moyenne des deux valeurs centrales. Exemple : les valeurs centrales sont 4 et 5, la médiane vaut donc 4,5. La moitié des valeurs lui est inférieure, l’autre moitié supérieure, et les valeurs extrêmes l’influencent à peine.</li><li><b>Mode</b>: La valeur qui apparaît le plus souvent. Exemple : 4 apparaît trois fois. Il peut y avoir plusieurs modes, ou aucun si chaque valeur n’apparaît qu’une fois.</li><li><b>Étendue</b>: La plus grande valeur moins la plus petite : 9 − 2 = 7. C’est la mesure de dispersion la plus simple, mais elle ne dépend que de deux nombres.</li><li><b>Quartiles (Q1, Q3) et écart interquartile</b>: Q1 sépare le quart inférieur des valeurs triées et Q3 le quart supérieur. Ici Q1 = 4 et Q3 = 6. L’écart interquartile Q3 − Q1 = 2 est la largeur de la moitié centrale et ignore les valeurs extrêmes.</li><li><b>Variance</b> (σ² = Σ(x − x̄)² / n): À quelle distance les valeurs sont en moyenne de la moyenne, mesurée en carrés : retirez la moyenne de chaque valeur, élevez les écarts au carré, additionnez et divisez. Exemple : les carrés sont 9, 1, 1, 1, 0, 0, 4, 16, leur somme est 32 et 32 / 8 = 4.</li><li><b>Écart type</b> (σ = √σ²): La racine carrée de la variance, donc dans la même unité que vos données. Exemple : √4 = 2. Une petite valeur signifie que les nombres sont proches de la moyenne, une grande qu’ils sont dispersés.</li><li>Les quartiles sont les médianes de la moitié inférieure et de la moitié supérieure des valeurs triées (la valeur centrale est exclue si le nombre est impair).</li><li>Séparez les nombres par des espaces, points-virgules ou retours à la ligne ; une seule virgule est lue comme virgule décimale (1,5), plusieurs virgules comme une liste (1,2,3).</li>"}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Calculadora de estadística", "sub": "Media, mediana, moda, rango, cuartiles y desviación típica de tus números, con las fórmulas.", "h1": "Qué significan los valores", "p1": "La estadística describe una lista de números con pocos valores: dónde está el centro (media, mediana, moda) y cuán dispersos están los números (rango, cuartiles, desviación típica). Pulsa Ejemplo y sigue las explicaciones de abajo con los números 2 4 4 4 5 5 7 9.", "h2": "¿Población o muestra?", "p2": "Usa las fórmulas de población (dividir entre n) cuando tus números son todo el grupo, y las de muestra (dividir entre n − 1) cuando son una muestra de un grupo mayor. Si dudas, la versión de muestra es la habitual para datos medidos. Con los números del ejemplo, la varianza de población es 32 / 8 = 4 y la de muestra 32 / 7 ≈ 4,571.", "note": "Todo se calcula en tu navegador y nada de lo que introduces se guarda ni se envía.", "h4": "Términos explicados", "lim": "<li><b>Media</b> (x̄ = Σx / n): Suma todos los valores y divide entre la cantidad. Ejemplo: (2+4+4+4+5+5+7+9) / 8 = 40 / 8 = 5. Es el punto de equilibrio de los números, pero un valor muy grande o muy pequeño la desplaza mucho.</li><li><b>Mediana</b>: Ordena los valores y toma el central; con cantidad par, toma el promedio de los dos centrales. Ejemplo: los valores centrales son 4 y 5, así que la mediana es 4,5. La mitad de los valores queda por debajo y la otra mitad por encima, y los valores extremos apenas la afectan.</li><li><b>Moda</b>: El valor que aparece con más frecuencia. Ejemplo: el 4 aparece tres veces. Puede haber varias modas, o ninguna si cada valor aparece una vez.</li><li><b>Rango</b>: El valor mayor menos el menor: 9 − 2 = 7. Es la medida de dispersión más simple, pero depende solo de dos números.</li><li><b>Cuartiles (Q1, Q3) y rango intercuartílico</b>: Q1 separa el cuarto inferior de los valores ordenados y Q3 el cuarto superior. Aquí Q1 = 4 y Q3 = 6. El rango intercuartílico Q3 − Q1 = 2 es la anchura de la mitad central e ignora los valores extremos.</li><li><b>Varianza</b> (σ² = Σ(x − x̄)² / n): Cuánto se alejan los valores de la media en promedio, medido en cuadrados: resta la media a cada valor, eleva las diferencias al cuadrado, suma y divide. Ejemplo: los cuadrados son 9, 1, 1, 1, 0, 0, 4, 16, su suma es 32 y 32 / 8 = 4.</li><li><b>Desviación típica</b> (σ = √σ²): La raíz cuadrada de la varianza, por lo que está en la misma unidad que tus datos. Ejemplo: √4 = 2. Un valor pequeño significa que los números están cerca de la media, uno grande que están dispersos.</li><li>Los cuartiles son las medianas de la mitad inferior y superior de los valores ordenados (el valor central se excluye si la cantidad es impar).</li><li>Separa los números con espacios, puntos y coma o saltos de línea; una sola coma se lee como coma decimal (1,5), varias comas como una lista (1,2,3).</li>"}};

const fmt=x=>isFinite(x)?(+x.toFixed(6)).toLocaleString(lang==='en'?'en-US':lang,{maximumFractionDigits:6}):'–';
function parse(t){const out=[],bad=[];for(const raw of t.split(/[\s;]+/)){if(!raw)continue;const ps=(raw.match(/,/g)||[]).length>1?raw.split(','):[raw.replace(',','.')];
  for(const p of ps){if(p==='')continue;const x=/^[+-]?(\d+(\.\d*)?|\.\d+)([eE][+-]?\d+)?$/.test(p)?parseFloat(p):NaN;if(isFinite(x))out.push(x);else bad.push(p)}}return{out,bad}}
function stats(t){const{out:xs,bad}=parse(t);if(bad.length)return{e:'errv',tok:bad[0]};if(!xs.length)return{h:1};if(xs.length>10000)return{e:'errm'};
  const n=xs.length,s=[...xs].sort((a,b)=>a-b),sum=s.reduce((a,b)=>a+b,0),mean=sum/n,md=a=>{const m=a.length,k=m>>1;return m%2?a[k]:(a[k-1]+a[k])/2},median=md(s),h=n>>1,
    q1=n>1?md(s.slice(0,h)):s[0],q3=n>1?md(s.slice(n-h)):s[0],cnt=new Map();s.forEach(x=>cnt.set(x,(cnt.get(x)||0)+1));

   ['median',fmt(median),n%2?`x[${(n+1)/2}]`:`(${fmt(s[n/2-1])} + ${fmt(s[n/2])}) / 2`],['mode',modes.length?modes.map(fmt).join(', '):null,mx>1?`${mx}×`:''],
   ['n',String(n),''],['sum',fmt(sum),''],['min',fmt(s[0]),''],['max',fmt(s[n-1]),''],['range',fmt(s[n-1]-s[0]),`${fmt(s[n-1])} − ${fmt(s[0])}`],
   ['q1',fmt(q1),''],['q3',fmt(q3),''],['iqr',fmt(q3-q1),`${fmt(q3)} − ${fmt(q1)}`],
   ['vp',fmt(vp),`σ² = Σ(x − x̄)² / n = ${fmt(ss)} / ${n}`],['sp',fmt(sp),`σ = √σ² = √${fmt(vp)}`]);
  if(n>1){const vs=ss/(n-1);R.push(['vs',fmt(vs),`s² = Σ(x − x̄)² / (n − 1) = ${fmt(ss)} / ${n-1}`],['ss',fmt(Math.sqrt(vs)),`s = √s² = √${fmt(vs)}`])}
  return{rows:R,sorted:s}}
