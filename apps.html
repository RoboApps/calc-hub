  const apps=`<section id="apps"><h2 class="text-2xl font-semibold text-white">${X.ah}</h2><div class="mt-4 space-y-4">`+X.apps.map(([id,n,d,c,u,img])=>`<article id="${id}" class="glass flex items-start gap-4 rounded-2xl p-5"><img src="${img}" alt="${n}" width="96" height="96" loading="lazy" class="h-20 w-20 shrink-0 rounded-2xl sm:h-24 sm:w-24"><div><h3 class="text-lg font-semibold text-white">${n}</h3><p class="mt-1 leading-relaxed" style="color:#a3acbf">${d}</p><p class="mt-3"><a class="chip inline-block" href="${u}" target="_blank" rel="noopener">${c}</a></p></div></article>`).join('')+`</div><p class="mt-4 text-xs" style="color:#667085">${X.tm}</p></section>`;
  $('sections').innerHTML=intro+apps;
  syncLang();
}
initLang(text);text();
if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView()}
</script>
