podľa úrovne aktivity.", "h1": "Čo je BMR a TDEE?", "p1": "Bazálny metabolizmus (BMR) je energia, ktorú telo spotrebuje v úplnom pokoji na udržanie života: dýchanie, obeh krvi a obnovu buniek. Celková denná energetická potreba (TDEE) k nemu pripočítava energiu na pohyb, cvičenie a trávenie. TDEE je zhruba počet kalórií, ktorý potrebuješ na udržanie stálej hmotnosti.", "h2": "Ako sa počíta", "p2": "BMR sa odhaduje z pohlavia, veku, výšky a hmotnosti pomocou rovnice Mifflin–St Jeor (najčastejšie odporúčanej) alebo revidovanej rovnice Harris–Benedict. Potom sa vynásobí faktorom aktivity od 1,2 pri sedavom spôsobe života po 1,9 pri veľmi náročnej každodennej aktivite, čím vznikne odhad TDEE.", "h4": "Dobré vedieť", "lim": "<li>Ide o odhady. Skutočná energetická potreba sa môže medzi ľuďmi rovnakej veľkosti a veku líšiť o 10 – 15 % aj viac.</li><li>Zjednodušene sa hovorí, že asi 7 700 kcal zodpovedá 1 kg telesnej hmotnosti, no skutočné zmeny sa líšia a časom spomaľujú. Sleduj trend hmotnosti 2 – 3 týždne a upravuj.</li><li>Kalkulačka nie je vhodná pre deti a dospievajúcich, tehotné ani dojčiace ženy a ľudí so zdravotnými problémami ovplyvňujúcimi metabolizmus.</li><li>Jesť výrazne primálo môže poškodiť zdravie. Ciele na zníženie hmotnosti sa preto nikdy nezobrazia pod bežne odporúčaným minimom (1 200 kcal pre ženy, 1 500 kcal pre mužov) ani pri podváhe.</li><li>1 kcal je približne 4,184 kJ; na obaloch potravín sa v mnohých krajinách uvádzajú obe jednotky.</li>", "note": "Nástroj slúži na všeobecné informovanie a nie je zdravotným ani výživovým poradenstvom. Ak ti myšlienky na jedlo alebo váhu spôsobujú stres, porozprávaj sa s lekárom alebo odborníkom na duševné zdravie."}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Kalorienrechner", "sub": "Schätze deinen Grundumsatz und täglichen Kalorienbedarf passend zu deinem Aktivitätsniveau.", "h1": "Was sind BMR und TDEE?", "p1": "Der Grundumsatz (BMR) ist die Energie, die dein Körper in völliger Ruhe zum Überleben braucht: Atmung, Kreislauf und Zellreparatur. Der Gesamtumsatz (TDEE) addiert die Energie für Bewegung, Sport und Verdauung. Der TDEE entspricht ungefähr den Kalorien, die du brauchst, um dein Gewicht stabil zu halten.", "h2": "So wird es berechnet", "p2": "Der BMR wird aus Geschlecht, Alter, Größe und Gewicht mit der Mifflin-St-Jeor-Formel (am häufigsten empfohlen) oder der überarbeiteten Harris-Benedict-Formel geschätzt. Danach wird er mit einem Aktivitätsfaktor von 1,2 bei sitzender Lebensweise bis 1,9 bei sehr hoher täglicher Belastung multipliziert, um den TDEE zu schätzen.", "h4": "Gut zu wissen", "lim": "<li>Das sind Schätzungen. Der tatsächliche Energiebedarf kann sich bei gleich großen und gleich alten Menschen um 10–15 % oder mehr unterscheiden.</li><li>Faustregel: Etwa 7.700 kcal entsprechen 1 kg Körpergewicht, doch reale Veränderungen schwanken und verlangsamen sich mit der Zeit. Beobachte den Gewichtstrend über 2–3 Wochen und passe an.</li><li>Der Rechner ist nicht für Kinder und Jugendliche, Schwangerschaft, Stillzeit oder Erkrankungen geeignet, die den Stoffwechsel beeinflussen.</li><li>Viel zu wenig zu essen kann der Gesundheit schaden. Ziele zur Gewichtsabnahme werden daher nie unter dem üblicherweise empfohlenen Minimum (1.200 kcal für Frauen, 1.500 kcal für Männer) und nicht bei Untergewicht angezeigt.</li><li>1 kcal entspricht etwa 4,184 kJ; auf Lebensmitteln stehen in vielen Ländern beide Angaben.</li>", "note": "Dieses Tool dient der allgemeinen Information und ist keine medizinische oder Ernährungsberatung. Wenn Gedanken an Essen oder Gewicht dich belasten, sprich bitte mit einer Ärztin, einem Arzt oder einer psychologischen Fachperson."}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Kalorická kalkulačka", "sub": "Odhadni svůj bazální metabolismus a denní potřebu kalorií podle úrovně aktivity.", "h1": "Co je BMR a TDEE?", "p1": "Bazální metabolismus (BMR) je energie, kterou tělo spotřebuje v úplném klidu k udržení života: dýchání, krevní oběh a obnova buněk. Celková denní energetická potřeba (TDEE) k němu přičítá energii na pohyb, cvičení a trávení. TDEE je zhruba počet kalorií, který potřebuješ k udržení stabilní hmotnosti.", "h2": "Jak se počítá", "p2": "BMR se odhaduje z pohlaví, věku, výšky a hmotnosti pomocí rovnice Mifflin–St Jeor (nejčastěji doporučované) nebo revidované rovnice Harris–Benedict. Poté se vynásobí faktorem aktivity od 1,2 při sedavém způsobu života po 1,9 při velmi náročné každodenní aktivitě, čímž vznikne odhad TDEE.", "h4": "Dobré vědět", "lim": "<li>Jde o odhady. Skutečná energetická potřeba se může mezi lidmi stejné velikosti a věku lišit o 10–15 % i více.</li><li>Zjednodušeně se říká, že asi 7 700 kcal odpovídá 1 kg tělesné hmotnosti, ale skutečné změny se liší a časem zpomalují. Sleduj trend hmotnosti 2–3 týdny a upravuj.</li><li>Kalkulačka není vhodná pro děti a dospívající, těhotné ani kojící ženy a lidi se zdravotními potížemi ovlivňujícími metabolismus.</li><li>Jíst výrazně málo může poškodit zdraví. Cíle ke snížení hmotnosti se proto nikdy nezobrazí pod běžně doporučeným minimem (1 200 kcal pro ženy, 1 500 kcal pro muže) ani při podváze.</li><li>1 kcal je přibližně 4,184 kJ; na obalech potravin se v mnoha zemích uvádějí obě jednotky.</li>", "note": "Nástroj slouží k obecné informaci a není zdravotním ani výživovým poradenstvím. Pokud ti myšlenky na jídlo nebo váhu způsobují stres, promluv si s lékařem nebo odborníkem na duševní zdraví."}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Kalkulator kalorii", "sub": "Oszacuj swoją podstawową przemianę materii i dzienne zapotrzebowanie kaloryczne według poziomu aktywności.", "h1": "Czym są BMR i TDEE?", "p1": "Podstawowa przemiana materii (BMR) to energia, której organizm potrzebuje w całkowitym spoczynku do podtrzymania życia: oddychania, krążenia i odnowy komórek. Całkowite dzienne zapotrzebowanie energetyczne (TDEE) dodaje energię na ruch, ćwiczenia i trawienie. TDEE to mniej więcej liczba kalorii potrzebna do utrzymania stałej wagi.", "h2": "Jak się to oblicza", "p2": "BMR szacuje się na podstawie płci, wieku, wzrostu i wagi za pomocą równania Mifflina–St Jeora (najczęściej zalecanego) lub zrewidowanego równania Harrisa–Benedicta. Następnie mnoży się go przez współczynnik aktywności od 1,2 przy siedzącym trybie życia do 1,9 przy bardzo wymagającej codziennej aktywności, co daje szacunek TDEE.", "h4": "Warto wiedzieć", "lim": "<li>To szacunki. Rzeczywiste zapotrzebowanie energetyczne może się różnić o 10–15 % lub więcej między osobami o tym samym wzroście i wieku.</li><li>Przyjmuje się upraszczając, że około 7 700 kcal odpowiada 1 kg masy ciała, ale rzeczywiste zmiany bywają różne i z czasem zwalniają. Obserwuj trend wagi przez 2–3 tygodnie i koryguj.</li><li>Kalkulator nie jest przeznaczony dla dzieci i młodzieży, kobiet w ciąży ani karmiących piersią oraz osób z chorobami wpływającymi na metabolizm.</li><li>Jedzenie zdecydowanie za mało może zaszkodzić zdrowiu. Cele redukcji masy nigdy nie są pokazywane poniżej powszechnie zalecanego minimum (1 200 kcal dla kobiet, 1 500 kcal dla mężczyzn) ani przy niedowadze.</li><li>1 kcal to około 4,184 kJ; na opakowaniach żywności w wielu krajach podaje się obie jednostki.</li>", "note": "To narzędzie ma charakter informacyjny i nie jest poradą medyczną ani żywieniową. Jeśli myśli o jedzeniu lub wadze powodują u Ciebie cierpienie, porozmawiaj z lekarzem lub specjalistą zdrowia psychicznego."}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calculateur de calories", "sub": "Estimez votre métabolisme de base et vos besoins caloriques quotidiens selon votre niveau d’activité.", "h1": "Que sont le MB et le TDEE ?", "p1": "Le métabolisme de base (MB, ou BMR) est l’énergie que votre corps utilise au repos complet pour vous maintenir en vie : respiration, circulation et réparation des cellules. La dépense énergétique totale quotidienne (TDEE) y ajoute l’énergie dépensée pour bouger, faire du sport et digérer. Le TDEE correspond à peu près aux calories nécessaires pour garder un poids stable.", "h2": "Comment c’est calculé", "p2": "Le MB est estimé à partir du sexe, de l’âge, de la taille et du poids avec l’équation de Mifflin–St Jeor (la plus souvent recommandée) ou l’équation de Harris–Benedict révisée. Il est ensuite multiplié par un facteur d’activité allant de 1,2 pour un mode de vie sédentaire à 1,9 pour une activité quotidienne très intense, ce qui donne une estimation du TDEE.", "h4": "Bon à savoir", "lim": "<li>Ce sont des estimations. Les besoins énergétiques réels peuvent différer de 10 à 15 % ou plus entre des personnes de même taille et du même âge.</li><li>On admet souvent qu’environ 7 700 kcal correspondent à 1 kg de poids corporel, mais les variations réelles diffèrent et ralentissent avec le temps. Suivez la tendance de votre poids sur 2 à 3 semaines et ajustez.</li><li>Ce calculateur ne convient pas aux enfants et adolescents, à la grossesse, à l’allaitement ni aux personnes ayant des problèmes de santé qui influencent le métabolisme.</li><li>Manger beaucoup trop peu peut nuire à la santé. Les objectifs de perte de poids ne sont donc jamais affichés en dessous d’un minimum couramment recommandé (1 200 kcal pour les femmes, 1 500 kcal pour les hommes) ni en cas d’insuffisance pondérale.</li><li>1 kcal vaut environ 4,184 kJ ; les étiquettes alimentaires de nombreux pays indiquent les deux.</li>", "note": "Cet outil est fourni à titre d’information générale et ne constitue pas un conseil médical ou nutritionnel. Si les pensées liées à l’alimentation ou au poids vous causent de la détresse, parlez-en à un médecin ou à un professionnel de la santé mentale."}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Calculadora de calorías", "sub": "Estima tu metabolismo basal y tus necesidades calóricas diarias según tu nivel de actividad.", "h1": "¿Qué son la TMB y el TDEE?", "p1": "La tasa metabólica basal (TMB) es la energía que tu cuerpo usa en reposo total para mantenerte con vida: respiración, circulación y reparación celular. El gasto energético diario total (TDEE) le suma la energía que gastas al moverte, hacer ejercicio y digerir. El TDEE es aproximadamente las calorías que necesitas para mantener estable tu peso.", "h2": "Cómo se calcula", "p2": "La TMB se estima a partir del sexo, la edad, la altura y el peso con la ecuación de Mifflin–St Jeor (la más recomendada) o la ecuación de Harris–Benedict revisada. Después se multiplica por un factor de actividad que va de 1,2 para una vida sedentaria a 1,9 para una actividad diaria muy intensa, y así se estima el TDEE.", "h4": "Conviene saber", "lim": "<li>Son estimaciones. Las necesidades energéticas reales pueden diferir un 10–15 % o más entre personas de la misma talla y edad.</li><li>Como regla general, unas 7700 kcal equivalen a 1 kg de peso corporal, pero los cambios reales varían y se ralentizan con el tiempo. Observa la tendencia de tu peso durante 2–3 semanas y ajusta.</li><li>La calculadora no es adecuada para niños y adolescentes, embarazo, lactancia ni personas con enfermedades que afecten al metabolismo.</li><li>Comer muy poco puede dañar la salud. Por eso nunca se muestran objetivos de pérdida de peso por debajo de un mínimo habitualmente recomendado (1200 kcal para mujeres, 1500 kcal para hombres) ni con bajo peso.</li><li>1 kcal equivale a unos 4,184 kJ; las etiquetas de los alimentos de muchos países muestran ambos valores.</li>", "note": "Esta herramienta es solo informativa y no constituye asesoramiento médico ni nutricional. Si los pensamientos sobre la comida o el peso te causan malestar, habla con un médico o un profesional de salud mental."}};

kles hmotnosti (přibližně −20 %)|Utrata wagi (ok. −20 %)|Perte de poids (environ −20 %)|Pérdida de peso (aprox. −20 %)", "g_gain": "Mild weight gain (about +10 %)|Mierny prírastok hmotnosti (približne +10 %)|Leichte Gewichtszunahme (ca. +10 %)|Mírný přírůstek hmotnosti (přibližně +10 %)|Łagodny przyrost wagi (ok. +10 %)|Légère prise de poids (environ +10 %)|Aumento de peso leve (aprox. +10 %)", "est": "Estimated change|Odhadovaná zmena|Geschätzte Änderung|Odhadovaná změna|Szacowana zmiana|Variation estimée|Cambio estimado", "wk": "per week|týždenne|pro Woche|týdně|tygodniowo|par semaine|a la semana", "actf": "activity factor|faktor aktivity|Aktivitätsfaktor|faktor aktivity|współczynnik aktywności|facteur d’activité|factor de actividad", "floor": "Raised to the commonly recommended minimum of {n} kcal; going lower should only be done under medical supervision.|Zvýšené na bežne odporúčané minimum {n} kcal; nižší príjem len pod lekárskym dohľadom.|Auf das üblicherweise empfohlene Minimum von {n} kcal angehoben; weniger nur unter ärztlicher Aufsicht.|Zvýšeno na běžně doporučené minimum {n} kcal; nižší příjem pouze pod lékařským dohledem.|Podniesiono do powszechnie zalecanego minimum {n} kcal; mniej tylko pod nadzorem lekarza.|Relevé au minimum couramment recommandé de {n} kcal ; moins uniquement sous surveillance médicale.|Subido al mínimo habitualmente recomendado de {n} kcal; menos solo bajo supervisión médica.", "under": "Your BMI is below 18.5, so weight-loss targets are not shown. If you want to change your weight, talk to a doctor or dietitian first.|Tvoje BMI je pod 18,5, preto sa ciele na zníženie hmotnosti nezobrazujú. Ak chceš meniť hmotnosť, najprv sa poraď s lekárom alebo dietológom.|Dein BMI liegt unter 18,5, deshalb werden keine Ziele zur Gewichtsabnahme angezeigt. Wenn du dein Gewicht ändern möchtest, sprich zuerst mit einer Ärztin, einem Arzt oder einer Ernährungsfachkraft.|Tvé BMI je pod 18,5, proto se cíle ke snížení hmotnosti nezobrazují. Chceš-li hmo }
const FT={en:['Privacy & Cookies','Privacy and cookie settings','About & contact'],sk:['Ochrana údajov a cookies','Nastavenia súkromia a cookies','O nás a kontakt'],de:['Datenschutz & Cookies','Datenschutz- und Cookie-Einstellungen','Über uns & Kontakt'],cs:['Ochrana údajů a cookies','Nastavení soukromí a cookies','O nás a kontakt'],pl:['Prywatność i cookies','Ustawienia prywatności i plików cookies','O nas i kontakt'],fr:['Confidentialité et cookies','Paramètres de confidentialité et de cookies','À propos et contact'],es:['Privacidad y cookies','Configuración de privacidad y cookies','Acerca de y contacto']};
function footLinks(){const f=document.getElementById('flinks');if(!f)return;const s='<span class="mx-2">·</span>';f.innerHTML=`<a href="about.html" class="hover:text-white">${FT[lang][2]}</a>${s}<a href="privacy.html" class="hover:text-white">${FT[lang][0]}</a>${s}<button data-cs class="hover:text-white">${FT[lang][1]}</button>`}
function propLinks(){document.querySelectorAll('a[href]').forEach(a=>{const h=a.dataset.h||(a.dataset.h=a.getAttribute('href'));if(!/^[a-z-]+\.html$/.test(h))return;a.setAttribute('href',lang==='en'?h:h+'?lang='+lang)})}
function openCs(){if(window.googlefc&&googlefc.callbackQueue&&googlefc.showRevocationMessage)googlefc.callbackQueue.push(googlefc.showRevocationMessage);else location.href='privacy.html'+(lang==='en'?'':'?lang='+lang)+'#cookies'}
document.addEventListener('click',e=>{if(e.target.closest('[data-cs]'))openCs()});
const LANGS=[['sk','Slovenčina'],['de','Deutsch'],['en','English'],['cs','Čeština'],['pl','Polski'],['fr','Français'],['es','Español']];
function syncLang(){document.getElementById('langCur').textContent=lang.toUpperCase();document.querySelectorAll('#langMenu button').forEach(b=>b.setAttribute('aria-selected',b.dataset.l===lang));footLinks();propLinks();applySeo()}
function initLang(cb){
  const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu');
  menu.innerHTML=LANGS.map(([c,n])=>`<li><button role="option" data-l="${c}"><span>${n}</span><b>${c.toUpperCase()}</b></button></li>`).join('');
  const close=()=>{menu.classList.add('hidden');btn.setAttribute('aria-expanded','false')};
  btn.addEventListener('click',e=>{e.stopPropagation();const hid=menu.classList.toggle('hidden');btn.setAttribute('aria-expanded',String(!hid))});
  menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{const u=new URL(location.href);if(lang==='en')u.searchParams.delete('lang');else u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(x){}close();cb()});
  document.addEventListener('click',close);

const $=id=>document.getElementById(id);
const IDX={en:0,sk:1,de:2,cs:3,pl:4,fr:5,es:6},LOC={sk:'sk-SK',de:'de-DE',en:'en-GB',cs:'cs-CZ',pl:'pl-PL',fr:'fr-FR',es:'es-ES'};
const L=k=>PIPE[k].split('|')[IDX[lang]];
const ACT=[1.2,1.375,1.55,1.725,1.9];
let sex='m',unit='m',act=1,fo='ms';
const nf=(n,d=0)=>new Intl.NumberFormat(LOC[lang],{maximumFractionDigits:d}).format(n);
const r10=n=>Math.round(n/10)*10;
const KJ=4.184;
function bmrOf(s,f,W,H,A){
  if(f==='ms')return 10*W+6.25*H-5*A+(s==='m'?5:-161);
  return s==='m'?88.362+13.397*W+4.799*H-5.677*A:447.593+9.247*W+3.098*H-4.330*A;
}
function calcAll(){
  const A=+$('ag').value;let H,W;
  if(unit==='m'){H=+$('h1').value;W=+$('w1').value}else{H=(+$('h1').value*12+(+$('h2').value||0))*2.54;W=+$('w1').value*0.45359237}
  if($('ag').value===''||$('h1').value===''||$('w1').value===''||!isFinite(A+H+W))return null;
  if(A<18)return {err:'adult'};
  if(A>100||H<100||H>250||W<30||W>300)return null;
  const bmr=bmrOf(sex,fo,W,H,A),tdee=bmr*ACT[act],bmi=W/Math.pow(H/100,2),floor=sex==='m'?1500:1200;
  const goals=[['g_maint',tdee,tdee]];let capped=false,under=bmi<18.5;
  [['g_mloss',.9],['g_loss',.8]].forEach(([k,f])=>{if(under)return;let t=tdee*f;if(t<floor){t=floor;capped=true}if(t<tdee-50)goals.push([k,t,tdee])});
  goals.push(['g_gain',tdee*1.1,tdee]);
  return {bmr,tdee,goals,capped,under,floor};
}
function kcal(n){return `${nf(r10(n))} kcal`}
function calc(){
  const o=calcAll();
  $('res').classList.toggle('hidden',!o||!!o.err);$('hint').classList.toggle('hidden',!!o);$('hint').textContent=L('hint');
  $('err').classList.toggle('hidden',!(o&&o.err));if(o&&o.err)$('err').textContent=L(o.err);
  $('gsec').classList.toggle('hidden',!o||!!o.err);
  if(!o||o.err)return;
  $('big').textContent=`${nf(r10(o.tdee))} kcal`;$('bigk').textContent=`${nf(r10(o.tdee*KJ))} kJ · ${L('perday')}`;
  $('bmrv').textContent=`${nf(r10(o.bmr))} kcal`;
  $('goals').innerHTML=o.goals.map(([k,t,base])=>{const kg=(t-base)*7/7700,v=unit==='m'?kg:kg*2.20462,u=unit==='m'?'kg':'lb';
    const est=k==='g_maint'?'':`<small>${L('est')}: ${v>0?'+':'−'}${nf(Math.abs(v),2)} ${u} ${L('wk')}</small>`;
    return `<div class="stat"><span>${L(k)}${est}</span><b>${kcal(t)}<small>${nf(r10(t*KJ))} kJ · ${L('perday')}</small></b></div>`}).join('');
  $('gn').textContent=o.under?L('under'):(o.capped?L('floor').replace('{n}',nf(o.floor)):'');
}
function buildSel(){
  $('ac').innerHTML=ACT.map((f,i)=>`<option value="${i}" ${i===act?'selected':''}>${L('a'+(i+1))}</option>`).join('');
  $('fo').innerHTML=['ms','hb'].map(k=>`<option value="${k}" ${k===fo?'selected':''}>${L('f_'+k)}</option>`).join('');
  document.querySelectorAll('[data-sx]').forEach(b=>{b.textContent=L(b.dataset.sx==='m'?'male':'female');b.setAttribute('aria-pressed',b.dataset.sx===sex)});
  document.querySelectorAll('[data-un]').forEach(b=>{b.textContent=L(b.dataset.un==='m'?'metric':'imperial');b.setAttribute('aria-pressed',b.dataset.un===unit)});
}
function text(){
  const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.tagName==='UL'?e.innerHTML=v:e.textContent=v});
  document.querySelectorAll('[data-p]').forEach(e=>e.textContent=L(e.dataset.p));
  $('fbox').innerHTML=`<div><span style="color:#8b94a7">${L('male')}:</span> <b style="color:var(--accent)">10 × kg + 6.25 × cm − 5 × ${L('ageW')} + 5</b></div><div><span style="color:#8b94a7">${L('female')}:</span> <b style="color:var(--accent)">10 × kg + 6.25 × cm − 5 × ${L('ageW')} − 161</b></div><div><span style="color:#8b94a7">TDEE =</span> <b style="color:var(--accent)">BMR × ${L('actf')}</b></div>`;
  buildSel();syncLang();calc();
}
function setUnit(u){
  if(u===unit)return;
  const H=unit==='m'?+$('h1').value:(+$('h1').value*12+(+$('h2').value||0))*2.54,W=unit==='m'?+$('w1').value:+$('w1').value*0.45359237;
  unit=u;$('h2w').classList.toggle('hidden',u==='m');$('u1').textContent=u==='m'?'cm':'ft';$('uw').textContent=u==='m'?'kg':'lb';
  if(isFinite(H)&&H>0&&isFinite(W)&&W>0){
    if(u==='m'){$('h1').value=Math.round(H);$('w1').value=Math.round(W*10)/10}
    else{const inch=H/2.54;$('h1').value=Math.floor(inch/12);$('h2').value=Math.round(inch%12);$('w1').value=Math.round(W/0.45359237*10)/10}
  }
  buildSel();calc();
}
document.addEventListener('click',e=>{const s=e.target.closest('[data-sx]');if(s){sex=s.dataset.sx;buildSel();calc();return}const u=e.target.closest('[data-un]');if(u)setUnit(u.dataset.un)});
['ag','h1','h2','w1'].forEach(id=>$(id).addEventListener('input',calc));
$('ac').addEventListener('change',e=>{act=+e.target.value;calc()});
$('fo').addEventListener('change',e=>{fo=e.target.value;calc()});
initLang(text);text();
</script>
