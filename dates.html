const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "Date Calculator", "sub": "Find the difference between two dates, count down to Christmas or any day, add or subtract time, and work out an age.", "h1": "How date calculations work", "p1": "Calendar dates are counted in whole days. The difference between two dates is the number of days from one to the other, and it can also be split into years, months and days. Because months have 28 to 31 days, the years-months-days breakdown counts full months first and then the remaining days.", "h4": "Good to know", "lim": "<li>A common year has 365 days; a leap year has 366. A year is a leap year if it is divisible by 4, except century years, which must be divisible by 400 (2000 was a leap year, 1900 was not).</li><li>ISO week numbers start on Monday, and week 1 is the week containing the first Thursday of the year.</li><li>Whether the last day is counted matters: from 1 to 10 January is 9 days, or 10 days if both the first and last day are included.</li><li>Working days here are Monday to Friday. Public holidays differ by country and are not subtracted.</li><li>Christmas Eve (24 December) is the main celebration in many Central European countries, while Christmas Day is 25 December. Easter moves every year and is calculated from the lunar calendar (the Sunday after the first full moon on or after 21 March).</li>", "h3": "Time units at a glance", "faqh": "Frequently asked questions", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How many days are there between two dates?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Use the Difference between dates mode: enter both dates and you get the total days, weeks and days, total hours and working days, plus the split into years, months and days. Example: from 1 to 10 January is 9 days, or 10 if you tick “Include the end day”.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How do I add or subtract days, weeks or months?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Choose Add or subtract, enter the start date, the amount and the unit (days, weeks, months, years or working days) and the page shows the resulting date. Example: 30 days after 1 March is 31 March.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How are working days counted?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Working days are Monday to Friday. Public holidays differ by country and are not subtracted, so check the holidays of your country separately.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How do I calculate age and the next birthday?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Choose Age, enter the date of birth and, if you like, another date to calculate the age on. You get the age in years, months and days, the total days lived and the next birthday.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How do I find the week number or the day of the year?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">The Date info mode shows the week number, day of the year, days left in the year, days in the month, quarter and whether it is a leap year. Weeks follow the ISO rule: they start on Monday, and week 1 contains the first Thursday of the year.</p></details></li>"}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Kalkulačka dátumov", "sub": "Zisti rozdiel dvoch dátumov, odpočítavaj do Vianoc či ľubovoľného dňa, pripočítaj alebo odpočítaj čas a vypočítaj vek.", "h1": "Ako fungujú výpočty s dátumami", "p1": "Kalendárne dátumy sa počítajú v celých dňoch. Rozdiel dvoch dátumov je počet dní od jedného k druhému a dá sa rozložiť aj na roky, mesiace a dni. Keďže mesiace majú 28 až 31 dní, rozklad na roky, mesiace a dni najprv spočíta celé mesiace a potom zvyšné dni.", "h4": "Dobré vedieť", "lim": "<li>Bežný rok má 365 dní, priestupný 366. Priestupný je rok deliteľný 4, okrem storočí, ktoré musia byť deliteľné 400 (rok 2000 bol priestupný, 1900 nie).</li><li>Čísla týždňov podľa ISO sa začínajú pondelkom a týždeň 1 je ten, v ktorom je prvý štvrtok roka.</li><li>Záleží na tom, či sa započítava posledný deň: od 1. do 10. januára je 9 dní, alebo 10 dní, ak sa počíta prvý aj posledný deň.</li><li>Pracovné dni sú tu pondelok až piatok. Štátne sviatky sa v jednotlivých krajinách líšia a neodpočítavajú sa.</li><li>Štedrý deň (24. decembra) je v mnohých krajinách strednej Európy hlavným sviatkom, kým Prvý sviatok vianočný je 25. decembra. Veľká noc sa každý rok posúva a určuje sa podľa lunárneho kalendára (nedeľa po prvom splne od 21. marca).</li>", "h3": "Časové jednotky v kocke", "faqh": "Často kladené otázky", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Koľko dní je medzi dvoma dátumami?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Použi režim Rozdiel dátumov: zadaj oba dátumy a získaš počet dní, týždne a dni, počet hodín a pracovné dni, ako aj rozpis na roky, mesiace a dni. Príklad: od 1. do 10. januára je 9 dní, alebo 10, ak zaškrtneš „Započítať aj posledný deň“.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ako pripočítam alebo odpočítam dni, týždne či mesiace?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Vyber Pripočítať alebo odpočítať, zadaj východiskový dátum, množstvo a jednotku (dni, týždne, mesiace, roky alebo pracovné dni) a stránka ukáže výsledný dátum. Príklad: 30 dní po 1. marci je 31. marec.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ako sa počítajú pracovné dni?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Pracovné dni sú od pondelka do piatka. Štátne sviatky sa v jednotlivých krajinách líšia a neodpočítavajú sa, preto si sviatky svojej krajiny skontroluj osobitne.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ako vypočítam vek a ďalšie narodeniny?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Vyber Vek, zadaj dátum narodenia a podľa potreby iný dátum, ku ktorému sa vek počíta. Získaš vek v rokoch, mesiacoch a dňoch, počet prežitých dní a ďalšie narodeniny.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ako zistím číslo týždňa alebo deň v roku?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Režim Informácie o dátume ukáže číslo týždňa, deň v roku, počet dní do konca roka, počet dní v mesiaci, štvrťrok a či je rok priestupný. Týždne sa riadia pravidlom ISO: začínajú v pondelok a týždeň 1 obsahuje prvý štvrtok roka.</p></details></li>"}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Datumsrechner", "sub": "Berechne die Differenz zweier Daten, zähle bis Weihnachten oder zu jedem Tag herunter, addiere oder subtrahiere Zeit und ermittle das Alter.", "h1": "So funktionieren Datumsberechnungen", "p1": "Kalenderdaten werden in ganzen Tagen gezählt. Der Unterschied zweier Daten ist die Anzahl der Tage von einem zum anderen und lässt sich auch in Jahre, Monate und Tage aufteilen. Da Monate 28 bis 31 Tage haben, zählt die Aufteilung in Jahre, Monate und Tage zuerst volle Monate und dann die übrigen Tage.", "h4": "Gut zu wissen", "lim": "<li>Ein normales Jahr hat 365 Tage, ein Schaltjahr 366. Schaltjahre sind durch 4 teilbar, außer Jahrhundertjahre, die durch 400 teilbar sein müssen (2000 war ein Schaltjahr, 1900 nicht).</li><li>ISO-Kalenderwochen beginnen am Montag, und Woche 1 ist die Woche mit dem ersten Donnerstag des Jahres.</li><li>Es kommt darauf an, ob der letzte Tag mitgezählt wird: Vom 1. bis 10. Januar sind es 9 Tage, oder 10 Tage, wenn erster und letzter Tag mitzählen.</li><li>Werktage sind hier Montag bis Freitag. Feiertage unterscheiden sich je nach Land und werden nicht abgezogen.</li><li>Heiligabend (24. Dezember) ist in vielen mitteleuropäischen Ländern der Hauptfeiertag, der erste Weihnachtsfeiertag ist der 25. Dezember. Ostern wandert jedes Jahr und wird aus dem Mondkalender berechnet (der Sonntag nach dem ersten Vollmond ab dem 21. März).</li>", "h3": "Zeiteinheiten im Überblick", "faqh": "Häufige Fragen", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie viele Tage liegen zwischen zwei Daten?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Nutze den Modus Datumsdifferenz: Gib beide Daten ein und du erhältst die Tage, Wochen und Tage, die Stunden und die Arbeitstage sowie die Aufteilung in Jahre, Monate und Tage. Beispiel: Vom 1. bis 10. Januar sind es 9 Tage, oder 10, wenn du „Endtag mitzählen“ aktivierst.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie addiere oder subtrahiere ich Tage, Wochen oder Monate?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Wähle Addieren oder subtrahieren, gib das Startdatum, die Menge und die Einheit (Tage, Wochen, Monate, Jahre oder Arbeitstage) ein, und die Seite zeigt das Ergebnisdatum. Beispiel: 30 Tage nach dem 1. März ist der 31. März.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie werden Arbeitstage gezählt?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Arbeitstage sind Montag bis Freitag. Feiertage unterscheiden sich je nach Land und werden nicht abgezogen, prüfe die Feiertage deines Landes daher separat.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie berechne ich das Alter und den nächsten Geburtstag?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Wähle Alter, gib das Geburtsdatum und bei Bedarf ein anderes Datum für die Altersberechnung ein. Du erhältst das Alter in Jahren, Monaten und Tagen, die gelebten Tage und den nächsten Geburtstag.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie finde ich die Kalenderwoche oder den Tag des Jahres?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Der Modus Datumsinfo zeigt Kalenderwoche, Tag des Jahres, verbleibende Tage im Jahr, Tage im Monat, Quartal und ob es ein Schaltjahr ist. Die Wochen folgen der ISO-Regel: Sie beginnen am Montag, und Woche 1 enthält den ersten Donnerstag des Jahres.</p></details></li>"}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Kalkulačka dat", "sub": "Zjisti rozdíl dvou dat, odpočítávej do Vánoc či libovolného dne, přičti nebo odečti čas a spočítej věk.", "h1": "Jak fungují výpočty s daty", "p1": "Kalendářní data se počítají v celých dnech. Rozdíl dvou dat je počet dní od jednoho k druhému a lze ho rozložit i na roky, měsíce a dny. Protože měsíce mají 28 až 31 dní, rozklad na roky, měsíce a dny nejprve spočítá celé měsíce a poté zbývající dny.", "h4": "Dobré vědět", "lim": "<li>Běžný rok má 365 dní, přestupný 366. Přestupný je rok dělitelný 4, kromě století, která musí být dělitelná 400 (rok 2000 byl přestupný, 1900 ne).</li><li>Čísla týdnů podle ISO začínají pondělkem a týden 1 je ten, ve kterém je první čtvrtek roku.</li><li>Záleží na tom, zda se počítá poslední den: od 1. do 10. ledna je 9 dní, nebo 10 dní, pokud se počítá první i poslední den.</li><li>Pracovní dny jsou zde pondělí až pátek. Státní svátky se v jednotlivých zemích liší a neodečítají se.</li><li>Štědrý den (24. prosince) je v mnoha zemích střední Evropy hlavním svátkem, zatímco Hod boží vánoční je 25. prosince. Velikonoce se každý rok posouvají a určují se podle lunárního kalendáře (neděle po prvním úplňku od 21. března).</li>", "h3": "Časové jednotky v kostce", "faqh": "Časté otázky", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Kolik dní je mezi dvěma daty?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Použij režim Rozdíl dat: zadej obě data a získáš počet dní, týdny a dny, počet hodin a pracovní dny, i rozpis na roky, měsíce a dny. Příklad: od 1. do 10. ledna je 9 dní, nebo 10, pokud zaškrtneš „Započítat i poslední den“.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak přičtu nebo odečtu dny, týdny či měsíce?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Vyber Přičíst nebo odečíst, zadej výchozí datum, množství a jednotku (dny, týdny, měsíce, roky nebo pracovní dny) a stránka ukáže výsledné datum. Příklad: 30 dní po 1. březnu je 31. březen.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak se počítají pracovní dny?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Pracovní dny jsou od pondělí do pátku. Státní svátky se v jednotlivých zemích liší a neodečítají se, proto si svátky své země zkontroluj zvlášť.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak vypočítám věk a příští narozeniny?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Vyber Věk, zadej datum narození a podle potřeby jiné datum, ke kterému se věk počítá. Získáš věk v letech, měsících a dnech, počet prožitých dní a příští narozeniny.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak zjistím číslo týdne nebo den v roce?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Režim Informace o datu ukáže číslo týdne, den v roce, počet dní do konce roku, počet dní v měsíci, čtvrtletí a zda je rok přestupný. Týdny se řídí pravidlem ISO: začínají v pondělí a týden 1 obsahuje první čtvrtek roku.</p></details></li>"}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Kalkulator dat", "sub": "Sprawdź różnicę dwóch dat, odliczaj do Świąt lub dowolnego dnia, dodawaj i odejmuj czas oraz oblicz wiek.", "h1": "Jak działają obliczenia na datach", "p1": "Daty kalendarzowe liczy się w pełnych dniach. Różnica dwóch dat to liczba dni od jednej do drugiej, którą można też rozłożyć na lata, miesiące i dni. Ponieważ miesiące mają od 28 do 31 dni, rozkład na lata, miesiące i dni najpierw liczy pełne miesiące, a potem pozostałe dni.", "h4": "Warto wiedzieć", "lim": "<li>Zwykły rok ma 365 dni, przestępny 366. Rok jest przestępny, gdy dzieli się przez 4, z wyjątkiem pełnych setek, które muszą dzielić się przez 400 (rok 2000 był przestępny, 1900 nie).</li><li>Numery tygodni ISO zaczynają się w poniedziałek, a tydzień 1 to ten, w którym wypada pierwszy czwartek roku.</li><li>Ma znaczenie, czy liczy się ostatni dzień: od 1 do 10 stycznia to 9 dni albo 10 dni, jeśli liczy się pierwszy i ostatni dzień.</li><li>Dni robocze to tu poniedziałek–piątek. Święta państwowe różnią się w zależności od kraju i nie są odejmowane.</li><li>Wigilia (24 grudnia) jest w wielu krajach Europy Środkowej głównym świętem, a Boże Narodzenie wypada 25 grudnia. Wielkanoc przesuwa się co roku i jest wyznaczana według kalendarza księżycowego (niedziela po pierwszej pełni od 21 marca).</li>", "h3": "Jednostki czasu w skrócie", "faqh": "Najczęstsze pytania", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ile dni jest między dwiema datami?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Użyj trybu Różnica dat: wpisz obie daty, a otrzymasz liczbę dni, tygodnie i dni, liczbę godzin i dni robocze oraz podział na lata, miesiące i dni. Przykład: od 1 do 10 stycznia to 9 dni albo 10, jeśli zaznaczysz „Wlicz ostatni dzień”.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak dodać lub odjąć dni, tygodnie albo miesiące?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Wybierz Dodaj lub odejmij, wpisz datę początkową, ilość i jednostkę (dni, tygodnie, miesiące, lata lub dni robocze), a strona pokaże datę wynikową. Przykład: 30 dni po 1 marca to 31 marca.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak liczone są dni robocze?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Dni robocze to poniedziałek–piątek. Święta państwowe różnią się w zależności od kraju i nie są odejmowane, więc sprawdź święta swojego kraju osobno.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak obliczyć wiek i następne urodziny?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Wybierz Wiek, wpisz datę urodzenia i w razie potrzeby inną datę, na którą liczony jest wiek. Otrzymasz wiek w latach, miesiącach i dniach, liczbę przeżytych dni i następne urodziny.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak sprawdzić numer tygodnia lub dzień roku?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Tryb Informacje o dacie pokazuje numer tygodnia, dzień roku, liczbę dni do końca roku, liczbę dni w miesiącu, kwartał i informację, czy rok jest przestępny. Tygodnie liczone są według ISO: zaczynają się w poniedziałek, a tydzień 1 zawiera pierwszy czwartek roku.</p></details></li>"}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calculateur de dates", "sub": "Calculez l’écart entre deux dates, le compte à rebours jusqu’à Noël ou n’importe quel jour, ajoutez ou soustrayez du temps et calculez un âge.", "h1": "Comment fonctionnent les calculs de dates", "p1": "Les dates du calendrier se comptent en jours entiers. L’écart entre deux dates est le nombre de jours de l’une à l’autre, et il peut aussi se décomposer en années, mois et jours. Comme les mois ont de 28 à 31 jours, la décomposition compte d’abord les mois complets, puis les jours restants.", "h4": "Bon à savoir", "lim": "<li>Une année ordinaire compte 365 jours, une année bissextile 366. Une année est bissextile si elle est divisible par 4, sauf les années séculaires, qui doivent être divisibles par 400 (2000 était bissextile, 1900 non).</li><li>Les numéros de semaine ISO commencent le lundi, et la semaine 1 est celle qui contient le premier jeudi de l’année.</li><li>Compter ou non le dernier jour change le résultat : du 1er au 10 janvier, il y a 9 jours, ou 10 si le premier et le dernier jour sont inclus.</li><li>Les jours ouvrés sont ici du lundi au vendredi. Les jours fériés varient selon les pays et ne sont pas retranchés.</li><li>La veille de Noël (24 décembre) est la fête principale dans plusieurs pays d’Europe centrale, tandis que Noël tombe le 25 décembre. Pâques change chaque année et se calcule d’après le calendrier lunaire (le dimanche après la première pleine lune à partir du 21 mars).</li>", "h3": "Les unités de temps en bref", "faqh": "Questions fréquentes", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Combien de jours y a-t-il entre deux dates ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Utilisez le mode Écart entre dates : saisissez les deux dates et vous obtenez le total de jours, les semaines et jours, le total d’heures et les jours ouvrés, ainsi que le détail en années, mois et jours. Exemple : du 1er au 10 janvier, il y a 9 jours, ou 10 si vous cochez « Inclure le dernier jour ».</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Comment ajouter ou soustraire des jours, des semaines ou des mois ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Choisissez Ajouter ou soustraire, saisissez la date de départ, la quantité et l’unité (jours, semaines, mois, années ou jours ouvrés) et la page affiche la date obtenue. Exemple : 30 jours après le 1er mars, on est le 31 mars.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Comment les jours ouvrés sont-ils comptés ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Les jours ouvrés vont du lundi au vendredi. Les jours fériés diffèrent selon les pays et ne sont pas déduits ; vérifiez donc séparément ceux de votre pays.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Comment calculer l’âge et le prochain anniversaire ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Choisissez Âge, saisissez la date de naissance et, si vous le souhaitez, une autre date à laquelle calculer l’âge. Vous obtenez l’âge en années, mois et jours, le nombre de jours vécus et le prochain anniversaire.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Comment trouver le numéro de semaine ou le jour de l’année ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Le mode Infos sur la date affiche le numéro de semaine, le jour de l’année, les jours restants dans l’année, les jours du mois, le trimestre et si l’année est bissextile. Les semaines suivent la règle ISO : elles commencent le lundi et la semaine 1 contient le premier jeudi de l’année.</p></details></li>"}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Calculadora de fechas", "sub": "Calcula la diferencia entre dos fechas, la cuenta atrás hasta Navidad o cualquier día, suma o resta tiempo y averigua una edad.", "h1": "Cómo funcionan los cálculos con fechas", "p1": "Las fechas del calendario se cuentan en días completos. La diferencia entre dos fechas es el número de días de una a otra y también se puede dividir en años, meses y días. Como los meses tienen de 28 a 31 días, el desglose cuenta primero los meses completos y después los días restantes.", "h4": "Conviene saber", "lim": "<li>Un año común tiene 365 días y uno bisiesto 366. Un año es bisiesto si es divisible entre 4, salvo los años de siglo, que deben ser divisibles entre 400 (2000 fue bisiesto, 1900 no).</li><li>Los números de semana ISO empiezan en lunes y la semana 1 es la que contiene el primer jueves del año.</li><li>Importa si se cuenta el último día: del 1 al 10 de enero hay 9 días, o 10 si se incluyen el primer y el último día.</li><li>Los días laborables son aquí de lunes a viernes. Los festivos varían según el país y no se restan.</li><li>Nochebuena (24 de diciembre) es la fiesta principal en varios países de Europa central, mientras que la Navidad es el 25 de diciembre. La Pascua cambia cada año y se calcula con el calendario lunar (el domingo posterior a la primera luna llena desde el 21 de marzo).</li>", "h3": "Las unidades de tiempo de un vistazo", "faqh": "Preguntas frecuentes", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Cuántos días hay entre dos fechas?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Usa el modo Diferencia de fechas: introduce ambas fechas y obtienes el total de días, las semanas y días, el total de horas y los días laborables, además del desglose en años, meses y días. Ejemplo: del 1 al 10 de enero ha const doy=d=>diffDays(new Date(Date.UTC(d.getUTCFullYear(),0,1)),d)+1;
const leap=y=>y%4===0&&(y%100!==0||y%400===0);
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(Date.UTC(y,mo-1,da))}
function target(sel,custom,today){
  if(sel==='custom')return parse(custom);
  const y=today.getUTCFullYear(),mk=yy=>sel==='eve'?new Date(Date.UTC(yy,11,24)):sel==='xmas'?new Date(Date.UTC(yy,11,25)):sel==='ny'?new Date(Date.UTC(yy,0,1)):easter(yy);
  let t=mk(y);if(t<today)t=mk(y+1);return t;
}
// HELP-END

const t0=todayUTC();
const v={d1:iso(t0),d2:iso(new Date(Date.UTC(t0.getUTCFullYear(),11,31))),incl:false,cdsel:'eve',cd:iso(addDays(t0,100)),a0:iso(t0),op:'add',n:'30',u:'days',b0:'1990-01-01',b1:iso(t0),i0:iso(t0)};
const SEL={cdsel:['eve','xmas','ny','easter','custom'].map(k=>[k,'o_'+k]),op:[['add','o_add'],['sub','o_sub']],u:['days','weeks','months','years','bdays'].map(k=>[k,'u_'+k])};
const FIELDS={diff:[['d1','date'],['d2','date'],['incl','check']],count:[['cdsel','select'],['cd','date']],add:[['a0','date'],['op','select'],['n','number'],['u','select']],age:[['b0','date'],['b1','date']],info:[['i0','date']]};
const MODES=Object.keys(FIELDS);
const parts=(y,mo,d)=>{const p=[];if(y)p.push(U(y,'year'));if(mo)p.push(U(mo,'month'));if(d||!p.length)p.push(U(d,'day'));return LIST(p)};
const RUN={
 diff(){let a=parse(v.d1),b=parse(v.d2);if(!a||!b)return null;let sw=false;if(a>b){[a,b]=[b,a];sw=true}
  const e=v.incl?addDays(b,1):b,[y,mo,d]=ymd(a,e),days=diffDays(a,e);
  return {rl:L('res_diff'),big:parts(y,mo,d),rows:[[L('tdays'),U(days,'day')],[L('wd'),LIST([U(Math.floor(days/7),'week'),U(days%7,'day')])],[L('thrs'),U(days*24,'hour')],[L('bd'),NF(bdays(a,e))]],note:(sw?L('rev')+' ':'')+L('wnote')}},
 count(){const t=target(v.cdsel,v.cd,t0);if(!t)return null;const dd=diffDays(t0,t);tgt=t;
  const rows=[[L('tg'),DF(t,LONG)]];if(dd>0){rows.push([L('wd'),LIST([U(Math.floor(dd/7),'week'),U(dd%7,'day')])]);rows.push([L('cdl'),NF(bdays(t0,t))])}
  return {rl:v.cdsel==='custom'?L('tg'):L('o_'+v.cdsel),big:dd===0?L('today'):RT(dd),boxes:dd>0,rows,note:dd>0?L('wnote'):''}},
 add(){const a=parse(v.a0),n=Math.trunc(+v.n);if(!a||v.n===''||!isFinite(n)||Math.abs(n)>100000)return null;const s=v.op==='sub'?-1:1;let r;
  if(v.u==='days')r=addDays(a,s*n);else if(v.u==='weeks')r=addDays(a,s*n*7);else if(v.u==='months')r=addMonths(a,s*n);else if(v.u==='years')r=addMonths(a,s*n*12);else r=addBdays(a,s*n);
  if(isNaN(r))return null;
  return {rl:L('res_date'),big:DF(r,LONG),rows:[[L('wk'),isoWeek(r)],[L('rel'),RT(diffDays(t0,r))]],note:v.u==='bdays'?L('wnote'):''}},
 age(){const b=parse(v.b0),c=parse(v.b1);if(!b||!c)return null;if(b>c)return {err:'eage'};
  const [y,mo,d,tm]=ymd(b,c),bd=yy=>new Date(Date.UTC(yy,b.getUTCMonth(),Math.min(b.getUTCDate(),dim(yy,b.getUTCMonth()))));
  let nb=bd(c.getUTCFullYear());if(nb<c)nb=bd(c.getUTCFullYear()+1);
  return {rl:L('res_age'),big:parts(y,mo,d),rows:[[L('tdl'),U(diffDays(b,c),'day')],[L('tmon'),NF(tm)],[L('nb'),DF(nb,LONG)+' · '+RT(diffDays(c,nb))],[L('bw'),DF(b,{weekday:'long'})]]}},
 info(){const d=parse(v.i0);if(!d)return null;const y=d.getUTCFullYear(),n=doy(d),tot=leap(y)?366:365;
  return {rl:L('cd'),big:DF(d,LONG),rows:[[L('wk'),isoWeek(d)],[L('doy'),n],[L('dl'),tot-n],[L('dim'),dim(y,d.getUTCMonth())],[L('leap'),L(leap(y)?'yes':'no')],[L('qtr'),Math.floor(d.getUTCMonth()/3)+1]]}}
};
function buildTabs(){$('tabs').innerHTML=MODES.map(m=>`<button class="chip" role="tab" data-m="${m}" aria-pressed="${m===mode}">${L('m_'+m)}</button>`).join('')}
function buildFields(){
  $('fields').innerHTML=FIELDS[mode].filter(([k])=>k!=='cd'||v.cdsel==='custom').map(([k,type])=>{
    if(type==='check')return `<label class="chk"><input type="checkbox" data-f="${k}" ${v[k]?'checked':''}>${L(k)}</label>`;
    const inner=type==='select'?`<select data-f="${k}">${SEL[k].map(([o,l])=>`<option value="${o}" ${v[k]===o?'selected':''}>${L(l)}</option>`).join('')}</select>`:`<input data-f="${k}" type="${type}" ${type==='number'?'inputmode="numeric" step="1"':''} value="${v[k]}">`;
    return `<div><label class="block text-sm" style="color:#8b94a7">${L(k)}</label><div class="field mt-2">${inner}</div></div>`}).join('');
}
function buildUnits(){
  $('units').innerHTML=[[1,'week',7,'day'],[1,'day',24,'hour'],[1,'hour',60,'minute'],[1,'minute',60,'second'],[1,'year',365,'day']].map(([a,u,b,w])=>`<div class="stat"><span>${U(a,u)}</span><b>${U(b,w)}</b></div>`).join('')+`<div class="stat"><span>${L('leap')}</span><b>${U(366,'day')}</b></div>`;
}
function text(){
  const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const t=X[e.dataset.i];if(t!==undefined)e.tagName==='UL'?e.innerHTML=t:e.textContent=t});
  buildTabs();buildFields();buildUnits();syncLang();calc();
}
function boxVals(){const tl=new Date(tgt.getUTCFullYear(),tgt.getUTCMonth(),tgt.getUTCDate()).getTime(),s=Math.floor(Math.max(0,tl-Date.now())/1000);return [Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60]}
function tick(){if(mode!=='count'||!$('cdv0'))return;boxVals().forEach((n,i)=>{$('cdv'+i).textContent=n})}
function calc(){
  const o=RUN[mode](),ok=o&&!o.err;
  $('res').classList.toggle('hidden',!ok);$('hint').classList.toggle('hidden',!!o);$('hint').textContent=L('hint');
  $('err').classList.toggle('hidden',!(o&&o.err));if(o&&o.err)$('err').textContent=L(o.err);
  if(!ok)return;
  $('rl').textContent=o.rl;$('big').textContent=o.big;
  $('bx').innerHTML=o.boxes?['u_days','h_h','h_m','h_s'].map((k,i)=>`<div class="box"><b id="cdv${i}">0</b><span>${L(k)}</span></div>`).join(''):'';
  if(o.boxes)tick();
  $('xs').innerHTML=o.rows.map(([k,val])=>`<div class="stat"><span>${k}</span><b>${val}</b></div>`).join('');
  $('nt').textContent=o.note||'';
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;buildTabs();buildFields();calc()});
$('fields').addEventListener('input',e=>{const k=e.target.dataset.f;if(!k)return;v[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;if(k==='cdsel')buildFields();calc()});
setInterval(tick,1000);
initLang(text);text();
</script>
</body>
</html>
