const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "Tile & Flooring Calculator", "sub": "Work out how many tiles or planks you need for a floor, including waste.", "h1": "How many tiles do you need?", "p1": "Divide the floor area by the area of one tile including the grout joint, then add waste for cuts and breakage. Straight laying needs about 10% extra, diagonal about 15% and complex patterns such as herringbone about 20%.", "h2": "Formula", "p2": "Tiles = floor area ÷ ((tile length + joint) × (tile width + joint)) × (1 + waste ÷ 100). The same method works for laminate, vinyl and wooden planks.", "h4": "Good to know", "lim": "<li>Keep a few spare tiles from the same batch for future repairs; shades can differ between batches.</li><li>Large-format tiles and small rooms need more waste because of cuts.</li><li>Check the tile dimensions: nominal and actual sizes can differ slightly.</li>", "note": "Estimate only; ask the supplier before ordering."}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Kalkulačka dlažby a podlahy", "sub": "Zisti, koľko dlaždíc alebo líšt potrebuješ na podlahu vrátane rezervy.", "h1": "Koľko dlaždíc potrebuješ?", "p1": "Plochu podlahy vydeľ plochou jednej dlaždice vrátane škáry a pridaj rezervu na rezanie a rozbitie. Rovné kladenie potrebuje asi 10 % navyše, diagonálne asi 15 % a zložité vzory, napríklad rybia kosť, asi 20 %.", "h2": "Vzorec", "p2": "Dlaždice = plocha podlahy ÷ ((dĺžka dlaždice + škára) × (šírka dlaždice + škára)) × (1 + rezerva ÷ 100). Rovnako to funguje pre laminát, vinyl a drevené lišty.", "h4": "Dobré vedieť", "lim": "<li>Nechaj si pár dlaždíc z tej istej šarže na budúce opravy; odtiene sa medzi šaržami môžu líšiť.</li><li>Veľkoformátové dlaždice a malé miestnosti potrebujú väčšiu rezervu kvôli rezaniu.</li><li>Skontroluj rozmery dlaždice: nominálne a skutočné rozmery sa môžu mierne líšiť.</li>", "note": "Len odhad; pred objednávkou sa opýtaj dodávateľa."}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Fliesen- & Bodenrechner", "sub": "Berechne, wie viele Fliesen oder Dielen du für einen Boden brauchst, inklusive Verschnitt.", "h1": "Wie viele Fliesen brauchst du?", "p1": "Teile die Bodenfläche durch die Fläche einer Fliese inklusive Fuge und addiere Verschnitt für Zuschnitte und Bruch. Gerades Verlegen braucht etwa 10 % mehr, diagonales etwa 15 % und aufwendige Muster wie Fischgrät etwa 20 %.", "h2": "Formel", "p2": "Fliesen = Bodenfläche ÷ ((Fliesenlänge + Fuge) × (Fliesenbreite + Fuge)) × (1 + Verschnitt ÷ 100). Dasselbe gilt für Laminat, Vinyl und Holzdielen.", "h4": "Gut zu wissen", "lim": "<li>Hebe ein paar Fliesen aus derselben Charge für spätere Reparaturen auf; Farbtöne können sich zwischen Chargen unterscheiden.</li><li>Großformatige Fliesen und kleine Räume brauchen wegen der Zuschnitte mehr Verschnitt.</li><li>Prüfe die Fliesenmaße: Nenn- und tatsächliche Maße können leicht abweichen.</li>", "note": "Nur eine Schätzung; frage vor der Bestellung beim Händler nach."}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Kalkulačka dlažby a podlahy", "sub": "Zjisti, kolik dlaždic nebo lamel potřebuješ na podlahu včetně rezervy.", "h1": "Kolik dlaždic potřebuješ?", "p1": "Plochu podlahy vyděl plochou jedné dlaždice včetně spáry a přidej rezervu na řezání a rozbití. Rovné kladení potřebuje asi 10 % navíc, diagonální asi 15 % a složité vzory, například rybí kost, asi 20 %.", "h2": "Vzorec", "p2": "Dlaždice = plocha podlahy ÷ ((délka dlaždice + spára) × (šířka dlaždice + spára)) × (1 + rezerva ÷ 100). Stejně to funguje pro laminát, vinyl a dřevěné lamely.", "h4": "Dobré vědět", "lim": "<li>Nech si pár dlaždic ze stejné šarže na budoucí opravy; odstíny se mezi šaržemi mohou lišit.</li><li>Velkoformátové dlaždice a malé místnosti potřebují větší rezervu kvůli řezání.</li><li>Zkontroluj rozměry dlaždice: nominální a skutečné rozměry se mohou mírně lišit.</li>", "note": "Pouze odhad; před objednávkou se zeptej dodavatele."}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Kalkulator płytek i podłogi", "sub": "Sprawdź, ile płytek lub desek potrzebujesz na podłogę, wraz z zapasem.", "h1": "Ile płytek potrzebujesz?", "p1": "Podziel powierzchnię podłogi przez powierzchnię jednej płytki wraz z fugą i dodaj zapas na cięcie i stłuczki. Układ prosty wymaga około 10 % więcej, po przekątnej około 15 %, a złożone wzory, jak jodełka, około 20 %.", "h2": "Wzór", "p2": "Płytki = powierzchnia podłogi ÷ ((długość płytki + fuga) × (szerokość płytki + fuga)) × (1 + zapas ÷ 100). Tak samo działa to dla paneli, winylu i desek drewnianych.", "h4": "Warto wiedzieć", "lim": "<li>Zachowaj kilka płytek z tej samej partii na przyszłe naprawy; odcienie między partiami mogą się różnić.</li><li>Płytki wielkoformatowe i małe pomieszczenia wymagają większego zapasu z powodu cięcia.</li><li>Sprawdź wymiary płytki: wymiary nominalne i rzeczywiste mogą się nieznacznie różnić.</li>", "note": "Tylko szacunek; przed zamówieniem zapytaj dostawcę."}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calculateur de carrelage et sol", "sub": "Calculez combien de carreaux ou de lames il faut pour un sol, pertes comprises.", "h1": "Combien de carreaux faut-il ?", "p1": "Divisez la surface du sol par celle d’un carreau, joint compris, puis ajoutez une marge pour les coupes et la casse. La pose droite demande environ 10 % de plus, la pose en diagonale environ 15 % et les motifs complexes comme les chevrons environ 20 %.", "h2": "Formule", "p2": "Carreaux = surface du sol ÷ ((longueur du carreau + joint) × (largeur du carreau + joint)) × (1 + marge ÷ 100). La méthode vaut aussi pour le stratifié, le vinyle et les lames de bois.", "h4": "Bon à savoir", "lim": "<li>Gardez quelques carreaux du même lot pour de futures réparations ; les teintes peuvent varier d’un lot à l’autre.</li><li>Les grands formats et les petites pièces demandent plus de marge à cause des coupes.</li><li>Vérifiez les dimensions du carreau : les formats nominal et réel peuvent légèrement différer.</li>", "note": "Estimation uniquement ; renseignez-vous auprès du fournisseur avant de commander."}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Calculadora de baldosas y suelo", "sub": "Calcula cuántas baldosas o lamas necesitas para un suelo, con el desperdicio incluido.", "h1": "¿Cuántas baldosas necesitas?", "p1": "Divide la superficie del suelo entre la de una baldosa, junta incluida, y añade un margen para cortes y roturas. La colocación recta necesita un 10 % más, la diagonal un 15 % y los patrones complejos, como la espiga, un 20 %.", "h2": "Fórmula", "p2": "Baldosas = superficie del suelo ÷ ((largo de la baldosa + junta) × (ancho de la baldosa + junta)) × (1 + margen ÷ 100). El método sirve también para laminado, vinilo y lamas de madera.", "h4": "Conviene saber", "lim": "<li>Guarda algunas baldosas del mismo lote para futuras reparaciones; los tonos pueden variar entre lotes.</li><li>Los formatos grandes y las habitaciones pequeñas necesitan más margen por los cortes.</li><li>Comprueba las medidas de la baldosa: el formato nominal y el real pueden diferir ligeramente.</li>", "note": "Solo una estimación; consulta al proveedor antes de pedir."}};

 por caja (opcional)", "area": "Floor area|Plocha podlahy|Bodenfläche|Plocha podlahy|Powierzchnia podłogi|Surface au sol|Superficie del suelo", "need": "Tiles needed (with waste)|Potrebné dlaždice (s rezervou)|Benötigte Fliesen (mit Verschnitt)|Potřebné dlaždice (s rezervou)|Potrzebne płytki (z zapasem)|Carreaux nécessaires (avec marge)|Baldosas necesarias (con margen)", "boxes": "Boxes|Balenia|Kartons|Balení|Opakowania|Boîtes|Cajas", "cover": "Area covered by the tiles|Plocha pokrytá dlaždicami|Mit Fliesen abgedeckte Fläche|Plocha pokrytá dlaždicemi|Powierzchnia pokryta płytkami|Surface couverte par les carreaux|Superficie cubierta por las baldosas"};

const BASE='https://calc-hub.eu/tiles.html',OGL={"en": "en_US", "sk": "sk_SK", "de": "de_DE", "cs": "cs_CZ", "pl": "pl_PL", "fr": "fr_FR", "es": "es_ES"},META={"en": {"t": "Tile Calculator – How Many Tiles Do I Need? | calc-hub.eu", "d": "Free tile and flooring calculator: number of tiles or planks from room and tile size, grout joint, laying pattern and waste, with boxes needed."}, "sk": {"t": "Kalkulačka dlažby a podlahy – koľko dlaždíc potrebujem? | calc-hub.eu", "d": "Bezplatná kalkulačka dlažby a podlahy: počet dlaždíc alebo líšt podľa rozmerov miestnosti a dlaždice, škáry, kladenia a rezervy, s počtom balení."}, "de": {"t": "Fliesenrechner – wie viele Fliesen brauche ich? | calc-hub.eu", "d": "Kostenloser Fliesen- und Bodenrechner: Anzahl Fliesen oder Dielen nach Raum- und Fliesengröße, Fuge, Verlegemuster und Verschnitt, mit benötigten Kartons."}, "cs": {"t": "Kalkulačka dlažby a podlahy – kolik dlaždic potřebuji? | calc-hub.eu", "d": "Bezplatná kalkulačka dlažby a podlahy: počet dlaždic nebo lamel podle rozměrů místnosti a dlaždice, spáry, kladení a rezervy, s počtem balení."}, "pl": {"t": "Kalkulator płytek i podłogi – ile płytek potrzebuję? | calc-hub.eu", "d": "Darmowy kalkulator płytek i podłogi: liczba płytek lub desek według wymiarów pomieszczenia i płytki, fugi, układu i zapasu, z liczbą opakowań."}, "fr": {"t": "Calculateur de carrelage – combien de carreaux ? | calc-hub.eu", "d": "Calculateur de carrelage et sol gratuit : nombre de carreaux ou lames selon la pièce, le format, le joint, le calepinage et les pertes, avec boîtes nécessaires."}, "es": {"t": "Calculadora de baldosas y suelo – ¿cuántas necesito? | calc-hub.eu", "d": "Calculadora de baldosas y suelo gratis: número de baldosas o lamas según la habitación, el formato, la junta, el aparejo y el desperdicio, con cajas necesarias."}};
function applySeo(){
  const m=META[lang],q=new URLSearchParams(location.search).get('lang'),u=BASE+(q&&META[q]&&q!=='en'?'?lang='+q:'');
  document.title=m.t;
  const set=(sel,v)=>{const e=document.querySelector(sel);if(e)e.setAttribute('content',v)};
  set('meta[name="description"]',m.d);set('meta[property="og:title"]',m.t);set('meta[property="og:description"]',m.d);
  set('meta[name="twitter:title"]',m.t);set('meta[name="twitter:description"]',m.d);set('meta[property="og:url"]',u);set('meta[property="og:locale"]',OGL[lang]);
  const c=document.querySelector('link[rel="canonical"]');if(c)c.setAttribute('href',u);
  document.querySelectorAll('meta[property="og:locale:alternate"]').forEach(e=>e.remove());
  Object.keys(OGL).filter(l=>l!==lang).forEach(l=>{const e=document.createElement('meta');e.setAttribute('property','og:locale:alternate');e.setAttribute('content',OGL[l]);document.head.appendChild(e)});
}
const FT={en:['Privacy & Cookies','Privacy and cookie settings','About & contact'],sk:['Ochrana údajov a cookies','Nastavenia súkromia a cookies','O nás a kontakt'],de:['Datenschutz & Cookies','Datenschutz- und Cookie-Einstellungen','Über uns & Kontakt'],cs:['Ochrana údajů a cookies','Nastavení soukromí a cookies','O nás a kontakt'],pl:['Prywatność i cookies','Ustawienia prywatności i plików cookies','O nas i kontakt'],fr:['Confidentialité et cookies','Paramètres de confidentialité et de cookies','À propos et contact'],es:['Privacidad y cookies','Configuración de privacidad y cookies','Acerca de y contacto']};
function footLinks(){const f=document.getElementById('flinks');if(!f)return;const s='<span class="mx-2">·</span>';f.innerHTML=`<a href="about.html" class="hover:text-white">${FT[lang][2]}</a>${s}<a href="privacy.html" class="hover:text-white">${FT[lang][0]}</a>${s}<button data-cs class="hover:text-white">${FT[lang][1]}</button>`}
function propLinks(){document.querySelectorAll('a[href]').forEach(a=>{const h=a.dataset.h||(a.dataset.h=a.getAttribute('href'));if(!/^[a-z-]+\.html$/.test(h))return;a.setAttribute('href',lang==='en'?h:h+'?lang='+lang)})}
function openCs(){if(window.googlefc&&googlefc.callbackQueue&&googlefc.showRevocationMessage)googlefc.callbackQueue.push(googlefc.showRevocationMessage);else location.href='privacy.html'+(lang==='en'?'':'?lang='+lang)+'#cookies'}
document.addEventListener('click',e=>{if(e.target.closest('[data-cs]'))openCs()});
const LANGS=[['sk','Slovenčina'],['de','Deutsch'],['en','English'],['cs','Čeština'],['pl','Polski'],['fr','Français'],['es','Español']];
function syncLang(){document.getElementById('langCur').textContent=lang.toUpperCase();document.querySelectorAll('#langMenu button').forEach(b=>b.setAttribute('aria-selected',b.dataset.l===lang));footLinks();propLinks();applySeo()}
function initLang(cb){
  const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu');
  menu.innerHTML=LANGS.map(([c,n])=>`<li><button role="option" data-l="${c}"><span>${n}</span><b>${c.toUpperCase()}</b></button></li>`).join('');
  const close=()=>{menu.classList.add('hidden');btn.setAttribute('aria-expanded','false')};
  btn.addEventListener('click',e=>{e.stopPropagation();const hid=menu.classList.toggle('hidden');btn.setAttribute('aria-expanded',String(!hid))});
  menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{const u=new URL(location.href);if(lang==='en')u.searchParams.delete('lang');else u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(x){}close();cb()});
  document.addEventListener('click',close);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}

const $=id=>document.getElementById(id);
const IDX={en:0,sk:1,de:2,cs:3,pl:4,fr:5,es:6},LOC={sk:'sk-SK',de:'de-DE',en:'en-GB',cs:'cs-CZ',pl:'pl-PL',fr:'fr-FR',es:'es-ES'};
const L=k=>PIPE[k].split('|')[IDX[lang]];
const nf=(n,d=0)=>new Intl.NumberFormat(LOC[lang],{maximumFractionDigits:d}).format(n);
function baseText(){
  const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.tagName==='UL'?e.innerHTML=v:e.textContent=v});
  document.querySelectorAll('[data-p]').forEach(e=>e.textContent=L(e.dataset.p));
}
function showRes(o){$('res').classList.toggle('hidden',!o||!!o.err);$('hint').classList.toggle('hidden',!!o);$('hint').textContent=L('hint');$('err').classList.toggle('hidden',!(o&&o.err));if(o&&o.err)$('err').textContent=L(o.err);return !!o&&!o.err}
const rows=a=>a.map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');

const PW={s:10,d:15,h:20};let pat='s',wTouched=false;
function calcAll(){
  const r=+$('tr').value,q=+$('tq').value,tl=+$('tl_').value,tw=+$('tw_').value,gp=+$('tg').value,u=+$('tu').value,s=+$('ts').value||0,bx=+$('tb').value||0;
  if(['tr','tq','tl_','tw_','tg','tu'].some(id=>$(id).value===''||!isFinite(+$(id).value)))return null;
  if(!(r>0&&q>0&&tl>0&&tw>0&&gp>=0&&gp<=30&&u>=0&&u<=100&&s>=0&&r<=200&&q<=200))return null;
  const area=r*q-s;if(area<=0)return null;
  const one=(tl+gp/10)*(tw+gp/10)/10000,n=Math.ceil(area/one*(1+u/100)),boxes=bx>0?Math.ceil(n/bx):0;
  return {area,n,boxes,cov:(boxes?boxes*bx:n)*one};
}
function calc(){const o=calcAll();if(!showRes(o))return;
  $('big').textContent=nf(o.n);
  $('rows').innerHTML=rows([[L('area'),nf(o.area,2)+' m²']].concat(o.boxes?[[L('boxes'),nf(o.boxes)]]:[]).concat([[L('cover'),nf(o.cov,2)+' m²']]));}
function build(){$('tp').innerHTML=['s','d','h'].map(k=>`<option value="${k}" ${k===pat?'selected':''}>${L('p_'+k)}</option>`).join('')}
function text(){baseText();build();$('fbox').innerHTML=`<b style="color:var(--accent)">${L('need')} = ${L('area')} ÷ ((${L('tl').split(' (')[0]} + ${L('gap').split(' (')[0]}) × (${L('tw').split(' (')[0]} + ${L('gap').split(' (')[0]})) × (1 + ${L('waste').split(' (')[0]} ÷ 100)</b>`;syncLang();calc()}
$('tp').addEventListener('change',e=>{pat=e.target.value;if(!wTouched)$('tu').value=PW[pat];calc()});
$('tu').addEventListener('input',()=>{wTouched=true});
['tr','tq','tl_','tw_','tg','tu','ts','tb'].forEach(id=>$(id).addEventListener('input',calc));
initLang(text);text();
</script>
