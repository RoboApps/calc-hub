let lang='en';
const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "Tile & Flooring Calculator", "sub": "Work out how many tiles or planks you need for a floor, including waste.", "h1": "How many tiles do you need?", "p1": "Divide the floor area by the area of one tile including the grout joint, then add waste for cuts and breakage. Straight laying needs about 10% extra, diagonal about 15% and complex patterns such as herringbone about 20%.", "h2": "Formula", "p2": "Tiles = floor area ÷ ((tile length + joint) × (tile width + joint)) × (1 + waste ÷ 100). The same method works for laminate, vinyl and wooden planks.", "h4": "Good to know", "lim": "<li>Keep a few spare tiles from the same batch for future repairs; shades can differ between batches.</li><li>Large-format tiles and small rooms need more waste because of cuts.</li><li>Check the tile dimensions: nominal and actual sizes can differ slightly.</li>", "note": "Estimate only; ask the supplier before ordering.", "faqh": "Frequently asked questions", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How do I calculate how many tiles I need?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Divide the floor area by the area of one tile including the grout joint, then add waste. Example: a 5 × 4 m room is 20 m². A 60 × 30 cm tile with a 3 mm joint covers about 0.183 m², so you need about 110 tiles and 121 with 10% waste.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How much waste should I allow?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">The calculator uses about 10% for straight laying, 15% for diagonal and 20% for complex patterns such as herringbone. Large tiles and small rooms need more waste because of cutting, and you can change the percentage yourself.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Is the grout joint included in the calculation?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Yes. The joint width is added to the tile length and width, so wider joints mean slightly fewer tiles. Check the recommended joint width for your tile with the manufacturer.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">What is the area to subtract for?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Use it for areas you will not tile, such as a bath, kitchen island or fixed furniture. The calculator subtracts it from the floor area before counting tiles.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Why should I buy a few extra tiles and keep spares?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Tiles are sold in boxes, so enter the number of tiles per box to see how many boxes to buy (for example 121 tiles at 8 per box means 16 boxes). Buy everything from the same batch, because shades can differ between batches, and keep a few spares for future repairs.</p></details></li>"}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Výpočet dlažby a podlahy", "sub": "Zisti, koľko dlaždíc alebo líšt potrebuješ na podlahu vrátane rezervy.", "h1": "Koľko dlaždíc potrebuješ?", "p1": "Plochu podlahy vydeľ plochou jednej dlaždice vrátane škáry a pridaj rezervu na rezanie a rozbitie. Rovné kladenie potrebuje asi 10 % navyše, diagonálne asi 15 % a zložité vzory, napríklad rybia kosť, asi 20 %.", "h2": "Vzorec", "p2": "Dlaždice = plocha podlahy ÷ ((dĺžka dlaždice + škára) × (šírka dlaždice + škára)) × (1 + rezerva ÷ 100). Rovnako to funguje pre laminát, vinyl a drevené lišty.", "h4": "Dobré vedieť", "lim": "<li>Nechaj si pár dlaždíc z tej istej šarže na budúce opravy; odtiene sa medzi šaržami môžu líšiť.</li><li>Veľkoformátové dlaždice a malé miestnosti potrebujú väčšiu rezervu kvôli rezaniu.</li><li>Skontroluj rozmery dlaždice: nominálne a skutočné rozmery sa môžu mierne líšiť.</li>", "note": "Len odhad; pred objednávkou sa opýtaj dodávateľa.", "faqh": "Často kladené otázky", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ako vypočítam, koľko dlaždíc potrebujem?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Vydeľ plochu podlahy plochou jednej dlaždice vrátane škáry a pridaj rezervu. Príklad: miestnosť 5 × 4 m má 20 m². Dlaždica 60 × 30 cm so škárou 3 mm pokryje asi 0,183 m², takže potrebuješ približne 110 dlaždíc a s 10 % rezervou 121.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Akú rezervu počítať?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Kalkulačka používa asi 10 % pri rovnom kladení, 15 % pri diagonálnom a 20 % pri zložitých vzoroch, napríklad rybia kosť. Veľkoformátové dlaždice a malé miestnosti potrebujú väčšiu rezervu kvôli rezaniu a percento môžeš zmeniť.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Zahŕňa výpočet aj škáru?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Áno. Šírka škáry sa pripočíta k dĺžke a šírke dlaždice, takže širšie škáry znamenajú mierne menej dlaždíc. Odporúčanú šírku škáry si over u výrobcu dlaždíc.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Načo slúži plocha na odpočítanie?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Použi ju na plochy, ktoré nebudeš obkladať, napríklad vaňu, kuchynský ostrovček alebo pevný nábytok. Kalkulačka ju odpočíta od plochy podlahy ešte pred počítaním dlaždíc.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Prečo kúpiť pár dlaždíc navyše a nechať si rezervu?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Dlaždice sa predávajú v baleniach, preto zadaj počet kusov v balení a uvidíš, koľko balení kúpiť (napríklad 121 dlaždíc pri 8 kusoch v balení je 16 balení). Kúp všetko z tej istej šarže, lebo odtiene sa medzi šaržami môžu líšiť, a nechaj si pár kusov na budúce opravy.</p></details></li>"}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Fliesen berechnen", "sub": "Berechne, wie viele Fliesen oder Dielen du für einen Boden brauchst, inklusive Verschnitt.", "h1": "Wie viele Fliesen brauchst du?", "p1": "Teile die Bodenfläche durch die Fläche einer Fliese inklusive Fuge und addiere Verschnitt für Zuschnitte und Bruch. Gerades Verlegen braucht etwa 10 % mehr, diagonales etwa 15 % und aufwendige Muster wie Fischgrät etwa 20 %.", "h2": "Formel", "p2": "Fliesen = Bodenfläche ÷ ((Fliesenlänge + Fuge) × (Fliesenbreite + Fuge)) × (1 + Verschnitt ÷ 100). Dasselbe gilt für Laminat, Vinyl und Holzdielen.", "h4": "Gut zu wissen", "lim": "<li>Hebe ein paar Fliesen aus derselben Charge für spätere Reparaturen auf; Farbtöne können sich zwischen Chargen unterscheiden.</li><li>Großformatige Fliesen und kleine Räume brauchen wegen der Zuschnitte mehr Verschnitt.</li><li>Prüfe die Fliesenmaße: Nenn- und tatsächliche Maße können leicht abweichen.</li>", "note": "Nur eine Schätzung; frage vor der Bestellung beim Händler nach.", "faqh": "Häufige Fragen", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie berechne ich, wie viele Fliesen ich brauche?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Teile die Bodenfläche durch die Fläche einer Fliese inklusive Fuge und addiere den Verschnitt. Beispiel: Ein Raum von 5 × 4 m hat 20 m². Eine Fliese von 60 × 30 cm mit 3 mm Fuge deckt etwa 0,183 m², du brauchst also rund 110 Fliesen und mit 10 % Verschnitt 121.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie viel Verschnitt sollte ich einplanen?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Der Rechner nimmt etwa 10 % für gerades Verlegen, 15 % für diagonales und 20 % für aufwendige Muster wie Fischgrät. Große Fliesen und kleine Räume brauchen wegen des Zuschnitts mehr Verschnitt, und du kannst den Prozentsatz selbst ändern.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ist die Fuge in der Berechnung enthalten?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Ja. Die Fugenbreite wird zur Länge und Breite der Fliese addiert, breitere Fugen bedeuten also etwas weniger Fliesen. Die empfohlene Fugenbreite erfragst du beim Hersteller deiner Fliese.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wofür ist die abzuziehende Fläche gedacht?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Verwende sie für Flächen, die du nicht fliesen willst, etwa eine Badewanne, eine Kücheninsel oder fest eingebaute Möbel. Der Rechner zieht sie von der Bodenfläche ab, bevor er die Fliesen zählt.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Warum sollte ich ein paar Fliesen mehr kaufen und Reserve behalten?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Fliesen werden in Kartons verkauft, gib deshalb die Stückzahl pro Karton ein, um die Anzahl der Kartons zu sehen (zum Beispiel 121 Fliesen bei 8 pro Karton sind 16 Kartons). Kaufe alles aus derselben Charge, denn Farbtöne können sich zwischen Chargen unterscheiden, und behalte ein paar Fliesen für spätere Reparaturen.</p></details></li>"}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Výpočet dlažby a podlahy", "sub": "Zjisti, kolik dlaždic nebo lamel potřebuješ na podlahu včetně rezervy.", "h1": "Kolik dlaždic potřebuješ?", "p1": "Plochu podlahy vyděl plochou jedné dlaždice včetně spáry a přidej rezervu na řezání a rozbití. Rovné kladení potřebuje asi 10 % navíc, diagonální asi 15 % a složité vzory, například rybí kost, asi 20 %.", "h2": "Vzorec", "p2": "Dlaždice = plocha podlahy ÷ ((délka dlaždice + spára) × (šířka dlaždice + spára)) × (1 + rezerva ÷ 100). Stejně to funguje pro laminát, vinyl a dřevěné lamely.", "h4": "Dobré vědět", "lim": "<li>Nech si pár dlaždic ze stejné šarže na budoucí opravy; odstíny se mezi šaržemi mohou lišit.</li><li>Velkoformátové dlaždice a malé místnosti potřebují větší rezervu kvůli řezání.</li><li>Zkontroluj rozměry dlaždice: nominální a skutečné rozměry se mohou mírně lišit.</li>", "note": "Pouze odhad; před objednávkou se zeptej dodavatele.", "faqh": "Časté otázky", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak spočítám, kolik dlaždic potřebuji?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Vyděl plochu podlahy plochou jedné dlaždice včetně spáry a přidej rezervu. Příklad: místnost 5 × 4 m má 20 m². Dlaždice 60 × 30 cm se spárou 3 mm pokryje asi 0,183 m², takže potřebuješ přibližně 110 dlaždic a s 10% rezervou 121.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jakou rezervu počítat?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Kalkulačka používá asi 10 % při rovném kladení, 15 % při diagonálním a 20 % u složitých vzorů, například rybí kost. Velkoformátové dlaždice a malé místnosti potřebují větší rezervu kvůli řezání a procento můžeš změnit.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Zahrnuje výpočet i spáru?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Ano. Šířka spáry se přičte k délce a šířce dlaždice, takže širší spáry znamenají mírně méně dlaždic. Doporučenou šířku spáry si ověř u výrobce dlaždic.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">K čemu slouží plocha k odečtení?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Použij ji na plochy, které nebudeš obkládat, například vanu, kuchyňský ostrůvek nebo pevný nábytek. Kalkulačka ji odečte od plochy podlahy ještě před počítáním dlaždic.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Proč koupit pár dlaždic navíc a nechat si rezervu?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Dlaždice se prodávají v baleních, proto zadej počet kusů v balení a uvidíš, kolik balení koupit (například 121 dlaždic při 8 kusech v balení je 16 balení). Kup vše z jedné šarže, protože odstíny se mezi šaržemi mohou lišit, a nech si pár kusů na budoucí opravy.</p></details></li>"}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Obliczanie ilości płytek i podłogi", "sub": "Sprawdź, ile płytek lub desek potrzebujesz na podłogę, wraz z zapasem.", "h1": "Ile płytek potrzebujesz?", "p1": "Podziel powierzchnię podłogi przez powierzchnię jednej płytki wraz z fugą i dodaj zapas na cięcie i stłuczki. Układ prosty wymaga około 10 % więcej, po przekątnej około 15 %, a złożone wzory, jak jodełka, około 20 %.", "h2": "Wzór", "p2": "Płytki = powierzchnia podłogi ÷ ((długość płytki + fuga) × (szerokość płytki + fuga)) × (1 + zapas ÷ 100). Tak samo działa to dla paneli, winylu i desek drewnianych.", "h4": "Warto wiedzieć", "lim": "<li>Zachowaj kilka płytek z tej samej partii na przyszłe naprawy; odcienie między partiami mogą się różnić.</li><li>Płytki wielkoformatowe i małe pomieszczenia wymagają większego zapasu z powodu cięcia.</li><li>Sprawdź wymiary płytki: wymiary nominalne i rzeczywiste mogą się nieznacznie różnić.</li>", "note": "Tylko szacunek; przed zamówieniem zapytaj dostawcę.", "faqh": "Najczęstsze pytania", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak obliczyć, ile płytek potrzebuję?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Podziel powierzchnię podłogi przez powierzchnię jednej płytki wraz z fugą i dodaj zapas. Przykład: pomieszczenie 5 × 4 m ma 20 m². Płytka 60 × 30 cm z fugą 3 mm pokrywa około 0,183 m², więc potrzeba około 110 płytek, a z 10% zapasem 121.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jaki zapas przyjąć?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Kalkulator używa około 10% przy układzie prostym, 15% po przekątnej i 20% przy złożonych wzorach, takich jak jodełka. Duże płytki i małe pomieszczenia wymagają większego zapasu z powodu cięcia, a procent możesz zmienić.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Czy w obliczeniach uwzględniono fugę?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Tak. Szerokość fugi jest dodawana do długości i szerokości płytki, więc szersze fugi oznaczają nieco mniej płytek. Zalecaną szerokość fugi sprawdź u producenta płytek.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Do czego służy powierzchnia do odjęcia?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Użyj jej dla powierzchni, których nie będziesz układać, na przykład wanny, wyspy kuchennej lub stałych mebli. Kalkulator odejmuje ją od powierzchni podłogi przed policzeniem płytek.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Dlaczego warto kupić kilka płytek więcej i zostawić zapas?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Płytki sprzedaje się w opakowaniach, więc wpisz liczbę sztuk w opakowaniu, aby zobaczyć, ile opakowań kupić (na przykład 121 płytek przy 8 sztukach w opakowaniu to 16 opakowań). Kupuj wszystko z jednej partii, bo odcienie mogą się różnić między partiami, i zostaw kilka sztuk na przyszłe naprawy.</p></details></li>"}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calcul de carrelage et de sol", "sub": "Calculez combien de carreaux ou de lames il faut pour un sol, pertes comprises.", "h1": "Combien de carreaux faut-il ?", "p1": "Divisez la surface du sol par celle d’un carreau, joint compris, puis ajoutez une marge pour les coupes et la casse. La pose droite demande environ 10 % de plus, la pose en diagonale environ 15 % et les motifs complexes comme les chevrons environ 20 %.", "h2": "Formule", "p2": "Carreaux = surface du sol ÷ ((longueur du carreau + joint) × (largeur du carreau + joint)) × (1 + marge ÷ 100). La méthode vaut aussi pour le stratifié, le vinyle et les lames de bois.", "h4": "Bon à savoir", "lim": "<li>Gardez quelques carreaux du même lot pour de futures réparations ; les teintes peuvent varier d’un lot à l’autre.</li><li>Les grands formats et les petites pièces demandent plus de marge à cause des coupes.</li><li>Vérifiez les dimensions du carreau : les formats nominal et réel peuvent légèrement différer.</li>", "note": "Estimation uniquement ; renseignez-vous auprès du fournisseur avant de commander.", "faqh": "Questions fréquentes", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Comment calculer le nombre de carreaux nécessaires ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Divisez la surface au sol par la surface d’un carreau joint compris, puis ajoutez la marge de pertes. Exemple : une pièce de 5 × 4 m fait 20 m². Un carreau de 60 × 30 cm avec un joint de 3 mm couvre environ 0,183 m², il faut donc environ 110 carreaux, soit 121 avec 10 % de pertes.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Quelle marge de pertes prévoir ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Le calculateur utilise environ 10 % pour une pose droite, 15 % en diagonale et 20 % pour les calepinages complexes comme les chevrons. Les grands formats et les petites pièces demandent plus de pertes à cause des découpes, et vous pouvez modifier le pourcentage.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Le joint est-il pris en compte dans le calcul ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Oui. La largeur du joint est ajoutée à la longueur et à la largeur du carreau : des joints plus larges signifient donc un peu moins de carreaux. Vérifiez la largeur de joint recommandée auprès du fabricant.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">À quoi sert la surface à déduire ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Utilisez-la pour les zones que vous ne carrellerez pas, comme une baignoire, un îlot de cuisine ou des meubles fixes. Le calculateur la soustrait de la surface au sol avant de compter les carreaux.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Pourquoi acheter quelques carreaux de plus et garder des réserves ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Les carreaux se vendent en boîtes : saisissez le nombre de carreaux par boîte pour voir combien de boîtes acheter (par exemple 121 carreaux à 8 par boîte donnent 16 boîtes). Achetez tout dans le même lot, car les teintes peuvent varier d’un lot à l’autre, et gardez quelques carreaux pour de futures réparations.</p></details></li>"}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Cálculo de baldosas y suelo", "sub": "Calcula cuántas baldosas o lamas necesitas para un suelo, con el desperdicio incluido.", "h1": "¿Cuántas baldosas necesitas?", "p1": "Divide la superficie del suelo entre la de una baldosa, junta incluida, y añade un margen para cortes y roturas. La colocación recta necesita un 10 % más, la diagonal un 15 % y los patrones complejos, como la espiga, un 20 %.", "h2": "Fórmula", "p2": "Baldosas = superficie del suelo ÷ ((largo de la baldosa + junta) × (ancho de la baldosa + junta)) × (1 + margen ÷ 100). El método sirve también para laminado, vinilo y lamas de madera.", "h4": "Conviene saber", "lim": "<li>Guarda algunas baldosas del mismo lote para futuras reparaciones; los tonos pueden variar entre lotes.</li><li>Los formatos grandes y las habitaciones pequeñas necesitan más margen por los cortes.</li><li>Comprueba las medidas de la baldosa: el formato nominal y el real pueden diferir ligeramente.</li>", "note": "Solo una estimación; consulta al proveedor antes de pedir.", "faqh": "Preguntas frecuentes", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Cómo calculo cuántas baldosas necesito?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Divide la superficie del suelo entre la superficie de una baldosa incluida la junta y añade el margen de desperdicio. Ejemplo: una habitación de 5 × 4 m tiene 20 m². Una baldosa de 60 × 30 cm con junta de 3 mm cubre unos 0,183 m², así que necesitas unas 110 baldosas y 121 con un 10 % de desperdicio.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Qué margen de desperdicio debo prever?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">La calculadora usa aproximadamente un 10 % para colocación recta, un 15 % en diagonal y un 20 % en aparejos complejos como la espiga. Las baldosas grandes y las habitaciones pequeñas necesitan más margen por los cortes, y puedes cambiar el porcentaje.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿La junta está incluida en el cálculo?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Sí. El ancho de la junta se suma al largo y al ancho de la baldosa, así que juntas más anchas significan algo menos de baldosas. Consulta con el fabricante el ancho de junta recomendado.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Para qué sirve la superficie a descontar?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Úsala para zonas que no vas a embaldosar, como una bañera, una isla de cocina o muebles fijos. La calculadora la resta de la superficie del suelo antes de contar las baldosas.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Por qué comprar unas baldosas de más y guardar repuestos?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Las baldosas se venden en cajas, así que introduce las piezas por caja para ver cuántas cajas comprar (por ejemplo, 121 baldosas a 8 por caja son 16 cajas). Compra todo del mismo lote, porque los tonos pueden variar entre lotes, y guarda algunas piezas para futuras reparaciones.</p></details></li>"}};

 por caja (opcional)", "area": "Floor area|Plocha podlahy|Bodenfläche|Plocha podlahy|Powierzchnia podłogi|Surface au sol|Superficie del suelo", "need": "Tiles needed (with waste)|Potrebné dlaždice (s rezervou)|Benötigte Fliesen (mit Verschnitt)|Potřebné dlaždice (s rezervou)|Potrzebne płytki (z zapasem)|Carreaux nécessaires (avec marge)|Baldosas necesarias (con margen)", "boxes": "Boxes|Balenia|Kartons|Balení|Opakowania|Boîtes|Cajas", "sch": "Schematic drawing, not to scale|Schematický nákres, nie v mierke|Schematische Zeichnung, nicht maßstäblich|Schematický nákres, ne v měřítku|Rysunek poglądowy, nie w skali|Schéma, pas à l’échelle|Dibujo esquemático, sin escala", "cover": "Area covered by the tiles|Plocha pokrytá dlaždicami|Mit Fliesen abgedeckte Fläche|Plocha pokrytá dlaždicemi|Powierzchnia pokryta płytkami|Surface couverte par les carreaux|Superficie cubierta por las baldosas"};

const BASE='https://calc-hub.eu/tiles.html',OGL={"en": "en_US", "sk": "sk_SK", "de": "de_DE", "cs": "cs_CZ", "pl": "pl_PL", "fr": "fr_FR", "es": "es_ES"},META={"en": {"t": "Tile Calculator – How Many Tiles Do I Need? | calc-hub.eu", "d": "Free tile and flooring calculator: number of tiles or planks from room and tile size, grout joint, laying pattern and waste, with boxes needed."}, "sk": {"t": "Výpočet dlažby – Kalkulačka dlaždíc a podlahy | calc-hub.eu", "d": "Bezplatná kalkulačka dlažby a podlahy: počet dlaždíc alebo líšt podľa rozmerov miestnosti a dlaždice, škáry, kladenia a rezervy, s počtom balení."}, "de": {"t": "Fliesen berechnen – Fliesenrechner & Bedarf | calc-hub.eu", "d": "Kostenloser Fliesen- und Bodenrechner: Anzahl Fliesen oder Dielen nach Raum- und Fliesengröße, Fuge, Verlegemuster und Verschnitt, mit benötigten Kartons."}, "cs": {"t": "Výpočet dlažby – Kalkulačka dlaždic a podlahy | calc-hub.eu", "d": "Bezplatná kalkulačka dlažby a podlahy: počet dlaždic nebo lamel podle rozměrů místnosti a dlaždice, spáry, kladení a rezervy, s počtem balení."}, "pl": {"t": "Obliczanie ilości płytek – Kalkulator płytek | calc-hub.eu", "d": "Darmowy kalkulator płytek i podłogi: liczba płytek lub desek według wymiarów pomieszczenia i płytki, fugi, układu i zapasu, z liczbą opakowań."}, "fr": {"t": "Calcul de carrelage – Calculateur de carreaux | calc-hub.eu", "d": "Calculateur de carrelage et sol gratuit : nombre de carreaux ou lames selon la pièce, le format, le joint, le calepinage et les pertes, avec boîtes nécessaires."}, "es": {"t": "Cálculo de baldosas – Cuántas baldosas necesito | calc-hub.eu", "d": "Calculadora de baldosas y suelo gratis: número de baldosas o lamas según la habitación, el formato, la junta, el aparejo y el desperdicio, con cajas necesarias."}};

const FT={en:['Privacy & Cookies','Privacy and cookie settings','About & contact'],sk:['Ochrana údajov a cookies','Nastavenia súkromia a cookies','O nás a kontakt'],de:['Datenschutz & Cookies','Datenschutz- und Cookie-Einstellungen','Über uns & Kontakt'],cs:['Ochrana údajů a cookies','Nastavení soukromí a cookies','O nás a kontakt'],pl:['Prywatność i cookies','Ustawienia prywatności i plików cookies','O nas i kontakt'],fr:['Confidentialité et cookies','Paramètres de confidentialité et de cookies','À propos et contact'],es:['Privacidad y cookies','Configuración de privacidad y cookies','Acerca de y contacto']};

const LANGS=[['sk','Slovenčina'],['de','Deutsch'],['en','English'],['cs','Čeština'],['pl','Polski'],['fr','Français'],['es','Español']];

function initLang(cb){
  const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu');
  menu.innerHTML=LANGS.map(([c,n])=>`<li><button role="option" data-l="${c}"><span>${n}</span><b>${c.toUpperCase()}</b></button></li>`).join('');
  const close=()=>{menu.classList.add('hidden');btn.setAttribute('aria-expanded','false')};
  btn.addEventListener('click',e=>{e.stopPropagation();const hid=menu.classList.toggle('hidden');btn.setAttribute('aria-expanded',String(!hid))});

const $=id=>document.getElementById(id);
const IDX={en:0,sk:1,de:2,cs:3,pl:4,fr:5,es:6},LOC={sk:'sk-SK',de:'de-DE',en:'en-GB',cs:'cs-CZ',pl:'pl-PL',fr:'fr-FR',es:'es-ES'};
const L=k=>PIPE[k].split('|')[IDX[lang]];
const nf=(n,d=0)=>new Intl.NumberFormat(LOC[lang],{maximumFractionDigits:d}).format(n);
function baseText(){
  const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.tagName==='UL'?e.innerHTML=v:e.textContent=v});
  document.querySelectorAll('[data-p]').forEach(e=>e.textContent=L(e.dataset.p));
}
function showRes(o){$('res').classList.toggle('hidden',!o||!!o.err);$('hint').classList.toggle('hidden',!!o);$('hint').textContent=L('hint');$('err').classList.toggle('hidden',!(o&&o.err));if(o&&o.err)$('err').textContent=L(o.err);return !!o&&!o.err}
const rows=a=>a.map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');

const PW={s:10,d:15,h:20};let pat='s',wTouched=false;
function calcAll(){
  const r=+$('tr').value,q=+$('tq').value,tl=+$('tl_').value,tw=+$('tw_').value,gp=+$('tg').value,u=+$('tu').value,s=+$('ts').value||0,bx=+$('tb').value||0;
  if(['tr','tq','tl_','tw_','tg','tu'].some(id=>$(id).value===''||!isFinite(+$(id).value)))return null;
  if(!(r>0&&q>0&&tl>0&&tw>0&&gp>=0&&gp<=30&&u>=0&&u<=100&&s>=0&&r<=200&&q<=200))return null;
  const area=r*q-s;if(area<=0)return null;
  const one=(tl+gp/10)*(tw+gp/10)/10000,n=Math.ceil(area/one*(1+u/100)),boxes=bx>0?Math.ceil(n/bx):0;
  return {area,n,boxes,cov:(boxes?boxes*bx:n)*one};
}
function fig(){
  const r=+$('tr').value,q=+$('tq').value,tl=+$('tl_').value,tw=+$('tw_').value,n=v=>nf(v,2),f=v=>v.toFixed(1);
  const ST='stroke="rgba(255,255,255,.3)" stroke-width="1"',DM='fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"',TX='font-size="12" fill="#cbd2e0" font-family="inherit"';
  const MX=44,MY=14,MW=296,MH=140,s=Math.min(MW/r,MH/q),w=r*s,h=q*s,x0=MX+(MW-w)/2,y0=MY+(MH-h)/2;
  let a=tl*s/100,b=tw*s/100;const k=Math.max(1,9/Math.min(a,b));a*=k;b*=k;
  let g='';
  if(pat==='h'){
    const L=Math.max(a,b),W=Math.min(a,b),N1=Math.ceil((w+h)/L)+3,N2=Math.ceil((w+h)/W)+3;let t='';
    for(let m=-N1;m<=N1;m++)for(let j=-N2;j<=N2;j++){
      const X=m*L+j*W,Y=m*L-j*W,VX=X+L-W,VY=Y+W;
      if(X<w&&X+L>0&&Y<h&&Y+W>0)t+=`<rect x="${f(x0+X)}" y="${f(y0+Y)}" width="${f(L)}" height="${f(W)}" fill="rgba(255,255,255,.14)"/>`;
      if(VX<w&&VX+W>0&&VY<h&&VY+L>0)t+=`<rect x="${f(x0+VX)}" y="${f(y0+VY)}" width="${f(W)}" height="${f(L)}" fill="rgba(255,255,255,.06)"/>`;
    }
    g=`<g clip-path="url(#rc)" ${ST}>${t}</g>`;
  }else if(pat==='d'){
    const cx=x0+w/2,cy=y0+h/2,D=Math.hypot(w,h);let p='';
    for(let x=-D/2;x<=D/2;x+=a)p+=`M${f(cx+x)} ${f(cy-D/2)}V${f(cy+D/2)}`;
    for(let y=-D/2;y<=D/2;y+=b)p+=`M${f(cx-D/2)} ${f(cy+y)}H${f(cx+D/2)}`;
    g=`<g clip-path="url(#rc)"><g transform="rotate(45 ${f(cx)} ${f(cy)})"><path d="${p}" fill="none" ${ST}/></g></g>`;
  }else{
    let p='';
    for(let x=x0+a;x<x0+w-1;x+=a)p+=`M${f(x)} ${f(y0)}V${f(y0+h)}`;
    for(let y=y0+b;y<y0+h-1;y+=b)p+=`M${f(x0)} ${f(y)}H${f(x0+w)}`;
    g=`<path d="${p}" fill="none" ${ST}/>`;
  }
  const by=y0+h+16,lab=n(r)+' × '+n(q)+' m, '+nf(tl)+' × '+nf(tw)+' cm, '+L('p_'+pat);
  $('fig').innerHTML=`<svg viewBox="0 0 360 196" width="100%" style="max-height:230px" role="img" aria-label="${lab}"><defs><clipPath id="rc"><rect x="${f(x0)}" y="${f(y0)}" width="${f(w)}" height="${f(h)}"/></clipPath></defs><rect x="${f(x0)}" y="${f(y0)}" width="${f(w)}" height="${f(h)}" fill="rgba(255,255,255,.05)"/>${g}<rect x="${f(x0)}" y="${f(y0)}" width="${f(w)}" height="${f(h)}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/><path ${DM} d="M${f(x0)} ${f(by)}H${f(x0+w)}M${f(x0)} ${f(by-4)}V${f(by+4)}M${f(x0+w)} ${f(by-4)}V${f(by+4)}M${f(x0-14)} ${f(y0)}V${f(y0+h)}M${f(x0-18)} ${f(y0)}H${f(x0-10)}M${f(x0-18)} ${f(y0+h)}H${f(x0-10)}"/><text ${TX} x="${f(x0+w/2)}" y="${f(by+16)}" text-anchor="middle">${n(r)} m</text><text ${TX} x="${f(x0-22)}" y="${f(y0+h/2)}" text-anchor="middle" transform="rotate(-90 ${f(x0-22)} ${f(y0+h/2)})">${n(q)} m</text></svg><p class="mt-1 text-center text-xs" style="color:#8b94a7">${L('sch')}</p>`;
}
function calc(){const o=calcAll();if(!showRes(o))return;
  fig();
  $('big').textContent=nf(o.n);
  $('rows').innerHTML=rows([[L('area'),nf(o.area,2)+' m²']].concat(o.boxes?[[L('boxes'),nf(o.boxes)]]:[]).concat([[L('cover'),nf(o.cov,2)+' m²']]));}
function build(){$('tp').innerHTML=['s','d','h'].map(k=>`<option value="${k}" ${k===pat?'selected':''}>${L('p_'+k)}</option>`).join('')}
function text(){baseText();build();$('fbox').innerHTML=`<b style="color:var(--accent)">${L('need')} = ${L('area')} ÷ ((${L('tl').split(' (')[0]} + ${L('gap').split(' (')[0]}) × (${L('tw').split(' (')[0]} + ${L('gap').split(' (')[0]})) × (1 + ${L('waste').split(' (')[0]} ÷ 100)</b>`;syncLang();calc()}
$('tp').addEventListener('change',e=>{pat=e.target.value;if(!wTouched)$('tu').value=PW[pat];calc()});
$('tu').addEventListener('input',()=>{wTouched=true});
['tr','tq','tl_','tw_','tg','tu','ts','tb'].forEach(id=>$(id).addEventListener('input',calc));
initLang(text);text();
</script>
