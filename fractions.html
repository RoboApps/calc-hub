const IDX={en:0,sk:1,de:2,cs:3,pl:4,fr:5,es:6};

const loc=()=>lang==='en'?'en-US':lang;
const OPS=['add','sub','mul','div','simp','dec'];
const gcd=(a,b)=>{a=a<0n?-a:a;b=b<0n?-b:b;while(b){[a,b]=[b,a%b]}return a};
const ft=(n,d)=>d===1n?String(n):n+'/'+d;
const isI=s=>/^-?\d{1,10}$/.test(s)&&Math.abs(+s)<=1e9;
function readF(get,g){const w=get('w'+g),n=get('n'+g),d=get('d'+g);
  if(w===''&&n===''&&d==='')return{h:1};
  if(n===''&&d===''){if(!isI(w))return{e:'erri'};return{n:BigInt(w),d:1n}}
  if(n===''||d==='')return{h:1};
  if(![w,n,d].every(x=>x===''||isI(x)))return{e:'erri'};
  let N=BigInt(n),D=BigInt(d);if(D===0n)return{e:'errd'};if(D<0n){N=-N;D=-D}
  if(w!==''&&+w!==0){const W=BigInt(w),s=W<0n?-1n:1n,aw=W<0n?-W:W,an=N<0n?-N:N,I=s*(aw*D+an);return{n:I,d:D,st:[['s_whole',`${w} ${an}/${D} = ${I}/${D}`]]}}
  return{n:N,d:D}}
function solveF(op,get){let A,B,steps=[],r;
  if(op==='dec'){const t=get('x').replace(',','.');if(t==='')return{h:1};
    if(!/^-?(\d+(\.\d{0,9})?|\.\d{1,9})$/.test(t))return{e:'errx'};
    const neg=t[0]==='-',s=t.replace('-',''),[ip,fp='']=s.split('.'),k=fp.length,N=BigInt((ip+fp)||'0')*(neg?-1n:1n),D=10n**BigInt(k);
    steps.push(['s_dec',`${t} = ${N}/${D}`]);r={n:N,d:D}}
  else{A=readF(get,1);if(A.h||A.e)return A;steps=steps.concat(A.st||[]);
    if(op==='simp')r={n:A.n,d:A.d};
    else{B=readF(get,2);if(B.h||B.e)return B;steps=steps.concat(B.st||[]);const T=(f)=>ft(f.n,f.d);
      if(op==='add'||op==='sub'){const q=op==='add'?'+':'−',l=A.d*B.d/gcd(A.d,B.d),a=A.n*(l/A.d),b=B.n*(l/B.d),n=op==='add'?a+b:a-b;
        steps.push(['s_lcd',`${A.d}, ${B.d} → ${l}`],['s_conv',`${T(A)} = ${a}/${l};  ${T(B)} = ${b}/${l}`],['s_calc',`${a}/${l} ${q} ${b}/${l} = ${n}/${l}`]);r={n,d:l}}
      else if(op==='mul'){r={n:A.n*B.n,d:A.d*B.d};steps.push(['s_mul',`(${A.n}·${B.n}) / (${A.d}·${B.d}) = ${r.n}/${r.d}`])}
      else{if(B.n===0n)return{e:'errz'};let n=A.n*B.d,d=A.d*B.n;if(d<0n){n=-n;d=-d}r={n,d};steps.push(['s_flip',`${T(A)} × ${B.d}/${B.n} = ${n}/${d}`])}}}
  const k=gcd(r.n,r.d)||1n,n=r.n/k,d=r.d/k;if(k>1n)steps.push(['s_simp',`${r.n}/${r.d} ÷ ${k} = ${ft(n,d)}`]);
  const an=n<0n?-n:n,rows=[['r_frac',ft(n,d)]];

  rows.push(['r_dec',ap+val.toLocaleString(loc(),{maximumFractionDigits:10})],['r_pct',ap+(val*100).toLocaleString(loc(),{maximumFractionDigits:6})+' %']);
  return{rows,steps}}
