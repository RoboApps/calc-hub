const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "Compound Interest / Investing", "sub": "See how a deposit and regular contributions grow over time with compound interest, and what they are worth after inflation.", "h1": "What is compound interest?", "p1": "Compound interest means you earn interest on your interest. Each period the earned interest is added to the balance, so the next period’s interest is calculated on a larger amount. Over long periods this snowball effect becomes far stronger than simple interest.", "h2": "How it is calculated", "p2": "The calculator simulates month by month: the balance grows by the monthly equivalent of your annual return (based on the compounding you choose), and your contribution is added at the start or end of each month and can rise every year. The value after inflation divides the result by (1 + inflation) for each year.", "h4": "Good to know", "lim": "<li>Returns are not guaranteed. Investments can lose value and past performance does not predict the future.</li><li>Fees and taxes reduce real returns and are not included; even a 1% yearly fee changes the result noticeably over decades.</li><li>Starting early matters more than the amount: time is the strongest driver of compound growth.</li><li>Inflation reduces purchasing power, so compare the value after inflation, not only the nominal number.</li><li>A fixed return is a simplification: real investments fluctuate from year to year.</li>", "note": "For illustration only; not investment advice. Past performance is not a guarantee of future results."}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Zložené úročenie / investovanie", "sub": "Pozri, ako rastie vklad a pravidelné príspevky vďaka zloženému úročeniu a koľko budú stáť po inflácii.", "h1": "Čo je zložené úročenie?", "p1": "Zložené úročenie znamená, že úročíš aj svoje úroky. V každom období sa zarobený úrok pripočíta k zostatku, takže úrok v ďalšom období sa počíta z väčšej sumy. Pri dlhých obdobiach je tento efekt snehovej gule oveľa silnejší než jednoduché úročenie.", "h2": "Ako sa počíta", "p2": "Kalkulačka simuluje mesiac po mesiaci: zostatok rastie o mesačný ekvivalent ročného výnosu (podľa zvoleného úročenia) a vklad sa pripisuje na začiatku alebo na konci mesiaca a môže sa každý rok zvyšovať. Hodnota po inflácii vznikne vydelením výsledku číslom (1 + inflácia) za každý rok.", "h4": "Dobré vedieť", "lim": "<li>Výnosy nie sú garantované. Investície môžu stratiť hodnotu a minulá výkonnosť nezaručuje budúcu.</li><li>Poplatky a dane znižujú reálny výnos a nie sú zahrnuté; aj ročný poplatok 1 % výrazne mení výsledok za desaťročia.</li><li>Skorý začiatok je dôležitejší než výška sumy: čas je najsilnejším motorom zloženého rastu.</li><li>Inflácia znižuje kúpnu silu, preto porovnávaj hodnotu po inflácii, nielen nominálne číslo.</li><li>Pevný výnos je zjednodušenie: skutočné investície z roka na rok kolíšu.</li>", "note": "Len na ilustráciu, nie je to investičné poradenstvo. Minulá výkonnosť nie je zárukou budúcich výsledkov."}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Zinseszins / Investieren", "sub": "Sieh, wie Anfangsbetrag und regelmäßige Einzahlungen durch Zinseszins wachsen und was sie nach Inflation wert sind.", "h1": "Was ist Zinseszins?", "p1": "Zinseszins bedeutet, dass du auch auf deine Zinsen Zinsen erhältst. In jeder Periode werden die Zinsen dem Guthaben zugeschlagen, sodass die Zinsen der nächsten Periode auf einen größeren Betrag berechnet werden. Über lange Zeiträume wird dieser Schneeballeffekt deutlich stärker als einfache Verzinsung.", "h2": "So wird es berechnet", "p2": "Der Rechner simuliert Monat für Monat: Das Guthaben wächst um das Monatsäquivalent deiner jährlichen Rendite (gemäß gewählter Zinsperiode), und deine Einzahlung wird am Monatsanfang oder -ende gutgeschrieben und kann jährlich steigen. Der Wert nach Inflation entsteht, indem das Ergebnis pro Jahr durch (1 + Inflation) geteilt wird.", "h4": "Gut zu wissen", "lim": "<li>Renditen sind nicht garantiert. Anlagen können an Wert verlieren, und vergangene Wertentwicklung sagt die Zukunft nicht voraus.</li><li>Gebühren und Steuern mindern die reale Rendite und sind nicht enthalten; schon eine jährliche Gebühr von 1 % verändert das Ergebnis über Jahrzehnte deutlich.</li><li>Früh anfangen zählt mehr als die Höhe: Zeit ist der stärkste Treiber des Zinseszinseffekts.</li><li>Inflation mindert die Kaufkraft, vergleiche daher den Wert nach Inflation, nicht nur die Nominalzahl.</li><li>Eine feste Rendite ist eine Vereinfachung: Reale Anlagen schwanken von Jahr zu Jahr.</li>", "note": "Nur zur Veranschaulichung, keine Anlageberatung. Vergangene Wertentwicklung ist kein Garant für zukünftige Ergebnisse."}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Složené úročení / investování", "sub": "Podívej se, jak roste vklad a pravidelné příspěvky díky složenému úročení a kolik budou stát po inflaci.", "h1": "Co je složené úročení?", "p1": "Složené úročení znamená, že úročíš i své úroky. V každém období se vydělaný úrok přičte k zůstatku, takže úrok v dalším období se počítá z větší částky. U dlouhých období je tento efekt sněhové koule mnohem silnější než jednoduché úročení.", "h2": "Jak se počítá", "p2": "Kalkulačka simuluje měsíc po měsíci: zůstatek roste o měsíční ekvivalent ročního výnosu (podle zvoleného úročení) a vklad se připisuje na začátku nebo na konci měsíce a může se každý rok zvyšovat. Hodnota po inflaci vznikne vydělením výsledku číslem (1 + inflace) za každý rok.", "h4": "Dobré vědět", "lim": "<li>Výnosy nejsou zaručeny. Investice mohou ztratit hodnotu a minulá výkonnost nezaručuje budoucí.</li><li>Poplatky a daně snižují reálný výnos a nejsou zahrnuty; i roční poplatek 1 % výrazně mění výsledek za desetiletí.</li><li>Brzký začátek je důležitější než výše částky: čas je nejsilnějším motorem složeného růstu.</li><li>Inflace snižuje kupní sílu, proto porovnávej hodnotu po inflaci, nejen nominální číslo.</li><li>Pevný výnos je zjednodušení: skutečné investice z roku na rok kolísají.</li>", "note": "Pouze pro ilustraci, nejde o investiční poradenství. Minulá výkonnost není zárukou budoucích výsledků."}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Procent składany / inwestowanie", "sub": "Zobacz, jak wpłata początkowa i regularne wpłaty rosną dzięki procentowi składanemu i ile będą warte po inflacji.", "h1": "Czym jest procent składany?", "p1": "Procent składany oznacza, że odsetki są naliczane także od odsetek. W każdym okresie zarobione odsetki dodawane są do salda, więc odsetki w kolejnym okresie liczone są od większej kwoty. W długim okresie efekt kuli śnieżnej jest znacznie silniejszy niż przy odsetkach prostych.", "h2": "Jak się to oblicza", "p2": "Kalkulator symuluje miesiąc po miesiącu: saldo rośnie o miesięczny odpowiednik rocznej stopy zwrotu (zgodnie z wybraną kapitalizacją), a wpłata dodawana jest na początku lub końcu miesiąca i może rosnąć co roku. Wartość po inflacji powstaje przez podzielenie wyniku przez (1 + inflacja) za każdy rok.", "h4": "Warto wiedzieć", "lim": "<li>Zyski nie są gwarantowane. Inwestycje mogą tracić na wartości, a przeszłe wyniki nie przesądzają o przyszłych.</li><li>Opłaty i podatki obniżają realny zwrot i nie są uwzględnione; nawet roczna opłata 1 % wyraźnie zmienia wynik w ciągu dekad.</li><li>Wczesny start liczy się bardziej niż kwota: czas jest najsilniejszym motorem wzrostu składanego.</li><li>Inflacja obniża siłę nabywczą, więc porównuj wartość po inflacji, a nie tylko liczbę nominalną.</li><li>Stały zwrot to uproszczenie: rzeczywiste inwestycje wahają się z roku na rok.</li>", "note": "Wyłącznie w celach ilustracyjnych, to nie jest porada inwestycyjna. Przeszłe wyniki nie gwarantują przyszłych."}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Intérêts composés / investissement", "sub": "Voyez comment un dépôt et des versements réguliers croissent grâce aux intérêts composés, et ce qu’ils valent après inflation.", "h1": "Que sont les intérêts composés ?", "p1": "Les intérêts composés signifient que vous gagnez des intérêts sur vos intérêts. À chaque période, les intérêts gagnés sont ajoutés au solde, si bien que ceux de la période suivante sont calculés sur un montant plus élevé. Sur de longues périodes, cet effet boule de neige devient bien plus puissant que les intérêts simples.", "h2": "Comment c’est calculé", "p2": "Le calculateur simule mois après mois : le solde croît de l’équivalent mensuel de votre rendement annuel (selon la capitalisation choisie), et votre versement est ajouté en début ou en fin de mois et peut augmenter chaque année. La valeur après inflation s’obtient en divisant le résultat par (1 + inflation) pour chaque année.", "h4": "Bon à savoir", "lim": "<li>Les rendements ne sont pas garantis. Les placements peuvent perdre de la valeur et les performances passées ne préjugent pas des performances futures.</li><li>Les frais et les impôts réduisent le rendement réel et ne sont pas inclus ; même des frais annuels de 1 % modifient nettement le résultat sur des décennies.</li><li>Commencer tôt compte plus que le montant : le temps est le principal moteur de la croissance composée.</li><li>L’inflation réduit le pouvoir d’achat ; comparez donc la valeur après inflation, pas seulement le chiffre nominal.</li><li>Un rendement fixe est une simplification : les placements réels fluctuent d’une année à l’autre.</li>", "note": "À titre d’illustration uniquement, pas un conseil en investissement. Les performances passées ne garantissent pas les résultats futurs."}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Interés compuesto / inversión", "sub": "Mira cómo crecen un depósito y las aportaciones regulares con el interés compuesto y cuánto valdrán tras la inflación.", "h1": "¿Qué es el interés compuesto?", "p1": "El interés compuesto significa que ganas intereses sobre tus intereses. En cada periodo los intereses ganados se suman al saldo, por lo que los del siguiente periodo se calculan sobre una cantidad mayor. A largo plazo, este efecto bola de nieve es mucho más potente que el interés simple.", "h2": "Cómo se calcula", "p2": "La calculadora simula mes a mes: el saldo crece según el equivalente mensual de tu rentabilidad anual (según la capitalización elegida) y tu aportación se suma al inicio o al final de cada mes y puede aumentar cada año. El valor tras la inflación se obtiene dividiendo el resultado entre (1 + inflación) por cada año.", "h4": "Conviene saber", "lim": "<li>Las rentabilidades no están garantizadas. Las inversiones pueden perder valor y la rentabilidad pasada no predice la futura.</li><li>Las comisiones y los impuestos reducen la rentabilidad real y no se incluyen; incluso una comisión anual del 1 % cambia notablemente el resultado a lo largo de décadas.</li><li>Empezar pronto importa más que la cantidad: el tiempo es el mayor motor del crecimiento compuesto.</li><li>La inflación reduce el poder adquisitivo, así que compara el valor tras la inflación, no solo la cifra nominal.</li><li>Una rentabilidad fija es una simplificación: las inversiones reales fluctúan de un año a otro.</li>", "note": "Solo con fines ilustrativos, no es asesoramiento de inversión. La rentabilidad pasada no garantiza resultados futuros."}};

const touched={};
function setDefaults(defs){Object.keys(defs).forEach(id=>{if(!touched[id])$(id).value=Math.round(defs[id]*SCALE[cur]/10)*10})}
function curInit(defs,onChange){
  $('lc').innerHTML=CURS.map(c=>`<option value="${c}">${c}</option>`).join('');$('lc').value=cur;
  $('lc').addEventListener('change',e=>{cur=e.target.value;curT=true;try{const u=new URL(location.href);u.searchParams.set('cur',cur);history.replaceState(null,'',u)}catch(x){}setDefaults(defs);onChange()});
  Object.keys(defs).forEach(id=>$(id).addEventListener('input',()=>{touched[id]=true}));
  setDefaults(defs);
}
function curLang(defs){if(!curT){cur=DEFC[lang]||'EUR';$('lc').value=cur;setDefaults(defs)}document.querySelectorAll('.cs').forEach(e=>e.textContent=sym())}
function baseText(){
  const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.tagName==='UL'?e.innerHTML=v:e.textContent=v});
  document.querySelectorAll('[data-p]').forEach(e=>e.textContent=L(e.dataset.p));
}
function showRes(ok){$('res').classList.toggle('hidden',!ok);$('hint').classList.toggle('hidden',ok);$('hint').textContent=L('hint')}

const DEFS={ci0:5000,cm0:200};
let fq=12,tm='e';
const FQ={y:1,s:2,q:4,m:12,d:365};
function sim(){
  const P=+$('ci0').value||0,m=+$('cm0').value||0,a=+$('cr').value,Y=+$('cy0').value,g=+$('cg').value||0,inf=+$('cn').value||0;
  if($('cr').value===''||$('cy0').value===''||!(P>=0&&m>=0&&(P>0||m>0)&&a>=0&&a<=100&&Y>=1&&Y<=60&&g>=0&&g<=50&&inf>=0&&inf<=50))return null;
  const im=Math.pow(1+a/100/fq,fq/12)-1;let bal=P,tc=P,c=m;const rows=[[0,P,0,P]];
  for(let k=1;k<=Math.round(Y*12);k++){if(tm==='s'){bal+=c;tc+=c}bal*=1+im;if(tm==='e'){bal+=c;tc+=c}
    if(k%12===0){rows.push([k/12,tc,bal-tc,bal]);c*=1+g/100}}
  const fin=bal,real=fin/Math.pow(1+inf/100,Y);
  return {fin,tc,earned:fin-tc,real,rows,Y,dbl:a>0?Math.log(2)/Math.log(1+a/100):null,a};
}
function chart(rows){
  const W=300,H=110,p=4,mx=Math.max(...rows.map(r=>r[3])),x=i=>p+i*(W-2*p)/(rows.length-1),y=v=>H-p-v/mx*(H-2*p);
  const top=rows.map((r,i)=>x(i).toFixed(1)+','+y(r[3]).toFixed(1)).join(' '),bot=rows.map((r,i)=>x(i).toFixed(1)+','+y(r[1]).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full" preserveAspectRatio="none" style="height:180px"><polygon points="${p},${H-p} ${top} ${W-p},${H-p}" style="fill:rgba(124,156,255,.35)"/><polygon points="${p},${H-p} ${bot} ${W-p},${H-p}" style="fill:rgba(var(--accent-rgb),.55)"/><polyline points="${top}" fill="none" stroke="#7c9cff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function calc(){
  const o=sim();showRes(!!o);$('csec').classList.toggle('hidden',!o);$('ssec').classList.toggle('hidden',!o);if(!o)return;
  $('big').textContent=money(o.fin);
  const u=lang==='en'?'%':' %';
  $('rows').innerHTML=[[L('contrib'),money(o.tc)],[L('earned'),money(o.earned)],[L('real'),money(o.real)]].concat(o.dbl?[[L('dbl'),nf(o.dbl,1)+' · 72 ÷ '+nf(o.a,2)+u+' = '+nf(72/o.a,1)]]:[]).map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');
  $('chart').innerHTML=chart(o.rows);
  $('shead').innerHTML=`<tr><th>${L('cy')}</th><th>${L('ccn')}</th><th>${L('cin')}</th><th>${L('cb')}</th></tr>`;
  $('sch').innerHTML=o.rows.slice(1).map(r=>`<tr><td>${r[0]}</td><td>${money(r[1])}</td><td>${money(r[2])}</td><td>${money(r[3])}</td></tr>`).join('');
}
function buildSel(){
  $('cf').innerHTML=Object.keys(FQ).map(k=>`<option value="${k}" ${FQ[k]===fq?'selected':''}>${L('f_'+k)}</option>`).join('');
  $('ct').innerHTML=['e','s'].map(k=>`<option value="${k}" ${k===tm?'selected':''}>${L('t_'+k)}</option>`).join('');
}
function text(){baseText();buildSel();curLang(DEFS);$('slbl').textContent=L(schOpen?'schH':'sch');
  $('fbox').innerHTML=`<div><b style="color:var(--accent)">FV = P × (1 + r ÷ n)<sup>n·t</sup></b></div><div><b style="color:var(--accent)">${L('dbl')} ≈ 72 ÷ r (%)</b></div>`;syncLang();calc()}
$('cf').addEventListener('change',e=>{fq=FQ[e.target.value];calc()});$('ct').addEventListener('change',e=>{tm=e.target.value;calc()});
['ci0','cm0','cr','cy0','cg','cn'].forEach(id=>$(id).addEventListener('input',calc));
curInit(DEFS,calc);

function schToggle(){schOpen=!schOpen;$('sbox').classList.toggle('hidden',!schOpen);$('sbtn').setAttribute('aria-expanded',String(schOpen));$('slbl').textContent=L(schOpen?'schH':'sch')}
$('sbtn').addEventListener('click',schToggle);
initLang(text);text();
</script>
</body>
</html>
