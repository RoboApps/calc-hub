const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "Body Fat Calculator", "sub": "Estimate your body fat percentage with the US Navy method or from your BMI.", "h1": "What is body fat percentage?", "p1": "Body fat percentage is the share of your body weight that is fat. Some fat is essential for hormones, organs and energy storage, so zero is neither possible nor healthy. Unlike BMI, it separates fat from lean tissue such as muscle, bone and water.", "h2": "How it is estimated", "p2": "The US Navy method estimates body fat from height and circumferences: neck and waist for men, neck, waist and hips for women. The BMI-based method (Deurenberg) uses BMI, age and sex. Both are rough estimates; DEXA scans or hydrostatic weighing are more accurate.", "h4": "Good to know", "lim": "<li>The typical error of these methods is around 3–4 percentage points, so use the result as a rough guide and track changes over time with the same method.</li><li>Measure on bare skin, relaxed, in the morning: neck just below the larynx, waist at the navel (men) or the narrowest point (women), hips at the widest point.</li><li>The category ranges are commonly used general ranges (for example those published by the American Council on Exercise); healthy values also vary with age.</li><li>Muscular people and older adults may be misjudged by the BMI-based method; the circumference method usually works better.</li><li>The calculator is not suitable for children, teenagers or pregnancy.</li>", "note": "For general information only; not a medical diagnosis. If worries about your body or weight affect your wellbeing, please talk to a doctor or a mental health professional."}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Kalkulačka telesného tuku", "sub": "Odhadni percento telesného tuku metódou US Navy alebo podľa BMI.", "h1": "Čo je percento telesného tuku?", "p1": "Percento telesného tuku je podiel tuku na tvojej hmotnosti. Trochu tuku je nevyhnutné pre hormóny, orgány a zásobu energie, takže nulový podiel nie je ani možný, ani zdravý. Na rozdiel od BMI oddeľuje tuk od beztukových tkanív, ako sú svaly, kosti a voda.", "h2": "Ako sa odhaduje", "p2": "Metóda US Navy odhaduje tuk z výšky a obvodov: u mužov krk a pás, u žien krk, pás a boky. Metóda podľa BMI (Deurenberg) používa BMI, vek a pohlavie. Obe sú hrubé odhady; presnejšie sú vyšetrenie DEXA alebo hydrostatické váženie.", "h4": "Dobré vedieť", "lim": "<li>Typická chyba týchto metód je okolo 3 – 4 percentuálnych bodov, preto výsledok ber ako hrubé vodidlo a zmeny sleduj v čase tou istou metódou.</li><li>Meraj na holej koži, uvoľnene, ráno: krk tesne pod hrtanom, pás v úrovni pupka (muži) alebo na najužšom mieste (ženy), boky na najširšom mieste.</li><li>Hranice kategórií sú bežne používané všeobecné rozpätia (napríklad od American Council on Exercise); zdravé hodnoty sa menia aj s vekom.</li><li>Svalnatých ľudí a starších dospelých môže metóda podľa BMI zle posúdiť; metóda s obvodmi zvyčajne funguje lepšie.</li><li>Kalkulačka nie je vhodná pre deti, dospievajúcich ani tehotenstvo.</li>", "note": "Len na všeobecné informovanie, nie je to zdravotná diagnóza. Ak starosti o telo alebo váhu ovplyvňujú tvoju pohodu, porozprávaj sa s lekárom alebo odborníkom na duševné zdravie."}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Körperfett-Rechner", "sub": "Schätze deinen Körperfettanteil mit der US-Navy-Methode oder anhand deines BMI.", "h1": "Was ist der Körperfettanteil?", "p1": "Der Körperfettanteil ist der Anteil von Fett an deinem Körpergewicht. Etwas Fett ist für Hormone, Organe und Energiespeicher lebenswichtig, daher ist null weder möglich noch gesund. Anders als der BMI trennt er Fett von magerem Gewebe wie Muskeln, Knochen und Wasser.", "h2": "So wird er geschätzt", "p2": "Die US-Navy-Methode schätzt das Körperfett aus Größe und Umfängen: bei Männern Hals und Taille, bei Frauen Hals, Taille und Hüfte. Die BMI-basierte Methode (Deurenberg) nutzt BMI, Alter und Geschlecht. Beide sind grobe Schätzungen; DEXA-Scans oder hydrostatisches Wiegen sind genauer.", "h4": "Gut zu wissen", "lim": "<li>Der typische Fehler dieser Methoden liegt bei etwa 3–4 Prozentpunkten, nutze das Ergebnis daher als grobe Orientierung und verfolge Veränderungen mit derselben Methode.</li><li>Miss auf bloßer Haut, entspannt, morgens: Hals direkt unterhalb des Kehlkopfs, Taille auf Nabelhöhe (Männer) oder an der schmalsten Stelle (Frauen), Hüfte an der breitesten Stelle.</li><li>Die Kategoriegrenzen sind gebräuchliche allgemeine Bereiche (etwa vom American Council on Exercise); gesunde Werte hängen auch vom Alter ab.</li><li>Muskulöse Menschen und ältere Erwachsene werden von der BMI-Methode evtl. falsch eingeschätzt; die Umfangsmethode funktioniert meist besser.</li><li>Der Rechner ist nicht für Kinder, Jugendliche oder Schwangerschaft geeignet.</li>", "note": "Nur zur allgemeinen Information, keine medizinische Diagnose. Wenn Sorgen um Körper oder Gewicht dein Wohlbefinden beeinträchtigen, sprich bitte mit einer Ärztin, einem Arzt oder einer psychologischen Fachperson."}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Kalkulačka tělesného tuku", "sub": "Odhadni procento tělesného tuku metodou US Navy nebo podle BMI.", "h1": "Co je procento tělesného tuku?", "p1": "Procento tělesného tuku je podíl tuku na tvé hmotnosti. Trochu tuku je nezbytné pro hormony, orgány a zásobu energie, takže nulový podíl není ani možný, ani zdravý. Na rozdíl od BMI odděluje tuk od beztukových tkání, jako jsou svaly, kosti a voda.", "h2": "Jak se odhaduje", "p2": "Metoda US Navy odhaduje tuk z výšky a obvodů: u mužů krk a pas, u žen krk, pas a boky. Metoda podle BMI (Deurenberg) používá BMI, věk a pohlaví. Obě jsou hrubé odhady; přesnější jsou vyšetření DEXA nebo hydrostatické vážení.", "h4": "Dobré vědět", "lim": "<li>Typická chyba těchto metod je kolem 3–4 procentních bodů, proto výsledek ber jako hrubé vodítko a změny sleduj v čase toutéž metodou.</li><li>Měř na holé kůži, uvolněně, ráno: krk těsně pod hrtanem, pas v úrovni pupku (muži) nebo na nejužším místě (ženy), boky na nejširším místě.</li><li>Hranice kategorií jsou běžně používaná obecná rozmezí (například od American Council on Exercise); zdravé hodnoty se mění i s věkem.</li><li>Svalnaté lidi a starší dospělé může metoda podle BMI špatně posoudit; metoda s obvody obvykle funguje lépe.</li><li>Kalkulačka není vhodná pro děti, dospívající ani těhotenství.</li>", "note": "Pouze k obecné informaci, nejde o zdravotní diagnózu. Pokud starosti o tělo nebo váhu ovlivňují tvou pohodu, promluv si s lékařem nebo odborníkem na duševní zdraví."}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Kalkulator tkanki tłuszczowej", "sub": "Oszacuj procent tkanki tłuszczowej metodą US Navy lub na podstawie BMI.", "h1": "Czym jest procent tkanki tłuszczowej?", "p1": "Procent tkanki tłuszczowej to udział tłuszczu w masie ciała. Trochę tłuszczu jest niezbędne dla hormonów, narządów i magazynowania energii, więc zero nie jest ani możliwe, ani zdrowe. W odróżnieniu od BMI oddziela tłuszcz od tkanek beztłuszczowych, takich jak mięśnie, kości i woda.", "h2": "Jak się go szacuje", "p2": "Metoda US Navy szacuje tłuszcz na podstawie wzrostu i obwodów: u mężczyzn szyi i talii, u kobiet szyi, talii i bioder. Metoda oparta na BMI (Deurenberg) wykorzystuje BMI, wiek i płeć. Obie dają przybliżone wyniki; dokładniejsze są badanie DEXA lub ważenie hydrostatyczne.", "h4": "Warto wiedzieć", "lim": "<li>Typowy błąd tych metod to około 3–4 punkty procentowe, więc traktuj wynik jako przybliżoną wskazówkę, a zmiany śledź w czasie tą samą metodą.</li><li>Mierz na gołej skórze, w rozluźnieniu, rano: szyja tuż pod krtanią, talia na wysokości pępka (mężczyźni) lub w najwęższym miejscu (kobiety), biodra w najszerszym miejscu.</li><li>Granice kategorii to powszechnie stosowane ogólne zakresy (na przykład z American Council on Exercise); zdrowe wartości zmieniają się też z wiekiem.</li><li>Osoby umięśnione i starsze dorosłe metoda oparta na BMI może źle ocenić; metoda obwodów zwykle sprawdza się lepiej.</li><li>Kalkulator nie jest przeznaczony dla dzieci, młodzieży ani kobiet w ciąży.</li>", "note": "Tylko informacyjnie, to nie jest diagnoza medyczna. Jeśli troski o ciało lub wagę wpływają na Twoje samopoczucie, porozmawiaj z lekarzem lub specjalistą zdrowia psychicznego."}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calculateur de masse grasse", "sub": "Estimez votre taux de masse grasse avec la méthode US Navy ou à partir de votre IMC.", "h1": "Qu’est-ce que le taux de masse grasse ?", "p1": "Le taux de masse grasse est la part de graisse dans votre poids. Un peu de graisse est indispensable pour les hormones, les organes et le stockage d’énergie ; zéro n’est donc ni possible ni sain. Contrairement à l’IMC, il distingue la graisse des tissus maigres comme les muscles, les os et l’eau.", "h2": "Comment il est estimé", "p2": "La méthode US Navy estime la graisse à partir de la taille et des circonférences : cou et taille pour les hommes, cou, taille et hanches pour les femmes. La méthode fondée sur l’IMC (Deurenberg) utilise l’IMC, l’âge et le sexe. Ce sont deux estimations approximatives ; la DEXA ou la pesée hydrostatique sont plus précises.", "h4": "Bon à savoir", "lim": "<li>L’erreur typique de ces méthodes est d’environ 3 à 4 points de pourcentage ; utilisez le résultat comme repère approximatif et suivez l’évolution avec la même méthode.</li><li>Mesurez sur peau nue, détendu, le matin : cou juste sous le larynx, taille au niveau du nombril (hommes) ou à l’endroit le plus étroit (femmes), hanches à l’endroit le plus large.</li><li>Les limites des catégories sont des fourchettes générales couramment utilisées (par exemple celles de l’American Council on Exercise) ; les valeurs saines varient aussi avec l’âge.</li><li>Les personnes musclées et les adultes plus âgés peuvent être mal évalués par la méthode fondée sur l’IMC ; la méthode des circonférences fonctionne généralement mieux.</li><li>Ce calculateur ne convient pas aux enfants, aux adolescents ni à la grossesse.</li>", "note": "À titre d’information générale uniquement, pas un diagnostic médical. Si des inquiétudes concernant votre corps ou votre poids affectent votre bien-être, parlez-en à un médecin ou à un professionnel de la santé mentale."}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Calculadora de grasa corporal", "sub": "Estima tu porcentaje de grasa corporal con el método US Navy o a partir de tu IMC.", "h1": "¿Qué es el porcentaje de grasa corporal?", "p1": "El porcentaje de grasa corporal es la parte de tu peso que es grasa. Algo de grasa es esencial para las hormonas, los órganos y el almacenamiento de energía, así que cero no es posible ni saludable. A diferencia del IMC, separa la grasa de los tejidos magros, como músculo, hueso y agua.", "h2": "Cómo se estima", "p2": "El método US Navy estima la grasa a partir de la altura y los perímetros: cuello y cintura en hombres; cuello, cintura y caderas en mujeres. El método basado en el IMC (Deurenberg) usa el IMC, la edad y el sexo. Ambos son estimaciones aproximadas; la densitometría DEXA o el pesaje hidrostático son más precisos.", "h4": "Conviene saber", "lim": "<li>El error típico de estos métodos ronda los 3–4 puntos porcentuales, así que usa el resultado como guía aproximada y sigue los cambios con el mismo método.</li><li>Mide sobre la piel desnuda, relajado, por la mañana: cuello justo debajo de la laringe, cintura a la altura del ombligo (hombres) o en el punto más estrecho (mujeres), caderas en el punto más ancho.</li><li>Los límites de las categorías son rangos generales de uso común (por ejemplo, los del American Council on Exercise); los valores saludables también varían con la edad.</li><li>Las personas musculosas y los adultos mayores pueden ser mal valorados por el método basado en el IMC; el de perímetros suele funcionar mejor.</li><li>La calculadora no es adecuada para niños, adolescentes ni embarazo.</li>", "note": "Solo con fines informativos, no es un diagnóstico médico. Si las preocupaciones por tu cuerpo o tu peso afectan a tu bienestar, habla con un médico o un profesional de salud mental."}};

  document.querySelectorAll('[data-p]').forEach(e=>e.textContent=L(e.dataset.p));
  document.querySelectorAll('[data-sx]').forEach(e=>{e.textContent=L(e.dataset.sx==='m'?'male':'female');e.setAttribute('aria-pressed',e.dataset.sx===sex)});
  document.querySelectorAll('[data-un]').forEach(e=>{e.textContent=L(e.dataset.un==='m'?'metric':'imperial');e.setAttribute('aria-pressed',e.dataset.un===unit)});
}
function showRes(o){
  $('res').classList.toggle('hidden',!o||!!o.err);$('hint').classList.toggle('hidden',!!o);$('hint').textContent=L('hint');
  $('err').classList.toggle('hidden',!(o&&o.err));if(o&&o.err)$('err').textContent=L(o.err);
  return !!o&&!o.err;
}
const getH=()=>unit==='m'?+$('h1').value:(+$('h1').value*12+(+$('h2').value||0))*2.54;
const getW=()=>unit==='m'?+$('w1').value:+$('w1').value*0.45359237;
let meth='navy';
const CATS={m:[6,14,18,25],f:[14,21,25,32]},RNG={m:['2–5','6–13','14–17','18–24','25+'],f:['10–13','14–20','21–24','25–31','32+']};
function catOf(bf){const t=CATS[sex];return t.findIndex(x=>bf<x)<0?4:t.findIndex(x=>bf<x)}
function calcAll(){
  const A=+$('ag').value,H=getH(),W=getW(),k=unit==='m'?1:2.54;
  const N=+$('nk').value*k,Wa=+$('ws').value*k,Hi=+$('hp').value*k;
  if($('ag').value===''||$('h1').value===''||$('w1').value===''||!isFinite(A+H+W))return null;
  if(A<18)return {err:'adult'};
  if(A>100||H<100||H>250||W<30||W>300)return null;
  let bf;
  if(meth==='navy'){
    if(!isFinite(N+Wa)||$('nk').value===''||$('ws').value===''||(sex==='f'&&($('hp').value===''||!isFinite(Hi))))return null;
    if(sex==='m'){if(Wa<=N)return {err:'err_navy'};bf=495/(1.0324-0.19077*Math.log10(Wa-N)+0.15456*Math.log10(H))-450}
    else{if(Wa+Hi<=N)return {err:'err_navy'};bf=495/(1.29579-0.35004*Math.log10(Wa+Hi-N)+0.22100*Math.log10(H))-450}
  }else{const bmi=W/Math.pow(H/100,2);bf=1.2*bmi+0.23*A-10.8*(sex==='m'?1:0)-5.4}
  if(!(bf>=2&&bf<=60))return {err:'rng'};
  return {bf,fat:W*bf/100,lean:W*(1-bf/100),c:catOf(bf),low:bf<(sex==='m'?3:10)};
}
function calc(){
  const o=calcAll();if(!showRes(o)){$('ctab').querySelectorAll?0:0;return}
  const f=unit==='m'?1:2.20462,u=unit==='m'?'kg':'lb';
  $('big').textContent=nf(o.bf,1)+(lang==='en'?'%':' %');$('cn').textContent=L('cat')+': '+L('c'+(o.c+1));
  $('rows').innerHTML=[[L('fatm'),nf(o.fat*f,1)+' '+u],[L('leanm'),nf(o.lean*f,1)+' '+u]].map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');
  $('lw').textContent=o.low?L('low'):'';
  tab(o.c);
}
function tab(cur){$('ctab').innerHTML=[0,1,2,3,4].map(i=>`<div class="stat${i===cur?' on':''}"><span>${L('c'+(i+1))}</span><b>${RNG[sex][i]} %</b></div>`).join('')}
function buildSel(){
  $('me').innerHTML=['navy','bmi'].map(k=>`<option value="${k}" ${k===meth?'selected':''}>${L('m_'+k)}</option>`).join('');
  $('navy').classList.toggle('hidden',meth!=='navy');$('hpw').classList.toggle('hidden',sex!=='f');
}
function text(){baseText();$('fbox').innerHTML=`<div><span style="color:#8b94a7">${L('male')}:</span> <b style="color:var(--accent)">495 ÷ (1.0324 − 0.19077·log₁₀(${L('waist')} − ${L('neck')}) + 0.15456·log₁₀(${L('height')})) − 450</b></div><div><span style="color:#8b94a7">${L('female')}:</span> <b style="color:var(--accent)">495 ÷ (1.29579 − 0.35004·log₁₀(${L('waist')} + ${L('hip')} − ${L('neck')}) + 0.22100·log₁₀(${L('height')})) − 450</b></div><div><span style="color:#8b94a7">BMI:</span> <b style="color:var(--accent)">1.20·BMI + 0.23·${L('age').split(' ')[0].toLowerCase()} − 10.8·(1/0) − 5.4</b></div>`;buildSel();tab(-1);syncLang();calc()}
function setUnit(u){
  if(u===unit)return;
  const H=getH(),W=getW(),v=['nk','ws','hp'].map(id=>+$(id).value*(unit==='m'?1:2.54));
  unit=u;$('h2w').classList.toggle('hidden',u==='m');$('u1').textContent=u==='m'?'cm':'ft';
  document.querySelectorAll('.uw').forEach(e=>e.textContent=u==='m'?'kg':'lb');document.querySelectorAll('.ul').forEach(e=>e.textContent=u==='m'?'cm':'in');
  if(isFinite(H)&&H>0){if(u==='m')$('h1').value=Math.round(H);else{const i=H/2.54;$('h1').value=Math.floor(i/12);$('h2').value=Math.round(i%12)}}
  if(isFinite(W)&&W>0)$('w1').value=u==='m'?Math.round(W*10)/10:Math.round(W/0.45359237*10)/10;
  ['nk','ws','hp'].forEach((id,i)=>{if(isFinite(v[i])&&v[i]>0)$(id).value=u==='m'?Math.round(v[i]*10)/10:Math.round(v[i]/2.54*10)/10});
  text();
}
document.addEventListener('click',e=>{const s=e.target.closest('[data-sx]');if(s){sex=s.dataset.sx;text();return}const u=e.target.closest('[data-un]');if(u)setUnit(u.dataset.un)});
['ag','h1','h2','w1','nk','ws','hp'].forEach(id=>$(id).addEventListener('input',calc));
$('me').addEventListener('change',e=>{meth=e.target.value;buildSel();calc()});
initLang(text);text();
</script>
</body>
</html>
