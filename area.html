const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "Area and Perimeter Calculator", "sub": "Choose a shape, enter its dimensions and get the area and perimeter with the formula.", "h1": "How to use", "h2": "Units and rounding", "h4": "Formulas", "p1": "Choose a shape, then fill in the dimensions. All results update instantly and show the formula with your numbers substituted. Use any unit (cm, m, inches): lengths give the same unit, areas the unit squared, volumes the unit cubed.", "note": "Everything is calculated in your browser and nothing you enter is stored or sent anywhere.", "p2": "Choose the length unit once and enter all dimensions in it. Areas come out in that unit squared, volumes in that unit cubed, and the main result is also shown in other units. Results have up to six decimals; π is used at full precision. Tip: 1 m² = 10,000 cm² and 1 hectare = 10,000 m².", "lim": "<li><b>Square:</b> A = a², P = 4·a</li><li><b>Rectangle:</b> A = a·b, P = 2(a+b)</li><li><b>Triangle (base and height):</b> A = ½·a·h</li><li><b>Triangle (three sides):</b> A = √(s(s−a)(s−b)(s−c)), s = (a+b+c)/2</li><li><b>Circle:</b> A = π·r², C = 2·π·r</li><li><b>Trapezoid:</b> A = ½(a+c)·h</li><li><b>Parallelogram:</b> A = a·h, P = 2(a+b)</li><li><b>Rhombus:</b> A = ½·e·f</li><li><b>Ellipse:</b> A = π·a·b</li><li><b>Regular polygon:</b> A = n·a²/(4·tan(π/n))</li><li><b>Circular sector:</b> A = (α/360)·π·r²</li>", "faqh": "Frequently asked questions", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How do I calculate the area of a rectangle, triangle and circle?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Rectangle: A = a·b, triangle: A = ½·a·h (base times height), circle: A = π·r². Example: a 5 × 3 rectangle has area 15, a triangle with base 6 and height 4 has area 12, and a circle with radius 2 has area 4π ≈ 12.566.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">What is the difference between area and perimeter?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Area measures the surface inside a shape and is given in square units, perimeter is the length of the line around it and is given in length units. Example: a 5 × 3 rectangle has area 15 (units²) and perimeter 2(5+3) = 16 (units). For a circle the perimeter is the circumference, C = 2·π·r.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How do I find the area of a triangle when I only know the three sides?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Use Heron’s formula: s = (a+b+c)/2 and A = √(s(s−a)(s−b)(s−c)). Example: sides 3, 4 and 5 give s = 6 and A = √(6·3·2·1) = 6. The three sides must satisfy the triangle inequality.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Which units should I use and how do I convert the result?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Choose the length unit once and enter all dimensions in it; the area comes out in that unit squared. The result is also shown in other units. Remember that 1 m² = 10,000 cm² and 1 hectare = 10,000 m², because squaring the length also changes the conversion factor.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Which shapes does the calculator cover?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Square, rectangle, triangle (from base and height or from three sides), circle, trapezoid, parallelogram, rhombus, ellipse, regular polygon and circular sector, always with the formula and your numbers substituted.</p></details></li>"}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Výpočet obsahu a obvodu", "sub": "Vyber útvar, zadaj rozmery a získaj obsah a obvod so vzorcom.", "h1": "Ako na to", "h2": "Jednotky a zaokrúhľovanie", "h4": "Vzorce", "p1": "Vyber útvar a vyplň rozmery. Všetky výsledky sa prepočítajú okamžite a ukážu vzorec s dosadenými číslami. Použi ľubovoľnú jednotku (cm, m, palce): dĺžky vyjdú v tej istej jednotke, obsahy v jednotke na druhú, objemy v jednotke na tretiu.", "note": "Všetko sa počíta v tvojom prehliadači a nič, čo zadáš, sa neukladá ani neodosiela.", "p2": "Vyber jednotku dĺžky raz a všetky rozmery zadaj v nej. Obsahy vyjdú v tejto jednotke na druhú, objemy na tretiu a hlavný výsledok sa zobrazí aj v iných jednotkách. Výsledky majú najviac šesť desatinných miest; π sa používa v plnej presnosti. Tip: 1 m² = 10 000 cm² a 1 hektár = 10 000 m².", "lim": "<li><b>Štvorec:</b> A = a², P = 4·a</li><li><b>Obdĺžnik:</b> A = a·b, P = 2(a+b)</li><li><b>Trojuholník (základňa a výška):</b> A = ½·a·h</li><li><b>Trojuholník (tri strany):</b> A = √(s(s−a)(s−b)(s−c)), s = (a+b+c)/2</li><li><b>Kruh:</b> A = π·r², C = 2·π·r</li><li><b>Lichobežník:</b> A = ½(a+c)·h</li><li><b>Rovnobežník:</b> A = a·h, P = 2(a+b)</li><li><b>Kosoštvorec:</b> A = ½·e·f</li><li><b>Elipsa:</b> A = π·a·b</li><li><b>Pravidelný n-uholník:</b> A = n·a²/(4·tan(π/n))</li><li><b>Kruhový výsek:</b> A = (α/360)·π·r²</li>", "faqh": "Často kladené otázky", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ako vypočítam obsah obdĺžnika, trojuholníka a kruhu?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Obdĺžnik: A = a·b, trojuholník: A = ½·a·h (základňa krát výška), kruh: A = π·r². Príklad: obdĺžnik 5 × 3 má obsah 15, trojuholník so základňou 6 a výškou 4 má obsah 12 a kruh s polomerom 2 má obsah 4π ≈ 12,566.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Aký je rozdiel medzi obsahom a obvodom?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Obsah meria plochu vnútri útvaru a udáva sa v štvorcových jednotkách, obvod je dĺžka čiary okolo neho a udáva sa v jednotkách dĺžky. Príklad: obdĺžnik 5 × 3 má obsah 15 (jednotiek²) a obvod 2(5+3) = 16 (jednotiek). Pri kruhu je obvod C = 2·π·r.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ako zistím obsah trojuholníka, keď poznám iba tri strany?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Použi Herónov vzorec: s = (a+b+c)/2 a A = √(s(s−a)(s−b)(s−c)). Príklad: strany 3, 4 a 5 dávajú s = 6 a A = √(6·3·2·1) = 6. Tri strany musia spĺňať trojuholníkovú nerovnosť.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Aké jednotky použiť a ako prevediem výsledok?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Vyber jednotku dĺžky raz a zadaj v nej všetky rozmery; obsah vyjde v tejto jednotke na druhú. Výsledok sa zobrazí aj v iných jednotkách. Pamätaj, že 1 m² = 10 000 cm² a 1 hektár = 10 000 m², lebo umocnenie dĺžky mení aj prevodný koeficient.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Aké útvary kalkulačka pokrýva?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Štvorec, obdĺžnik, trojuholník (zo základne a výšky alebo z troch strán), kruh, lichobežník, rovnobežník, kosoštvorec, elipsu, pravidelný mnohouholník a kruhový výsek, vždy so vzorcom a dosadenými číslami.</p></details></li>"}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Fläche und Umfang berechnen", "sub": "Wähle eine Form, gib die Maße ein und erhalte Fläche und Umfang samt Formel.", "h1": "So geht’s", "h2": "Einheiten und Rundung", "h4": "Formeln", "p1": "Wähle eine Form und trage die Maße ein. Alle Ergebnisse aktualisieren sich sofort und zeigen die Formel mit deinen eingesetzten Zahlen. Verwende eine beliebige Einheit (cm, m, Zoll): Längen ergeben dieselbe Einheit, Flächen die Einheit zum Quadrat, Volumen die Einheit hoch drei.", "note": "Alles wird in deinem Browser berechnet; nichts, was du eingibst, wird gespeichert oder gesendet.", "p2": "Wähle die Längeneinheit einmal und gib alle Maße in ihr ein. Flächen ergeben diese Einheit zum Quadrat, Volumen hoch drei, und das Hauptergebnis wird auch in anderen Einheiten angezeigt. Ergebnisse haben bis zu sechs Nachkommastellen; π wird in voller Genauigkeit verwendet. Tipp: 1 m² = 10.000 cm² und 1 Hektar = 10.000 m².", "lim": "<li><b>Quadrat:</b> A = a², P = 4·a</li><li><b>Rechteck:</b> A = a·b, P = 2(a+b)</li><li><b>Dreieck (Grundseite und Höhe):</b> A = ½·a·h</li><li><b>Dreieck (drei Seiten):</b> A = √(s(s−a)(s−b)(s−c)), s = (a+b+c)/2</li><li><b>Kreis:</b> A = π·r², C = 2·π·r</li><li><b>Trapez:</b> A = ½(a+c)·h</li><li><b>Parallelogramm:</b> A = a·h, P = 2(a+b)</li><li><b>Raute:</b> A = ½·e·f</li><li><b>Ellipse:</b> A = π·a·b</li><li><b>Regelmäßiges Vieleck:</b> A = n·a²/(4·tan(π/n))</li><li><b>Kreissektor:</b> A = (α/360)·π·r²</li>", "faqh": "Häufige Fragen", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie berechne ich die Fläche eines Rechtecks, Dreiecks oder Kreises?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Rechteck: A = a·b, Dreieck: A = ½·a·h (Grundseite mal Höhe), Kreis: A = π·r². Beispiel: Ein Rechteck 5 × 3 hat die Fläche 15, ein Dreieck mit Grundseite 6 und Höhe 4 die Fläche 12 und ein Kreis mit Radius 2 die Fläche 4π ≈ 12,566.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Was ist der Unterschied zwischen Fläche und Umfang?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Die Fläche misst das Innere einer Figur und wird in Quadrateinheiten angegeben, der Umfang ist die Länge der Randlinie und wird in Längeneinheiten angegeben. Beispiel: Ein Rechteck 5 × 3 hat die Fläche 15 (Einheiten²) und den Umfang 2(5+3) = 16 (Einheiten). Beim Kreis ist der Umfang U = 2·π·r.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie berechne ich die Fläche eines Dreiecks, wenn ich nur die drei Seiten kenne?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Nutze die Heronsche Formel: s = (a+b+c)/2 und A = √(s(s−a)(s−b)(s−c)). Beispiel: Die Seiten 3, 4 und 5 ergeben s = 6 und A = √(6·3·2·1) = 6. Die drei Seiten müssen die Dreiecksungleichung erfüllen.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Welche Einheiten soll ich verwenden und wie rechne ich das Ergebnis um?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Wähle die Längeneinheit einmal und gib alle Maße darin ein; die Fläche kommt in dieser Einheit zum Quadrat heraus. Das Ergebnis wird auch in anderen Einheiten angezeigt. Denk daran: 1 m² = 10.000 cm² und 1 Hektar = 10.000 m², weil das Quadrieren der Länge auch den Umrechnungsfaktor ändert.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Welche Figuren deckt der Rechner ab?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Quadrat, Rechteck, Dreieck (aus Grundseite und Höhe oder aus drei Seiten), Kreis, Trapez, Parallelogramm, Raute, Ellipse, regelmäßiges Vieleck und Kreisausschnitt, jeweils mit Formel und eingesetzten Zahlen.</p></details></li>"}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Výpočet obsahu a obvodu", "sub": "Vyber útvar, zadej rozměry a získej obsah a obvod se vzorcem.", "h1": "Jak na to", "h2": "Jednotky a zaokrouhlování", "h4": "Vzorce", "p1": "Vyber útvar a vyplň rozměry. Všechny výsledky se přepočítají okamžitě a ukážou vzorec s dosazenými čísly. Použij libovolnou jednotku (cm, m, palce): délky vyjdou ve stejné jednotce, obsahy v jednotce na druhou, objemy v jednotce na třetí.", "note": "Vše se počítá ve tvém prohlížeči a nic, co zadáš, se neukládá ani neodesílá.", "p2": "Vyber jednotku délky jednou a všechny rozměry zadej v ní. Obsahy vyjdou v této jednotce na druhou, objemy na třetí a hlavní výsledek se zobrazí i v jiných jednotkách. Výsledky mají nejvýše šest desetinných míst; π se používá v plné přesnosti. Tip: 1 m² = 10 000 cm² a 1 hektar = 10 000 m².", "lim": "<li><b>Čtverec:</b> A = a², P = 4·a</li><li><b>Obdélník:</b> A = a·b, P = 2(a+b)</li><li><b>Trojúhelník (základna a výška):</b> A = ½·a·h</li><li><b>Trojúhelník (tři strany):</b> A = √(s(s−a)(s−b)(s−c)), s = (a+b+c)/2</li><li><b>Kruh:</b> A = π·r², C = 2·π·r</li><li><b>Lichoběžník:</b> A = ½(a+c)·h</li><li><b>Rovnoběžník:</b> A = a·h, P = 2(a+b)</li><li><b>Kosočtverec:</b> A = ½·e·f</li><li><b>Elipsa:</b> A = π·a·b</li><li><b>Pravidelný n-úhelník:</b> A = n·a²/(4·tan(π/n))</li><li><b>Kruhová výseč:</b> A = (α/360)·π·r²</li>", "faqh": "Časté otázky", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak vypočítám obsah obdélníku, trojúhelníku a kruhu?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Obdélník: A = a·b, trojúhelník: A = ½·a·h (základna krát výška), kruh: A = π·r². Příklad: obdélník 5 × 3 má obsah 15, trojúhelník se základnou 6 a výškou 4 má obsah 12 a kruh s poloměrem 2 má obsah 4π ≈ 12,566.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jaký je rozdíl mezi obsahem a obvodem?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Obsah měří plochu uvnitř útvaru a udává se ve čtverečních jednotkách, obvod je délka čáry kolem něj a udává se v jednotkách délky. Příklad: obdélník 5 × 3 má obsah 15 (jednotek²) a obvod 2(5+3) = 16 (jednotek). U kruhu je obvod C = 2·π·r.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak zjistím obsah trojúhelníku, když znám jen tři strany?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Použij Heronův vzorec: s = (a+b+c)/2 a A = √(s(s−a)(s−b)(s−c)). Příklad: strany 3, 4 a 5 dávají s = 6 a A = √(6·3·2·1) = 6. Tři strany musí splňovat trojúhelníkovou nerovnost.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jaké jednotky použít a jak převedu výsledek?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Vyber jednotku délky jednou a zadej v ní všechny rozměry; obsah vyjde v této jednotce na druhou. Výsledek se zobrazí i v jiných jednotkách. Pamatuj, že 1 m² = 10 000 cm² a 1 hektar = 10 000 m², protože umocnění délky mění i převodní koeficient.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jaké útvary kalkulačka pokrývá?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Čtverec, obdélník, trojúhelník (ze základny a výšky nebo ze tří stran), kruh, lichoběžník, rovnoběžník, kosočtverec, elipsu, pravidelný mnohoúhelník a kruhovou výseč, vždy se vzorcem a dosazenými čísly.</p></details></li>"}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Obliczanie pola i obwodu", "sub": "Wybierz figurę, wpisz wymiary i uzyskaj pole oraz obwód wraz ze wzorem.", "h1": "Jak używać", "h2": "Jednostki i zaokrąglanie", "h4": "Wzory", "p1": "Wybierz figurę i wpisz wymiary. Wszystkie wyniki przeliczają się od razu i pokazują wzór z podstawionymi liczbami. Użyj dowolnej jednostki (cm, m, cale): długości wyjdą w tej samej jednostce, pola w jednostce do kwadratu, objętości w jednostce do sześcianu.", "note": "Wszystko jest liczone w Twojej przeglądarce, a nic, co wpiszesz, nie jest zapisywane ani wysyłane.", "p2": "Wybierz jednostkę długości raz i wpisz w niej wszystkie wymiary. Pola wyjdą w tej jednostce do kwadratu, objętości do sześcianu, a główny wynik pokazujemy też w innych jednostkach. Wyniki mają do sześciu miejsc po przecinku; π jest użyte z pełną precyzją. Wskazówka: 1 m² = 10 000 cm², a 1 hektar = 10 000 m².", "lim": "<li><b>Kwadrat:</b> A = a², P = 4·a</li><li><b>Prostokąt:</b> A = a·b, P = 2(a+b)</li><li><b>Trójkąt (podstawa i wysokość):</b> A = ½·a·h</li><li><b>Trójkąt (trzy boki):</b> A = √(s(s−a)(s−b)(s−c)), s = (a+b+c)/2</li><li><b>Koło:</b> A = π·r², C = 2·π·r</li><li><b>Trapez:</b> A = ½(a+c)·h</li><li><b>Równoległobok:</b> A = a·h, P = 2(a+b)</li><li><b>Romb:</b> A = ½·e·f</li><li><b>Elipsa:</b> A = π·a·b</li><li><b>Wielokąt foremny:</b> A = n·a²/(4·tan(π/n))</li><li><b>Wycinek koła:</b> A = (α/360)·π·r²</li>", "faqh": "Najczęstsze pytania", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak obliczyć pole prostokąta, trójkąta i koła?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Prostokąt: A = a·b, trójkąt: A = ½·a·h (podstawa razy wysokość), koło: A = π·r². Przykład: prostokąt 5 × 3 ma pole 15, trójkąt o podstawie 6 i wysokości 4 ma pole 12, a koło o promieniu 2 ma pole 4π ≈ 12,566.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jaka jest różnica między polem a obwodem?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Pole mierzy powierzchnię wewnątrz figury i podaje się je w jednostkach kwadratowych, obwód to długość linii wokół niej i podaje się go w jednostkach długości. Przykład: prostokąt 5 × 3 ma pole 15 (jednostek²) i obwód 2(5+3) = 16 (jednostek). W kole obwód to C = 2·π·r.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak obliczyć pole trójkąta, gdy znam tylko trzy boki?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Użyj wzoru Herona: s = (a+b+c)/2 i A = √(s(s−a)(s−b)(s−c)). Przykład: boki 3, 4 i 5 dają s = 6 i A = √(6·3·2·1) = 6. Trzy boki muszą spełniać nierówność trójkąta.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jakich jednostek użyć i jak przeliczyć wynik?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Wybierz jednostkę długości raz i wpisz w niej wszystkie wymiary; pole wyjdzie w tej jednostce do kwadratu. Wynik jest pokazany także w innych jednostkach. Pamiętaj, że 1 m² = 10 000 cm², a 1 hektar = 10 000 m², bo podniesienie długości do kwadratu zmienia też przelicznik.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jakie figury obejmuje kalkulator?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Kwadrat, prostokąt, trójkąt (z podstawy i wysokości lub z trzech boków), koło, trapez, równoległobok, romb, elipsę, wielokąt foremny i wycinek koła, zawsze ze wzorem i podstawionymi liczbami.</p></details></li>"}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calcul d’aire et de périmètre", "sub": "Choisissez une forme, saisissez ses dimensions et obtenez l’aire et le périmètre avec la formule.", "h1": "Mode d’emploi", "h2": "Unités et arrondis", "h4": "Formules", "p1": "Choisissez une forme et remplissez les dimensions. Tous les résultats se mettent à jour instantanément et montrent la formule avec vos nombres. Utilisez n’importe quelle unité (cm, m, pouces) : les longueurs restent dans cette unité, les aires en unité au carré, les volumes en unité au cube.", "note": "Tout est calculé dans votre navigateur et rien de ce que vous saisissez n’est enregistré ni envoyé.", "p2": "Choisissez l’unité de longueur une fois et saisissez toutes les dimensions dedans. Les aires sortent en unité au carré, les volumes en unité au cube, et le résultat principal est aussi donné dans d’autres unités. Les résultats ont jusqu’à six décimales ; π est utilisé avec toute sa précision. Astuce : 1 m² = 10 000 cm² et 1 hectare = 10 000 m².", "lim": "<li><b>Carré:</b> A = a², P = 4·a</li><li><b>Rectangle:</b> A = a·b, P = 2(a+b)</li><li><b>Triangle (base et hauteur):</b> A = ½·a·h</li><li><b>Triangle (trois côtés):</b> A = √(s(s−a)(s−b)(s−c)), s = (a+b+c)/2</li><li><b>Cercle:</b> A = π·r², C = 2·π·r</li><li><b>Trapèze:</b> A = ½(a+c)·h</li><li><b>Parallélogramme:</b> A = a·h, P = 2(a+b)</li><li><b>Losange:</b> A = ½·e·f</li><li><b>Ellipse:</b> A = π·a·b</li><li><b>Polygone régulier:</b> A = n·a²/(4·tan(π/n))</li><li><b>Secteur circulaire:</b> A = (α/360)·π·r²</li>", "faqh": "Questions fréquentes", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Comment calculer l’aire d’un rectangle, d’un triangle et d’un cercle ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Rectangle : A = a·b, triangle : A = ½·a·h (base fois hauteur), disque : A = π·r². Exemple : un rectangle de 5 × 3 a une aire de 15, un triangle de base 6 et de hauteur 4 a une aire de 12, et un disque de rayon 2 a une aire de 4π ≈ 12,566.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Quelle est la différence entre aire et périmètre ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">L’aire mesure la surface à l’intérieur d’une figure et s’exprime en unités carrées ; le périmètre est la longueur de son contour et s’exprime en unités de longueur. Exemple : un rectangle de 5 × 3 a une aire de 15 (unités²) et un périmètre de 2(5+3) = 16 (unités). Pour un cercle, le périmètre est la circonférence C = 2·π·r.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Comment trouver l’aire d’un triangle quand on ne connaît que les trois côtés ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Utilisez la formule de Héron : s = (a+b+c)/2 et A = √(s(s−a)(s−b)(s−c)). Exemple : les côtés 3, 4 et 5 donnent s = 6 et A = √(6·3·2·1) = 6. Les trois côtés doivent respecter l’inégalité triangulaire.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Quelles unités utiliser et comment convertir le résultat ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Choisissez l’unité de longueur une fois et saisissez-y toutes les dimensions ; l’aire sort dans cette unité au carré. Le résultat s’affiche aussi dans d’autres unités. Rappel : 1 m² = 10 000 cm² et 1 hectare = 10 000 m², car élever la longueur au carré change aussi le facteur de conversion.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Quelles figures le calculateur couvre-t-il ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Carré, rectangle, triangle (à partir de la base et de la hauteur ou des trois côtés), disque, trapèze, parallélogramme, losange, ellipse, polygone régulier et secteur circulaire, toujours avec la formule et vos nombres substitués.</p></details></li>"}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Cálculo de área y perímetro", "sub": "Elige una figura, introduce sus medidas y obtén el área y el perímetro con la fórmula.", "h1": "Cómo se usa", "h2": "Unidades y redondeo", "h4": "Fórmulas", "p1": "Elige una figura y rellena las medidas. Todos los resultados se actualizan al instante y muestran la fórmula con tus números sustituidos. Usa cualquier unidad (cm, m, pulgadas): las longitudes salen en esa unidad, las áreas en unidad al cuadrado y los volúmenes en unidad al cubo.", "note": "Todo se calcula en tu navegador y nada de lo que introduces se guarda ni se envía.", "p2": "Elige la unidad de longitud una vez e introduce en ella todas las medidas. Las áreas salen en esa unidad al cuadrado, los volúmenes al cubo, y el resultado principal también se muestra en otras unidades. Los resultados tienen hasta seis decimales; π se usa con toda su precisión. Consejo: 1 m² = 10 000 cm² y 1 hectárea = 10 000 m².", "lim": "<li><b>Cuadrado:</b> A = a², P = 4·a</li><li><b>Rectángulo:</b> A = a·b, P = 2(a+b)</li><li><b>Triángulo (base y altura):</b> A = ½·a·h</li><li><b>Triángulo (tres lados):</b> A = √(s(s−a)(s−b)(s−c)), s = (a+b+c)/2</li><li><b>Círculo:</b> A = π·r², C = 2·π·r</li><li><b>Trapecio:</b> A = ½(a+c)·h</li><li><b>Paralelogramo:</b> A = a·h, P = 2(a+b)</li><li><b>Rombo:</b> A = ½·e·f</li><li><b>Elipse:</b> A = π·a·b</li><li><b>Polígono regular:</b> A = n·a²/(4·tan(π/n))</li><li><b>Sector circular:</b> A = (α/360)·π·r²</li>", "faqh": "Preguntas frecuentes", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Cómo calculo el área de un rectángulo, un triángulo y un círculo?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Rectángulo: A = a·b, triángulo: A = ½·a·h (base por altura), círculo: A = π·r². Ejemplo: un rectángulo de 5 × 3 tiene área 15, un triángulo de base 6 y altura 4 tiene área 12 y un círculo de radio 2 tiene área 4π ≈ 12,566.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Qué diferencia hay entre área y perímetro?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">El área mide la superficie dentro de una figura y se expresa en unidades cuadradas; el perímetro es la longitud de su contorno y se expresa en unidades de longitud. Ejemplo: un rectángulo de 5 × 3 tiene área 15 (unidades²) y perímetro 2(5+3) = 16 (unidades). En el círculo, el perímetro es la circunferencia C = 2·π·r.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Cómo hallo el área de un triángulo si solo conozco los tres lados?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Usa la fórmula de Herón: s = (a+b+c)/2 y A = √(s(s−a)(s−b)(s−c)). Ejemplo: los lados 3, 4 y 5 dan s = 6 y A = √(6·3·2·1) = 6. Los tres lados deben cumplir la desigualdad triangular.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Qué unidades uso y cómo convierto el resultado?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Elige la unidad de longitud una vez e introduce en ella todas las dimensiones; el área sale en esa unidad al cuadrado. El resultado se muestra también en otras unidades. Recuerda que 1 m² = 10.000 cm² y 1 hectárea = 10.000 m², porque elevar la longitud al cuadrado cambia también el factor de conversión.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Qué figuras cubre la calculadora?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Cuadrado, rectángulo, triángulo (con base y altura o con los tres lados), círculo, trapecio, paralelogramo, rombo, elipse, polígono regular y sector circular, siempre con la fórmula y tus números sustituidos.</p></details></li>"}};
