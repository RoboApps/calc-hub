tki i zaokrąglanie", "h4": "Wzory", "p1": "Wybierz figurę i wpisz wymiary. Wszystkie wyniki przeliczają się od razu i pokazują wzór z podstawionymi liczbami. Użyj dowolnej jednostki (cm, m, cale): długości wyjdą w tej samej jednostce, pola w jednostce do kwadratu, objętości w jednostce do sześcianu.", "note": "Wszystko jest liczone w Twojej przeglądarce, a nic, co wpiszesz, nie jest zapisywane ani wysyłane.", "p2": "Wybierz jednostkę długości raz i wpisz w niej wszystkie wymiary. Pola wyjdą w tej jednostce do kwadratu, objętości do sześcianu, a główny wynik pokazujemy też w innych jednostkach. Wyniki mają do sześciu miejsc po przecinku; π jest użyte z pełną precyzją. Wskazówka: 1 m² = 10 000 cm², a 1 hektar = 10 000 m².", "lim": "<li><b>Kwadrat:</b> A = a², P = 4·a</li><li><b>Prostokąt:</b> A = a·b, P = 2(a+b)</li><li><b>Trójkąt (podstawa i wysokość):</b> A = ½·a·h</li><li><b>Trójkąt (trzy boki):</b> A = √(s(s−a)(s−b)(s−c)), s = (a+b+c)/2</li><li><b>Koło:</b> A = π·r², C = 2·π·r</li><li><b>Trapez:</b> A = ½(a+c)·h</li><li><b>Równoległobok:</b> A = a·h, P = 2(a+b)</li><li><b>Romb:</b> A = ½·e·f</li><li><b>Elipsa:</b> A = π·a·b</li><li><b>Wielokąt foremny:</b> A = n·a²/(4·tan(π/n))</li><li><b>Wycinek koła:</b> A = (α/360)·π·r²</li>"}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calculateur d’aire et de périmètre", "sub": "Choisissez une forme, saisissez ses dimensions et obtenez l’aire et le périmètre avec la formule.", "h1": "Mode d’emploi", "h2": "Unités et arrondis", "h4": "Formules", "p1": "Choisissez une forme et remplissez les dimensions. Tous les résultats se mettent à jour instantanément et montrent la formule avec vos nombres. Utilisez n’importe quelle unité (cm, m, pouces) : les longueurs restent dans cette unité, les aires en unité au carré, les volumes en unité au cube.", "note": "Tout est calculé dans votre navigateur et rien de ce que vous saisissez n’est enregistré ni envoyé.", "p2": "Choisissez l’unité de longueur une fois Triángulo (tres lados):</b> A = √(s(s−a)(s−b)(s−c)), s = (a+b+c)/2</li><li><b>Círculo:</b> A = π·r², C = 2·π·r</li><li><b>Trapecio:</b> A = ½(a+c)·h</li><li><b>Paralelogramo:</b> A = a·h, P = 2(a+b)</li><li><b>Rombo:</b> A = ½·e·f</li><li><b>Elipse:</b> A = π·a·b</li><li><b>Polígono regular:</b> A = n·a²/(4·tan(π/n))</li><li><b>Sector circular:</b> A = (α/360)·π·r²</li>"}};

  menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{const u=new URL(location.href);if(lang==='en')u.searchParams.delete('lang');else u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(x){}close();cb()});
  document.addEventListener('click',close);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}

const $=id=>document.getElementById(id);
const IDX={en:0,sk:1,de:2,cs:3,pl:4,fr:5,es:6};
const L=k=>PIPE[k].split('|')[IDX[lang]];
function baseText(){const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.tagName==='UL'?e.innerHTML=v:e.textContent=v})}
const P=Math.PI;
const SH=[
{k:'square',f:[['a','side']],r:[['r_area','A = a²',v=>v.a**2],['r_peri','P = 4·a',v=>4*v.a]]},
{k:'rect',f:[['a','side'],['b','side']],r:[['r_area','A = a·b',v=>v.a*v.b],['r_peri','P = 2(a+b)',v=>2*(v.a+v.b)]]},
{k:'trih',f:[['a','base'],['h','height']],r:[['r_area','A = ½·a·h',v=>v.a*v.h/2]]},
{k:'tris',f:[['a','side'],['b','side'],['c','side']],c:v=>v.a+v.b>v.c&&v.a+v.c>v.b&&v.b+v.c>v.a?null:'errt',x:v=>({s:(v.a+v.b+v.c)/2}),r:[['r_area','A = √(s(s−a)(s−b)(s−c))',v=>Math.sqrt(v.s*(v.s-v.a)*(v.s-v.b)*(v.s-v.c))],['r_peri','P = a+b+c',v=>v.a+v.b+v.c]]},
{k:'circle',f:[['r','radius']],r:[['r_area','A = π·r²',v=>P*v.r**2],['r_circ','C = 2·π·r',v=>2*P*v.r]]},
{k:'trap',f:[['a','base'],['c','base'],['b','leg'],['d','leg'],['h','height']],c:v=>v.b<v.h||v.d<v.h?'errl':null,r:[['r_area','A = ½(a+c)·h',v=>(v.a+v.c)*v.h/2],['r_peri','P = a+b+c+d',v=>v.a+v.b+v.c+v.d]]},
{k:'para',f:[['a','base'],['b','side'],['h','height']],c:v=>v.b<v.h?'errl':null,r:[['r_area','A = a·h',v=>v.a*v.h],['r_peri','P = 2(a+b)',v=>2*(v.a+v.b)]]},
{k:'rhomb',f:[['e','diag'],['f','diag']],r:[['r_area','A = ½·e·f',v=>v.e*v.f/2],['r_peri','P = 4·√((e/2)²+(f/2)²)',v=>4*Math.sqrt((v.e/2)**2+(v.f/2)**2)]]},
{k:'ell',f:[['a','semi'],['b','semi']],r:[['r_area','A = π·a·b',v=>P*v.a*v.b],['r_peri','P ≈ π(3(a+b)−√((3·a+b)(a+3·b)))',v=>P*(3*(v.a+v.b)-Math.sqrt((3*v.a+v.b)*(v.a+3*v.b)))]]},
{k:'poly',f:[['n','n'],['a','side']],c:v=>Number.isInteger(v.n)&&v.n>=3?null:'errn',r:[['r_area','A = n·a²/(4·tan(π/n))',v=>v.n*v.a**2/(4*Math.tan(P/v.n))],['r_peri','P = n·a',v=>v.n*v.a]]},
{k:'sector',f:[['r','radius'],['α','angle']],c:v=>v['α']<=360?null:'erra',x:v=>({l:v['α']/360*2*P*v.r}),r:[['r_area','A = (α/360)·π·r²',v=>v['α']/360*P*v.r**2],['r_arc','l = (α/360)·2·π·r',v=>v.l],['r_peri','P = l+2·r',v=>v.l+2*v.r]]}
];

const fmt=x=>isFinite(x)?(+x.toFixed(6)).toLocaleString(lang==='en'?'en-US':lang,{maximumFractionDigits:6}):'–';
const sub=(f,v)=>f.replace(/^[^=≈]*[=≈]/,'').trim().replace(/(?<![A-Za-z])[A-Za-zα][₁₂]?(?![A-Za-z])/g,m=>v[m]!==undefined?fmt(v[m]):m);
const UN=[['mm',.001],['cm',.01],['dm',.1],['m',1],['km',1000],['in',.0254],['ft',.3048],['yd',.9144]],PW={r_area:2,r_surf:2,r_lat:2,r_vol:3},SUP=['','','²','³'];
const EQ={2:[['mm²',1e-6],['cm²',1e-4],['dm²',1e-2],['m²',1],['ha',1e4],['km²',1e6],['in²',.0254**2],['ft²',.3048**2]],3:[['mm³',1e-9],['cm³ = ml',1e-6],['dm³ = l',1e-3],['m³',1],['in³',.0254**3],['ft³',.3048**3],['gal (US)',.003785411784]]};
const fm=x=>x.toLocaleString(lang==='en'?'en-US':lang,{maximumSignificantDigits:6}),uo=()=>UN[+$('un').value||1];
function compute(s,v){if(!s.f.every(([k])=>v[k]>0))return{e:'err'};const e=s.c&&s.c(v);if(e)return{e};
  const w={...v,...(s.x?s.x(v):{})};return{rows:s.r.map(([l,f,fn])=>({l,f,val:fn(w),s:sub(f,w)}))}}
let cur=0;
function fields(){const s=SH[cur],old={},u=uo()[0],suf=w=>w==='angle'?'°':w==='n'?'':w==='barea'?u+'²':u;document.querySelectorAll('#fl input').forEach(i=>old[i.dataset.v]=i.value);
  $('fl').innerHTML=s.f.map(([v,w])=>`<div><label class="block text-sm" style="color:#8b94a7">${L('w_'+w)} <i>${v}</i></label><div class="field mt-2"><input data-v="${v}" type="number" inputmode="decimal" min="0" step="any" value="${old[v]!==undefined?old[v]:''}"><span>${suf(w)}</span></div></div>`).join('')}
function calc(){const s=SH[cur],v={};let full=true;
  document.querySelectorAll('#fl input').forEach(i=>{const x=parseFloat(String(i.value).replace(',','.'));if(i.value!==''&&isFinite(x))v[i.dataset.v]=x;else full=false});
  const h=$('hint'),er=$('err'),rs=$('res');h.classList.add('hidden');er.classList.add('hidden');rs.classList.add('hidden');
  if(!full){h.textContent=L('hint');h.classList.remove('hidden');return}
  const o=compute(s,v);if(o.e){er.textContent=L(o.e);er.classList.remove('hidden');return}
  const [un,f]=uo();rs.innerHTML=o.rows.map((r,i)=>{const pw=PW[r.l]||1,u=un+SUP[pw];let eq='';
    if(i===0&&pw>1){const b=r.val*f**pw;eq=`<p class="mt-2 text-xs leading-relaxed" style="color:#8b94a7">${L('eq')}: ${EQ[pw].filter(e=>e[0]!==u).map(e=>fm(b/e[1])+' '+e[0]).join(' · ')}</p>`}
    return `<div class="rounded-xl p-4" style="background:rgba(255,255,255,.04)"><p class="text-sm" style="color:#8b94a7">${L(r.l)}</p><p class="${i?'text-2xl':'grad text-4xl'} font-bold">${fmt(r.val)} <span class="text-base font-semibold" style="color:#8b94a7;-webkit-text-fill-color:#8b94a7">${u}</span></p><p class="mt-1 text-xs" style="color:#667085">${r.f} = ${r.s} = ${fmt(r.val)} ${u}</p>${eq}</div>`}).join('');rs.classList.remove('hidden')}
function text(){baseText();$('pl').textContent=L('pick');$('ul').textContent=L('unit');const cu=$('un').value||'1';$('un').innerHTML=UN.map((u,i)=>`<option value="${i}">${u[0]}</option>`).join('');$('un').value=cu;$('sh').innerHTML=SH.map((s,i)=>`<option value="${i}">${L('s_'+s.k)}</option>`).join('');$('sh').value=cur;fields();calc();syncLang()}
$('sh').onchange=e=>{cur=+e.target.value;$('fl').innerHTML='';fields();calc()};
$('un').onchange=()=>{fields();calc()};
$('fl').addEventListener('input',calc);
initLang(text);text();

</script>
