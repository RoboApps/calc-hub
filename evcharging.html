na na rychlých DC nabíječkách, takže skutečný čas je delší než odhad. Přidaný dojezd = přidaná energie ÷ spotřeba × 100.", "h4": "Dobré vědět", "lim": "<li>Veřejné nabíječky stojí často 2–3krát více za kWh než nabíjení doma.</li><li>Chlad zvyšuje spotřebu a snižuje rychlost nabíjení.</li><li>Auto může omezit výkon pod maximum nabíječky (například limit palubní AC nabíječky 7,4 nebo 11 kW).</li>", "note": "Pouze odhad; skutečný čas a cena nabíjení závisí na autě, nabíječce a tarifu."}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Kalkulator ładowania samochodu elektrycznego", "sub": "Sprawdź, jak długo ładuje się samochód elektryczny, ile energii potrzebuje i ile to kosztuje.", "h1": "Jak oblicza się ładowanie samochodu elektrycznego", "p1": "Dodana energia = pojemność baterii × (cel − obecne naładowanie). Energia pobrana z sieci jest większa z powodu strat ładowania (zwykle 5–15 %). Czas = energia z sieci ÷ moc ładowarki; koszt = energia z sieci × cena za kWh.", "h2": "Dobre szacunki wymagają kontekstu", "p2": "Ładowanie nie jest liniowe: powyżej około 80 % samochód zwalnia ładowanie, zwłaszcza na szybkich ładowarkach DC, więc rzeczywisty czas jest dłuższy niż szacunek. Dodany zasięg = dodana energia ÷ zużycie × 100.", "h4": "Warto wiedzieć", "lim": "<li>Publiczne ładowarki kosztują często 2–3 razy więcej za kWh niż ładowanie w domu.</li><li>Zimno zwiększa zużycie i zmniejsza prędkość ładowania.</li><li>Samochód może ograniczyć moc poniżej maksimum ładowarki (na przykład limit pokładowej ładowarki AC 7,4 lub 11 kW).</li>", "note": "Tylko szacunek; rzeczywisty czas i koszt zależą od auta, ładowarki i taryfy."}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calculateur de recharge de véhicule électrique", "sub": "Calculez la durée de charge d’une voiture électrique, l’énergie nécessaire et son coût.", "h1": "Comment la recharge d’un VE est calculée", "p1": "Énergie ajoutée = capacité de la batterie × (cible − charge actuelle). L’énergie prélevée sur le réseau est plus élevée à cause des pertes de charge (généralement 5 à 15 %). Durée = énergie du réseau ÷ puissance du chargeur ; coût = énergie du réseau × prix du kWh.", "h2": "Une bonne estimation demande du contexte", "p2": "La charge n’est pas linéaire : au-delà d’environ 80 %, la voiture ralentit la charge, surtout sur les bornes rapides DC ; la durée réelle est donc plus longue que l’estimation. Autonomie ajoutée = énergie ajoutée ÷ consommation × 100.", "h4": "Bon à savoir", "lim": "<li>Les bornes publiques coûtent souvent 2 à 3 fois plus cher par kWh que la recharge à domicile.</li><li>Le froid augmente la consommation et réduit la vitesse de charge.</li><li>La voiture peut limiter la puissance sous le maximum de la borne (par exemple chargeur AC embarqué limité à 7,4 ou 11 kW).</li>", "note": "Estimation uniquement ; la durée et le coût réels dépendent de la voiture, de la borne et du tarif."}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Calculadora de carga de vehículo eléctrico", "sub": "Calcula cuánto tarda en cargarse un coche eléctrico, cuánta energía necesita y cuánto cuesta.", "h1": "Cómo se calcula la carga de un VE", "p1": "Energía añadida = capacidad de la batería × (objetivo − carga actual). La energía tomada de la red es mayor por las pérdidas de carga (normalmente un 5–15 %). Tiempo = energía de la red ÷ potencia del cargador; coste = energía de la red × precio del kWh.", "h2": "Una buena estimación necesita contexto", "p2": "La carga no es lineal: por encima de un 80 % aproximadamente el coche reduce la velocidad, sobre todo en cargadores rápidos de CC, así que el tiempo real es mayor que la estimación. Autonomía añadida = energía añadida ÷ consumo × 100.", "h4": "Conviene saber", "lim": "<li>Los cargadores públicos suelen costar 2–3 veces más por kWh que cargar en casa.</li><li>El frío aumenta el consumo y reduce la velocidad de carga.</li><li>El coche puede limitar la potencia por debajo del máximo del cargador (por ejemplo, un cargador de CA a bordo limitado a 7,4 u 11 kW).</li>", "note": "Solo una estimación; el tiempo y el coste reales dependen del coche, del cargador y de la tarifa."}};

lady|Kosten|Náklady|Koszt|Coût|Coste", "rg": "Range added|Pridaný dojazd|Hinzugefügte Reichweite|Přidaný dojezd|Dodany zasięg|Autonomie ajoutée|Autonomía añadida", "c100": "Cost per 100 km|Náklady na 100 km|Kosten pro 100 km|Náklady na 100 km|Koszt na 100 km|Coût aux 100 km|Coste por 100 km", "sn": "The target must be higher than the current charge.|Cieľ musí byť vyšší ako súčasné nabitie.|Das Ziel muss höher sein als der aktuelle Ladestand.|Cíl musí být vyšší než současné nabití.|Cel musi być wyższy niż obecne naładowanie.|La cible doit être supérieure à la charge actuelle.|El objetivo debe ser mayor que la carga actual."};

}
const FT={en:['Privacy & Cookies','Privacy and cookie settings','About & contact'],sk:['Ochrana údajov a cookies','Nastavenia súkromia a cookies','O nás a kontakt'],de:['Datenschutz & Cookies','Datenschutz- und Cookie-Einstellungen','Über uns & Kontakt'],cs:['Ochrana údajů a cookies','Nastavení soukromí a cookies','O nás a kontakt'],pl:['Prywatność i cookies','Ustawienia prywatności i plików cookies','O nas i kontakt'],fr:['Confidentialité et cookies','Paramètres de confidentialité et de cookies','À propos et contact'],es:['Privacidad y cookies','Configuración de privacidad y cookies','Acerca de y contacto']};

function openCs(){if(window.googlefc&&googlefc.callbackQueue&&googlefc.showRevocationMessage)googlefc.callbackQueue.push(googlefc.showRevocationMessage);else location.href='privacy.html'+(lang==='en'?'':'?lang='+lang)+'#cookies'}
document.addEventListener('click',e=>{if(e.target.closest('[data-cs]'))openCs()});
const LANGS=[['sk','Slovenčina'],['de','Deutsch'],['en','English'],['cs','Čeština'],['pl','Polski'],['fr','Français'],['es','Español']];
function syncLang(){document.getElementById('langCur').textContent=lang.toUpperCase();document.querySelectorAll('#langMenu button').forEach(b=>b.setAttribute('aria-selected',b.dataset.l===lang));footLinks();propLinks();applySeo()}
function initLang(cb){
  const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu');
  menu.innerHTML=LANGS.map(([c,n])=>`<li><button role="option" data-l="${c}"><span>${n}</span><b>${c.toUpperCase()}</b></button></li>`).join('');
  const close=()=>{menu.classList.add('hidden');btn.setAttribute('aria-expanded','false')};
  btn.addEventListener('click',e=>{e.stopPropagation();const hid=menu.classList.toggle('hidden');btn.setAttribute('aria-expanded',String(!hid))});
  menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{const u=new URL(location.href);if(lang==='en')u.searchParams.delete('lang');else u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(x){}close();cb()});
  document.addEventListener('click',close);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}

const $=id=>document.getElementById(id);
const IDX={en:0,sk:1,de:2,cs:3,pl:4,fr:5,es:6},LOC={sk:'sk-SK',de:'de-DE',en:'en-GB',cs:'cs-CZ',pl:'pl-PL',fr:'fr-FR',es:'es-ES'};
const L=k=>PIPE[k].split('|')[IDX[lang]];
const nf=(n,d=0)=>new Intl.NumberFormat(LOC[lang],{maximumFractionDigits:d}).format(n);
function baseText(){
  const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.tagName==='UL'?e.innerHTML=v:e.textContent=v});
  document.querySelectorAll('[data-p]').forEach(e=>e.textContent=L(e.dataset.p));
}
function showRes(o){$('res').classList.toggle('hidden',!o||!!o.err);$('hint').classList.toggle('hidden',!!o);$('hint').textContent=L('hint');$('err').classList.toggle('hidden',!(o&&o.err));if(o&&o.err)$('err').textContent=L(o.err);return !!o&&!o.err}
const rows=a=>a.map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');

const CURS=['EUR','USD','GBP','CZK','PLN','CHF'],DEFC={cs:'CZK',pl:'PLN'};
let cur=DEFC[lang]||'EUR',curT=false;const touched={};
try{const c=new URLSearchParams(location.search).get('cur');if(CURS.includes(c)){cur=c;curT=true}}catch(e){}
const money=(n,d=2)=>new Intl.NumberFormat(LOC[lang],{style:'currency',currency:cur,minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const sym=()=>new Intl.NumberFormat(LOC[lang],{style:'currency',currency:cur}).formatToParts(0).find(p=>p.type==='currency').value;
function setDef(defs){Object.keys(defs).forEach(id=>{if(!touched[id])$(id).value=defs[id][cur]})}
function curInit(defs,onChange){
  $('lc').innerHTML=CURS.map(c=>`<option value="${c}">${c}</option>`).join('');$('lc').value=cur;
  $('lc').addEventListener('change',e=>{cur=e.target.value;curT=true;try{const u=new URL(location.href);u.searchParams.set('cur',cur);history.replaceState(null,'',u)}catch(x){}setDef(defs);document.querySelectorAll('.cs').forEach(e=>e.textContent=sym());onChange()});
  Object.keys(defs).forEach(id=>$(id).addEventListener('input',()=>{touched[id]=true}));setDef(defs);
}
function curLang(defs){if(!curT){cur=DEFC[lang]||'EUR';$('lc').value=cur;setDef(defs)}document.querySelectorAll('.cs').forEach(e=>e.textContent=sym())}

const DEFS={vp:{EUR:.25,USD:.17,GBP:.28,CZK:5.5,PLN:1.1,CHF:.27}},KW=[2.3,3.7,7.4,11,22,50,150];let kw=11;
function hm(h){const m=Math.round(h*60);return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'}
function calcAll(){
  const ids=['vc','v0','v1','ve','vu','vp'];if(ids.some(i=>$(i).value===''||!isFinite(+$(i).value)))return null;
  const c=+$('vc').value,a=+$('v0').value,b=+$('v1').value,e=+$('ve').value,u=+$('vu').value,p=+$('vp').value;
  if(!(c>0&&c<=300&&a>=0&&a<=100&&b>0&&b<=100&&e>=50&&e<=100&&u>0&&p>=0))return null;
  if(b<=a)return {err:'sn'};
  const eb=c*(b-a)/100,eg=eb/(e/100),cost=eg*p;
  return {eb,eg,t:eg/kw,cost,rg:eb/u*100,c100:u/(e/100)*p};
}
function calc(){const o=calcAll();if(!showRes(o))return;
  $('big').textContent=money(o.cost,2);
  $('rows').innerHTML=rows([[L('eb'),nf(o.eb,1)+' kWh'],[L('eg'),nf(o.eg,1)+' kWh'],[L('tm'),hm(o.t)],[L('rg'),nf(o.rg)+' km'],[L('c100'),money(o.c100,2)]]);}
function build(){$('vk').innerHTML=KW.map(k=>`<option value="${k}" ${k===kw?'selected':''}>${nf(k,1)} kW${k>=50?' (DC)':''}</option>`).join('')}
function text(){baseText();curLang(DEFS);build();$('fbox').innerHTML=`<div><b style="color:var(--accent)">${L('eb')} = ${L('cap').split(' (')[0]} × (${L('s1').split(' (')[0]} − ${L('s0').split(' (')[0]})</b></div><div><b style="color:var(--accent)">${L('tm').split(' (')[0]} = ${L('eg')} ÷ ${L('kw')}</b></div>`;syncLang();calc()}
$('vk').addEventListener('change',e=>{kw=+e.target.value;calc()});
['vc','v0','v1','ve','vu','vp'].forEach(id=>$(id).addEventListener('input',calc));
curInit(DEFS,calc);initLang(text);text();
</script>
