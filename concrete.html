const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "Concrete Calculator", "sub": "Calculate how much concrete you need for a slab, column or strip footing.", "h1": "How to calculate concrete volume", "p1": "Volume is the area of the shape times its thickness or height. Order 5–10% extra to cover uneven ground, spillage and formwork errors.", "h2": "Formulas", "p2": "Slab: length × width × thickness. Cylinder: π × (diameter ÷ 2)² × height × number. Strip footing: length × width × depth. Ready-mix is ordered by cubic metre; one 25 kg bag of premixed concrete gives roughly 0.01 m³.", "h4": "Good to know", "lim": "<li>Slabs and driveways are usually 10–15 cm thick; footings depend on the project and the soil.</li><li>Concrete reaches design strength after about 28 days; keep it damp during the first days.</li><li>Do not pour in frost or very hot weather without proper precautions.</li>", "faqh": "Frequently asked questions", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How do I calculate the concrete needed for a slab?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Multiply length × width × thickness, with thickness converted to metres. Example: a 4 × 3 m slab that is 10 cm thick needs 4 × 3 × 0.10 = 1.2 m³, and about 1.26 m³ with a 5% reserve.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How much extra concrete should I order?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Order 5–10% extra to cover uneven ground, spillage and formwork errors. Running short in the middle of a pour causes joints and delays, which is worse than having a little left over.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Should I use premixed bags or ready-mix concrete?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">One 25 kg bag of premixed concrete gives roughly 0.01 m³, so the 1.26 m³ example needs about 121 bags. Bags suit small jobs; for larger volumes ready-mix is usually more practical. It is ordered by cubic metre, and the calculator rounds the order up to 0.25 m³ (1.5 m³ in the example).</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How much does concrete weigh?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">About 2,400 kg per cubic metre, so 1 m³ is roughly 2.4 tonnes. The 1.26 m³ example weighs about 3 tonnes, which matters for transport, formwork and the ground underneath.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How thick should a concrete slab be?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Slabs and driveways are usually 10–15 cm thick, while footings depend on the project and the soil. This is only an estimate, so follow the structural design or consult a professional.</p></details></li>", "note": "Estimate only; follow the structural design or consult a professional."}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Výpočet betónu", "sub": "Vypočítaj, koľko betónu potrebuješ na dosku, stĺp alebo pásový základ.", "h1": "Ako sa počíta objem betónu", "p1": "Objem je plocha tvaru krát hrúbka alebo výška. Objednaj o 5 – 10 % viac na nerovný podklad, rozliatie a chyby debnenia.", "h2": "Vzorce", "p2": "Doska: dĺžka × šírka × hrúbka. Valec: π × (priemer ÷ 2)² × výška × počet. Pásový základ: dĺžka × šírka × hĺbka. Betón z betonárne sa objednáva v metroch kubických; jedno 25 kg vrece suchej zmesi dá približne 0,01 m³.", "h4": "Dobré vedieť", "lim": "<li>Dosky a príjazdové cesty majú zvyčajne 10 – 15 cm; základy závisia od projektu a podložia.</li><li>Betón dosiahne projektovanú pevnosť po asi 28 dňoch; v prvých dňoch ho udržiavaj vlhký.</li><li>Nelej v mraze ani vo veľkej horúčave bez primeraných opatrení.</li>", "faqh": "Často kladené otázky", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ako vypočítam množstvo betónu na dosku?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Vynásob dĺžku × šírku × hrúbku, pričom hrúbku prepočítaj na metre. Príklad: doska 4 × 3 m s hrúbkou 10 cm potrebuje 4 × 3 × 0,10 = 1,2 m³ a s 5 % rezervou asi 1,26 m³.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Koľko betónu objednať navyše?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Objednaj o 5 až 10 % viac na pokrytie nerovného podkladu, rozliatia a chýb v debnení. Ak betón počas liatia dôjde, vznikajú škáry a zdržania, čo je horšie ako mať trochu zvyšku.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Mám použiť vrecia suchej zmesi alebo betón z betonárne?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Jedno vrece suchej zmesi s hmotnosťou 25 kg dá približne 0,01 m³, takže príklad s 1,26 m³ potrebuje asi 121 vriec. Vrecia sú vhodné na malé práce, pri väčších objemoch býva praktickejší betón z betonárne. Objednáva sa po kubíkoch a kalkulačka zaokrúhľuje objednávku na 0,25 m³ (v príklade 1,5 m³).</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Koľko váži betón?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Asi 2 400 kg na kubický meter, takže 1 m³ má približne 2,4 tony. Príklad s 1,26 m³ váži asi 3 tony, čo je dôležité pri doprave, debnení aj podloží.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Aká hrubá má byť betónová doska?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Dosky a príjazdové cesty majú obvykle hrúbku 10 až 15 cm, základy závisia od projektu a podložia. Ide len o odhad, preto sa riaď projektom statika alebo sa poraď s odborníkom.</p></details></li>", "note": "Len odhad; riaď sa statickým návrhom alebo sa poraď s odborníkom."}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Beton berechnen", "sub": "Berechne, wie viel Beton du für Platte, Säule oder Streifenfundament brauchst.", "h1": "So berechnest du das Betonvolumen", "p1": "Das Volumen ist die Fläche der Form mal Dicke oder Höhe. Bestelle 5–10 % extra für unebenen Untergrund, Verschüttetes und Schalungsfehler.", "h2": "Formeln", "p2": "Platte: Länge × Breite × Dicke. Zylinder: π × (Durchmesser ÷ 2)² × Höhe × Anzahl. Streifenfundament: Länge × Breite × Tiefe. Transportbeton wird in Kubikmetern bestellt; ein 25-kg-Sack Fertigmischung ergibt etwa 0,01 m³.", "h4": "Gut zu wissen", "lim": "<li>Platten und Einfahrten sind meist 10–15 cm dick; Fundamente hängen von Projekt und Boden ab.</li><li>Beton erreicht seine Festigkeit nach etwa 28 Tagen; halte ihn in den ersten Tagen feucht.</li><li>Betoniere nicht bei Frost oder großer Hitze ohne geeignete Vorkehrungen.</li>", "faqh": "Häufige Fragen", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie berechne ich den Betonbedarf für eine Platte?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Multipliziere Länge × Breite × Dicke, wobei die Dicke in Meter umgerechnet wird. Beispiel: Eine Platte von 4 × 3 m mit 10 cm Dicke braucht 4 × 3 × 0,10 = 1,2 m³, mit 5 % Verschnitt etwa 1,26 m³.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie viel Beton sollte ich zusätzlich bestellen?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Bestelle 5–10 % mehr, um unebenen Untergrund, Verschüttetes und Fehler in der Schalung auszugleichen. Geht der Beton mitten im Guss aus, entstehen Fugen und Verzögerungen, was schlimmer ist als ein kleiner Rest.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Soll ich Fertigmischung-Säcke oder Transportbeton verwenden?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Ein 25-kg-Sack Fertigmischung ergibt etwa 0,01 m³, das Beispiel mit 1,26 m³ braucht also rund 121 Säcke. Säcke eignen sich für kleine Arbeiten, bei größeren Mengen ist Transportbeton meist praktischer. Er wird pro Kubikmeter bestellt, und der Rechner rundet die Bestellung auf 0,25 m³ auf (im Beispiel 1,5 m³).</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie viel wiegt Beton?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Etwa 2.400 kg pro Kubikmeter, 1 m³ sind also rund 2,4 Tonnen. Das Beispiel mit 1,26 m³ wiegt etwa 3 Tonnen, was für Transport, Schalung und den Untergrund wichtig ist.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie dick sollte eine Betonplatte sein?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Platten und Einfahrten sind meist 10–15 cm dick, Fundamente richten sich nach Projekt und Boden. Das ist nur eine Schätzung, halte dich daher an die Statik oder frage eine Fachperson.</p></details></li>", "note": "Nur eine Schätzung; halte dich an die Statik oder frage eine Fachperson."}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Výpočet betonu", "sub": "Spočítej, kolik betonu potřebuješ na desku, sloup nebo pásový základ.", "h1": "Jak se počítá objem betonu", "p1": "Objem je plocha tvaru krát tloušťka nebo výška. Objednej o 5–10 % více na nerovný podklad, rozlití a chyby bednění.", "h2": "Vzorce", "p2": "Deska: délka × šířka × tloušťka. Válec: π × (průměr ÷ 2)² × výška × počet. Pásový základ: délka × šířka × hloubka. Beton z betonárny se objednává v metrech krychlových; jeden 25kg pytel suché směsi dá přibližně 0,01 m³.", "h4": "Dobré vědět", "lim": "<li>Desky a příjezdové cesty mají obvykle 10–15 cm; základy závisí na projektu a podloží.</li><li>Beton dosáhne projektované pevnosti po asi 28 dnech; v prvních dnech ho udržuj vlhký.</li><li>Nelij v mrazu ani ve velkém horku bez vhodných opatření.</li>", "faqh": "Časté otázky", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak spočítám množství betonu na desku?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Vynásob délku × šířku × tloušťku, přičemž tloušťku převeď na metry. Příklad: deska 4 × 3 m o tloušťce 10 cm potřebuje 4 × 3 × 0,10 = 1,2 m³ a s 5% rezervou asi 1,26 m³.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Kolik betonu objednat navíc?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Objednej o 5 až 10 % víc na pokrytí nerovného podkladu, rozlití a chyb v bednění. Když beton během lití dojde, vznikají spáry a zdržení, což je horší než mít trochu zbytku.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Mám použít pytle suché směsi, nebo beton z betonárny?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Jeden pytel suché směsi o hmotnosti 25 kg dá přibližně 0,01 m³, takže příklad s 1,26 m³ potřebuje asi 121 pytlů. Pytle se hodí na malé práce, u větších objemů bývá praktičtější beton z betonárny. Objednává se po metrech krychlových a kalkulačka zaokrouhluje objednávku na 0,25 m³ (v příkladu 1,5 m³).</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Kolik váží beton?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Asi 2 400 kg na metr krychlový, takže 1 m³ má přibližně 2,4 tuny. Příklad s 1,26 m³ váží asi 3 tuny, což je důležité při dopravě, bednění i podloží.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak silná má být betonová deska?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Desky a příjezdové cesty mívají tloušťku 10 až 15 cm, základy závisejí na projektu a podloží. Jde jen o odhad, proto se řiď projektem statika nebo se poraď s odborníkem.</p></details></li>", "note": "Pouze odhad; řiď se statickým návrhem nebo se poraď s odborníkem."}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Kalkulator betonu", "sub": "Oblicz, ile betonu potrzebujesz na płytę, słup lub ławę fundamentową.", "h1": "Jak obliczyć objętość betonu", "p1": "Objętość to pole kształtu razy grubość lub wysokość. Zamów o 5–10 % więcej na nierówne podłoże, rozlanie i błędy szalunku.", "h2": "Wzory", "p2": "Płyta: długość × szerokość × grubość. Walec: π × (średnica ÷ 2)² × wysokość × liczba. Ława fundamentowa: długość × szerokość × głębokość. Beton towarowy zamawia się w metrach sześciennych; jeden worek suchej mieszanki 25 kg daje około 0,01 m³.", "h4": "Warto wiedzieć", "lim": "<li>Płyty i podjazdy mają zwykle 10–15 cm grubości; fundamenty zależą od projektu i gruntu.</li><li>Beton osiąga projektową wytrzymałość po około 28 dniach; w pierwszych dniach utrzymuj go wilgotnym.</li><li>Nie betonuj w mróz ani w upał bez odpowiednich zabezpieczeń.</li>", "faqh": "Najczęstsze pytania", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak obliczyć ilość betonu na płytę?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Pomnóż długość × szerokość × grubość, przeliczając grubość na metry. Przykład: płyta 4 × 3 m o grubości 10 cm wymaga 4 × 3 × 0,10 = 1,2 m³, a z 5% zapasem około 1,26 m³.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ile betonu zamówić z zapasem?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Zamów o 5–10% więcej, aby pokryć nierówne podłoże, rozlanie i błędy w deskowaniu. Gdy beton skończy się w trakcie wylewania, powstają przerwy robocze i opóźnienia, co jest gorsze niż niewielka nadwyżka.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Czy użyć worków suchej mieszanki, czy betonu towarowego?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Jeden worek suchej mieszanki o masie 25 kg daje około 0,01 m³, więc przykład z 1,26 m³ wymaga około 121 worków. Worki nadają się do małych prac, przy większych ilościach zwykle praktyczniejszy jest beton towarowy. Zamawia się go w metrach sześciennych, a kalkulator zaokrągla zamówienie do 0,25 m³ (w przykładzie 1,5 m³).</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ile waży beton?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Około 2 400 kg na metr sześcienny, więc 1 m³ to około 2,4 tony. Przykład z 1,26 m³ waży około 3 tony, co ma znaczenie przy transporcie, deskowaniu i podłożu.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak gruba powinna być płyta betonowa?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Płyty i podjazdy mają zwykle 10–15 cm grubości, a fundamenty zależą od projektu i gruntu. To tylko szacunek, dlatego kieruj się projektem konstrukcyjnym lub skonsultuj się ze specjalistą.</p></details></li>", "note": "Tylko szacunek; kieruj się projektem konstrukcyjnym lub zapytaj specjalistę."}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calcul de béton", "sub": "Calculez la quantité de béton nécessaire pour une dalle, un poteau ou une semelle filante.", "h1": "Comment calculer le volume de béton", "p1": "Le volume est la surface de la forme multipliée par l’épaisseur ou la hauteur. Prévoyez 5 à 10 % de plus pour un sol irrégulier, les pertes et les erreurs de coffrage.", "h2": "Formules", "p2": "Dalle : longueur × largeur × épaisseur. Cylindre : π × (diamètre ÷ 2)² × hauteur × nombre. Semelle filante : longueur × largeur × profondeur. Le béton prêt à l’emploi se commande au mètre cube ; un sac de 25 kg de mélange prêt donne environ 0,01 m³.", "h4": "Bon à savoir", "lim": "<li>Les dalles et allées font en général 10 à 15 cm d’épaisseur ; les fondations dépendent du projet et du sol.</li><li>Le béton atteint sa résistance après environ 28 jours ; gardez-le humide les premiers jours.</li><li>Ne coulez pas par gel ou forte chaleur sans précautions adaptées.</li>", "faqh": "Questions fréquentes", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Comment calculer le béton nécessaire pour une dalle ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Multipliez longueur × largeur × épaisseur, en convertissant l’épaisseur en mètres. Exemple : une dalle de 4 × 3 m de 10 cm d’épaisseur demande 4 × 3 × 0,10 = 1,2 m³, soit environ 1,26 m³ avec 5 % de marge.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Quelle marge de béton prévoir en plus ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Prévoyez 5 à 10 % de plus pour compenser un terrain irrégulier, les pertes et les erreurs de coffrage. Manquer de béton en plein coulage crée des joints et des retards, ce qui est pire qu’un petit reste.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Faut-il utiliser des sacs de mélange prêt ou du béton prêt à l’emploi ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Un sac de 25 kg de mélange prêt donne environ 0,01 m³ ; l’exemple de 1,26 m³ demande donc environ 121 sacs. Les sacs conviennent aux petits travaux, pour de plus gros volumes le béton prêt à l’emploi est généralement plus pratique. Il se commande au mètre cube, et le calculateur arrondit la commande à 0,25 m³ (1,5 m³ dans l’exemple).</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Combien pèse le béton ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Environ 2 400 kg par mètre cube, soit 1 m³ pour à peu près 2,4 tonnes. L’exemple de 1,26 m³ pèse environ 3 tonnes, ce qui compte pour le transport, le coffrage et le sol.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Quelle épaisseur pour une dalle en béton ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Les dalles et les allées font généralement 10 à 15 cm d’épaisseur, tandis que les fondations dépendent du projet et du sol. Ce n’est qu’une estimation : suivez le dossier de structure ou consultez un professionnel.</p></details></li>", "note": "Estimation uniquement ; suivez le plan de structure ou consultez un professionnel."}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Calculadora de hormigón", "sub": "Calcula cuánto hormigón necesitas para una losa, una columna o una zapata corrida.", "h1": "Cómo calcular el volumen de hormigón", "p1": "El volumen es el área de la forma por el espesor o la altura. Pide un 5–10 % más para cubrir terreno irregular, derrames y errores de encofrado.", "h2": "Fórmulas", "p2": "Losa: longitud × anchura × espesor. Cilindro: π × (diámetro ÷ 2)² × altura × cantidad. Zapata corrida: longitud × anchura × profundidad. El hormigón preparado se pide por metro cúbico; un saco de 25 kg de mezcla da aproximadamente 0,01 m³.", "h4": "Conviene saber", "lim": "<li>Las losas y accesos suelen tener 10–15 cm de espesor; las cimentaciones dependen del proyecto y del suelo.</li><li>El hormigón alcanza su resistencia a los 28 días aproximadamente; mantenlo húmedo los primeros días.</li><li>No hormigones con heladas o calor extremo sin las precauciones adecuadas.</li>", "faqh": "Preguntas frecuentes", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Cómo calculo el hormigón necesario para una losa?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Multiplica largo × ancho × espesor, pasando el espesor a metros. Ejemplo: una losa de 4 × 3 m con 10 cm de espesor necesita 4 × 3 × 0,10 = 1,2 m³, y unos 1,26 m³ con un 5 % de margen.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Cuánto hormigón extra debo pedir?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Pide entre un 5 y un 10 % más para cubrir un terreno irregular, derrames y errores del encofrado. Quedarse corto en pleno vertido genera juntas y retrasos, lo cual es peor que tener un pequeño sobrante.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Uso sacos de mezcla o hormigón preparado?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Un saco de mezcla de 25 kg rinde aproximadamente 0,01 m³, así que el ejemplo de 1,26 m³ necesita unos 121 sacos. Los sacos sirven para trabajos pequeños; para volúmenes mayores suele ser más práctico el hormigón preparado. Se pide por metro cúbico y la calculadora redondea el pedido a 0,25 m³ (1,5 m³ en el ejemplo).</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Cuánto pesa el hormigón?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Unos 2400 kg por metro cúbico, es decir, 1 m³ pesa aproximadamente 2,4 toneladas. El ejemplo de 1,26 m³ pesa unas 3 toneladas, algo importante para el transporte, el encofrado y el terreno.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Qué espesor debe tener una losa de hormigón?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Las losas y los accesos suelen tener entre 10 y 15 cm de espesor, mientras que las zapatas dependen del proyecto y del suelo. Es solo una estimación, así que sigue el proyecto estructural o consulta a un profesional.</p></details></li>", "note": "Solo una estimación; sigue el proyecto estructural o consulta a un profesional."}};

const $=id=>document.getElementById(id);
const IDX={en:0,sk:1,de:2,cs:3,pl:4,fr:5,es:6},LOC={sk:'sk-SK',de:'de-DE',en:'en-GB',cs:'cs-CZ',pl:'pl-PL',fr:'fr-FR',es:'es-ES'};

const nf=(n,d=0)=>new Intl.NumberFormat(LOC[lang],{maximumFractionDigits:d}).format(n);
function baseText(){
  const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.tagName==='UL'?e.innerHTML=v:e.textContent=v});

function showRes(o){$('res').classList.toggle('hidden',!o||!!o.err);$('hint').classList.toggle('hidden',!!o);$('hint').textContent=L('hint');$('err').classList.toggle('hidden',!(o&&o.err));if(o&&o.err)$('err').textContent=L(o.err);return !!o&&!o.err}
const rows=a=>a.map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');

const SH={sl:{k:['len','wid','thk'],d:[4,3,10]},cy:{k:['dia','hgt','qty'],d:[30,3,4]},st:{k:['len','wcm','dep'],d:[12,40,60]}};
let shape='sl';
function calcAll(){
  const a=+$('a1').value,b=+$('a2').value,c=+$('a3').value,w=+$('cw').value;
  if(['a1','a2','a3','cw'].some(id=>$(id).value===''||!isFinite(+$(id).value)))return null;
  if(!(a>0&&b>0&&c>0&&w>=0&&w<=100&&a<=1000&&b<=1000&&c<=1000))return null;
  const v=shape==='sl'?a*b*c/100:shape==='cy'?Math.PI*Math.pow(a/200,2)*b*c:a*(b/100)*(c/100),vw=v*(1+w/100),kg=vw*2400;
  return {v,vw,t:kg/1000,bags:Math.ceil(kg/25),rm:Math.ceil(vw/0.25)*0.25};
}
function fig(){
  const a=+$('a1').value,b=+$('a2').value,c=+$('a3').value,n=v=>nf(v,2),P=p=>p.map(q=>q.join(',')).join(' ');
  const ST='stroke="rgba(255,255,255,.4)" stroke-width="1" stroke-linejoin="round"',DM='fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"',TX='font-size="12" fill="#cbd2e0" font-family="inherit"';
  const box=(x,y,W,dx,dy,T)=>`<g ${ST}><polygon points="${P([[x,y],[x+dx,y-dy],[x+W+dx,y-dy],[x+W,y]])}" fill="rgba(255,255,255,.26)"/><polygon points="${P([[x,y],[x+W,y],[x+W,y+T],[x,y+T]])}" fill="rgba(255,255,255,.15)"/><polygon points="${P([[x+W,y],[x+W+dx,y-dy],[x+W+dx,y-dy+T],[x+W,y+T]])}" fill="rgba(255,255,255,.07)"/></g>`;
  const hd=(x1,x2,y)=>`M${x1} ${y}H${x2}M${x1} ${y-4}V${y+4}M${x2} ${y-4}V${y+4}`,vd=(x,y1,y2)=>`M${x} ${y1}V${y2}M${x-4} ${y1}H${x+4}M${x-4} ${y2}H${x+4}`;
  let g='',lab;
  if(shape==='cy'){
    const cx=170,rx=34,ry=11,t=40,bt=140,q=Math.round(+$('a3').value);
    g=`<g ${ST}><path d="M${cx-rx} ${t}V${bt}A${rx} ${ry} 0 0 0 ${cx+rx} ${bt}V${t}Z" fill="rgba(255,255,255,.15)"/><ellipse cx="${cx}" cy="${t}" rx="${rx}" ry="${ry}" fill="rgba(255,255,255,.26)"/></g>`
     +`<path ${DM} d="${hd(cx-rx,cx+rx,bt+ry+14)}${vd(cx-rx-24,t,bt)}"/>`
     +`<text ${TX} x="${cx}" y="${bt+ry+34}" text-anchor="middle">Ø ${n(a)} cm</text><text ${TX} x="${cx-rx-32}" y="${(t+bt)/2+4}" text-anchor="end">${n(b)} m</text>`
     +(q>1?`<text x="${cx+rx+36}" y="${(t+bt)/2+8}" font-size="24" font-weight="700" fill="var(--accent)" font-family="inherit">× ${nf(q)}</text>`:'');
    lab=`Ø ${n(a)} cm, ${n(b)} m, × ${nf(q)}`;
  }else{
    const st=shape==='st',x=60,y=st?92:84,W=st?190:170,dx=st?26:52,dy=st?14:26,T=st?34:Math.min(36,Math.max(10,Math.round(150*(c/100)/a*2.5)));
    const l1=n(a)+' m',l2=st?n(b)+' cm':n(b)+' m',l3=n(c)+' cm',by=y+T+18,mx=x+W+dx/2+10,my=y-dy/2+T+4;
    g=box(x,y,W,dx,dy,T)

function calc(){const o=calcAll();if(!showRes(o))return;
