const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "Currency Converter", "sub": "Convert between 30 currencies using European Central Bank reference rates, with a 90-day trend chart.", "h1": "How exchange rates work", "p1": "An exchange rate tells you how much of one currency you get for one unit of another. Rates move constantly with supply and demand on the foreign-exchange market, influenced by interest rates, inflation, trade and news. To convert, multiply the amount by the rate; to go the other way, divide by it.", "h2": "Where the rates come from", "p2": "This converter uses the euro foreign exchange reference rates published by the European Central Bank, delivered through the free Frankfurter service. They are updated once per working day, around 16:00 Central European Time, and cover about 30 currencies. On weekends and holidays the latest published rate is shown. Rates between two non-euro currencies are calculated through the euro.", "h4": "Good to know", "lim": "<li>These are reference rates, not live trading prices, and they are not suitable for trading.</li><li>Banks, card providers and exchange offices use their own rates and add fees or a margin, so the amount you actually receive will usually be lower.</li><li>When paying by card or withdrawing cash abroad, choose to be charged in the local currency; “dynamic currency conversion” in your home currency is usually more expensive.</li><li>Only currencies covered by the ECB are available. Others, such as the Russian rouble or many African currencies, are not included.</li>", "note": "Results are indicative only and not financial advice."}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Prevodník mien", "sub": "Prepočítaj 30 mien podľa referenčných kurzov Európskej centrálnej banky, s grafom vývoja za 90 dní.", "h1": "Ako fungujú výmenné kurzy", "p1": "Výmenný kurz hovorí, koľko jednej meny dostaneš za jednu jednotku druhej. Kurzy sa neustále menia podľa ponuky a dopytu na devízovom trhu a ovplyvňujú ich úrokové sadzby, inflácia, obchod aj správy. Pri prevode sumu vynásobíš kurzom, opačným smerom ním delíš.", "h2": "Odkiaľ sú kurzy", "p2": "Prevodník používa referenčné devízové kurzy eura, ktoré zverejňuje Európska centrálna banka a sprostredkúva ich bezplatná služba Frankfurter. Aktualizujú sa raz za pracovný deň okolo 16:00 stredoeurópskeho času a zahŕňajú približne 30 mien. Cez víkendy a sviatky sa zobrazuje posledný zverejnený kurz. Kurzy medzi dvoma menami mimo eura sa počítajú cez euro.", "h4": "Dobré vedieť", "lim": "<li>Ide o referenčné kurzy, nie o živé obchodné ceny, a nie sú vhodné na obchodovanie.</li><li>Banky, poskytovatelia kariet a zmenárne používajú vlastné kurzy a pridávajú poplatky alebo maržu, takže suma, ktorú skutočne dostaneš, bude zvyčajne nižšia.</li><li>Pri platbe kartou alebo výbere hotovosti v zahraničí zvoľ účtovanie v mene krajiny; „dynamická konverzia meny“ do domácej meny je zvyčajne drahšia.</li><li>Dostupné sú len meny, ktoré pokrýva ECB. Iné, napríklad ruský rubeľ alebo mnohé africké meny, tu nie sú.</li>", "note": "Výsledky sú len orientačné a nie sú finančným poradenstvom."}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Währungsrechner", "sub": "Rechne 30 Währungen mit den Referenzkursen der Europäischen Zentralbank um, mit 90-Tage-Verlaufsdiagramm.", "h1": "So funktionieren Wechselkurse", "p1": "Ein Wechselkurs sagt, wie viel einer Währung du für eine Einheit einer anderen bekommst. Kurse bewegen sich ständig mit Angebot und Nachfrage am Devisenmarkt und werden von Zinsen, Inflation, Handel und Nachrichten beeinflusst. Zum Umrechnen multiplizierst du den Betrag mit dem Kurs, in die andere Richtung teilst du durch ihn.", "h2": "Woher die Kurse stammen", "p2": "Dieser Umrechner nutzt die Euro-Referenzkurse der Europäischen Zentralbank, die über den kostenlosen Dienst Frankfurter bereitgestellt werden. Sie werden einmal pro Werktag gegen 16:00 Uhr mitteleuropäischer Zeit aktualisiert und umfassen etwa 30 Währungen. An Wochenenden und Feiertagen wird der zuletzt veröffentlichte Kurs angezeigt. Kurse zwischen zwei Nicht-Euro-Währungen werden über den Euro berechnet.", "h4": "Gut zu wissen", "lim": "<li>Es handelt sich um Referenzkurse, nicht um Live-Handelspreise, und sie eignen sich nicht für den Handel.</li><li>Banken, Kartenanbieter und Wechselstuben verwenden eigene Kurse und erheben Gebühren oder Aufschläge, daher ist der tatsächlich erhaltene Betrag meist niedriger.</li><li>Beim Bezahlen mit Karte oder Geldabheben im Ausland solltest du die Abrechnung in der Landeswährung wählen; die „dynamische Währungsumrechnung“ in deine Heimatwährung ist meist teurer.</li><li>Es sind nur Währungen verfügbar, die die EZB abdeckt. Andere, etwa der russische Rubel oder viele afrikanische Währungen, fehlen.</li>", "note": "Die Ergebnisse sind nur Richtwerte und keine Finanzberatung."}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Převodník měn", "sub": "Přepočítej 30 měn podle referenčních kurzů Evropské centrální banky, s grafem vývoje za 90 dní.", "h1": "Jak fungují směnné kurzy", "p1": "Směnný kurz říká, kolik jedné měny dostaneš za jednu jednotku druhé. Kurzy se neustále mění podle nabídky a poptávky na devizovém trhu a ovlivňují je úrokové sazby, inflace, obchod i zprávy. Při převodu částku vynásobíš kurzem, opačným směrem jím dělíš.", "h2": "Odkud jsou kurzy", "p2": "Převodník používá referenční devizové kurzy eura, které zveřejňuje Evropská centrální banka a zprostředkovává je bezplatná služba Frankfurter. Aktualizují se jednou za pracovní den kolem 16:00 středoevropského času a zahrnují přibližně 30 měn. O víkendech a svátcích se zobrazuje poslední zveřejněný kurz. Kurzy mezi dvěma měnami mimo euro se počítají přes euro.", "h4": "Dobré vědět", "lim": "<li>Jde o referenční kurzy, nikoli o živé obchodní ceny, a nejsou vhodné pro obchodování.</li><li>Banky, poskytovatelé karet a směnárny používají vlastní kurzy a přidávají poplatky nebo marži, takže částka, kterou skutečně dostaneš, bude obvykle nižší.</li><li>Při platbě kartou nebo výběru hotovosti v zahraničí zvol účtování v měně dané země; „dynamická konverze měny“ do domácí měny bývá dražší.</li><li>Jsou dostupné jen měny, které pokrývá ECB. Jiné, například ruský rubl nebo mnohé africké měny, zde nejsou.</li>", "note": "Výsledky jsou pouze orientační a nejsou finančním poradenstvím."}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Przelicznik walut", "sub": "Przeliczaj 30 walut według kursów referencyjnych Europejskiego Banku Centralnego, z wykresem trendu z 90 dni.", "h1": "Jak działają kursy walut", "p1": "Kurs waluty mówi, ile jednej waluty dostaniesz za jednostkę innej. Kursy zmieniają się stale wraz z podażą i popytem na rynku walutowym, a wpływają na nie stopy procentowe, inflacja, handel i wiadomości. Aby przeliczyć, mnożysz kwotę przez kurs, a w drugą stronę dzielisz przez niego.", "h2": "Skąd pochodzą kursy", "p2": "Przelicznik korzysta z referencyjnych kursów wymiany euro publikowanych przez Europejski Bank Centralny, udostępnianych przez bezpłatną usługę Frankfurter. Są aktualizowane raz na dzień roboczy około godziny 16:00 czasu środkowoeuropejskiego i obejmują około 30 walut. W weekendy i święta wyświetlany jest ostatni opublikowany kurs. Kursy między dwiema walutami innymi niż euro są liczone przez euro.", "h4": "Warto wiedzieć", "lim": "<li>To kursy referencyjne, a nie ceny handlowe na żywo, i nie nadają się do handlu.</li><li>Banki, wydawcy kart i kantory stosują własne kursy oraz dodają opłaty lub marżę, więc kwota, którą faktycznie otrzymasz, zwykle będzie niższa.</li><li>Przy płaceniu kartą lub wypłacie gotówki za granicą wybierz rozliczenie w walucie lokalnej; „dynamiczna konwersja walut” na walutę krajową zwykle jest droższa.</li><li>Dostępne są tylko waluty obejmowane przez EBC. Innych, na przykład rubla rosyjskiego czy wielu walut afrykańskich, tu nie ma.</li>", "note": "Wyniki mają charakter orientacyjny i nie stanowią porady finansowej."}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Convertisseur de devises", "sub": "Convertissez 30 devises avec les cours de référence de la Banque centrale européenne, avec un graphique sur 90 jours.", "h1": "Comment fonctionnent les taux de change", "p1": "Un taux de change indique combien vous obtenez d’une devise pour une unité d’une autre. Les taux varient en permanence selon l’offre et la demande sur le marché des changes, sous l’influence des taux d’intérêt, de l’inflation, du commerce et de l’actualité. Pour convertir, on multiplie le montant par le taux ; dans l’autre sens, on divise.", "h2": "D’où viennent les taux", "p2": "Ce convertisseur utilise les cours de référence de l’euro publiés par la Banque centrale européenne, fournis par le service gratuit Frankfurter. Ils sont mis à jour une fois par jour ouvré vers 16 h, heure de l’Europe centrale, et couvrent une trentaine de devises. Le week-end et les jours fériés, le dernier cours publié est affiché. Les taux entre deux devises hors euro sont calculés via l’euro.", "h4": "Bon à savoir", "lim": "<li>Ce sont des cours de référence, pas des prix de marché en direct, et ils ne conviennent pas au trading.</li><li>Les banques, émetteurs de cartes et bureaux de change appliquent leurs propres taux et ajoutent des frais ou une marge ; le montant réellement reçu est donc généralement inférieur.</li><li>Pour payer par carte ou retirer de l’argent à l’étranger, choisissez d’être débité dans la devise locale ; la « conversion dynamique de devise » dans votre monnaie est généralement plus chère.</li><li>Seules les devises couvertes par la BCE sont disponibles. D’autres, comme le rouble russe ou de nombreuses devises africaines, n’y figurent pas.</li>", "note": "Les résultats sont indicatifs et ne constituent pas un conseil financier."}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Conversor de divisas", "sub": "Convierte 30 monedas con los tipos de referencia del Banco Central Europeo, con un gráfico de 90 días.", "h1": "Cómo funcionan los tipos de cambio", "p1": "Un tipo de cambio indica cuánto obtienes de una moneda por una unidad de otra. Los tipos se mueven constantemente con la oferta y la demanda del mercado de divisas y los influyen los tipos de interés, la inflación, el comercio y las noticias. Para convertir, multiplicas el importe por el tipo; en sentido contrario, divides.", "h2": "De dónde vienen los tipos", "p2": "Este conversor usa los tipos de cambio de referencia del euro que publica el Banco Central Europeo, proporcionados por el servicio gratuito Frankfurter. Se actualizan una vez por día laborable hacia las 16:00 (hora de Europa central) y cubren unas 30 monedas. En fines de semana y festivos se muestra el último tipo publicado. Los tipos entre dos monedas distintas del euro se calculan a través del euro.", "h4": "Conviene saber", "lim": "<li>Son tipos de referencia, no precios de mercado en directo, y no sirven para operar.</li><li>Los bancos, emisores de tarjetas y casas de cambio usan sus propios tipos y añaden comisiones o margen, por lo que lo que recibes suele ser menos.</li><li>Al pagar con tarjeta o sacar efectivo en el extranjero, elige que te cobren en la moneda local; la «conversión dinámica de divisas» a tu moneda suele ser más cara.</li><li>Solo están disponibles las monedas que cubre el BCE. Otras, como el rublo ruso o muchas monedas africanas, no figuran.</li>", "note": "Los resultados son orientativos y no constituyen asesoramiento financiero."}};

function spark(arr){

  const vs=arr.map(a=>a[1]),mn=Math.min(...vs),mx=Math.max(...vs),W=300,H=70,p=4;
  const x=i=>p+i*(W-2*p)/(arr.length-1),y=v=>mx===mn?H/2:H-p-(v-mn)/(mx-mn)*(H-2*p);
  const pts=vs.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  const ch=(vs[vs.length-1]-vs[0])/vs[0]*100;
  return `<p class="mb-1 text-xs" style="color:#667085">${L('trend')}</p><svg viewBox="0 0 ${W} ${H}" class="w-full" preserveAspectRatio="none" style="height:80px"><polygon points="${p},${H} ${pts} ${W-p},${H}" style="fill:rgba(var(--accent-rgb),.12)"/><polyline points="${pts}" fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><div class="mt-2 flex flex-wrap justify-between gap-2 text-xs" style="color:#8b94a7"><span>${L('lo')}: <b class="text-white">${nf(mn,4)}</b></span><span>${L('hi')}: <b class="text-white">${nf(mx,4)}</b></span><span>${L('chg')}: <b class="text-white">${ch>0?'+':''}${nf(ch,2)} %</b></span></div>`;
}

  $('mbox').classList.toggle('hidden',status!=='error');
  const ok=status==='ok';
  $('eurl').innerHTML=ok?POP2.filter(c=>rates[c]).map(c=>`<div class="stat"><span>1 EUR → ${c}</span><b>${nf(rates[c],4)}</b></div>`).join(''):'';
  calc();
}
function calc(){
  const raw=$('fa').value,a=+raw,r=rate(from,to),valid=raw!==''&&isFinite(a)&&a>=0&&r>0;
  $('res').classList.toggle('hidden',!valid);$('hint').classList.toggle('hidden',valid);$('hint').textContent=L('hint');
  $('popt').innerHTML='';
  if(!valid)return;
  $('l1').textContent=`${money(a,from)} =`;
  $('big').textContent=money(a*r,to);
  $('l2').textContent=`1 ${from} = ${nf(r)} ${to}  ·  1 ${to} = ${nf(1/r)} ${from}`;
  $('chart').innerHTML=spark(series[from+to]);
  if(rates)$('popt').innerHTML=POP.filter(c=>c!==from&&rates[c]).map(c=>`<button class="urow" data-c="${c}"><span><b class="text-white">${c}</b> ${nm(c)}</span><span class="v">${money(a*rates[c]/rates[from],c)}</span></button>`).join('');
}
async function getJSON(url){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}
async function load(){
  status='loading';ui();
  try{const d=await getJSON('https://api.frankfurter.dev/v1/latest?base=EUR');const r={EUR:1};CURS.forEach(c=>{const v=+(d.rates||{})[c];if(v>0)r[c]=v});if(Object.keys(r).length<3)throw new Error('empty');rates=r;rdate=d.date;status='ok'}catch(e){status=rates?'ok':'error'}
  if(rates){if(!rates[from])from='EUR';if(!rates[to])to='USD'}
  buildSel();ui();loadSeries();
}
async function loadSeries(){
  if(from===to||status!=='ok')return;const key=from+to;if(series[key])return;
  try{const end=new Date(),st=new Date(end.getTime()-90*864e5),iso=d=>d.toISOString().slice(0,10);
    const d=await getJSON(`https://api.frankfurter.dev/v1/${iso(st)}..${iso(end)}?base=${from}&symbols=${to}`);
    const arr=Object.keys(d.rates||{}).sort().map(k=>[k,d.rates[k][to]]).filter(a=>a[1]>0);
    if(arr.length>1){series[key]=arr;if(from+to===key)calc()}}catch(e){}
}
const setPair=(a,b)=>{from=a;to=b;$('cf').value=from;$('ct').value=to;calc();loadSeries()};
$('fa').addEventListener('input',calc);$('mr').addEventListener('input',calc);
$('cf').addEventListener('change',e=>{from=e.target.value;calc();loadSeries()});
$('ct').addEventListener('change',e=>{to=e.target.value;calc();loadSeries()});
$('sw').addEventListener('click',()=>setPair(to,from));
$('pairs').addEventListener('click',e=>{const b=e.target.closest('[data-pr]');if(b){const p=PAIRS[+b.dataset.pr];setPair(p[0],p[1])}});
$('popt').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){to=b.dataset.c;$('ct').value=to;calc();loadSeries()}});
initLang(text);text();load();
</script>
