const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "Roof Pitch Calculator", "sub": "Convert between angle, slope percentage and ratio, and get the rafter length and roof area.", "h1": "What is roof pitch?", "p1": "Roof pitch (slope) describes how steep a roof is. It is given as an angle in degrees, as a percentage (rise per 100 units of run) or as a ratio such as 6:12 (6 units of rise for every 12 of run).", "h2": "Formulas", "p2": "Angle = arctan(rise ÷ run). Percentage = rise ÷ run × 100. Rafter length = (half the span + overhang) ÷ cos(angle). Roof area (gable) = 2 × rafter length × (building length + 2 × overhang).", "h4": "Good to know", "lim": "<li>The minimum pitch depends on the roofing material and manufacturer; lower pitches need extra waterproofing.</li><li>Steeper roofs shed rain and snow better but need more material and cost more.</li><li>Local building rules and snow loads may set minimum or maximum pitches; check them before planning.</li>", "note": "Estimate only; consult a roofer or structural engineer."}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Kalkulačka sklonu strechy", "sub": "Prepočítaj medzi uhlom, sklonom v percentách a pomerom a zisti dĺžku krokvy a plochu strechy.", "h1": "Čo je sklon strechy?", "p1": "Sklon strechy hovorí, aká je strecha strmá. Udáva sa ako uhol v stupňoch, v percentách (prevýšenie na 100 jednotiek vodorovnej dĺžky) alebo ako pomer, napríklad 6:12 (6 jednotiek prevýšenia na 12 vodorovne).", "h2": "Vzorce", "p2": "Uhol = arctan(prevýšenie ÷ priemet). Percentá = prevýšenie ÷ priemet × 100. Dĺžka krokvy = (polovica rozpätia + presah) ÷ cos(uhol). Plocha strechy (sedlová) = 2 × dĺžka krokvy × (dĺžka budovy + 2 × presah).", "h4": "Dobré vedieť", "lim": "<li>Minimálny sklon závisí od krytiny a výrobcu; nižšie sklony potrebujú doplnkovú hydroizoláciu.</li><li>Strmšie strechy lepšie odvádzajú dážď a sneh, ale potrebujú viac materiálu a stoja viac.</li><li>Miestne stavebné predpisy a zaťaženie snehom môžu určovať minimálny alebo maximálny sklon; over ich pred plánovaním.</li>", "note": "Len odhad; poraď sa so strechárom alebo statikom."}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Dachneigung-Rechner", "sub": "Rechne zwischen Winkel, Neigung in Prozent und Verhältnis um und erhalte Sparrenlänge und Dachfläche.", "h1": "Was ist die Dachneigung?", "p1": "Die Dachneigung beschreibt, wie steil ein Dach ist. Sie wird als Winkel in Grad, in Prozent (Höhe pro 100 Einheiten Länge) oder als Verhältnis wie 6:12 (6 Einheiten Höhe auf 12 Einheiten Länge) angegeben.", "h2": "Formeln", "p2": "Winkel = arctan(Höhe ÷ Länge). Prozent = Höhe ÷ Länge × 100. Sparrenlänge = (halbe Gebäudebreite + Überstand) ÷ cos(Winkel). Dachfläche (Satteldach) = 2 × Sparrenlänge × (Gebäudelänge + 2 × Überstand).", "h4": "Gut zu wissen", "lim": "<li>Die Mindestneigung hängt von Eindeckung und Hersteller ab; flachere Neigungen brauchen zusätzliche Abdichtung.</li><li>Steilere Dächer leiten Regen und Schnee besser ab, brauchen aber mehr Material und kosten mehr.</li><li>Örtliche Bauvorschriften und Schneelasten können Mindest- oder Höchstneigungen festlegen; prüfe sie vor der Planung.</li>", "note": "Nur eine Schätzung; frage einen Dachdecker oder Statiker."}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Kalkulačka sklonu střechy", "sub": "Převeď mezi úhlem, sklonem v procentech a poměrem a zjisti délku krokve a plochu střechy.", "h1": "Co je sklon střechy?", "p1": "Sklon střechy říká, jak je střecha strmá. Udává se jako úhel ve stupních, v procentech (převýšení na 100 jednotek vodorovné délky) nebo jako poměr, například 6:12 (6 jednotek převýšení na 12 vodorovně).", "h2": "Vzorce", "p2": "Úhel = arctan(převýšení ÷ průmět). Procenta = převýšení ÷ průmět × 100. Délka krokve = (polovina rozpětí + přesah) ÷ cos(úhel). Plocha střechy (sedlová) = 2 × délka krokve × (délka budovy + 2 × přesah).", "h4": "Dobré vědět", "lim": "<li>Minimální sklon závisí na krytině a výrobci; nižší sklony potřebují doplňkovou hydroizolaci.</li><li>Strmější střechy lépe odvádějí déšť a sníh, ale potřebují více materiálu a stojí více.</li><li>Místní stavební předpisy a zatížení sněhem mohou určovat minimální nebo maximální sklon; ověř je před plánováním.</li>", "note": "Pouze odhad; poraď se s klempířem nebo statikem."}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Kalkulator spadku dachu", "sub": "Przeliczaj między kątem, nachyleniem w procentach i stosunkiem oraz poznaj długość krokwi i powierzchnię dachu.", "h1": "Czym jest spadek dachu?", "p1": "Spadek dachu opisuje, jak stromy jest dach. Podaje się go jako kąt w stopniach, w procentach (wzniesienie na 100 jednostek długości poziomej) lub jako stosunek, na przykład 6:12 (6 jednostek wzniesienia na 12 w poziomie).", "h2": "Wzory", "p2": "Kąt = arctan(wzniesienie ÷ rozpiętość). Procent = wzniesienie ÷ rozpiętość × 100. Długość krokwi = (połowa rozpiętości + okap) ÷ cos(kąt). Powierzchnia dachu (dwuspadowego) = 2 × długość krokwi × (długość budynku + 2 × okap).", "h4": "Warto wiedzieć", "lim": "<li>Minimalny spadek zależy od pokrycia i producenta; mniejsze spadki wymagają dodatkowej hydroizolacji.</li><li>Bardziej strome dachy lepiej odprowadzają deszcz i śnieg, ale wymagają więcej materiału i kosztują więcej.</li><li>Lokalne przepisy budowlane i obciążenie śniegiem mogą określać minimalny lub maksymalny spadek; sprawdź je przed planowaniem.</li>", "note": "Tylko szacunek; skonsultuj się z dekarzem lub konstruktorem."}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calculateur de pente de toit", "sub": "Convertissez entre angle, pente en pourcentage et rapport, et obtenez la longueur du chevron et la surface du toit.", "h1": "Qu’est-ce que la pente d’un toit ?", "p1": "La pente d’un toit décrit son inclinaison. Elle s’exprime en degrés, en pourcentage (hauteur pour 100 unités de portée) ou sous forme de rapport comme 6:12 (6 unités de hauteur pour 12 de portée).", "h2": "Formules", "p2": "Angle = arctan(hauteur ÷ portée). Pourcentage = hauteur ÷ portée × 100. Longueur du chevron = (demi-largeur du bâtiment + débord) ÷ cos(angle). Surface du toit (à deux pans) = 2 × longueur du chevron × (longueur du bâtiment + 2 × débord).", "h4": "Bon à savoir", "lim": "<li>La pente minimale dépend de la couverture et du fabricant ; les faibles pentes demandent une étanchéité supplémentaire.</li><li>Les toits plus pentus évacuent mieux pluie et neige, mais demandent plus de matériaux et coûtent plus cher.</li><li>Les règles locales de construction et les charges de neige peuvent imposer une pente minimale ou maximale ; vérifiez-les avant de planifier.</li>", "note": "Estimation uniquement ; consultez un couvreur ou un ingénieur structure."}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Calculadora de pendiente del tejado", "sub": "Convierte entre ángulo, porcentaje y relación, y obtén la longitud del cabio y la superficie del tejado.", "h1": "¿Qué es la pendiente del tejado?", "p1": "La pendiente del tejado describe lo inclinado que es. Se expresa como ángulo en grados, como porcentaje (altura por cada 100 unidades de luz) o como relación, por ejemplo 6:12 (6 unidades de altura por cada 12 de luz).", "h2": "Fórmulas", "p2": "Ángulo = arctan(altura ÷ luz). Porcentaje = altura ÷ luz × 100. Longitud del cabio = (mitad de la luz del edificio + alero) ÷ cos(ángulo). Superficie del tejado (a dos aguas) = 2 × longitud del cabio × (longitud del edificio + 2 × alero).", "h4": "Conviene saber", "lim": "<li>La pendiente mínima depende de la cubierta y del fabricante; las pendientes bajas necesitan impermeabilización adicional.</li><li>Los tejados más inclinados evacuan mejor la lluvia y la nieve, pero necesitan más material y cuestan más.</li><li>La normativa local y las cargas de nieve pueden fijar pendientes mínimas o máximas; compruébalas antes de planificar.</li>", "no let mode='rr';

function calcAll(){
  let a;const v=id=>$(id).value;
  if(mode==='rr'){const r=+v('r1'),n=+v('r2');if(v('r1')===''||v('r2')===''||!(r>0&&n>0))return null;a=Math.atan2(r,n)}
  else if(mode==='ang'){const d=+v('r3');if(v('r3')===''||!(d>0&&d<90))return null;a=d*Math.PI/180}
  else{const p=+v('r4');if(v('r4')===''||!(p>0&&p<=1000))return null;a=Math.atan(p/100)}
  const t=Math.tan(a),o={a,deg:a*180/Math.PI,pct:t*100,r12:12*t,one:1/t};
  const sp=+v('rs'),ln=+v('rl'),ov=(+v('ro')||0)/100;
  if(v('rs')!==''&&v('rl')!==''&&sp>0&&ln>0&&ov>=0){o.raft=(sp/2+ov)/Math.cos(a);o.area=2*o.raft*(ln+2*ov)}
  return o;
}
function calc(){const o=calcAll();$('mats').innerHTML=MINA.map((m,i)=>`<div class="stat"><span>${o&&o.deg>=m?'✓ ':''}${L('mt'+(i+1))}</span><b>≥ ${m}°</b></div>`).join('');
  if(!showRes(o))return;
  $('big').textContent=nf(o.deg,1)+'°';
  $('rows').innerHTML=rows([[L('pct'),nf(o.pct,1)+(lang==='en'?'%':' %')],[L('ratio'),nf(o.r12,1)+' : 12'],[L('one'),nf(o.one,2)]].concat(o.raft?[[L('raft'),nf(o.raft,2)+' m'],[L('rarea'),nf(o.area,1)+' m²']]:[]));}

function build(){$('rm').innerHTML=[['rr','m_rr'],['ang','m_ang'],['pct','m_pct']].map(([k,l])=>`<option value="${k}" ${k===mode?'selected':''}>${L(l)}</option>`).join('');vis()}
function text(){baseText();build();$('fbox').innerHTML=`<div><b style="color:var(--accent)">${L('ang')} = arctan(${L('rise').split(' (')[0]} ÷ ${L('run').split(' (')[0]})</b></div><div><b style="color:var(--accent)">${L('pct')} = tan(${L('ang')}) × 100</b></div>`;syncLang();calc()}
$('rm').addEventListener('change',e=>{mode=e.target.value;vis();calc()});
['r1','r2','r3','r4','rs','rl','ro'].forEach(id=>$(id).addEventListener('input',calc));
initLang(text);text();
</script>
</body>
</html>
