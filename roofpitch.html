const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "Roof Pitch Calculator", "sub": "Convert between angle, slope percentage and ratio, and get the rafter length and roof area.", "h1": "What is roof pitch?", "p1": "Roof pitch (slope) describes how steep a roof is. It is given as an angle in degrees, as a percentage (rise per 100 units of run) or as a ratio such as 6:12 (6 units of rise for every 12 of run).", "h2": "Formulas", "p2": "Angle = arctan(rise ÷ run). Percentage = rise ÷ run × 100. Rafter length = (half the span + overhang) ÷ cos(angle). Roof area (gable) = 2 × rafter length × (building length + 2 × overhang).", "h4": "Good to know", "lim": "<li>The minimum pitch depends on the roofing material and manufacturer; lower pitches need extra waterproofing.</li><li>Steeper roofs shed rain and snow better but need more material and cost more.</li><li>Local building rules and snow loads may set minimum or maximum pitches; check them before planning.</li>", "note": "Estimate only; consult a roofer or structural engineer.", "faqh": "Frequently asked questions", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How do I convert roof pitch from degrees to percent?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Percentage = tan(angle) × 100. Example: 35° gives tan 35° ≈ 0.70, so the slope is about 70%, or roughly 8.4 : 12 as a ratio.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">What angle is a 6:12 roof pitch?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">A 6:12 pitch rises 6 units for every 12 units of run, so the angle is arctan(6 ÷ 12) ≈ 26.6°, which equals a 50% slope.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">What is the minimum pitch for my roof covering?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">It depends on the material and the manufacturer. Typical minimums are about 22° for concrete or clay tiles, 15° for bitumen shingles, 10° for trapezoidal metal sheet, 25° for slate, 5° for standing-seam metal and 2° for flat roof membranes. Always check the manufacturer’s instructions and local building rules.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How do I measure the pitch of an existing roof?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Measure the vertical rise over a known horizontal run, for example from the attic along a rafter with a level and a tape measure, or use an inclinometer app. Enter the rise and run in the calculator. Do not climb onto a steep or wet roof to measure it.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How is rafter length calculated?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Rafter length = (half the span + overhang) ÷ cos(angle). Example: a span of 8 m, an overhang of 40 cm and a 35° pitch give (4 + 0.4) ÷ cos 35° ≈ 5.37 m. Cutting also has to account for the ridge and the notches, so confirm the lengths with a carpenter.</p></details></li>"}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Výpočet sklonu strechy", "sub": "Prepočítaj medzi uhlom, sklonom v percentách a pomerom a zisti dĺžku krokvy a plochu strechy.", "h1": "Čo je sklon strechy?", "p1": "Sklon strechy hovorí, aká je strecha strmá. Udáva sa ako uhol v stupňoch, v percentách (prevýšenie na 100 jednotiek vodorovnej dĺžky) alebo ako pomer, napríklad 6:12 (6 jednotiek prevýšenia na 12 vodorovne).", "h2": "Vzorce", "p2": "Uhol = arctan(prevýšenie ÷ priemet). Percentá = prevýšenie ÷ priemet × 100. Dĺžka krokvy = (polovica rozpätia + presah) ÷ cos(uhol). Plocha strechy (sedlová) = 2 × dĺžka krokvy × (dĺžka budovy + 2 × presah).", "h4": "Dobré vedieť", "lim": "<li>Minimálny sklon závisí od krytiny a výrobcu; nižšie sklony potrebujú doplnkovú hydroizoláciu.</li><li>Strmšie strechy lepšie odvádzajú dážď a sneh, ale potrebujú viac materiálu a stoja viac.</li><li>Miestne stavebné predpisy a zaťaženie snehom môžu určovať minimálny alebo maximálny sklon; over ich pred plánovaním.</li>", "note": "Len odhad; poraď sa so strechárom alebo statikom.", "faqh": "Často kladené otázky", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ako prepočítam sklon strechy zo stupňov na percentá?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Percentá = tan(uhol) × 100. Príklad: 35° dáva tan 35° ≈ 0,70, takže sklon je približne 70 %, teda asi 8,4 : 12 ako pomer.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Aký uhol má sklon 6:12?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Sklon 6:12 stúpa o 6 jednotiek na každých 12 jednotiek vodorovne, takže uhol je arctan(6 ÷ 12) ≈ 26,6°, čo je sklon 50 %.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Aký je minimálny sklon pre moju krytinu?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Závisí od materiálu a výrobcu. Typické minimá sú asi 22° pre betónové alebo pálené škridly, 15° pre bitúmenové šindle, 10° pre trapézový plech, 25° pre bridlicu, 5° pre falcovaný plech a 2° pre fólie na ploché strechy. Vždy skontroluj pokyny výrobcu a miestne stavebné predpisy.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ako zmeriam sklon existujúcej strechy?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Zmeraj zvislé prevýšenie na známej vodorovnej vzdialenosti, napríklad z podkrovia pozdĺž krokvy vodováhou a metrom, alebo použi aplikáciu sklonomera. Prevýšenie a priemet zadaj do kalkulačky. Na strmú alebo mokrú strechu kvôli meraniu nelez.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ako sa počíta dĺžka krokvy?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Dĺžka krokvy = (polovica rozpätia + presah) ÷ cos(uhol). Príklad: rozpätie 8 m, presah 40 cm a sklon 35° dávajú (4 + 0,4) ÷ cos 35° ≈ 5,37 m. Pri rezaní treba zohľadniť aj hrebeň a zárezy, preto si dĺžky over s tesárom.</p></details></li>"}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Dachneigung berechnen", "sub": "Rechne zwischen Winkel, Neigung in Prozent und Verhältnis um und erhalte Sparrenlänge und Dachfläche.", "h1": "Was ist die Dachneigung?", "p1": "Die Dachneigung beschreibt, wie steil ein Dach ist. Sie wird als Winkel in Grad, in Prozent (Höhe pro 100 Einheiten Länge) oder als Verhältnis wie 6:12 (6 Einheiten Höhe auf 12 Einheiten Länge) angegeben.", "h2": "Formeln", "p2": "Winkel = arctan(Höhe ÷ Länge). Prozent = Höhe ÷ Länge × 100. Sparrenlänge = (halbe Gebäudebreite + Überstand) ÷ cos(Winkel). Dachfläche (Satteldach) = 2 × Sparrenlänge × (Gebäudelänge + 2 × Überstand).", "h4": "Gut zu wissen", "lim": "<li>Die Mindestneigung hängt von Eindeckung und Hersteller ab; flachere Neigungen brauchen zusätzliche Abdichtung.</li><li>Steilere Dächer leiten Regen und Schnee besser ab, brauchen aber mehr Material und kosten mehr.</li><li>Örtliche Bauvorschriften und Schneelasten können Mindest- oder Höchstneigungen festlegen; prüfe sie vor der Planung.</li>", "note": "Nur eine Schätzung; frage einen Dachdecker oder Statiker.", "faqh": "Häufige Fragen", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie rechne ich die Dachneigung von Grad in Prozent um?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Prozent = tan(Winkel) × 100. Beispiel: 35° ergibt tan 35° ≈ 0,70, die Neigung beträgt also etwa 70 %, als Verhältnis rund 8,4 : 12.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Welcher Winkel entspricht einer Neigung von 6:12?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Bei 6:12 steigt das Dach um 6 Einheiten je 12 Einheiten Länge, der Winkel ist also arctan(6 ÷ 12) ≈ 26,6°, das entspricht 50 % Neigung.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Welche Mindestneigung braucht meine Dachdeckung?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Das hängt von Material und Hersteller ab. Typische Mindestwerte sind etwa 22° für Beton- oder Tondachziegel, 15° für Bitumenschindeln, 10° für Trapezblech, 25° für Schiefer, 5° für Stehfalzblech und 2° für Flachdachbahnen. Prüfe immer die Herstellerangaben und die örtlichen Bauvorschriften.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie messe ich die Neigung eines bestehenden Daches?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Miss die senkrechte Höhe über eine bekannte waagerechte Strecke, zum Beispiel vom Dachboden aus entlang eines Sparrens mit Wasserwaage und Maßband, oder nutze eine Neigungsmesser-App. Trage Höhe und Länge im Rechner ein. Steige für die Messung nicht auf ein steiles oder nasses Dach.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie wird die Sparrenlänge berechnet?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Sparrenlänge = (halbe Spannweite + Überstand) ÷ cos(Winkel). Beispiel: 8 m Spannweite, 40 cm Überstand und 35° Neigung ergeben (4 + 0,4) ÷ cos 35° ≈ 5,37 m. Beim Zuschnitt müssen auch First und Kerven berücksichtigt werden, lass die Maße daher von einem Zimmermann prüfen.</p></details></li>"}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Výpočet sklonu střechy", "sub": "Převeď mezi úhlem, sklonem v procentech a poměrem a zjisti délku krokve a plochu střechy.", "h1": "Co je sklon střechy?", "p1": "Sklon střechy říká, jak je střecha strmá. Udává se jako úhel ve stupních, v procentech (převýšení na 100 jednotek vodorovné délky) nebo jako poměr, například 6:12 (6 jednotek převýšení na 12 vodorovně).", "h2": "Vzorce", "p2": "Úhel = arctan(převýšení ÷ průmět). Procenta = převýšení ÷ průmět × 100. Délka krokve = (polovina rozpětí + přesah) ÷ cos(úhel). Plocha střechy (sedlová) = 2 × délka krokve × (délka budovy + 2 × přesah).", "h4": "Dobré vědět", "lim": "<li>Minimální sklon závisí na krytině a výrobci; nižší sklony potřebují doplňkovou hydroizolaci.</li><li>Strmější střechy lépe odvádějí déšť a sníh, ale potřebují více materiálu a stojí více.</li><li>Místní stavební předpisy a zatížení sněhem mohou určovat minimální nebo maximální sklon; ověř je před plánováním.</li>", "note": "Pouze odhad; poraď se s klempířem nebo statikem.", "faqh": "Časté otázky", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak převedu sklon střechy ze stupňů na procenta?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Procenta = tan(úhel) × 100. Příklad: 35° dává tan 35° ≈ 0,70, takže sklon je přibližně 70 %, tedy asi 8,4 : 12 jako poměr.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jaký úhel má sklon 6:12?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Sklon 6:12 stoupá o 6 jednotek na každých 12 jednotek vodorovně, takže úhel je arctan(6 ÷ 12) ≈ 26,6°, což je sklon 50 %.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jaký je minimální sklon pro mou krytinu?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Záleží na materiálu a výrobci. Typická minima jsou asi 22° pro betonové nebo pálené tašky, 15° pro asfaltové šindele, 10° pro trapézový plech, 25° pro břidlici, 5° pro drážkovaný plech a 2° pro fólie na ploché střechy. Vždy zkontroluj pokyny výrobce a místní stavební předpisy.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak změřím sklon existující střechy?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Změř svislé převýšení na známé vodorovné vzdálenosti, například z podkroví podél krokve vodováhou a metrem, nebo použij aplikaci sklonoměru. Převýšení a průmět zadej do kalkulačky. Na strmou nebo mokrou střechu kvůli měření nelez.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak se počítá délka krokve?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Délka krokve = (polovina rozpětí + přesah) ÷ cos(úhel). Příklad: rozpětí 8 m, přesah 40 cm a sklon 35° dávají (4 + 0,4) ÷ cos 35° ≈ 5,37 m. Při řezání je třeba zohlednit i hřeben a zářezy, proto si délky ověř s tesařem.</p></details></li>"}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Obliczanie spadku dachu", "sub": "Przeliczaj między kątem, nachyleniem w procentach i stosunkiem oraz poznaj długość krokwi i powierzchnię dachu.", "h1": "Czym jest spadek dachu?", "p1": "Spadek dachu opisuje, jak stromy jest dach. Podaje się go jako kąt w stopniach, w procentach (wzniesienie na 100 jednostek długości poziomej) lub jako stosunek, na przykład 6:12 (6 jednostek wzniesienia na 12 w poziomie).", "h2": "Wzory", "p2": "Kąt = arctan(wzniesienie ÷ rozpiętość). Procent = wzniesienie ÷ rozpiętość × 100. Długość krokwi = (połowa rozpiętości + okap) ÷ cos(kąt). Powierzchnia dachu (dwuspadowego) = 2 × długość krokwi × (długość budynku + 2 × okap).", "h4": "Warto wiedzieć", "lim": "<li>Minimalny spadek zależy od pokrycia i producenta; mniejsze spadki wymagają dodatkowej hydroizolacji.</li><li>Bardziej strome dachy lepiej odprowadzają deszcz i śnieg, ale wymagają więcej materiału i kosztują więcej.</li><li>Lokalne przepisy budowlane i obciążenie śniegiem mogą określać minimalny lub maksymalny spadek; sprawdź je przed planowaniem.</li>", "note": "Tylko szacunek; skonsultuj się z dekarzem lub konstruktorem.", "faqh": "Najczęstsze pytania", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak przeliczyć spadek dachu ze stopni na procenty?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Procent = tan(kąt) × 100. Przykład: 35° daje tan 35° ≈ 0,70, więc spadek wynosi około 70%, czyli ok. 8,4 : 12 jako stosunek.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jaki kąt odpowiada spadkowi 6:12?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Spadek 6:12 wznosi się o 6 jednostek na każde 12 jednostek poziomo, więc kąt to arctan(6 ÷ 12) ≈ 26,6°, co odpowiada nachyleniu 50%.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jaki jest minimalny spadek dla mojego pokrycia?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Zależy od materiału i producenta. Typowe minima to około 22° dla dachówek betonowych lub ceramicznych, 15° dla gontu bitumicznego, 10° dla blachy trapezowej, 25° dla łupka, 5° dla blachy na rąbek stojący i 2° dla membran na dachy płaskie. Zawsze sprawdź instrukcję producenta i lokalne przepisy budowlane.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak zmierzyć spadek istniejącego dachu?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Zmierz wzniesienie w pionie na znanej odległości poziomej, na przykład od strony poddasza wzdłuż krokwi poziomicą i miarką, albo użyj aplikacji z inklinometrem. Wpisz wzniesienie i rzut poziomy w kalkulatorze. Nie wchodź na stromy ani mokry dach, żeby go zmierzyć.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak oblicza się długość krokwi?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Długość krokwi = (połowa rozpiętości + okap) ÷ cos(kąt). Przykład: rozpiętość 8 m, okap 40 cm i kąt 35° dają (4 + 0,4) ÷ cos 35° ≈ 5,37 m. Przy cięciu trzeba uwzględnić też kalenicę i wręby, więc potwierdź długości z cieślą.</p></details></li>"}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calcul de la pente de toit", "sub": "Convertissez entre angle, pente en pourcentage et rapport, et obtenez la longueur du chevron et la surface du toit.", "h1": "Qu’est-ce que la pente d’un toit ?", "p1": "La pente d’un toit décrit son inclinaison. Elle s’exprime en degrés, en pourcentage (hauteur pour 100 unités de portée) ou sous forme de rapport comme 6:12 (6 unités de hauteur pour 12 de portée).", "h2": "Formules", "p2": "Angle = arctan(hauteur ÷ portée). Pourcentage = hauteur ÷ portée × 100. Longueur du chevron = (demi-largeur du bâtiment + débord) ÷ cos(angle). Surface du toit (à deux pans) = 2 × longueur du chevron × (longueur du bâtiment + 2 × débord).", "h4": "Bon à savoir", "lim": "<li>La pente minimale dépend de la couverture et du fabricant ; les faibles pentes demandent une étanchéité supplémentaire.</li><li>Les toits plus pentus évacuent mieux pluie et neige, mais demandent plus de matériaux et coûtent plus cher.</li><li>Les règles locales de construction et les charges de neige peuvent imposer une pente minimale ou maximale ; vérifiez-les avant de planifier.</li>", "note": "Estimation uniquement ; consultez un couvreur ou un ingénieur structure.", "faqh": "Questions fréquentes", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Comment convertir la pente d’un toit de degrés en pourcentage ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Pourcentage = tan(angle) × 100. Exemple : 35° donne tan 35° ≈ 0,70, soit une pente d’environ 70 %, ou à peu près 8,4 : 12 en rapport.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Quel angle correspond à une pente de 6:12 ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Une pente de 6:12 monte de 6 unités pour 12 unités à l’horizontale, donc l’angle est arctan(6 ÷ 12) ≈ 26,6°, ce qui équivaut à 50 %.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Quelle est la pente minimale pour ma couverture ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Elle dépend du matériau et du fabricant. Les minimums courants sont d’environ 22° pour les tuiles en béton ou en terre cuite, 15° pour les bardeaux bitumés, 10° pour la tôle trapézoïdale, 25° pour l’ardoise, 5° pour le métal à joint debout et 2° pour les membranes de toit plat. Vérifiez toujours les consignes du fabricant et la réglementation locale.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Comment mesurer la pente d’un toit existant ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Mesurez la hauteur verticale sur une distance horizontale connue, par exemple depuis les combles le long d’un chevron avec un niveau et un mètre, ou utilisez une application inclinomètre. Saisissez la hauteur et la distance dans le calculateur. Ne montez pas sur un toit raide ou mouillé pour mesurer.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Comment calcule-t-on la longueur d’un chevron ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Longueur du chevron = (demi-portée + débord) ÷ cos(angle). Exemple : une portée de 8 m, un débord de 40 cm et une pente de 35° donnent (4 + 0,4) ÷ cos 35° ≈ 5,37 m. À la coupe, il faut aussi tenir compte du faîtage et des entailles ; faites valider les longueurs par un charpentier.</p></details></li>"}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Cálculo de la pendiente del tejado", "sub": "Convierte entre ángulo, porcentaje y relación, y obtén la longitud del cabio y la superficie del tejado.", "h1": "¿Qué es la pendiente del tejado?", "p1": "La pendiente del tejado describe lo inclinado que es. Se expresa como ángulo en grados, como porcentaje (altura por cada 100 unidades de luz) o como relación, por ejemplo 6:12 (6 unidades de altura por cada 12 de luz).", "h2": "Fórmulas", "p2": "Ángulo = arctan(altura ÷ luz). Porcentaje = altura ÷ luz × 100. Longitud del cabio = (mitad de la luz del edificio + alero) ÷ cos(ángulo). Superficie del tejado (a dos aguas) = 2 × longitud del cabio × (longitud del edificio + 2 × alero).", "h4": "Conviene saber", "lim": "<li>La pendiente mínima depende de la cubierta y del fabricante; las pendientes bajas necesitan impermeabilización adicional.</li><li>Los tejados más inclinados evacuan mejor la lluvia y la nieve, pero necesitan más material y cuestan más.</li><li>La normativa local y las cargas de nieve pueden fijar pendientes mínimas o máximas; compruébalas antes de planificar.</li>", "note": "Solo una estimación; consulta a un cubridor o ingeniero estructural.", "faqh": "Preguntas frecuentes", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Cómo convierto la pendiente del tejado de grados a porcentaje?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Porcentaje = tan(ángulo) × 100. Ejemplo: 35° da tan 35° ≈ 0,70, así que la pendiente es de aproximadamente un 70 %, o unos 8,4 : 12 como relación.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Qué ángulo tiene una pendiente de 6:12?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Una pendiente de 6:12 sube 6 unidades por cada 12 en horizontal, así que el ángulo es arctan(6 ÷ 12) ≈ 26,6°, lo que equivale a un 50 %.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Cuál es la pendiente mínima para mi cubierta?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Depende del material y del fabricante. Los mínimos habituales son de unos 22° para tejas de hormigón o cerámicas, 15° para tejas asfálticas, 10° para chapa trapezoidal, 25° para pizarra, 5° para chapa de junta alzada y 2° para láminas de cubierta plana. Comprueba siempre las instrucciones del fabricante y la normativa local.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Cómo mido la pendiente de un tejado existente?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Mide la altura vertical sobre una distancia horizontal conocida, por ejemplo desde el desván a lo largo de un cabio con un nivel y una cinta métrica, o usa una aplicación de inclinómetro. Introduce la altura y la distancia en la calculadora. No subas a un tejado empinado o mojado para medirlo.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Cómo se calcula la longitud del cabio?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Longitud del cabio = (mitad de la luz + alero) ÷ cos(ángulo). Ejemplo: una luz de 8 m, un alero de 40 cm y una pendiente de 35° dan (4 + 0,4) ÷ cos 35° ≈ 5,37 m. Al cortar hay que tener en cuenta también la cumbrera y las muescas, así que confirma las longitudes con un carpintero.</p></details></li>"}};

const LANGS=[['sk','Slovenčina'],['de','Deutsch'],['en','English'],['cs','Čeština'],['pl','Polski'],['fr','Français'],['es','Español']];

function initLang(cb){

  menu.innerHTML=LANGS.map(([c,n])=>`<li><button role="option" data-l="${c}"><span>${n}</span><b>${c.toUpperCase()}</b></button></li>`).join('');
  const close=()=>{menu.classList.add('hidden');btn.setAttribute('aria-expanded','false')};

const $=id=>document.getElementById(id);
const IDX={en:0,sk:1,de:2,cs:3,pl:4,fr:5,es:6},LOC={sk:'sk-SK',de:'de-DE',en:'en-GB',cs:'cs-CZ',pl:'pl-PL',fr:'fr-FR',es:'es-ES'};
const L=k=>PIPE[k].split('|')[IDX[lang]];
const nf=(n,d=0)=>new Intl.NumberFormat(LOC[lang],{maximumFractionDigits:d}).format(n);
function baseText(){
  const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.tagName==='UL'?e.innerHTML=v:e.textContent=v});
  document.querySelectorAll('[data-p]').forEach(e=>e.textContent=L(e.dataset.p));
}
function showRes(o){$('res').classList.toggle('hidden',!o||!!o.err);$('hint').classList.toggle('hidden',!!o);$('hint').textContent=L('hint');$('err').classList.toggle('hidden',!(o&&o.err));if(o&&o.err)$('err').textContent=L(o.err);return !!o&&!o.err}
const rows=a=>a.map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');

let mode='rr';
const MINA=[22,15,5,10,25,2];
function calcAll(){
  let a;const v=id=>$(id).value;
  if(mode==='rr'){const r=+v('r1'),n=+v('r2');if(v('r1')===''||v('r2')===''||!(r>0&&n>0))return null;a=Math.atan2(r,n)}
  else if(mode==='ang'){const d=+v('r3');if(v('r3')===''||!(d>0&&d<90))return null;a=d*Math.PI/180}
  else{const p=+v('r4');if(v('r4')===''||!(p>0&&p<=1000))return null;a=Math.atan(p/100)}
  const t=Math.tan(a),o={a,deg:a*180/Math.PI,pct:t*100,r12:12*t,one:1/t};
  const sp=+v('rs'),ln=+v('rl'),ov=(+v('ro')||0)/100;
  if(v('rs')!==''&&v('rl')!==''&&sp>0&&ln>0&&ov>=0){o.raft=(sp/2+ov)/Math.cos(a);o.area=2*o.raft*(ln+2*ov)}
  return o;
}
function fig(o){
  const f=x=>x.toFixed(1),t=Math.tan(o.a),n=x=>nf(x,1);
  const hw=Math.min(150,118/t),H=hw*t,cx=180,yb=14+(118+H)/2;
  const DM='fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"',TX='font-size="12" fill="#cbd2e0" font-family="inherit"';
  const lx=cx-hw,rx=cx+hw,r=Math.min(34,hw*.5),ex=lx+r*Math.cos(o.a),ey=yb-r*Math.sin(o.a);
  let sv=`<path d="M${f(lx)} ${f(yb)}L${f(cx)} ${f(yb-H)}L${f(rx)} ${f(yb)}Z" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.55)" stroke-width="1.5" stroke-linejoin="round"/>`;
  sv+=`<path d="M${f(cx)} ${f(yb-H)}V${f(yb)}" stroke="rgba(255,255,255,.35)" stroke-width="1" stroke-dasharray="4 3" fill="none"/>`;
  sv+=`<path ${DM} d="M${f(lx+r)} ${f(yb)}A${f(r)} ${f(r)} 0 0 0 ${f(ex)} ${f(ey)}"/>`;
  sv+=`<text ${TX} x="${f(lx+r+6)}" y="${f(yb-5)}">${n(o.deg)}°</text>`;
  sv+=`<text ${TX} x="${f(cx+6)}" y="${f(yb-H/2+4)}">${n(o.r12)}</text>`;
  const by=yb+12;
  sv+=`<path ${DM} d="M${f(lx)} ${f(by)}H${f(cx)}M${f(lx)} ${f(by-4)}V${f(by+4)}M${f(cx)} ${f(by-4)}V${f(by+4)}"/><text ${TX} x="${f((lx+cx)/2)}" y="${f(by+16)}" text-anchor="middle">12</text>`;
  const sp=+$('rs').value;
  if($('rs').value!==''&&sp>0){const b2=by+26;sv+=`<path ${DM} d="M${f(lx)} ${f(b2)}H${f(rx)}M${f(lx)} ${f(b2-4)}V${f(b2+4)}M${f(rx)} ${f(b2-4)}V${f(b2+4)}"/><text ${TX} x="${f(cx)}" y="${f(b2+16)}" text-anchor="middle">${nf(sp,2)} m</text>`}
  $('fig').innerHTML=`<svg viewBox="0 0 360 200" width="100%" style="max-height:230px" role="img" aria-label="${n(o.deg)}°, ${n(o.pct)} %, ${n(o.r12)} : 12">${sv}</svg><p class="mt-1 text-center text-xs" style="color:#8b94a7">${L('sch')}</p>`;
}
function calc(){const o=calcAll();$('mats').innerHTML=MINA.map((m,i)=>`<div class="stat"><span>${o&&o.deg>=m?'✓ ':''}${L('mt'+(i+1))}</span><b>≥ ${m}°</b></div>`).join('');
  if(!showRes(o))return;fig(o);
  $('big').textContent=nf(o.deg,1)+'°';
  $('rows').innerHTML=rows([[L('pct'),nf(o.pct,1)+(lang==='en'?'%':' %')],[L('ratio'),nf(o.r12,1)+' : 12'],[L('one'),nf(o.one,2)]].concat(o.raft?[[L('raft'),nf(o.raft,2)+' m'],[L('rarea'),nf(o.area,1)+' m²']]:[]));}
function vis(){[['r1','r2'],['r3'],['r4']].forEach((ids,i)=>ids.forEach(id=>$(id+'w').classList.toggle('hidden',!['rr','ang','pct'][i]||['rr','ang','pct'][i]!==mode)))}
function build(){$('rm').innerHTML=[['rr','m_rr'],['ang','m_ang'],['pct','m_pct']].map(([k,l])=>`<option value="${k}" ${k===mode?'selected':''}>${L(l)}</option>`).join('');vis()}
function text(){baseText();build();$('fbox').innerHTML=`<div><b style="color:var(--accent)">${L('ang')} = arctan(${L('rise').split(' (')[0]} ÷ ${L('run').split(' (')[0]})</b></div><div><b style="color:var(--accent)">${L('pct')} = tan(${L('ang')}) × 100</b></div>`;syncLang();calc()}
$('rm').addEventListener('change',e=>{mode=e.target.value;vis();calc()});
