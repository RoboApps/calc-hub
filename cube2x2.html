jviac 11 ťahov).", "note": "Všetko beží v tvojom prehliadači; farby, ktoré zadáš, nikdy neopustia tvoje zariadenie. Ak riešič nahlási chybu, skontroluj, či si farby prepísal správne, pretože jediná zlá nálepka robí kocku nemožnou.", "h4": "Dobré vedieť", "lim": "<li>Funguje pre kocku 2×2 s ľubovoľným rozložením farieb.</li><li>Každá zo 6 farieb sa musí vyskytnúť presne 4-krát.</li><li>Riešenie používa len otočenia U, R a F.</li>"}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "2×2-Würfel-Löser", "sub": "Färbe die Felder wie deinen Würfel und erhalte die kürzeste Lösung.", "h1": "So liest du die Züge", "p1": "Halte den Würfel wie im Schema: Die oben gefärbte Fläche zeigt nach oben, die zweite Fläche der mittleren Reihe zu dir. Jeder Buchstabe dreht eine Fläche um eine Vierteldrehung im Uhrzeigersinn, wenn du auf sie schaust: U ist oben, R rechts, F vorn. Ein Apostroph (R') bedeutet gegen den Uhrzeigersinn, eine 2 (R2) eine halbe Drehung.", "h2": "So funktioniert der Löser", "p2": "Der Löser hält eine Ecke fest, wodurch 3.674.160 mögliche Stellungen bleiben, die mit den Zügen U, R und F erreichbar sind. Er sucht gleichzeitig von deinem Würfel und vom gelösten Würfel aus und verbindet beide Wege, daher ist das Ergebnis immer eine kürzeste Lösung (höchstens 11 Züge).", "note": "Alles läuft in deinem Browser; die Farben, die du setzt, verlassen nie dein Gerät. Meldet der Löser einen Fehler, prüfe, ob du die Farben richtig übertragen hast, denn ein einziger falscher Aufkleber macht den Würfel unmöglich.", "h4": "Gut zu wissen", "lim": "<li>Funktioniert mit dem 2×2-Würfel in jeder Farbanordnung.</li><li>Jede der 6 Farben muss genau 4-mal vorkommen.</li><li>Die Lösung nutzt nur Drehungen von U, R und F.</li>"}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Řešič kostky 2×2", "sub": "Vybarvi nálepky podle své kostky a získej nejkratší řešení.", "h1": "Jak číst tahy", "p1": "Drž kostku jako na schématu: stěna nahoře je vršek a druhá stěna ve středním řadě míří k tobě. Každé písmeno otočí jednu stěnu o čtvrt otáčky po směru hodinových ručiček, když se na ni díváš: U je horní, R pravá, F přední. Apostrof (R') znamená proti směru hodin a dvojka (R2) půl otáčky.", "h2": "Jak řešič funguje", "p2": "Řešič nechá jeden roh na místě, takže zbývá 3 674 160 možných pozic dosažitelných tahy U, R a F. Hledá současně z tvé kostky i ze složené kostky a obě cesty spojí, takže výsledek je vždy nejkratší řešení (nejvýše 11 tahů).", "note": "Vše běží ve tvém prohlížeči; barvy, které zadáš, nikdy neopustí tvé zařízení. Pokud řešič ohlásí chybu, zkontroluj, zda jsi barvy přepsal správně, protože jediná špatná nálepka činí kostku nemožnou.", "h4": "Dobré vědět", "lim": "<li>Funguje pro kostku 2×2 s libovolným rozmístěním barev.</li><li>Každá ze 6 barev se musí vyskytnout přesně 4krát.</li><li>Řešení používá jen otočení U, R a F.</li>"}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Solver kostki 2×2", "sub": "Pokoloruj naklejki jak na swojej kostce i uzyskaj najkrótsze rozwiązanie.", "h1": "Jak czytać ruchy", "p1": "Trzymaj kostkę jak na schemacie: ściana na górze jest górą, a druga ściana środkowego rzędu jest zwrócona do ciebie. Każda litera obraca jedną ścianę o ćwierć obrotu zgodnie z ruchem wskazówek zegara, gdy na nią patrzysz: U to góra, R prawa, F przód. Apostrof (R') oznacza obrót przeciwny, a 2 (R2) pół obrotu.", "h2": "Jak działa solver", "p2": "Solver zostawia jeden narożnik na miejscu, co daje 3 674 160 możliwych układów osiągalnych ruchami U, R i F. Szuka jednocześnie od twojej kostki i od ułożonej kostki, a obie ścieżki łączy, więc wynik jest zawsze najkrótszym rozwiązaniem (najwyżej 11 ruchów).", "note": "Wszystko działa w Twojej przeglądarce; kolory, które wprowadzasz, nigdy nie opuszczają Twojego urządzenia. Jeśli solver zgłosi błąd, sprawdź, czy poprawnie przepisałeś kolory, bo jedna błędna naklejka sprawia, że kostka jest niemożliwa.", "h4": "Warto wiedzieć", "lim": "<li>Działa dla kostki 2×2 z dowolnym układem kolorów.</li><li>Każdy z 6 kolorów musi wystąpić dokładnie 4 razy.</li><li>Rozwiązanie używa tylko obrotów U, R i F.</li>"}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Solveur de cube 2×2", "sub": "Coloriez les autocollants comme votre cube et obtenez la solution la plus courte.", "h1": "Comment lire les mouvements", "p1": "Tenez le cube comme sur le schéma : la face du haut est vers le haut et la deuxième face de la rangée du milieu vous fait face. Chaque lettre tourne une face d’un quart de tour dans le sens horaire quand on la regarde : U est le haut, R la droite, F l’avant. Une apostrophe (R') signifie sens antihoraire et un 2 (R2) un demi-tour.", "h2": "Comment fonctionne le solveur", "p2": "Le solveur garde un coin en place, ce qui laisse 3 674 160 positions atteignables avec les mouvements U, R et F. Il cherche en même temps depuis votre cube et depuis le cube résolu, puis relie les deux chemins : le résultat est toujours une solution la plus courte (11 mouvements au maximum).", "note": "Tout s’exécute dans votre navigateur ; les couleurs saisies ne quittent jamais votre appareil. Si le solveur signale une erreur, vérifiez que vous avez bien recopié les couleurs : un seul autocollant erroné rend le cube impossible.", "h4": "Bon à savoir", "lim": "<li>Fonctionne pour le cube 2×2 avec n’importe quel schéma de couleurs.</li><li>Chacune des 6 couleurs doit apparaître exactement 4 fois.</li><li>La solution n’utilise que les rotations U, R et F.</li>"}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Resolutor de cubo 2×2", "sub": "Colorea las pegatinas como tu cubo y obtén la solución más corta.", "h1": "Cómo leer los movimientos", "p1": "Sujeta el cubo como en el esquema: la cara de arriba mira hacia arriba y la segunda cara de la fila central te mira a ti. Cada letra gira una cara un cuarto de vuelta en sentido horario al mirarla: U es arriba, R derecha, F frente. Un apóstrofo (R') significa sentido antihorario y un 2 (R2) media vuelta.", "h2": "Cómo funciona el resolutor", "p2": "El resolutor deja una esquina fija, lo que deja 3 674 160 posiciones alcanzables con los movimientos U, R y F. Busca a la vez desde tu cubo y desde el cubo resuelto y une ambos caminos, así que el resultado es siempre una solución más corta (11 movimientos como máximo).", "note": "Todo funciona en tu navegador; los colores que introduces nunca salen de tu dispositivo. Si el resolutor indica un error, comprueba que copiaste bien los colores, ya que una sola pegatina errónea hace imposible el cubo.", "h4": "Conviene saber", "lim": "<li>Funciona con el cubo 2×2 con cualquier esquema de colores.</li><li>Cada uno de los 6 colores debe aparecer exactamente 4 veces.</li><li>La solución solo usa giros de U, R y F.</li>"}};

const FACES=[{n:[0,1,0],r:[1,0,0],d:[0,0,1],g:[1,0]},{n:[-1,0,0],r:[0,0,1],d:[0,-1,0],g:[0,1]},{n:[0,0,1],r:[1,0,0],d:[0,-1,0],g:[1,1]},{n:[1,0,0],r:[0,0,-1],d:[0,-1,0],g:[2,1]},{n:[0,0,-1],r:[-1,0,0],d:[0,-1,0],g:[3,1]},{n:[0,-1,0],r:[1,0,0],d:[0,0,-1],g:[1,2]}];
const K=(p,n)=>p.join()+'|'+n.join(),ST=[],IX={};
FACES.forEach(f=>{for(let r=0;r<2;r++)for(let c=0;c<2;c++){const p=[0,1,2].map(k=>f.n[k]+f.r[k]*(2*c-1)+f.d[k]*(2*r-1));IX[K(p,f.n)]=ST.length;ST.push({p,n:f.n})}});
const ROT=[v=>[-v[2],v[1],v[0]],v=>[v[0],v[2],-v[1]],v=>[v[1],-v[0],v[2]]],AX=[1,0,2],SRC=[],NM=[];
ROT.forEach((rot,a)=>{const s=ST.map((t,i)=>i);ST.forEach((t,i)=>{if(t.p[AX[a]]===1)s[IX[K(rot(t.p),rot(t.n))]]=i});
  const s2=s.map(i=>s[i]),s3=s.map(i=>s2[i]);SRC.push(s,s2,s3);NM.push('URF'[a],'URF'[a]+'2','URF'[a]+"'")});
const ap=(st,m)=>SRC[m].map(i=>st[i]),inv=m=>m-m%3+2-m%3;
function solveCube(a,b){const ka=a.join(''),kb=b.join('');if(ka===kb)return[];
  const A=new Map([[ka,null]]),B=new Map([[kb,null]]);let fa=[ka],fb=[kb];
  const exp=(F,M,O)=>{const nf=[];for(const k of F){const s=k.split('').map(Number);for(let m=0;m<9;m++){const t=ap(s,m).join('');if(M.has(t))continue;M.set(t,[k,m]);if(O.has(t))return{hit:t};nf.push(t)}}return{nf}};
  for(let d=0;d<6;d++)for(const side of[0,1]){const r=side?exp(fb,B,A):exp(fa,A,B);
    if(r.hit){const f=[],g=[];let k=r.hit,x;while(x=A.get(k)){f.unshift(x[1]);k=x[0]}k=r.hit;while(x=B.get(k)){g.push(inv(x[1]));k=x[0]}return f.concat(g)}
    if(side)fb=r.nf;else fa=r.nf}
  return null}
function prep(col){const cnt=Array(6).fill(0);col.forEach(c=>cnt[c]++);if(cnt.some(n=>n!==4))return{e:'errc'};
  const adj=[0,1,2,3,4,5].map(()=>new Set()),cub={};ST.forEach((t,i)=>{(cub[t.p.join()]=cub[t.p.join()]||[]).push(col[i])});
  for(const k in cub){const v=cub[k];if(new Set(v).size<3)return{e:'errn'};v.forEach(x=>v.forEach(y=>{if(x!==y)adj[x].add(y)}))}
  const opp=adj.map((s,c)=>{const o=[0,1,2,3,4,5].filter(x=>x!==c&&!s.has(x));return o.length===1?o[0]:-1});
  if(opp.some((o,c)=>o<0||opp[o]!==c))return{e:'errn'};
  const at=n=>col[IX[K([-1,-1,-1],n)]],d=at([0,-1,0]),l=at([-1,0,0]),b=at([0,0,-1]);
  return{tg:ST.map(t=>{const n=t.n;return n[1]===1?opp[d]:n[1]===-1?d:n[0]===1?opp[l]:n[0]===-1?l:n[2]===1?opp[b]:b})}}
