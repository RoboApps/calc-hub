 why they are separate categories. 1 kWh equals 1 kW running for one hour.</li><li>The calorie (cal) is 4.184 J; the food Calorie on labels is the kilocalorie (kcal). Mechanical horsepower (hp) is about 745.7 W, while metric horsepower (PS) is about 735.5 W.</li>", "note": "Results are provided for general information. For engineering, medical or legal purposes, always check against the official definitions of the units.", "from": "From"}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Prevodník jednotiek", "sub": "Okamžite prepočítaj dĺžku, hmotnosť, teplotu, plochu, objem, rýchlosť, čas, tlak, energiu, výkon aj dáta.", "value": "Hodnota", "to": "Na jednotku", "swap": "Vymeniť jednotky", "hint": "Zadaj hodnotu na prepočet.", "all": "Všetky jednotky v kategórii", "common": "Časté prevody", "h1": "Sústavy jednotiek", "p1": "Väčšina sveta používa metrickú sústavu (SI), v ktorej sú jednotky založené na mocninách desiatky: kilometer je 1 000 metrov a kilogram 1 000 gramov. Spojené štáty a v menšej miere aj Británia stále používajú tradičné (imperiálne) jednotky ako míle, libry a galóny. Prevodník jednotiek tieto svety prepája.", "h2": "Ako funguje prevod jednotiek", "p2": "Každá jednotka je pevný násobok základnej jednotky, napríklad 1 palec = 0,0254 metra. Pri prevode sa hodnota najprv prepočíta na základnú jednotku a potom na cieľovú, čo je to isté ako vynásobenie jedným prevodovým koeficientom. Výnimkou je teplota: stupnice majú rôzny nulový bod, preto sa používa vzorec s posunom.", "ex": "Príklad: 5 km × 0,621371 ≈ 3,11 mi", "h4": "Dobré vedieť", "lim": "<li>Americké a britské jednotky nie sú vždy rovnaké: americký galón má približne 3,785 litra, britský (imperiálny) približne 4,546 litra. Táto stránka pri objeme používa americké jednotky.</li><li>Dátové jednotky kB, MB a GB používajú mocniny 1 000 (ako sa predávajú disky), kým KiB, MiB a GiB mocniny 1 024 (ako často uvádzajú operačné systémy).</li><li>Jeden rok sa počíta ako 365,25 dňa. Mesiace nie sú v ponuke, pretože ich dĺžka sa mení.</li><li>Výsledky sa zaokrúhľujú na 8 platných číslic.</li><li>Tlak: 1 atm = 101 325 Pa, 1 bar = 100 000 Pa a 1 torr je 1/760 atmosféry (približne 1 mmHg). Pretlak a absolútny tlak, napríklad psi v pneumatikách, sa nerozlišujú.</li><li>Energia a výkon sú rôzne veličiny: energia sa meria v jouloch alebo kWh, výkon (energia za jednotku času) vo wattoch alebo konských silách. Preto sú v samostatných kategóriách. 1 kWh je 1 kW bežiaci jednu hodinu.</li><li>Kalória (cal) je 4,184 J, potravinová kalória na obaloch je kilokalória (kcal). Mechanická konská sila (hp) je približne 745,7 W, metrická (PS) približne 735,5 W.</li>", "note": "Výsledky slúžia na všeobecné informovanie. Pre technické, zdravotné alebo právne účely si vždy over oficiálne definície jednotiek.", "from": "Z jednotky"}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Einheitenumrechner", "sub": "Rechne Länge, Masse, Temperatur, Fläche, Volumen, Geschwindigkeit, Zeit, Druck, Energie, Leistung und Daten sofort um.", "value": "Wert", "to": "Nach", "swap": "Einheiten tauschen", "hint": "Gib einen Wert zum Umrechnen ein.", "all": "Alle Einheiten dieser Kategorie", "common": "Häufige Umrechnungen", "h1": "Maßsysteme", "p1": "Der Großteil der Welt nutzt das metrische System (SI), dessen Einheiten auf Zehnerpotenzen beruhen: Ein Kilometer sind 1.000 Meter, ein Kilogramm 1.000 Gramm. Die USA und in geringerem Maß das Vereinigte Königreich verwenden noch immer imperiale Einheiten wie Meilen, Pfund und Gallonen. Ein Einheitenumrechner verbindet beide Welten.", "h2": "So funktioniert die Umrechnung", "p2": "Jede Einheit ist ein festes Vielfaches einer Basiseinheit, zum Beispiel 1 Zoll = 0,0254 Meter. Bei der Umrechnung wird der Wert zuerst in die Basiseinheit und dann in die Zieleinheit umgerechnet, was einer Multiplikation mit einem einzigen Umrechnungsfaktor entspricht. Die Temperatur ist eine Ausnahme: Die Skalen haben unterschiedliche Nullpunkte, daher braucht man eine Formel mit Verschiebung.", "ex": "Beispiel: 5 km × 0,621371 ≈ 3,11 mi", "h4": "Gut zu wissen", "lim": "<li>US- und britische Einheiten sind nicht immer gleich: Eine US-Gallone sind etwa 3,785 Liter, eine britische (imperiale) Gallone etwa 4,546 Liter. Diese Seite verwendet beim Volumen US-Einheiten.</li><li>Die Dateneinheiten kB, MB und GB nutzen Potenzen von 1.000 (wie Festplatten verkauft werden), KiB, MiB und GiB Potenzen von 1.024 (wie Betriebssysteme oft anzeigen).</li><li>Ein Jahr wird mit 365,25 Tagen gerechnet. Monate werden nicht angeboten, weil ihre Länge schwankt.</li><li>Ergebnisse werden auf 8 signifikante Stellen gerundet.</li><li>Druck: 1 atm = 101.325 Pa, 1 bar = 100.000 Pa und 1 Torr ist 1/760 einer Atmosphäre (etwa 1 mmHg). Überdruck und Absolutdruck, etwa bei Reifen-psi, werden nicht unterschieden.</li><li>Energie und Leistung sind verschiedene Größen: Energie wird in Joule oder kWh gemessen, Leistung (Energie pro Zeit) in Watt oder Pferdestärken. Deshalb sind sie getrennte Kategorien. 1 kWh entspricht 1 kW über eine Stunde.</li><li>Die Kalorie (cal) entspricht 4,184 J; die Nahrungskalorie auf Verpackungen ist die Kilokalorie (kcal). Eine mechanische Pferdestärke (hp) sind etwa 745,7 W, die metrische (PS) etwa 735,5 W.</li>", "note": "Die Ergebnisse dienen der allgemeinen Information. Prüfe für technische, medizinische oder rechtliche Zwecke immer die offiziellen Definitionen der Einheiten.", "from": "Von"}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Převodník jednotek", "sub": "Okamžitě přepočítej délku, hmotnost, teplotu, plochu, objem, rychlost, čas, tlak, energii, výkon i data.", "value": "Hodnota", "to": "Na jednotku", "swap": "Prohodit jednotky", "hint": "Zadej hodnotu k přepočtu.", "all": "Všechny jednotky v kategorii", "common": "Časté převody", "h1": "Soustavy jednotek", "p1": "Většina světa používá metrickou soustavu (SI), v níž jsou jednotky založeny na mocninách deseti: kilometr je 1 000 metrů a kilogram 1 000 gramů. Spojené státy a v menší míře i Británie stále používají tradiční (imperiální) jednotky jako míle, libry a galony. Převodník jednotek tyto světy propojuje.", "h2": "Jak funguje převod jednotek", "p2": "Každá jednotka je pevný násobek základní jednotky, například 1 palec = 0,0254 metru. Při převodu se hodnota nejprve přepočítá na základní jednotku a poté na cílovou, což je totéž jako vynásobení jedním převodním koeficientem. Výjimkou je teplota: stupnice mají různý nulový bod, proto se používá vzorec s posunem.", "ex": "Příklad: 5 km × 0,621371 ≈ 3,11 mi", "h4": "Dobré vědět", "lim": "<li>Americké a britské jednotky nejsou vždy stejné: americký galon má přibližně 3,785 litru, britský (imperiální) přibližně 4,546 litru. Tato stránka u objemu používá americké jednotky.</li><li>Datové jednotky kB, MB a GB používají mocniny 1 000 (jak se prodávají disky), zatímco KiB, MiB a GiB mocniny 1 024 (jak často uvádějí operační systémy).</li><li>Jeden rok se počítá jako 365,25 dne. Měsíce nejsou v nabídce, protože jejich délka kolísá.</li><li>Výsledky se zaokrouhlují na 8 platných číslic.</li><li>Tlak: 1 atm = 101 325 Pa, 1 bar = 100 000 Pa a 1 torr je 1/760 atmosféry (přibližně 1 mmHg). Přetlak a absolutní tlak, například psi v pneumatikách, se nerozlišují.</li><li>Energie a výkon jsou různé veličiny: energie se měří v joulech nebo kWh, výkon (energie za jednotku času) ve wattech nebo koňských silách. Proto jsou v samostatných kategoriích. 1 kWh je 1 kW běžící jednu hodinu.</li><li>Kalorie (cal) je 4,184 J, potravinová kalorie na obalech je kilokalorie (kcal). Mechanická koňská síla (hp) je přibližně 745,7 W, metrická (PS) přibližně 735,5 W.</li>", "note": "Výsledky slouží k obecné informaci. Pro technické, zdravotní nebo právní účely si vždy ověř oficiální definice jednotek.", "from": "Z jednotky"}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Przelicznik jednostek", "sub": "Natychmiast przelicz długość, masę, temperaturę, powierzchnię, objętość, prędkość, czas, ciśnienie, energię, moc i dane.", "value": "Wartość", "to": "Na jednostkę", "swap": "Zamień jednostki", "hint": "Wpisz wartość do przeliczenia.", "all": "Wszystkie jednostki w kategorii", "common": "Częste przeliczenia", "h1": "Systemy miar", "p1": "Większość świata używa systemu metrycznego (SI), w którym jednostki opierają się na potęgach dziesięciu: kilometr to 1000 metrów, a kilogram to 1000 gramów. Stany Zjednoczone, a w mniejszym stopniu Wielka Brytania, nadal stosują jednostki tradycyjne (imperialne), takie jak mile, funty i galony. Przelicznik jednostek łączy te dwa światy.", "h2": "Jak działa przeliczanie jednostek", "p2": "Każda jednostka jest stałą wielokrotnością jednostki bazowej, na przykład 1 cal = 0,0254 metra. Przy przeliczaniu wartość zamienia się najpierw na jednostkę bazową, a potem na docelową, co jest równoznaczne z pomnożeniem przez jeden współczynnik. Wyjątkiem jest temperatura: skale mają różne punkty zerowe, dlatego potrzebny jest wzór z przesunięciem.", "ex": "Przykład: 5 km × 0,621371 ≈ 3,11 mi", "h4": "Warto wiedzieć", "lim": "<li>Jednostki amerykańskie i brytyjskie nie zawsze są takie same: galon amerykański to około 3,785 litra, a brytyjski (imperialny) około 4,546 litra. Ta strona używa dla objętości jednostek amerykańskich.</li><li>Jednostki danych kB, MB i GB opierają się na potęgach 1000 (tak sprzedaje się dyski), a KiB, MiB i GiB na potęgach 1024 (tak często podają systemy operacyjne).</li><li>Rok liczony jest jako 365,25 dnia. Miesięcy nie ma w ofercie, bo ich długość jest różna.</li><li>Wyniki są zaokrąglane do 8 cyfr znaczących.</li><li>Ciśnienie: 1 atm = 101 325 Pa, 1 bar = 100 000 Pa, a 1 tor to 1/760 atmosfery (około 1 mmHg). Nie rozróżnia się ciśnienia względnego i bezwzględnego, np. psi w oponach.</li><li>Energia i moc to różne wielkości: energię mierzy się w dżulach lub kWh, moc (energię w jednostce czasu) w watach lub koniach mechanicznych. Dlatego są to osobne kategorie. 1 kWh to 1 kW działający przez godzinę.</li><li>Kaloria (cal) to 4,184 J, a kaloria żywieniowa na opakowaniach to kilokaloria (kcal). Koń mechaniczny (hp) to około 745,7 W, a metryczny (PS, KM) około 735,5 W.</li>", "note": "Wyniki mają charakter informacyjny. W celach technicznych, medycznych lub prawnych zawsze sprawdź oficjalne definicje jednostek.", "from": "Z jednostki"}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Convertisseur d’unités", "sub": "Convertissez instantanément longueur, masse, température, surface, volume, vitesse, durée, pression, énergie, puissance et données.", "value": "Valeur", "to": "Vers", "swap": "Inverser les unités", "hint": "Saisissez une valeur à convertir.", "all": "Toutes les unités de cette catégorie", "common": "Conversions courantes", "h1": "Les systèmes de mesure", "p1": "La majeure partie du monde utilise le système métrique (SI), dont les unités reposent sur des puissances de dix : un kilomètre fait 1 000 mètres et un kilogramme 1 000 grammes. Les États-Unis, et dans une moindre mesure le Royaume-Uni, emploient encore des unités impériales comme le mile, la livre et le gallon. Un convertisseur d’unités fait le pont entre les deux.", "h2": "Comment fonctionne la conversion", "p2": "Chaque unité est un multiple fixe d’une unité de base, par exemple 1 pouce = 0,0254 mètre. Pour convertir, on ramène d’abord la valeur à l’unité de base, puis à l’unité cible, ce qui revient à multiplier par un seul facteur. La température fait exception : les échelles ont des zéros différents, il faut donc une formule avec décalage.", "ex": "Exemple : 5 km × 0,621371 ≈ 3,11 mi", "h4": "Bon à savoir", "lim": "<li>Les unités américaines et britanniques ne sont pas toujours identiques : un gallon US vaut environ 3,785 litres, un gallon britannique (impérial) environ 4,546 litres. Cette page utilise les unités US pour les volumes.</li><li>Les unités kB, MB et GB utilisent des puissances de 1 000 (comme sont vendus les disques), tandis que KiB, MiB et GiB utilisent des puissances de 1 024 (comme l’affichent souvent les systèmes d’exploitation).</li><li>Une année vaut 365,25 jours. Les mois ne sont pas proposés, car leur durée varie.</li><li>Les résultats sont arrondis à 8 chiffres significatifs.</li><li>Pression : 1 atm = 101 325 Pa, 1 bar = 100 000 Pa et 1 torr vaut 1/760 d’atmosphère (environ 1 mmHg). La pression relative et la pression absolue, par exemple les psi des pneus, ne sont pas distinguées.</li><li>L’énergie et la puissance sont deux grandeurs différentes : l’énergie se mesure en joules ou en kWh, la puissance (énergie par unité de temps) en watts ou en chevaux-vapeur. Ce sont donc des catégories séparées. 1 kWh correspond à 1 kW pendant une heure.</li><li>La calorie (cal) vaut 4,184 J ; la calorie alimentaire des étiquettes est la kilocalorie (kcal). Le cheval-vapeur mécanique (hp) vaut environ 745,7 W, le cheval-vapeur métrique (PS) environ 735,5 W.</li>", "note": "Les résultats sont fournis à titre d’information générale. Pour un usage technique, médical ou juridique, vérifiez toujours les définitions officielles des unités.", "from": "De"}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Conversor de unidades", "sub": "Convierte al instante longitud, masa, temperatura, superficie, volumen, velocidad, tiempo, presión, energía, potencia y datos.", "value": "Valor", "to": "A", "swap": "Intercambiar unidades", "hint": "Introduce un valor para convertir.", "all": "Todas las unidades de esta categoría", "common": "Conversiones habituales", "h1": "Sistemas de medida", "p1": "Gran parte del mundo usa el sistema métrico (SI), cuyas unidades se basan en potencias de diez: un kilómetro son 1000 metros y un kilogramo 1000 gramos. Estados Unidos, y en menor medida el Reino Unido, siguen usando unidades imperiales como millas, libras y galones. Un conversor de unidades une ambos mundos.", "h2": "Cómo funciona la conversión", "p2": "Cada unidad es un múltiplo fijo de una unidad base, por ejemplo 1 pulgada = 0,0254 metros. Al convertir, el valor se pasa primero a la unidad base y después a la unidad de destino, lo que equivale a multiplicar por un único factor. La temperatura es la excepción: las escalas tienen ceros distintos, así que hace falta una fórmula con desplazamiento.", "ex": "Ejemplo: 5 km × 0,621371 ≈ 3,11 mi", "h4": "Conviene saber", "lim": "<li>Las unidades de EE. UU. y del Reino Unido no siempre coinciden: un galón estadounidense son unos 3,785 litros y un galón británico (imperial) unos 4,546 litros. Esta página usa unidades estadounidenses para el volumen.</li><li>Las unidades kB, MB y GB usan potencias de 1000 (como se venden los discos), mientras que KiB, MiB y GiB usan potencias de 1024 (como suelen mostrar los sistemas operativos).</li><li>Un año se toma como 365,25 días. No se ofrecen meses porque su duración varía.</li><li>Los resultados se redondean a 8 cifras significativas.</li><li>Presión: 1 atm = 101 325 Pa, 1 bar = 100 000 Pa y 1 torr es 1/760 de atmósfera (aprox. 1 mmHg). No se distingue entre presión manométrica y absoluta, por ejemplo los psi de los neumáticos.</li><li>La energía y la potencia son magnitudes distintas: la energía se mide en julios o kWh y la potencia (energía por unidad de tiempo) en vatios o caballos de vapor. Por eso son categorías separadas. 1 kWh equivale a 1 kW durante una hora.</li><li>La caloría (cal) equivale a 4,184 J; la caloría de los alimentos en las etiquetas es la kilocaloría (kcal). El caballo de vapor mecánico (hp) son unos 745,7 W y el métrico (PS) unos 735,5 W.</li>", "note": "Los resultados son informativos. Para fines técnicos, médicos o legales, comprueba siempre las definiciones oficiales de las unidades.", "from": "De"}};

function initLang(cb){
