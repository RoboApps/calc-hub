const T={"en": {"back": "← Back to calculators", "title": "About & Contact", "upd": "", "date": "", "sec": [["who", "What is calc-hub.eu", "calc-hub.eu is a collection of free online calculators in one place: health, finance, construction and everyday utilities. The goal is simple: fast, accurate tools that work on any device, need no registration and are available in seven languages (English, Slovak, German, Czech, Polish, French and Spanish)."], ["tools", "Calculators", "Currently available: <a class=\"underline\" style=\"color:var(--accent)\" href=\"bmi.html\">BMI calculator</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"mortgage.html\">Mortgage calculator</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"bitcoin.html\">Bitcoin converter</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"units.html\">Unit converter</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"percentage.html\">Percentage calculator</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"dates.html\">Date calculator</a>. More calculators are added over time."], ["how", "How the calculators work", "Each calculator explains the formulas and concepts behind the result, so you can understand the numbers rather than just copy them. Calculations run in your browser; nothing you enter is sent to or stored on our servers. We check the formulas against known examples, but we cannot guarantee that every result is free of errors."], ["disclaimer", "Important note", "Results are for general information only. They are not financial, medical, legal or tax advice, and they may differ from what a bank, doctor or authority calculates. For important decisions, consult a qualified professional."], ["ads", "How the site is funded", "calc-hub.eu is free to use and is funded by advertising (Google AdSense). Ads are clearly labelled and never influence the calculation results. See <a class=\"underline\" style=\"color:var(--accent)\" href=\"privacy.html\">Privacy & Cookies</a> for details about cookies and consent."], ["contact", "Contact", "Questions, corrections or ideas for new calculators? Write to <a class=\"underline\" style=\"color:var(--accent)\" href=\"mailto:info@calc-hub.eu\">info@calc-hub.eu</a>. Operator: Róbert Horváth, Poprad, Slovakia."]]}, "sk": {"back": "← Späť na kalkulačky", "title": "O nás a kontakt", "upd": "", "date": "", "sec": [["who", "Čo je calc-hub.eu", "calc-hub.eu je zbierka bezplatných online kalkulačiek na jednom mieste: zdravie, financie, stavebníctvo a každodenné nástroje. Cieľ je jednoduchý: rýchle a presné nástroje, ktoré fungujú na každom zariadení, nevyžadujú registráciu a sú dostupné v siedmich jazykoch (angličtina, slovenčina, nemčina, čeština, poľština, francúzština a španielčina)."], ["tools", "Kalkulačky", "Momentálne môžeš používať: <a class=\"underline\" style=\"color:var(--accent)\" href=\"bmi.html\">Kalkulačka BMI</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"mortgage.html\">Kalkulačka hypotéky</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"bitcoin.html\">Bitcoin prevodník</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"units.html\">Prevodník jednotiek</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"percentage.html\">Kalkulačka percent</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"dates.html\">Kalkulačka dátumov</a>. Ďalšie kalkulačky pribúdajú postupne."], ["how", "Ako kalkulačky fungujú", "Každá kalkulačka vysvetľuje vzorce a pojmy za výsledkom, aby si číslam rozumel, nielen ich kopíroval. Výpočty prebiehajú v tvojom prehliadači a nič, čo zadáš, sa neodosiela ani neukladá na našich serveroch. Vzorce kontrolujeme na známych príkladoch, nemôžeme však zaručiť, že každý výsledok je bez chyby."], ["disclaimer", "Dôležité upozornenie", "Výsledky slúžia len na všeobecné informovanie. Nie sú finančným, zdravotným, právnym ani daňovým poradenstvom a môžu sa líšiť od výpočtu banky, lekára alebo úradu. Pri dôležitých rozhodnutiach sa poraď s kvalifikovaným odborníkom."], ["ads", "Ako sa web financuje", "calc-hub.eu je zadarmo a financuje sa reklamou (Google AdSense). Reklamy sú jasne označené a nikdy neovplyvňujú výsledky výpočtov. Podrobnosti o cookies a súhlase nájdeš v <a class=\"underline\" style=\"color:var(--accent)\" href=\"privacy.html\">Ochrana údajov a cookies</a>."], ["contact", "Kontakt", "Máš otázku, opravu alebo tip na novú kalkulačku? Napíš na <a class=\"underline\" style=\"color:var(--accent)\" href=\"mailto:info@calc-hub.eu\">info@calc-hub.eu</a>. Prevádzkovateľ: Róbert Horváth, Poprad, Slovensko."]]}, "de": {"back": "← Zurück zu den Rechnern", "title": "Über uns & Kontakt", "upd": "", "date": "", "sec": [["who", "Was ist calc-hub.eu", "calc-hub.eu ist eine Sammlung kostenloser Online-Rechner an einem Ort: Gesundheit, Finanzen, Bauen und Alltagswerkzeuge. Das Ziel ist einfach: schnelle, genaue Werkzeuge, die auf jedem Gerät funktionieren, keine Registrierung brauchen und in sieben Sprachen verfügbar sind (Englisch, Slowakisch, Deutsch, Tschechisch, Polnisch, Französisch und Spanisch)."], ["tools", "Rechner", "Derzeit kannst du nutzen: <a class=\"underline\" style=\"color:var(--accent)\" href=\"bmi.html\">BMI-Rechner</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"mortgage.html\">Hypothekenrechner</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"bitcoin.html\">Bitcoin-Umrechner</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"units.html\">Einheitenumrechner</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"percentage.html\">Prozentrechner</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"dates.html\">Datumsrechner</a>. Weitere Rechner kommen nach und nach hinzu."], ["how", "So funktionieren die Rechner", "Jeder Rechner erklärt die Formeln und Begriffe hinter dem Ergebnis, damit du die Zahlen verstehst, statt sie nur zu übernehmen. Die Berechnungen laufen in deinem Browser, und nichts, was du eingibst, wird an unsere Server gesendet oder dort gespeichert. Wir prüfen die Formeln an bekannten Beispielen, können aber nicht garantieren, dass jedes Ergebnis fehlerfrei ist."], ["disclaimer", "Wichtiger Hinweis", "Die Ergebnisse dienen nur der allgemeinen Information. Sie sind keine Finanz-, Gesundheits-, Rechts- oder Steuerberatung und können von den Berechnungen einer Bank, eines Arztes oder einer Behörde abweichen. Hole bei wichtigen Entscheidungen den Rat einer qualifizierten Fachperson ein."], ["ads", "Wie sich die Seite finanziert", "calc-hub.eu ist kostenlos und finanziert sich über Werbung (Google AdSense). Anzeigen sind klar gekennzeichnet und beeinflussen die Rechenergebnisse nie. Details zu Cookies und Einwilligung findest du unter <a class=\"underline\" style=\"color:var(--accent)\" href=\"privacy.html\">Datenschutz & Cookies</a>."], ["contact", "Kontakt", "Fragen, Korrekturen oder Vorschläge für neue Rechner? Schreibe an <a class=\"underline\" style=\"color:var(--accent)\" href=\"mailto:info@calc-hub.eu\">info@calc-hub.eu</a>. Betreiber: Róbert Horváth, Poprad, Slowakei."]]}, "cs": {"back": "← Zpět na kalkulačky", "title": "O nás a kontakt", "upd": "", "date": "", "sec": [["who", "Co je calc-hub.eu", "calc-hub.eu je sbírka bezplatných online kalkulaček na jednom místě: zdraví, finance, stavebnictví a každodenní nástroje. Cíl je jednoduchý: rychlé a přesné nástroje, které fungují na každém zařízení, nevyžadují registraci a jsou dostupné v sedmi jazycích (angličtina, slovenština, němčina, čeština, polština, francouzština a španělština)."], ["tools", "Kalkulačky", "Aktuálně můžeš používat: <a class=\"underline\" style=\"color:var(--accent)\" href=\"bmi.html\">BMI kalkulačka</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"mortgage.html\">Hypoteční kalkulačka</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"bitcoin.html\">Bitcoin převodník</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"units.html\">Převodník jednotek</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"percentage.html\">Procentní kalkulačka</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"dates.html\">Kalkulačka dat</a>. Další kalkulačky přibývají postupně."], ["how", "Jak kalkulačky fungují", "Každá kalkulačka vysvětluje vzorce a pojmy za výsledkem, abys číslům rozuměl, a nejen je kopíroval. Výpočty probíhají ve tvém prohlížeči a nic, co zadáš, se neodesílá ani neukládá na našich serverech. Vzorce kontrolujeme na známých příkladech, nemůžeme však zaručit, že každý výsledek je bez chyby."], ["disclaimer", "Důležité upozornění", "Výsledky slouží pouze k obecné informaci. Nejsou finančním, zdravotním, právním ani daňovým poradenstvím a mohou se lišit od výpočtu banky, lékaře nebo úřadu. U důležitých rozhodnutí se poraď s kvalifikovaným odborníkem."], ["ads", "Jak se web financuje", "calc-hub.eu je zdarma a financuje se reklamou (Google AdSense). Reklamy jsou jasně označené a nikdy neovlivňují výsledky výpočtů. Podrobnosti o cookies a souhlasu najdeš v <a class=\"underline\" style=\"color:var(--accent)\" href=\"privacy.html\">Ochrana údajů a cookies</a>."], ["contact", "Kontakt", "Máš otázku, opravu nebo tip na novou kalkulačku? Napiš na <a class=\"underline\" style=\"color:var(--accent)\" href=\"mailto:info@calc-hub.eu\">info@calc-hub.eu</a>. Provozovatel: Róbert Horváth, Poprad, Slovensko."]]}, "pl": {"back": "← Wróć do kalkulatorów", "title": "O nas i kontakt", "upd": "", "date": "", "sec": [["who", "Czym jest calc-hub.eu", "calc-hub.eu to zbiór darmowych kalkulatorów online w jednym miejscu: zdrowie, finanse, budownictwo i narzędzia na co dzień. Cel jest prosty: szybkie i dokładne narzędzia, które działają na każdym urządzeniu, nie wymagają rejestracji i są dostępne w siedmiu językach (angielski, słowacki, niemiecki, czeski, polski, francuski i hiszpański)."], ["tools", "Kalkulatory", "Obecnie możesz korzystać z: <a class=\"underline\" style=\"color:var(--accent)\" href=\"bmi.html\">Kalkulator BMI</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"mortgage.html\">Kalkulator kredytu hipotecznego</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"bitcoin.html\">Przelicznik Bitcoina</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"units.html\">Przelicznik jednostek</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"percentage.html\">Kalkulator procentowy</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"dates.html\">Kalkulator dat</a>. Kolejne kalkulatory dodajemy stopniowo."], ["how", "Jak działają kalkulatory", "Każdy kalkulator wyjaśnia wzory i pojęcia stojące za wynikiem, abyś rozumiał liczby, a nie tylko je przepisywał. Obliczenia wykonują się w Twojej przeglądarce, a nic, co wpiszesz, nie jest wysyłane ani zapisywane na naszych serwerach. Wzory sprawdzamy na znanych przykładach, ale nie możemy zagwarantować, że każdy wynik jest wolny od błędów."], ["disclaimer", "Ważna uwaga", "Wyniki mają charakter wyłącznie informacyjny. Nie są poradą finansową, medyczną, prawną ani podatkową i mogą się różnić od obliczeń banku, lekarza lub urzędu. Przy ważnych decyzjach skonsultuj się z wykwalifikowanym specjalistą."], ["ads", "Jak finansowany jest serwis", "calc-hub.eu jest bezpłatny i finansowany z reklam (Google AdSense). Reklamy są wyraźnie oznaczone i nigdy nie wpływają na wyniki obliczeń. Szczegóły o plikach cookies i zgodzie znajdziesz w <a class=\"underline\" style=\"color:var(--accent)\" href=\"privacy.html\">Prywatność i cookies</a>."], ["contact", "Kontakt", "Masz pytanie, poprawkę lub pomysł na nowy kalkulator? Napisz na <a class=\"underline\" style=\"color:var(--accent)\" href=\"mailto:info@calc-hub.eu\">info@calc-hub.eu</a>. Operator: Róbert Horváth, Poprad, Słowacja."]]}, "fr": {"back": "← Retour aux calculateurs", "title": "À propos et contact", "upd": "", "date": "", "sec": [["who", "Qu’est-ce que calc-hub.eu", "calc-hub.eu est une collection de calculateurs en ligne gratuits au même endroit : santé, finances, construction et outils du quotidien. L’objectif est simple : des outils rapides et précis qui fonctionnent sur tous les appareils, sans inscription, disponibles en sept langues (anglais, slovaque, allemand, tchèque, polonais, français et espagnol)."], ["tools", "Calculateurs", "Vous pouvez actuellement utiliser : <a class=\"underline\" style=\"color:var(--accent)\" href=\"bmi.html\">Calculateur d’IMC</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"mortgage.html\">Calculateur de prêt immobilier</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"bitcoin.html\">Convertisseur Bitcoin</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"units.html\">Convertisseur d’unités</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"percentage.html\">Calculateur de pourcentages</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"dates.html\">Calculateur de dates</a>. D’autres calculateurs sont ajoutés progressivement."], ["how", "Comment fonctionnent les calculateurs", "Chaque calculateur explique les formules et les notions derrière le résultat, pour que vous compreniez les chiffres au lieu de simplement les recopier. Les calculs s’exécutent dans votre navigateur et rien de ce que vous saisissez n’est envoyé ni conservé sur nos serveurs. Nous vérifions les formules sur des exemples connus, mais ne pouvons garantir que chaque résultat soit exempt d’erreurs."], ["disclaimer", "Remarque importante", "Les résultats sont fournis à titre d’information générale. Ils ne constituent pas un conseil financier, médical, juridique ou fiscal et peuvent différer des calculs d’une banque, d’un médecin ou d’une administration. Pour les décisions importantes, consultez un professionnel qualifié."], ["ads", "Comment le site est financé", "calc-hub.eu est gratuit et financé par la publicité (Google AdSense). Les annonces sont clairement signalées et n’influencent jamais les résultats des calculs. Pour les détails sur les cookies et le consentement, voir <a class=\"underline\" style=\"color:var(--accent)\" href=\"privacy.html\">Confidentialité et cookies</a>."], ["contact", "Contact", "Une question, une correction ou une idée de nouveau calculateur ? Écrivez à <a class=\"underline\" style=\"color:var(--accent)\" href=\"mailto:info@calc-hub.eu\">info@calc-hub.eu</a>. Exploitant : Róbert Horváth, Poprad, Slovaquie."]]}, "es": {"back": "← Volver a las calculadoras", "title": "Acerca de y contacto", "upd": "", "date": "", "sec": [["who", "Qué es calc-hub.eu", "calc-hub.eu es una colección de calculadoras online gratuitas en un solo lugar: salud, finanzas, construcción y utilidades cotidianas. El objetivo es sencillo: herramientas rápidas y precisas que funcionan en cualquier dispositivo, no requieren registro y están disponibles en siete idiomas (inglés, eslovaco, alemán, checo, polaco, francés y español)."], ["tools", "Calculadoras", "Ahora puedes usar: <a class=\"underline\" style=\"color:var(--accent)\" href=\"bmi.html\">Calculadora de IMC</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"mortgage.html\">Calculadora de hipoteca</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"bitcoin.html\">Conversor de Bitcoin</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"units.html\">Conversor de unidades</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"percentage.html\">Calculadora de porcentajes</a>, <a class=\"underline\" style=\"color:var(--accent)\" href=\"dates.html\">Calculadora de fechas</a>. Se van añadiendo más calculadoras poco a poco."], ["how", "Cómo funcionan las calculadoras", "Cada calculadora explica las fórmulas y los conceptos detrás del resultado, para que entiendas las cifras en lugar de limitarte a copiarlas. Los cálculos se ejecutan en tu navegador y nada de lo que introduces se envía ni se almacena en nuestros servidor
