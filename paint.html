let lang='en';
const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "Paint Calculator", "sub": "Work out how many litres of paint you need for the walls and ceiling of a room.", "h1": "How much paint do you need?", "p1": "Paint needed = area to paint × number of coats ÷ coverage, plus a reserve for waste and touch-ups. The calculator takes the wall area from the room’s perimeter and height and subtracts doors and windows; the ceiling is optional.", "h2": "Formula", "p2": "Litres = (walls + ceiling) × coats ÷ coverage × (1 + waste ÷ 100). Typical coverage is 8–12 m² per litre per coat; the exact value is printed on the can.", "h4": "Good to know", "lim": "<li>Dark colours, new plaster and porous surfaces need more coats or a primer.</li><li>Rough surfaces absorb more paint, so lower the coverage value.</li><li>Buy all the paint at once and from the same batch so the shade matches.</li>", "note": "The result is an estimate; check the coverage on your paint can.", "faqh": "Frequently asked questions", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How do I calculate how much paint I need?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Multiply the room’s perimeter by its height, subtract doors and windows, then multiply by the number of coats, divide by the coverage and add a reserve. Example: a 5 × 4 m room that is 2.6 m high with 1 door and 2 windows has about 42.2 m² of walls. Two coats at 10 m² per litre with a 10% reserve need about 9.3 litres, so one 10-litre can.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">What coverage should I enter?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Typical coverage is 8–12 m² per litre per coat, but the exact value is printed on the can. Rough surfaces absorb more paint, so use a lower value for them.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How many coats do I need?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Two coats are common for a lasting, even finish. Dark colours, new plaster and porous surfaces may need more coats or a primer first.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Are doors, windows and the ceiling included?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">The calculator subtracts 1.8 m² for each door and 1.4 m² for each window; for much larger openings, enter a higher number of doors or windows. The ceiling is optional: tick the box to add an area equal to the floor, which in the example brings the total to about 13.7 litres.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Why buy all the paint at once?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Different batches can differ slightly in shade, so buy everything at once and from the same batch. Keep a little leftover for touch-ups.</p></details></li>"}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Výpočet spotreby farby", "sub": "Zisti, koľko litrov farby potrebuješ na steny a strop miestnosti.", "h1": "Koľko farby potrebuješ?", "p1": "Potrebná farba = plocha na natretie × počet náterov ÷ výdatnosť plus rezerva na stratu a opravy. Kalkulačka vypočíta plochu stien z obvodu a výšky miestnosti a odpočíta dvere a okná; strop je voliteľný.", "h2": "Vzorec", "p2": "Litre = (steny + strop) × nátery ÷ výdatnosť × (1 + rezerva ÷ 100). Typická výdatnosť je 8 – 12 m² na liter na náter; presná hodnota je uvedená na obale.", "h4": "Dobré vedieť", "lim": "<li>Tmavé farby, nová omietka a savé povrchy potrebujú viac náterov alebo penetráciu.</li><li>Drsné povrchy spotrebujú viac farby, preto zníž hodnotu výdatnosti.</li><li>Kúp všetku farbu naraz a z jednej šarže, aby sa odtieň zhodoval.</li>", "note": "Výsledok je odhad; výdatnosť si over na obale farby.", "faqh": "Často kladené otázky", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ako vypočítam, koľko farby potrebujem?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Vynásob obvod miestnosti jej výškou, odpočítaj dvere a okná, potom vynásob počtom náterov, vydeľ výdatnosťou a pridaj rezervu. Príklad: miestnosť 5 × 4 m vysoká 2,6 m s dverami a dvoma oknami má asi 42,2 m² stien. Dva nátery pri 10 m² na liter s 10 % rezervou potrebujú asi 9,3 litra, čiže jedno 10-litrové balenie.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Akú výdatnosť zadať?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Typická výdatnosť je 8 až 12 m² na liter na náter, presná hodnota je uvedená na obale. Drsné povrchy nasajú viac farby, preto pre ne použi nižšiu hodnotu.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Koľko náterov potrebujem?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Dva nátery sú bežné pre trvanlivý a rovnomerný výsledok. Tmavé farby, nová omietka a savé povrchy môžu potrebovať viac náterov alebo najprv penetráciu.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Počítajú sa aj dvere, okná a strop?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Kalkulačka odpočíta 1,8 m² za každé dvere a 1,4 m² za každé okno; pri oveľa väčších otvoroch zadaj vyšší počet dverí alebo okien. Strop je voliteľný: po zaškrtnutí sa pripočíta plocha rovnajúca sa podlahe, čo v príklade zvýši potrebu na asi 13,7 litra.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Prečo kúpiť všetku farbu naraz?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Rôzne šarže sa môžu mierne líšiť odtieňom, preto kúp všetko naraz a z tej istej šarže. Trochu zvyšku si nechaj na drobné opravy.</p></details></li>"}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Farbbedarf berechnen", "sub": "Berechne, wie viele Liter Farbe du für Wände und Decke eines Raumes brauchst.", "h1": "Wie viel Farbe brauchst du?", "p1": "Farbbedarf = zu streichende Fläche × Anzahl der Anstriche ÷ Ergiebigkeit, plus Reserve für Verlust und Ausbesserungen. Der Rechner ermittelt die Wandfläche aus Umfang und Höhe des Raumes und zieht Türen und Fenster ab; die Decke ist optional.", "h2": "Formel", "p2": "Liter = (Wände + Decke) × Anstriche ÷ Ergiebigkeit × (1 + Verschnitt ÷ 100). Typisch sind 8–12 m² pro Liter und Anstrich; der genaue Wert steht auf dem Gebinde.", "h4": "Gut zu wissen", "lim": "<li>Dunkle Farben, neuer Putz und saugende Untergründe brauchen mehr Anstriche oder eine Grundierung.</li><li>Raue Flächen nehmen mehr Farbe auf, setze daher die Ergiebigkeit niedriger an.</li><li>Kaufe die ganze Farbe auf einmal und aus derselben Charge, damit der Farbton passt.</li>", "note": "Das Ergebnis ist eine Schätzung; prüfe die Ergiebigkeit auf dem Farbeimer.", "faqh": "Häufige Fragen", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie berechne ich, wie viel Farbe ich brauche?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Multipliziere den Umfang des Raums mit der Höhe, ziehe Türen und Fenster ab, multipliziere mit der Anzahl der Anstriche, teile durch die Ergiebigkeit und addiere eine Reserve. Beispiel: Ein Raum von 5 × 4 m mit 2,6 m Höhe, einer Tür und 2 Fenstern hat etwa 42,2 m² Wandfläche. Zwei Anstriche bei 10 m² pro Liter mit 10 % Reserve brauchen etwa 9,3 Liter, also ein 10-Liter-Gebinde.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Welche Ergiebigkeit soll ich eingeben?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Typisch sind 8–12 m² pro Liter und Anstrich, der genaue Wert steht auf dem Gebinde. Raue Untergründe saugen mehr Farbe auf, nimm dafür einen niedrigeren Wert.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie viele Anstriche brauche ich?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Zwei Anstriche sind für ein gleichmäßiges, haltbares Ergebnis üblich. Dunkle Farben, neuer Putz und saugende Untergründe brauchen eventuell mehr Anstriche oder zuerst eine Grundierung.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Sind Türen, Fenster und die Decke berücksichtigt?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Der Rechner zieht 1,8 m² pro Tür und 1,4 m² pro Fenster ab; bei deutlich größeren Öffnungen gib eine höhere Anzahl an Türen oder Fenstern ein. Die Decke ist optional: Mit dem Häkchen wird eine Fläche in Größe des Bodens addiert, im Beispiel steigt der Bedarf damit auf etwa 13,7 Liter.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Warum sollte ich die ganze Farbe auf einmal kaufen?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Verschiedene Chargen können im Farbton leicht abweichen, kaufe daher alles auf einmal und aus derselben Charge. Behalte einen kleinen Rest für Ausbesserungen.</p></details></li>"}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Výpočet spotřeby barvy", "sub": "Zjisti, kolik litrů barvy potřebuješ na stěny a strop místnosti.", "h1": "Kolik barvy potřebuješ?", "p1": "Potřebná barva = plocha k natření × počet nátěrů ÷ výdatnost plus rezerva na ztráty a opravy. Kalkulačka spočítá plochu stěn z obvodu a výšky místnosti a odečte dveře a okna; strop je volitelný.", "h2": "Vzorec", "p2": "Litry = (stěny + strop) × nátěry ÷ výdatnost × (1 + rezerva ÷ 100). Typická výdatnost je 8–12 m² na litr na nátěr; přesná hodnota je uvedena na obalu.", "h4": "Dobré vědět", "lim": "<li>Tmavé barvy, nová omítka a savé povrchy potřebují více nátěrů nebo penetraci.</li><li>Drsné povrchy spotřebují více barvy, proto sniž hodnotu výdatnosti.</li><li>Kup všechnu barvu najednou a z jedné šarže, aby se odstín shodoval.</li>", "note": "Výsledek je odhad; výdatnost si ověř na obalu barvy.", "faqh": "Časté otázky", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak spočítám, kolik barvy potřebuji?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Vynásob obvod místnosti její výškou, odečti dveře a okna, pak vynásob počtem nátěrů, vyděl výdatností a přidej rezervu. Příklad: místnost 5 × 4 m vysoká 2,6 m s dveřmi a dvěma okny má asi 42,2 m² stěn. Dva nátěry při 10 m² na litr s 10% rezervou potřebují asi 9,3 litru, tedy jedno 10litrové balení.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jakou výdatnost zadat?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Typická výdatnost je 8 až 12 m² na litr na nátěr, přesná hodnota je uvedena na obalu. Drsné povrchy nasají víc barvy, proto pro ně použij nižší hodnotu.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Kolik nátěrů potřebuji?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Dva nátěry jsou běžné pro trvanlivý a rovnoměrný výsledek. Tmavé barvy, nová omítka a savé povrchy mohou potřebovat více nátěrů nebo nejdřív penetraci.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Počítají se i dveře, okna a strop?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Kalkulačka odečte 1,8 m² za každé dveře a 1,4 m² za každé okno; u mnohem větších otvorů zadej vyšší počet dveří nebo oken. Strop je volitelný: po zaškrtnutí se připočte plocha rovnající se podlaze, což v příkladu zvýší potřebu na asi 13,7 litru.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Proč koupit všechnu barvu najednou?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Různé šarže se mohou mírně lišit odstínem, proto kup vše najednou a z jedné šarže. Trochu zbytku si nech na drobné opravy.</p></details></li>"}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Obliczanie zużycia farby", "sub": "Sprawdź, ile litrów farby potrzebujesz na ściany i sufit pomieszczenia.", "h1": "Ile farby potrzebujesz?", "p1": "Potrzebna farba = powierzchnia do malowania × liczba warstw ÷ wydajność plus zapas na straty i poprawki. Kalkulator oblicza powierzchnię ścian z obwodu i wysokości pomieszczenia i odejmuje drzwi oraz okna; sufit jest opcjonalny.", "h2": "Wzór", "p2": "Litry = (ściany + sufit) × warstwy ÷ wydajność × (1 + zapas ÷ 100). Typowa wydajność to 8–12 m² na litr na warstwę; dokładna wartość jest na opakowaniu.", "h4": "Warto wiedzieć", "lim": "<li>Ciemne kolory, nowy tynk i chłonne powierzchnie wymagają więcej warstw lub gruntu.</li><li>Chropowate powierzchnie wchłaniają więcej farby, więc obniż wartość wydajności.</li><li>Kup całą farbę naraz i z jednej partii, aby odcień się zgadzał.</li>", "note": "Wynik jest szacunkiem; wydajność sprawdź na opakowaniu farby.", "faqh": "Najczęstsze pytania", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak obliczyć, ile farby potrzebuję?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Pomnóż obwód pomieszczenia przez wysokość, odejmij drzwi i okna, następnie pomnóż przez liczbę warstw, podziel przez wydajność i dodaj zapas. Przykład: pomieszczenie 5 × 4 m o wysokości 2,6 m z jednymi drzwiami i 2 oknami ma około 42,2 m² ścian. Dwie warstwy przy 10 m² na litr z 10% zapasem potrzebują około 9,3 litra, czyli jednego opakowania 10 l.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jaką wydajność wpisać?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Typowa wydajność to 8–12 m² na litr na warstwę, a dokładna wartość jest podana na opakowaniu. Chropowate powierzchnie chłoną więcej farby, więc dla nich użyj niższej wartości.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ile warstw farby potrzebuję?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Dwie warstwy to standard dla trwałego, równomiernego efektu. Ciemne kolory, nowy tynk i chłonne podłoża mogą wymagać większej liczby warstw lub wcześniejszego gruntowania.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Czy drzwi, okna i sufit są uwzględnione?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Kalkulator odejmuje 1,8 m² na każde drzwi i 1,4 m² na każde okno; przy znacznie większych otworach wpisz większą liczbę drzwi lub okien. Sufit jest opcjonalny: po zaznaczeniu dodawana jest powierzchnia równa podłodze, co w przykładzie zwiększa zapotrzebowanie do około 13,7 litra.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Dlaczego warto kupić całą farbę naraz?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Różne partie mogą nieco różnić się odcieniem, dlatego kup wszystko naraz i z jednej partii. Zostaw odrobinę na drobne poprawki.</p></details></li>"}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calcul de peinture", "sub": "Calculez combien de litres de peinture il faut pour les murs et le plafond d’une pièce.", "h1": "De quelle quantité de peinture avez-vous besoin ?", "p1": "Peinture nécessaire = surface à peindre × nombre de couches ÷ rendement, plus une marge pour les pertes et retouches. Le calculateur déduit la surface des murs du périmètre et de la hauteur de la pièce et retranche portes et fenêtres ; le plafond est facultatif.", "h2": "Formule", "p2": "Litres = (murs + plafond) × couches ÷ rendement × (1 + marge ÷ 100). Le rendement courant est de 8 à 12 m² par litre et par couche ; la valeur exacte figure sur le pot.", "h4": "Bon à savoir", "lim": "<li>Les couleurs foncées, l’enduit neuf et les supports poreux demandent plus de couches ou une sous-couche.</li><li>Les surfaces rugueuses absorbent plus de peinture : réduisez la valeur du rendement.</li><li>Achetez toute la peinture en une fois et dans le même lot pour que la teinte corresponde.</li>", "note": "Le résultat est une estimation ; vérifiez le rendement sur votre pot de peinture.", "faqh": "Questions fréquentes", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Comment calculer la quantité de peinture nécessaire ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Multipliez le périmètre de la pièce par sa hauteur, retirez les portes et fenêtres, multipliez par le nombre de couches, divisez par le rendement et ajoutez une marge. Exemple : une pièce de 5 × 4 m haute de 2,6 m avec 1 porte et 2 fenêtres a environ 42,2 m² de murs. Deux couches à 10 m² par litre avec 10 % de marge demandent environ 9,3 litres, soit un pot de 10 litres.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Quel rendement saisir ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Le rendement habituel est de 8 à 12 m² par litre et par couche, la valeur exacte est indiquée sur le pot. Les surfaces rugueuses absorbent plus de peinture, utilisez donc une valeur plus faible.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Combien de couches faut-il ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Deux couches sont courantes pour un résultat durable et régulier. Les couleurs foncées, l’enduit neuf et les supports poreux peuvent demander plus de couches ou une sous-couche.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Les portes, fenêtres et le plafond sont-ils pris en compte ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Le calculateur retire 1,8 m² par porte et 1,4 m² par fenêtre ; pour des ouvertures bien plus grandes, saisissez un nombre plus élevé de portes ou de fenêtres. Le plafond est facultatif : en cochant la case, on ajoute une surface égale à celle du sol, ce qui porte le besoin à environ 13,7 litres dans l’exemple.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Pourquoi acheter toute la peinture en une fois ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Des lots différents peuvent varier légèrement de teinte : achetez tout en une fois et dans le même lot. Gardez un peu de reste pour les retouches.</p></details></li>"}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Cálculo de pintura", "sub": "Calcula cuántos litros de pintura necesitas para las paredes y el techo de una habitación.", "h1": "¿Cuánta pintura necesitas?", "p1": "Pintura necesaria = superficie a pintar × número de manos ÷ rendimiento, más un margen para pérdidas y retoques. La calculadora obtiene la superficie de las paredes del perímetro y la altura de la habitación y resta puertas y ventanas; el techo es opcional.", "h2": "Fórmula", "p2": "Litros = (paredes + techo) × manos ÷ rendimiento × (1 + margen ÷ 100). El rendimiento habitual es de 8 a 12 m² por litro y mano; el valor exacto figura en el bote.", "h4": "Conviene saber", "lim": "<li>Los colores oscuros, el yeso nuevo y las superficies porosas necesitan más manos o una imprimación.</li><li>Las superficies rugosas absorben más pintura, así que baja el valor del rendimiento.</li><li>Compra toda la pintura de una vez y del mismo lote para que el tono coincida.</li>", "note": "El resultado es una estimación; comprueba el rendimiento en el bote de pintura.", "faqh": "Preguntas frecuentes", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Cómo calculo cuánta pintura necesito?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Multiplica el perímetro de la habitación por su altura, resta puertas y ventanas, multiplica por el número de manos, divide entre el rendimiento y añade un margen. Ejemplo: una habitación de 5 × 4 m y 2,6 m de altura con 1 puerta y 2 ventanas tiene unos 42,2 m² de paredes. Dos manos a 10 m² por litro con un 10 % de margen necesitan unos 9,3 litros, es decir, un bote de 10 litros.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Qué rendimiento debo introducir?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">El rendimiento habitual es de 8 a 12 m² por litro y mano; el valor exacto figura en el bote. Las superficies rugosas absorben más pintura, así que usa un valor menor.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Cuántas manos necesito?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Dos manos son lo habitual para un acabado duradero y uniforme. Los colores oscuros, el yeso nuevo y las superficies porosas pueden necesitar más manos o una imprimación previa.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Se tienen en cuenta puertas, ventanas y el techo?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">La calculadora resta 1,8 m² por cada puerta y 1,4 m² por cada ventana; para huecos mucho mayores, introduce un número más alto de puertas o ventanas. El techo es opcional: al marcar la casilla se suma una superficie igual a la del suelo, lo que en el ejemplo eleva la necesidad a unos 13,7 litros.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Por qué comprar toda la pintura de una vez?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Lotes distintos pueden variar ligeramente de tono, así que compra todo de una vez y del mismo lote. Guarda un poco sobrante para retoques.</p></details></li>"}};

const $=id=>document.getElementById(id);
const IDX={en:0,sk:1,de:2,cs:3,pl:4,fr:5,es:6},LOC={sk:'sk-SK',de:'de-DE',en:'en-GB',cs:'cs-CZ',pl:'pl-PL',fr:'fr-FR',es:'es-ES'};

}
function showRes(o){$('res').classList.toggle('hidden',!o||!!o.err);$('hint').classList.toggle('hidden',!!o);$('hint').textContent=L('hint');$('err').classList.toggle('hidden',!(o&&o.err));if(o&&o.err)$('err').textContent=L(o.err);return !!o&&!o.err}
const rows=a=>a.map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');

const g=id=>+$(id).value;
function calcAll(){
  const l=g('pl_'),w=g('pw'),h=g('ph'),d=g('pd'),n=g('pn'),c=g('pc'),v=g('pv'),u=g('pu');
  if(['pl_','pw','ph','pd','pn','pc','pv','pu'].some(id=>$(id).value===''||!isFinite(g(id))))return null;
  if(!(l>0&&l<=100&&w>0&&w<=100&&h>0&&h<=20&&d>=0&&n>=0&&c>=1&&c<=10&&v>=1&&v<=40&&u>=0&&u<=100))return null;
  const walls=2*(l+w)*h,open=d*1.8+n*1.4;if(open>=walls)return {err:'eo'};
  const aw=walls-open,ac=$('pce').checked?l*w:0,at=aw+ac,lit=at*c/v*(1+u/100);
  let r=lit,p=[];const t=Math.floor(r/10);if(t){p.push(`${t} × 10 L`);r-=t*10}
  if(r>0.0001){const s=r<=1?1:r<=2.5?2.5:r<=5?5:10;p.push(`1 × ${nf(s,1)} L`)}
  return {aw,ac,at,lit,packs:p.join(' + ')};
}
function fig(){
  const l=g('pl_'),w=g('pw'),h=g('ph'),nd=Math.min(2,Math.max(0,Math.round(g('pd'))||0)),nw=Math.min(3,Math.max(0,Math.round(g('pn'))||0)),f=v=>v.toFixed(1),nn=v=>nf(v,2),P=p=>p.map(q=>q.map(f).join(',')).join(' ');
  const ST='stroke="rgba(255,255,255,.4)" stroke-width="1" stroke-linejoin="round"',DM='fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"',TX='font-size="12" fill="#cbd2e0" font-family="inherit"';
  const Wf=150,Hf=Math.min(110,Math.max(50,Wf*h/l)),D=Math.min(110,Math.max(40,Wf*w/l)),dx=D*.55,dy=D*.3,x0=70,y0=14+dy,ceil=$('pce').checked;
  let g2=`<g ${ST}><polygon points="${P([[x0,y0],[x0+dx,y0-dy],[x0+Wf+dx,y0-dy],[x0+Wf,y0]])}" ${ceil?'fill="var(--accent)" fill-opacity=".38"':'fill="rgba(255,255,255,.07)"'}/><polygon points="${P([[x0,y0],[x0+Wf,y0],[x0+Wf,y0+Hf],[x0,y0+Hf]])}" fill="var(--accent)" fill-opacity=".2"/><polygon points="${P([[x0+Wf,y0],[x0+Wf+dx,y0-dy],[x0+Wf+dx,y0-dy+Hf],[x0+Wf,y0+Hf]])}" fill="var(--accent)" fill-opacity=".12"/></g>`;
  const items=[...Array(nd).fill('d'),...Array(nw).fill('w')],slot=Wf/(items.length+1);
  items.forEach((t,i)=>{const cx=x0+slot*(i+1);
    if(t==='d')g2+=`<rect x="${f(cx-Wf*.06)}" y="${f(y0+Hf-Hf*.62)}" width="${f(Wf*.12)}" height="${f(Hf*.62)}" fill="rgba(0,0,0,.45)" ${ST}/>`;
    else g2+=`<rect x="${f(cx-Wf*.075)}" y="${f(y0+Hf*.28)}" width="${f(Wf*.15)}" height="${f(Hf*.28)}" fill="rgba(110,150,255,.4)" ${ST}/>`;});
  const by=y0+Hf+18,lab=nn(l)+' × '+nn(w)+' × '+nn(h)+' m';
  $('fig').innerHTML=`<svg viewBox="0 0 360 200" width="100%" style="max-height:230px" role="img" aria-label="${lab}">${g2}<path ${DM} d="M${x0} ${f(by)}H${x0+Wf}M${x0} ${f(by-4)}V${f(by+4)}M${x0+Wf} ${f(by-4)}V${f(by+4)}M${x0-14} ${f(y0)}V${f(y0+Hf)}M${x0-18} ${f(y0)}H${x0-10}M${x0-18} ${f(y0+Hf)}H${x0-10}M${x0+Wf+8} ${f(y0+Hf+4)}L${f(x0+Wf+dx+8)} ${f(y0-dy+Hf+4)}"/><text ${TX} x="${x0+Wf/2}" y="${f(by+16)}" text-anchor="middle">${nn(l)} m</text><text ${TX} x="${x0-20}" y="${f(y0+Hf/2+4)}" text-anchor="end">${nn(h)} m</text><text ${TX} x="${f(x0+Wf+dx/2+20)}" y="${f(y0+Hf-dy/2+14)}">${nn(w)} m</text></svg><p class="mt-1 text-center text-xs" style="color:#8b94a7">${L('sch')}</p>`;
}
function calc(){const o=calcAll();if(!showRes(o))return;
