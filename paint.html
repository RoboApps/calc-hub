Farbbedarf-Rechner", "sub": "Berechne, wie viele Liter Farbe du für Wände und Decke eines Raumes brauchst.", "h1": "Wie viel Farbe brauchst du?", "p1": "Farbbedarf = zu streichende Fläche × Anzahl der Anstriche ÷ Ergiebigkeit, plus Reserve für Verlust und Ausbesserungen. Der Rechner ermittelt die Wandfläche aus Umfang und Höhe des Raumes und zieht Türen und Fenster ab; die Decke ist optional.", "h2": "Formel", "p2": "Liter = (Wände + Decke) × Anstriche ÷ Ergiebigkeit × (1 + Verschnitt ÷ 100). Typisch sind 8–12 m² pro Liter und Anstrich; der genaue Wert steht auf dem Gebinde.", "h4": "Gut zu wissen", "lim": "<li>Dunkle Farben, neuer Putz und saugende Untergründe brauchen mehr Anstriche oder eine Grundierung.</li><li>Raue Flächen nehmen mehr Farbe auf, setze daher die Ergiebigkeit niedriger an.</li><li>Kaufe die ganze Farbe auf einmal und aus derselben Charge, damit der Farbton passt.</li>", "note": "Das Ergebnis ist eine Schätzung; prüfe die Ergiebigkeit auf dem Farbeimer."}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Kalkulačka spotřeby barvy", "sub": "Zjisti, kolik litrů barvy potřebuješ na stěny a strop místnosti.", "h1": "Kolik barvy potřebuješ?", "p1": "Potřebná barva = plocha k natření × počet nátěrů ÷ výdatnost plus rezerva na ztráty a opravy. Kalkulačka spočítá plochu stěn z obvodu a výšky místnosti a odečte dveře a okna; strop je volitelný.", "h2": "Vzorec", "p2": "Litry = (stěny + strop) × nátěry ÷ výdatnost × (1 + rezerva ÷ 100). Typická výdatnost je 8–12 m² na litr na nátěr; přesná hodnota je uvedena na obalu.", "h4": "Dobré vědět", "lim": "<li>Tmavé barvy, nová omítka a savé povrchy potřebují více nátěrů nebo penetraci.</li><li>Drsné povrchy spotřebují více barvy, proto sniž hodnotu výdatnosti.</li><li>Kup všechnu barvu najednou a z jedné šarže, aby se odstín shodoval.</li>", "note": "Výsledek je odhad; výdatnost si ověř na obalu barvy."}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Kalkulator zużycia farby", "sub": "Sprawdź, ile litrów farby potrzebujesz na ściany i sufit pomieszczenia.", "h1": "Ile farby potrzebujesz?", "p1": "Potrzebna farba = powierzchnia do malowania × liczba warstw ÷ wydajność plus zapas na straty i poprawki. Kalkulator oblicza powierzchnię ścian z obwodu i wysokości pomieszczenia i odejmuje drzwi oraz okna; sufit jest opcjonalny.", "h2": "Wzór", "p2": "Litry = (ściany + sufit) × warstwy ÷ wydajność × (1 + zapas ÷ 100). Typowa wydajność to 8–12 m² na litr na warstwę; dokładna wartość jest na opakowaniu.", "h4": "Warto wiedzieć", "lim": "<li>Ciemne kolory, nowy tynk i chłonne powierzchnie wymagają więcej warstw lub gruntu.</li><li>Chropowate powierzchnie wchłaniają więcej farby, więc obniż wartość wydajności.</li><li>Kup całą farbę naraz i z jednej partii, aby odcień się zgadzał.</li>", "note": "Wynik jest szacunkiem; wydajność sprawdź na opakowaniu farby."}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calculateur de peinture", "sub": "Calculez combien de litres de peinture il faut pour les murs et le plafond d’une pièce.", "h1": "De quelle quantité de peinture avez-vous besoin ?", "p1": "Peinture nécessaire = surface à peindre × nombre de couches ÷ rendement, plus une marge pour les pertes et retouches. Le calculateur déduit la surface des murs du périmètre et de la hauteur de la pièce et retranche portes et fenêtres ; le plafond est facultatif.", "h2": "Formule", "p2": "Litres = (murs + plafond) × couches ÷ rendement × (1 + marge ÷ 100). Le rendement courant est de 8 à 12 m² par litre et par couche ; la valeur exacte figure sur le pot.", "h4": "Bon à savoir", "lim": "<li>Les couleurs foncées, l’enduit neuf et les supports poreux demandent plus de couches ou une sous-couche.</li><li>Les surfaces rugueuses absorbent plus de peinture : réduisez la valeur du rendement.</li><li>Achetez toute la peinture en une fois et dans le même lot pour que la teinte corresponde.</li>", "note": "Le résultat est une estimation ; vérifiez le rendement sur votre pot de peinture."}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Calculadora de pintura", "sub": "Calcula cuántos litros de pintura necesitas para las paredes y el techo de una habitación.", "h1": "¿Cuánta pintura necesitas?", "p1": "Pintura necesaria = superficie a pintar × número de manos ÷ rendimiento, más un margen para pérdidas y retoques. La calculadora obtiene la superficie de las paredes del perímetro y la altura de la habitación y resta puertas y ventanas; el techo es opcional.", "h2": "Fórmula", "p2": "Litros = (paredes + techo) × manos ÷ rendimiento × (1 + margen ÷ 100). El rendimiento habitual es de 8 a 12 m² por litro y mano; el valor exacto figura en el bote.", "h4": "Conviene saber", "lim": "<li>Los colores oscuros, el yeso nuevo y las superficies porosas necesitan más manos o una imprimación.</li><li>Las superficies rugosas absorben más pintura, así que baja el valor del rendimiento.</li><li>Compra toda la pintura de una vez y del mismo lote para que el tono coincida.</li>", "note": "El resultado es una estimación; comprueba el rendimiento en el bote de pintura."}};
const PIPE={"hint": "Fill in the dimensions to see the result.|Vyplň rozmery a zobrazí sa výsledok.|Gib die Maße ein, um das Ergebnis zu sehen.|Vyplň rozměry a zobrazí se výsledek.|Wpisz wymiary, aby zobaczyć wynik.|Renseignez les dimensions pour voir le résultat.|Introduce las medidas para ver el resultado.", "len": "Room length (m)|Dĺžka miestnosti (m)|Raumlänge (m)|Délka místnosti (m)|Długość pomieszczenia (m)|Longueur de la pièce (m)|Largo de la habitación (m)", "wid": "Room width (m)|Šírka miestnosti (m)|Raumbreite (m)|Šířka místnosti (m)|Szerokość pomieszczenia (m)|Largeur de la pièce (m)|Ancho de la habitación (m)", "hgt": "Room height (m)|Výška miestnosti (m)|Raumhöhe (m)|Výška místnosti (m)|Wysokość pomieszczenia (m)|Hauteur sous plafond (m)|Altura de la habitación (m)", "doors": "Doors (1.8 m² each)|Dvere (po 1,8 m²)|Türen (je 1,8 m²)|Dveře (po 1,8 m²)|Drzwi (po 1,8 m²)|Portes (1,8 m² chacune)|Puertas (1,8 m² cada una)", "wins": "Windows (1.4 m² each)|Okná (po 1,4 m²)|Fenster (je 1,4 m²)|Okna (po 1,4 m²)|Okna (po 1,4 m²)|Fenêtres (1,4 m² chacune)|Ventanas (1,4 m² cada una)", "ceil": "Also paint the ceiling|Natrieť aj strop|Decke mitstreichen|Natřít i strop|Pomaluj też sufit|Peindre aussi le plafond|Pintar también el techo", "coats": "Coats|Počet náterov|Anzahl Anstriche|Počet nátěrů|Liczba warstw|Nombre de couches|Número de manos", "cov": "Coverage (m² per litre per coat)|Výdatnosť (m² na liter na náter)|Ergiebigkeit (m² pro Liter und Anstrich)|Výdatnost (m² na litr na nátěr)|Wydajność (m² na litr na warstwę)|Rendement (m² par litre et par couche)|Rendimiento (m² por litro y mano)", "waste": "Waste (%)|Rezerva (%)|Verschnitt (%)|Rezerva (%)|Zapas (%)|Marge de perte (%)|Margen de pérdida (%)", "res": "Paint needed|Potrebná farba|Benötigte Farbe|Potřebná barva|Potrzebna farba|Peinture nécessaire|Pintura necesaria", "aw": "Wall area|Plocha stien|Wandfläche|Plocha stěn|Powierzchnia ścian|Surface des murs|Superficie de paredes", "ac": "Ceiling area|Plocha stropu|Deckenfläche|Plocha stropu|Powierzchnia sufitu|Surface du plafond|Superficie del techo", "at": "Area to paint|Plocha na natretie|Zu streichende Fläche|Plocha k natření|Powierzchnia do malowania|Surface à peindre|Superficie a pintar", "packs": "Suggested cans|Odporúčané balenia|Empfohlene Gebinde|Doporučená balení|Zalecane opakowania|Pots conseillés|Envases sugeridos", "eo": "The doors and windows are larger than the walls. Check the numbers.|Dvere a okná sú väčšie ako steny. Skontroluj hodnoty.|Türen und Fenster sind größer als die Wände. Prüfe die Werte.|Dveře a okna jsou větší než stěny. Zkontroluj hodnoty.|Drzwi i okna są większe niż ściany. Sprawdź wartości.|Les portes et fenêtres sont plus grandes que les murs. Vérifiez les valeurs.|Las puertas y ventanas son mayores que las paredes. Revisa los valores."};
try{const s=new URLSearchParams(location.search).get('lang')||(navigator.language||'').slice(0,2);if(T[s])lang=s}catch(e){}
const BASE='https://calc-hub.eu/paint.html',OGL={"en": "en_US", "sk": "sk_SK", "de": "de_DE", "cs": "cs_CZ", "pl": "pl_PL", "fr": "fr_FR", "es": "es_ES"},META={"en": {"t": "Paint Calculator – How Much Paint Do I Need? | calc-hub.eu", "d": "Free paint calculator: litres of paint for walls and ceiling from room size, doors, windows, coats and coverage, with suggested can sizes."}, "sk": {"t": "Kalkulačka spotreby farby – koľko farby potrebujem? | calc-hub.eu", "d": "Bezplatná kalkulačka spotreby farby: litre farby na steny a strop podľa rozmerov, dverí, okien, náterov a výdatnosti, s odporúčanými baleniami."}, "de": {"t": "Farbbedarf-Rechner – wie viel Farbe brauche ich? | calc-hub.eu", "d": "Kostenloser Farbbedarf-Rechner: Liter Farbe für Wände und Decke nach Raumgröße, Türen, Fenstern, Anstrichen und Ergiebigkeit, mit Gebindeempfehlung."}, "cs": {"t": "Kalkulačka spotřeby barvy – kolik barvy potřebuji? | calc-hub.eu", "d": "Bezplatná kalkulačka spotřeby barvy: litry barvy na stěny a strop podle rozměrů, dveří, oken, nátěrů a výdatnosti, s doporučenými baleními."}, "pl": {"t": "Kalkulator zużycia farby – ile farby potrzebuję? | calc-hub.eu", "d": "Darmowy kalkulator zużycia farby: litry farby na ściany i sufit według wymiarów, drzwi, okien, warstw i wydajności, z zalecanymi opakowaniami."}, "fr": {"t": "Calculateur de peinture – quelle quantité ? | calc-hub.eu", "d": "Calculateur de peinture gratuit : litres de peinture pour murs et plafond selon la pièce, les portes, fenêtres, couches et rendement, avec pots conseillés."}, "es": {"t": "Calculadora de pintura – ¿cuánta necesito? | calc-hub.eu", "d": "Calculadora de pintura gratis: litros para paredes y techo según la habitación, puertas, ventanas, manos y rendimiento, con envases sugeridos."}};
function applySeo(){
  const m=META[lang],q=new URLSearchParams(location.search).get('lang'),u=BASE+(q&&META[q]&&q!=='en'?'?lang='+q:'');
  document.title=m.t;
  const set=(sel,v)=>{const e=document.querySelector(sel);if(e)e.setAttribute('content',v)};
  set('meta[name="description"]',m.d);set('meta[property="og:title"]',m.t);set('meta[property="og:description"]',m.d);
  set('meta[name="twitter:title"]',m.t);set('meta[name="twitter:description"]',m.d);set('meta[property="og:url"]',u);set('meta[property="og:locale"]',OGL[lang]);
  const c=document.querySelector('link[rel="canonical"]');if(c)c.setAttribute('href',u);
  document.querySelectorAll('meta[property="og:locale:alternate"]').forEach(e=>e.remove());
  Object.keys(OGL).filter(l=>l!==lang).forEach(l=>{const e=document.createElement('meta');e.setAttribute('property','og:locale:alternate');e.setAttribute('content',OGL[l]);document.head.appendChild(e)});
}
const FT={en:['Privacy & Cookies','Privacy and cookie settings','About & contact'],sk:['Ochrana údajov a cookies','Nastavenia súkromia a cookies','O nás a kontakt'],de:['Datenschutz & Cookies','Datenschutz- und Cookie-Einstellungen','Über uns & Kontakt'],cs:['Ochrana údajů a cookies','Nastavení soukromí a cookies','O nás a kontakt'],pl:['Prywatność i cookies','Ustawienia prywatności i plików cookies','O nas i kontakt'],fr:['Confidentialité et cookies','Paramètres de confidentialité et de cookies','À propos et contact'],es:['Privacidad y cookies','Configuración de privacidad y cookies','Acerca de y contacto']};
function footLinks(){const f=document.getElementById('flinks');if(!f)return;const s='<span class="mx-2">·</span>';f.innerHTML=`<a href="about.html" class="hover:text-white">${FT[lang][2]}</a>${s}<a href="privacy.html" class="hover:text-white">${FT[lang][0]}</a>${s}<button data-cs class="hover:text-white">${FT[lang][1]}</button>`}
function propLinks(){document.querySelectorAll('a[href]').forEach(a=>{const h=a.dataset.h||(a.dataset.h=a.getAttribute('href'));if(!/^[a-z-]+\.html$/.test(h))return;a.setAttribute('href',lang==='en'?h:h+'?lang='+lang)})}
function openCs(){if(window.googlefc&&googlefc.callbackQueue&&googlefc.showRevocationMessage)googlefc.callbackQueue.push(googlefc.showRevocationMessage);else location.href='privacy.html'+(lang==='en'?'':'?lang='+lang)+'#cookies'}
document.addEventListener('click',e=>{if(e.target.closest('[data-cs]'))openCs()});
const LANGS=[['sk','Slovenčina'],['de','Deutsch'],['en','English'],['cs','Čeština'],['pl','Polski'],['fr','Français'],['es','Español']];
function syncLang(){document.getElementById('langCur').textContent=lang.toUpperCase();document.querySelectorAll('#langMenu button').forEach(b=>b.setAttribute('aria-selected',b.dataset.l===lang));footLinks();propLinks();applySeo()}
function initLang(cb){
  const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu');
  menu.innerHTML=LANGS.map(([c,n])=>`<li><button role="option" data-l="${c}"><span>${n}</span><b>${c.toUpperCase()}</b></button></li>`).join('');
  const close=()=>{menu.classList.add('hidden');btn.setAttribute('aria-expanded','false')};
  btn.addEventListener('click',e=>{e.stopPropagation();const hid=menu.classList.toggle('hidden');btn.setAttribute('aria-expanded',String(!hid))});
  menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{const u=new URL(location.href);if(lang==='en')u.searchParams.delete('lang');else u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(x){}close();cb()});
  document.addEventListener('click',close);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}

const $=id=>document.getElementById(id);
const IDX={en:0,sk:1,de:2,cs:3,pl:4,fr:5,es:6},LOC={sk:'sk-SK',de:'de-DE',en:'en-GB',cs:'cs-CZ',pl:'pl-PL',fr:'fr-FR',es:'es-ES'};
const L=k=>PIPE[k].split('|')[IDX[lang]];
const nf=(n,d=0)=>new Intl.NumberFormat(LOC[lang],{maximumFractionDigits:d}).format(n);
function baseText(){
  const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.tagName==='UL'?e.innerHTML=v:e.textContent=v});
  document.querySelectorAll('[data-p]').forEach(e=>e.textContent=L(e.dataset.p));
}
function showRes(o){$('res').classList.toggle('hidden',!o||!!o.err);$('hint').classList.toggle('hidden',!!o);$('hint').textContent=L('hint');$('err').classList.toggle('hidden',!(o&&o.err));if(o&&o.err)$('err').textContent=L(o.err);return !!o&&!o.err}
const rows=a=>a.map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');

const g=id=>+$(id).value;
function calcAll(){
  const l=g('pl_'),w=g('pw'),h=g('ph'),d=g('pd'),n=g('pn'),c=g('pc'),v=g('pv'),u=g('pu');
  if(['pl_','pw','ph','pd','pn','pc','pv','pu'].some(id=>$(id).value===''||!isFinite(g(id))))return null;
  if(!(l>0&&l<=100&&w>0&&w<=100&&h>0&&h<=20&&d>=0&&n>=0&&c>=1&&c<=10&&v>=1&&v<=40&&u>=0&&u<=100))return null;
  const walls=2*(l+w)*h,open=d*1.8+n*1.4;if(open>=walls)return {err:'eo'};
  const aw=walls-open,ac=$('pcl').checked?l*w:0,at=aw+ac,lit=at*c/v*(1+u/100);
  let r=lit,p=[];const t=Math.floor(r/10);if(t){p.push(`${t} × 10 L`);r-=t*10}
  if(r>0.0001){const s=r<=1?1:r<=2.5?2.5:r<=5?5:10;p.push(`1 × ${nf(s,1)} L`)}
  return {aw,ac,at,lit,packs:p.join(' + ')};
}
function calc(){const o=calcAll();if(!showRes(o))return;
  $('big').textContent=nf(o.lit,1)+' L';
  $('rows').innerHTML=rows([[L('aw'),nf(o.aw,1)+' m²']].concat(o.ac?[[L('ac'),nf(o.ac,1)+' m²']]:[]).concat([[L('at'),nf(o.at,1)+' m²'],[L('packs'),o.packs]]));}
function text(){baseText();$('fbox').innerHTML=`<b style="color:var(--accent)">${L('res')} = (${L('aw')} + ${L('ac')}) × ${L('coats').toLowerCase()} ÷ ${L('cov').split(' (')[0].toLowerCase()} × (1 + ${L('waste').split(' (')[0].toLowerCase()} ÷ 100)</b>`;syncLang();calc()}
['pl_','pw','ph','pd','pn','pc','pv','pu','pcl'].forEach(id=>$(id).addEventListener('input',calc));
initLang(text);text();
</script>
