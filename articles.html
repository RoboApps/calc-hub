bjem pravouhlej dosky (dĺžka × šírka × hrúbka) a pridať rezervu na straty. Príklad: terasa 4 × 3 m s hrúbkou 10 cm potrebuje 1,2 m³, čiže 1,26 m³ s 5 % rezervou. Rozoberá aj betónové stĺpy, odhad počtu vriec a časté chyby, napríklad miešanie centimetrov a metrov.<br><br><a class=\"underline\" style=\"color:var(--accent)\" href=\"https://medium.com/@robopp64/how-much-concrete-do-you-need-a-simple-guide-to-calculating-concrete-volume-298cf76b1a4e\" target=\"_blank\" rel=\"noopener\">Čítať článok na Medium (anglicky) →</a><br><a class=\"underline\" style=\"color:var(--accent)\" href=\"concrete.html\">Otvoriť kalkulačku betónu →</a>"]]}, "de": {"back": "← Zurück zu den Rechnern", "title": "Ratgeber & Artikel", "upd": "Zuletzt aktualisiert", "date": "26. November 2026", "sec": [["intro", "Kurze Ratgeber für alltägliche Berechnungen", "Praktische Ratgeber des Autors von calc-hub.eu zur Berechnung von Mengen für Bau, Malerarbeiten und Heimprojekte. Jeder Ratgeber enthält eine kurze Zusammenfassung, einen Link zum vollständigen Artikel und einen Link zum passenden kostenlosen Rechner auf dieser Seite. Neue Ratgeber kommen nach und nach hinzu."], ["concrete", "How Much Concrete Do You Need? A Simple Guide to Calculating Concrete Volume", "Planst du eine Terrasse, eine Einfahrt oder ein Fundament? Diese Schritt-für-Schritt-Anleitung zeigt, wie man das Projekt ausmisst, das Volumen einer rechteckigen Platte (Länge × Breite × Dicke) berechnet und eine Reserve für Verluste addiert. Beispiel: Eine Terrasse von 4 × 3 m mit 10 cm Dicke braucht 1,2 m³, mit 5 % Reserve also 1,26 m³. Außerdem geht es um Betonsäulen, die Schätzung der Sackzahl und typische Fehler wie das Vermischen von Zentimetern und Metern.<br><br><a class=\"underline\" style=\"color:var(--accent)\" href=\"https://medium.com/@robopp64/how-much-concrete-do-you-need-a-simple-guide-to-calculating-concrete-volume-298cf76b1a4e\" target=\"_blank\" rel=\"noopener\">Artikel auf Medium lesen (Englisch) →</a><br><a class=\"underline\" style=\"color:var(--accent)\" href=\"concrete.html\">Betonrechner öffnen →</a>"]]}, "cs": {"back": "← Zpět na kalkulačky", "title": "Návody a články", "upd": "Naposledy aktualizováno", "date": "26. listopadu 2026", "sec": [["intro", "Stručné návody na každodenní výpočty", "Praktické návody autora calc-hub.eu o tom, jak spočítat množství pro stavbu, malování a domácí projekty. Každý návod má krátké shrnutí, odkaz na celý článek a odkaz na příslušnou bezplatnou kalkulačku na tomto webu. Nové návody přibývají postupně."], ["concrete", "How Much Concrete Do You Need? A Simple Guide to Calculating Concrete Volume", "Plánuješ terasu, příjezdovou cestu nebo základy? Tento návod krok za krokem ukazuje, jak změřit projekt, spočítat objem pravoúhlé desky (délka × šířka × tloušťka) a přidat rezervu na ztráty. Příklad: terasa 4 × 3 m o tloušťce 10 cm potřebuje 1,2 m³, tedy 1,26 m³ s 5% rezervou. Probírá i betonové sloupy, odhad počtu pytlů a časté chyby, například míchání centimetrů a metrů.<br><br><a class=\"underline\" style=\"color:var(--accent)\" href=\"https://medium.com/@robopp64/how-much-concrete-do-you-need-a-simple-guide-to-calculating-concrete-volume-298cf76b1a4e\" target=\"_blank\" rel=\"noopener\">Číst článek na Medium (anglicky) →</a><br><a class=\"underline\" style=\"color:var(--accent)\" href=\"concrete.html\">Otevřít kalkulačku betonu →</a>"]]}, "pl": {"back": "← Wróć do kalkulatorów", "title": "Poradniki i artykuły", "upd": "Ostatnia aktualizacja", "date": "26 listopada 2026", "sec": [["intro", "Krótkie poradniki do codziennych obliczeń", "Praktyczne poradniki autora calc-hub.eu o tym, jak obliczać ilości do budowy, malowania i projektów domowych. Każdy poradnik zawiera krótkie streszczenie, link do pełnego artykułu i link do odpowiedniego bezpłatnego kalkulatora na tej stronie. Nowe poradniki będą dodawane stopniowo."], ["concrete", "How Much Concrete Do You Need? A Simple Guide to Calculating Concrete Volume", "Planujesz taras, podjazd lub fundament?   Object.keys(OGL).filter(l=>l!==lang).forEach(l=>{const e=document.createElement('meta');e.setAttribute('property','og:locale:alternate');e.setAttribute('content',OGL[l]);document.head.appendChild(e)});
}
const FT={en:['Privacy & Cookies','Privacy and cookie settings','About & contact'],sk:['Ochrana údajov a cookies','Nastavenia súkromia a cookies','O nás a kontakt'],de:['Datenschutz & Cookies','Datenschutz- und Cookie-Einstellungen','Über uns & Kontakt'],cs:['Ochrana údajů a cookies','Nastavení soukromí a cookies','O nás a kontakt'],pl:['Prywatność i cookies','Ustawienia prywatności i plików cookies','O nas i kontakt'],fr:['Confidentialité et cookies','Paramètres de confidentialité et de cookies','À propos et contact'],es:['Privacidad y cookies','Configuración de privacidad y cookies','Acerca de y contacto']};
function footLinks(){const f=document.getElementById('flinks');if(!f)return;const s='<span class="mx-2">·</span>';f.innerHTML=`<a href="about.html" class="hover:text-white">${FT[lang][2]}</a>${s}<a href="privacy.html" class="hover:text-white">${FT[lang][0]}</a>${s}<button data-cs class="hover:text-white">${FT[lang][1]}</button>`}
function propLinks(){document.querySelectorAll('a[href]').forEach(a=>{const h=a.dataset.h||(a.dataset.h=a.getAttribute('href'));if(!/^[a-z-]+\.html$/.test(h))return;a.setAttribute('href',lang==='en'?h:h+'?lang='+lang)})}
function openCs(){if(window.googlefc&&googlefc.callbackQueue&&googlefc.showRevocationMessage)googlefc.callbackQueue.push(googlefc.showRevocationMessage);else location.href='privacy.html'+(lang==='en'?'':'?lang='+lang)+'#cookies'}
document.addEventListener('click',e=>{if(e.target.closest('[data-cs]'))openCs()});
const LANGS=[['sk','Slovenčina'],['de','Deutsch'],['en','English'],['cs','Čeština'],['pl','Polski'],['fr','Français'],['es','Español']];
function syncLang(){document.getElementById('langCur').textContent=lang.toUpperCase();document.querySelectorAll('#langMenu button').forEach(b=>b.setAttribute('aria-selected',b.dataset.l===lang));footLinks();propLinks();applySeo()}
function initLang(cb){
  const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu');
  menu.innerHTML=LANGS.map(([c,n])=>`<li><button role="option" data-l="${c}"><span>${n}</span><b>${c.toUpperCase()}</b></button></li>`).join('');
  const close=()=>{menu.classList.add('hidden');btn.setAttribute('aria-expanded','false')};
  btn.addEventListener('click',e=>{e.stopPropagation();const hid=menu.classList.toggle('hidden');btn.setAttribute('aria-expanded',String(!hid))});
  menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{const u=new URL(location.href);if(lang==='en')u.searchParams.delete('lang');else u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(x){}close();cb()});
  document.addEventListener('click',close);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}
const $=id=>document.getElementById(id);
const PH=/\[(OPERATOR NAME|ADDRESS|E-MAIL)\]/g;
function text(){
  const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.textContent=v});
  $('upd').textContent=X.upd+': '+X.date;
  $('sections').innerHTML=X.sec.map(([id,h,p])=>`<section id="${id}"><h2 class="text-2xl font-semibold text-white">${h}</h2><p class="mt-3 leading-relaxed" style="color:#a3acbf">${p.replace(PH,'<span class="ph">$&</span>')}</p>${id==='cookies'?`<p class="mt-4"><button class="chip" data-cs>${FT[lang][1]}</button></p>`:''}</section>`).join('');
  syncLang();
}
initLang(text);text();
if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView()}
</script>
