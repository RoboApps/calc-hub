iten berechnet dein Browser aus der IANA-Zeitzonendatenbank. Geht die Uhr deines Geräts falsch, sind auch die Ergebnisse falsch."}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Světové hodiny a časová pásma", "sub": "Podívej se na čas ve městech po celém světě, přepočítej čas mezi časovými pásmy a najdi společnou pracovní dobu pro schůzky.", "h1": "Jak fungují časová pásma", "p1": "Země je rozdělena na časová pásma, z nichž každé je určeno posunem od koordinovaného světového času (UTC), například UTC+1. Mnohé regiony posouvají hodiny na letní čas, takže se posun během roku mění. Pásma se v databázi IANA, kterou používá tvůj prohlížeč, pojmenovávají podle regionu a města, například Europe/Bratislava.", "h4": "Dobré vědět", "lim": "<li>Používej pásmo podle města, ne zkratku: „CST“ může znamenat americký střední čas, Čínu nebo Kubu.</li><li>Letní čas začíná a končí v různých regionech v jiné dny, takže rozdíl mezi dvěma městy se může několik týdnů v roce změnit o hodinu.</li><li>Některá pásma mají posun o půl hodiny nebo 45 minut, například Indie (UTC+5:30) a Nepál (UTC+5:45).</li><li>Data se mohou lišit: když je v Evropě večer, v Asii a Oceánii může být už další den.</li><li>Plánovač schůzek bere za pracovní dobu 9:00–17:00; přizpůsob si ji podle sebe.</li>", "note": "Časy počítá tvůj prohlížeč z databáze časových pásem IANA. Pokud má zařízení špatné hodiny, budou špatné i výsledky."}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Zegar światowy i strefy czasowe", "sub": "Sprawdź czas w miastach na całym świecie, przelicz godzinę między strefami czasowymi i znajdź wspólne godziny pracy na spotkania.", "h1": "Jak działają strefy czasowe", "p1": "Ziemia podzielona jest na strefy czasowe, z których każda jest określona przesunięciem względem uniwersalnego czasu koordynowanego (UTC), na przykład UTC+1. Wiele regionów przestawia zegary na czas letni, więc przesunięcie zmienia się w ciągu roku. Strefy w bazie IANA, z której korzysta Twoja przeglądarka, nazywane są od regionu i miasta, na przykład Europe/Bratislava.", "h4": "Warto wiedzieć", "lim": "<li>Używaj strefy według miasta, a nie skrótu: „CST” może oznaczać czas środkowoamerykański, Chiny albo Kubę.</li><li>Czas letni zaczyna się i kończy w różnych regionach w innych dniach, więc różnica między dwoma miastami może przez kilka tygodni w roku zmienić się o godzinę.</li><li>Niektóre strefy mają przesunięcie o pół godziny lub 45 minut, na przykład Indie (UTC+5:30) i Nepal (UTC+5:45).</li><li>Daty mogą się różnić: gdy w Europie jest wieczór, w Azji i Oceanii może być już następny dzień.</li><li>Planer spotkań przyjmuje za godziny pracy 9:00–17:00; dostosuj je do siebie.</li>", "note": "Godziny oblicza Twoja przeglądarka na podstawie bazy stref czasowych IANA. Jeśli zegar urządzenia źle chodzi, wyniki też będą błędne."}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Horloge mondiale et fuseaux horaires", "sub": "Consultez l’heure dans les villes du monde, convertissez une heure entre fuseaux horaires et trouvez des heures de travail communes pour vos réunions.", "h1": "Comment fonctionnent les fuseaux horaires", "p1": "La Terre est divisée en fuseaux horaires, chacun défini par un décalage par rapport au temps universel coordonné (UTC), par exemple UTC+1. De nombreuses régions avancent leurs horloges pour l’heure d’été, si bien que le décalage change au cours de l’année. Dans la base IANA que votre navigateur utilise, les fuseaux portent le nom d’une région et d’une ville, comme Europe/Bratislava.", "h4": "Bon à savoir", "lim": "<li>Utilisez un fuseau nommé d’après une ville plutôt qu’une abréviation : « CST » peut désigner le centre des États-Unis, la Chine ou Cuba.</li><li>L’heure d’été commence et finit à des dates différentes selon les régions, si bien que l’écart entre deux villes peut changer d’une heure pendant quelques semaines par an.</li><li>Certains fuseaux ont un décalage d’une demi-heure ou de 45 minutes, comme l’Inde (UTC+5:30) et le Népal (UTC+5:45).</li><li>Les dates peuvent différer : quand il est soir en Europe, il peut déjà être le lendemain en Asie et en Océanie.</li><li>Le planificateur considère 9 h–17 h comme heures de travail ; adaptez-le à votre emploi du temps.</li>", "note": "Les heures sont calculées par votre navigateur à partir de la base de fuseaux horaires IANA. Si l’horloge de votre appareil est fausse, les résultats le seront aussi."}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Reloj mundial y zonas horarias", "sub": "Consulta la hora en ciudades de todo el mundo, convierte una hora entre zonas horarias y encuentra horas laborables comunes para reuniones.", "h1": "Cómo funcionan las zonas horarias", "p1": "La Tierra está dividida en zonas horarias, cada una definida por un desfase respecto al tiempo universal coordinado (UTC), por ejemplo UTC+1. Muchas regiones adelantan los relojes en verano, por lo que el desfase cambia a lo largo del año. En la base de datos IANA que usa tu navegador, las zonas se nombran por región y ciudad, como Europe/Bratislava.", "h4": "Conviene saber", "lim": "<li>Usa una zona basada en una ciudad en lugar de una abreviatura: «CST» puede significar centro de EE. UU., China o Cuba.</li><li>El horario de verano empieza y termina en fechas distintas según la región, por lo que la diferencia entre dos ciudades puede cambiar una hora durante unas semanas al año.</li><li>Algunas zonas tienen desfases de media hora o 45 minutos, como India (UTC+5:30) y Nepal (UTC+5:45).</li><li>Las fechas pueden diferir: cuando en Europa es de noche, en Asia y Oceanía puede ser ya el día siguiente.</li><li>El planificador considera horario laboral de 9:00 a 17:00; ajústalo a tu situación.</li>", "note": "Tu navegador calcula las horas a partir de la base de datos de zonas horarias IANA. Si el reloj de tu dispositivo va mal, los resultados también serán erróneos."}};

  if(!zones.includes(cv.zone))cv.zone=zones[0];
  if(!cv.date){const n=Date.now();cv.date=dkey(n,cv.zone);cv.time=hm(n,cv.zone)}
  $('view').innerHTML=`<div class="grid gap-4 sm:grid-cols-3"><div><label class="block text-sm" style="color:#8b94a7">${L('date')}</label><div class="field mt-2"><input id="cvd" type="date" value="${cv.date}"></div></div><div><label class="block text-sm" style="color:#8b94a7">${L('time')}</label><div class="field mt-2"><input id="cvt" type="time" value="${cv.time}"></div></div><div><label class="block text-sm" style="color:#8b94a7">${L('tz')}</label><div class="field mt-2"><select id="cvz">${zones.map(z=>`<option value="${z}" ${z===cv.zone?'selected':''}>${city(z)}</option>`).join('')}</select></div></div></div><div id="cvr" class="mt-6 space-y-2"></div>`;
  convRows();
}
function convRows(){
  const [y,m,d]=(cv.date||'').split('-').map(Number),[h,mi]=(cv.time||'').split(':').map(Number);
  if(![y,m,d,h,mi].every(Number.isFinite)){$('cvr').innerHTML='';return}
  const t=zonedToUtc(y,m-1,d,h,mi,cv.zone),so=off(t,cv.zone),sk=dkey(t,cv.zone);
  $('cvr').innerHTML=zones.map(z=>{const o=off(t,z),dd=Math.round((Date.parse(dkey(t,z)+'T00:00:00Z')-Date.parse(sk+'T00:00:00Z'))/864e5),df=(o-so)/60;
    return `<div class="stat"><span><b class="text-white">${city(z)}</b> <span class="text-xs">${offLbl(o)}${isDst(t,z)?' · '+L('dst'):''}</span></span><b>${hm(t,z)} <span class="text-xs" style="color:#8b94a7">${f(t,z,{weekday:'short',day:'numeric',month:'short'})}${dd?` (${dd>0?'+':''}${dd})`:''} · ${df<0?'−':'+'}${nfd(Math.abs(df))} h</span></b></div>`}).join('');
}
function renderPlan(){
  if(!pdate)pdate=dkey(Date.now(),zones[0]);
  $('view').innerHTML=`<div class="grid gap-4 sm:grid-cols-2"><div><label class="block text-sm" style="color:#8b94a7">${L('date')} (${city(zones[0])})</label><div class="field mt-2"><input id="pld" type="date" value="${pdate}"></div></div></div><div id="pl" class="mt-6"></div>`;
  planRows();
}
function planRows(){
  if(zones.length<2){$('pl').innerHTML=`<p style="color:#8b94a7">${L('need')}</p>`;return}
  const [y,m,d]=(pdate||'').split('-').map(Number);if(![y,m,d].every(Number.isFinite)){$('pl').innerHTML='';return}
  const ref=zones[0],t0=zonedToUtc(y,m-1,d,0,0,ref),cls=h=>h>=9&&h<17?'w':(h>=7&&h<22?'e':'n'),all=Array(24).fill(true);
  const rows=zones.map(z=>{let cells='';for(let i=0;i<24;i++){const h=hh(t0+i*36e5,z),c=cls(h);if(c!=='w')all[i]=false;cells+=`<div class="pc ${c}">${h}</div>`}return `<div class="pr"><div class="pn" title="${city(z)}">${city(z)}</div>${cells}</div>`}).join('');
  const r=[];let s=-1;for(let i=0;i<=24;i++){if(i<24&&all[i]){if(s<0)s=i}else if(s>=0){r.push(`${s}:00–${i}:00`);s=-1}}
  $('pl').innerHTML=`<div class="overflow-x-auto"><div style="min-width:640px">${rows}</div></div><p class="mt-4 text-sm" style="color:#a3acbf"><b class="text-white">${L('common').replace('{c}',city(ref))}:</b> ${r.length?r.join(', '):L('none')}</p>`;
}
const VIEW={clock:renderClock,conv:renderConv,plan:renderPlan};
function render(){renderMgr();VIEW[mode]()}
function text(){
  const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.tagName==='UL'?e.innerHTML=v:e.textContent=v});
  document.querySelectorAll('[data-p]').forEach(e=>e.textContent=L(e.dataset.p));
  buildTabs();render();syncLang();
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;buildTabs();VIEW[mode]()});
$('zadd').addEventListener('change',e=>{const z=e.target.value;if(z&&ZL.includes(z)&&!zones.includes(z)){zones.push(z);save();render()}});
$('zchips').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b||zones.length<2)return;zones.splice(+b.dataset.rm,1);save();render()});
$('view').addEventListener('input',e=>{const id=e.target.id;if(id==='cvd'){cv.date=e.target.value;convRows()}else if(id==='cvt'){cv.time=e.target.value;convRows()}else if(id==='cvz'){cv.zone=e.target.value;convRows()}else if(id==='pld'){pdate=e.target.value;planRows()}});
setInterval(tick,1000);
initLang(text);text();
</script>
</body>
</html>
