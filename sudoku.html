k ich má tvoje viac, riešič zobrazí jedno z nich a upozorní ťa. Čísla, ktoré zadáš, nikdy neopustia tvoje zariadenie.", "h4": "Dobré vedieť", "lim": "<li>Klasické sudoku 9×9 s číslami 1–9.</li><li>Takmer prázdna mriežka má nespočetne veľa riešení; riešič ukáže len jedno.</li><li>Opakované čísla v riadku, stĺpci alebo štvorci sa nahlásia pred riešením.</li>"}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Sudoku-Löser", "sub": "Gib die bekannten Ziffern ein und erhalte sofort die komplette Lösung.", "h1": "So funktioniert der Löser", "p1": "Ein Sudoku ist gelöst, wenn jede Zeile, jede Spalte und jedes 3×3-Feld die Ziffern 1 bis 9 genau einmal enthält. Der Löser probiert stets das Feld mit den wenigsten Möglichkeiten, geht bei einer Sackgasse einen Schritt zurück und findet jede existierende Lösung. Alles läuft in deinem Browser.", "h2": "Tipps zum Selbstlösen", "p2": "Beginne mit Feldern, in die nur eine Ziffer passt (Naked Singles), und mit Ziffern, die in einer Zeile, Spalte oder einem Feld nur an einer Stelle möglich sind (Hidden Singles). Notiere kleine Kandidaten und streiche sie, während sich das Gitter füllt. Nutze den Löser zur Kontrolle oder wenn du nicht weiterkommst.", "note": "Ein korrektes Sudoku hat genau eine Lösung. Hat deines mehrere, zeigt der Löser eine davon und weist darauf hin. Deine Eingaben verlassen nie dein Gerät.", "h4": "Gut zu wissen", "lim": "<li>Klassisches 9×9-Sudoku mit den Ziffern 1–9.</li><li>Ein fast leeres Gitter hat unzählige Lösungen; der Löser zeigt nur eine.</li><li>Doppelte Ziffern in Zeile, Spalte oder Feld werden vor dem Lösen gemeldet.</li>"}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Řešič sudoku", "sub": "Zadej známá čísla a okamžitě získej celé řešení.", "h1": "Jak řešič funguje", "p1": "Sudoku je vyřešeno, když každý řádek, sloupec a čtverec 3×3 obsahuje čísla 1 až 9 právě jednou. Řešič vždy zkouší políčko s nejmenším počtem možných čísel, při slepé uličce se vrátí zpět a najde řešení, pokud existuje. Vše běží ve tvém prohlížeči.", "h2": "Tipy pro ruční řešení", "p2": "Začni políčky, kam pasuje jen jedno číslo (nahé jedničky), a čísly, která lze v řádku, sloupci nebo čtverci umístit jen na jedno místo (skryté jedničky). Poznamenej si malé kandidáty a škrtej je, jak se mřížka plní. Řešič použij ke kontrole výsledku nebo když se zasekneš.", "note": "Správně sestavené sudoku má právě jedno řešení. Pokud jich má tvoje více, řešič zobrazí jedno z nich a upozorní tě. Zadaná čísla nikdy neopustí tvé zařízení.", "h4": "Dobré vědět", "lim": "<li>Klasické sudoku 9×9 s čísly 1–9.</li><li>Téměř prázdná mřížka má nespočet řešení; řešič ukáže jen jedno.</li><li>Opakovaná čísla v řádku, sloupci nebo čtverci se ohlásí před řešením.</li>"}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Solver sudoku", "sub": "Wpisz znane cyfry i od razu uzyskaj pełne rozwiązanie.", "h1": "Jak działa solver", "p1": "Sudoku jest rozwiązane, gdy każdy wiersz, kolumna i kwadrat 3×3 zawierają cyfry od 1 do 9 dokładnie raz. Solver zawsze próbuje pola z najmniejszą liczbą możliwych cyfr, w razie ślepego zaułka cofa się i znajduje rozwiązanie, jeśli istnieje. Wszystko działa w Twojej przeglądarce.", "h2": "Wskazówki do samodzielnego rozwiązywania", "p2": "Zacznij od pól, w które pasuje tylko jedna cyfra (pojedyncze oczywiste), i od cyfr, które w wierszu, kolumnie lub kwadracie mieszczą się tylko w jednym miejscu (pojedyncze ukryte). Zapisuj małe kandydatury i skreślaj je w miarę wypełniania planszy. Solvera użyj do sprawdzenia wyniku lub gdy utkniesz.", "note": "Poprawnie ułożone sudoku ma dokładnie jedno rozwiązanie. Jeśli Twoje ma ich kilka, solver pokaże jedno z nich i o tym poinformuje. Wpisane cyfry nigdy nie opuszczają Twojego urządzenia.", "h4": "Warto wiedzieć", "lim": "<li>Klasyczne sudoku 9×9 z cyframi 1–9.</li><li>Prawie pusta plansza ma niezliczone rozwiązania; solver pokazuje tylko jedno.</li><li>Powtórzone cyfry w wierszu, kolumnie lub kwadracie są zgłaszane przed rozwiązaniem.</li>"}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Solveur de sudoku", "sub": "Saisissez les chiffres connus et obtenez aussitôt la solution complète.", "h1": "Comment fonctionne le solveur", "p1": "Un sudoku est résolu lorsque chaque ligne, chaque colonne et chaque carré 3×3 contient les chiffres de 1 à 9 exactement une fois. Le solveur choisit toujours la case qui a le moins de possibilités, revient en arrière en cas d’impasse et trouve une solution dès qu’elle existe. Tout s’exécute dans votre navigateur.", "h2": "Conseils pour résoudre à la main", "p2": "Commencez par les cases où un seul chiffre est possible (singletons nus) et par les chiffres qui ne tiennent qu’à un endroit d’une ligne, d’une colonne ou d’un carré (singletons cachés). Notez de petits candidats et barrez-les à mesure que la grille se remplit. Utilisez le solveur pour vérifier ou pour vous débloquer.", "note": "Un sudoku bien conçu a une seule solution. Si le vôtre en a plusieurs, le solveur en affiche une et vous le signale. Les chiffres saisis ne quittent jamais votre appareil.", "h4": "Bon à savoir", "lim": "<li>Sudoku classique 9×9 avec les chiffres 1 à 9.</li><li>Une grille presque vide a d’innombrables solutions ; le solveur n’en montre qu’une.</li><li>Les doublons dans une ligne, une colonne ou un carré sont signalés avant la résolution.</li>"}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Resolutor de sudoku", "sub": "Introduce los números que conoces y obtén al instante la solución completa.", "h1": "Cómo funciona el resolutor", "p1": "Un sudoku está resuelto cuando cada fila, columna y cuadro de 3×3 contiene los dígitos del 1 al 9 exactamente una vez. El resolutor prueba siempre la casilla con menos opciones, retrocede si llega a un callejón sin salida y encuentra una solución siempre que exista. Todo funciona en tu navegador.", "h2": "Consejos para resolver a mano", "p2": "Empieza por las casillas donde solo cabe un dígito (únicos desnudos) y por los dígitos que solo caben en un sitio de una fila, columna o cuadro (únicos ocultos). Anota pequeños candidatos y táchalos al llenarse la cuadrícula. Usa el resolutor para comprobar o cuando te atasques.", "note": "Un sudoku bien formado tiene una sola solución. Si el tuyo tiene varias, el resolutor muestra una y te lo indica. Los dígitos que introduces nunca salen de tu dispositivo.", "h4": "Conviene saber", "lim": "<li>Sudoku clásico de 9×9 con los dígitos 1–9.</li><li>Una cuadrícula casi vacía tiene incontables soluciones; el resolutor muestra solo una.</li><li>Los dígitos repetidos en una fila, columna o cuadro se avisan antes de resolver.</li>"}};
const PIPE={"solve": "Solve|Vyriešiť|Lösen|Vyřešit|Rozwiąż|Résoudre|Resolver", "clear": "Clear|Vymazať|Leeren|Vymazat|Wyczyść|Effacer|Borrar", "ex": "Example|Príklad|Beispiel|Příklad|Przykład|Exemple|Ejemplo", "hint": "Enter the known digits (1–9) and press Solve.|Zadaj známe čísla (1–9) a stlač Vyriešiť.|Gib die bekannten Ziffern (1–9) ein und drücke Lösen.|Zadej známá čísla (1–9) a stiskni Vyřešit.|Wpisz znane cyfry (1–9) i naciśnij Rozwiąż.|Saisissez les chiffres connus (1–9) et appuyez sur Résoudre.|Introduce los dígitos conocidos (1–9) y pulsa Resolver.", "errc": "Some digits conflict (a repeat in a row, column or box).|Niektoré čísla sú v konflikte (opakovanie v riadku, stĺpci alebo štvorci).|Einige Ziffern widersprechen sich (Wiederholung in Zeile, Spalte oder Feld).|Některá čísla jsou v konfliktu (opakování v řádku, sloupci nebo čtverci).|Niektóre cyfry są sprzeczne (powtórzenie w wierszu, kolumnie lub kwadracie).|Certains chiffres sont en conflit (doublon dans une ligne, une colonne ou un carré).|Algunos dígitos entran en conflicto (repetición en una fila, columna o cuadro).", "errn": "This puzzle has no solution. Check the digits.|Toto sudoku nemá riešenie. Skontroluj čísla.|Dieses Sudoku hat keine Lösung. Prüfe die Ziffern.|Toto sudoku nemá řešení. Zkontroluj čísla.|To sudoku nie ma rozwiązania. Sprawdź cyfry.|Ce sudoku n’a pas de solution. Vérifiez les chiffres.|Este sudoku no tiene solución. Revisa los dígitos.", "multi": "Several solutions exist; one is shown.|Existuje viac riešení; zobrazené je jedno.|Es gibt mehrere Lösungen; eine wird angezeigt.|Existuje více řešení; zobrazeno je jedno.|Istnieje kilka rozwiązań; pokazano jedno.|Plusieurs solutions existent ; une est affichée.|Existen varias soluciones; se muestra una.", "ok": "Solved. Digits added by the solver are in colour.|Vyriešené. Čísla doplnené riešičom sú farebné.|Gelöst. Vom Löser ergänzte Ziffern sind farbig.|Vyřešeno. Čísla doplněná řešičem jsou barevná.|Rozwiązane. Cyfry dodane przez solver są kolorowe.|Résolu. Les chiffres ajoutés par le solveur sont en couleur.|Resuelto. Los dígitos añadidos por el resolutor están en color."};

const BASE='https://calc-hub.eu/sudoku.html',OGL={"en": "en_US", "sk": "sk_SK", "de": "de_DE", "cs": "cs_CZ", "pl": "pl_PL", "fr": "fr_FR", "es": "es_ES"},META={"en": {"t": "Sudoku Solver – Solve Any Sudoku Online | calc-hub.eu", "d": "Free online sudoku solver: enter the digits you know and get the complete solution instantly, with a clear explanation and tips for solving by hand."}, "sk": {"t": "Riešič sudoku – vyrieš akékoľvek sudoku online | calc-hub.eu", "d": "Bezplatný online riešič sudoku: zadaj známe čísla a okamžite získaj celé riešenie, s vysvetlením a tipmi na ručné riešenie."}, "de": {"t": "Sudoku-Löser – Sudoku online lösen | calc-hub.eu", "d": "Kostenloser Sudoku-Löser: Gib die bekannten Ziffern ein und erhalte sofort die komplette Lösung, mit Erklärung und Tipps zum Selbstlösen."}, "cs": {"t": "Řešič sudoku – vyřeš jakékoli sudoku online | calc-hub.eu", "d": "Bezplatný online řešič sudoku: zadej známá čísla a okamžitě získej celé řešení, s vysvětlením a tipy pro ruční řešení."}, "pl": {"t": "Solver sudoku – rozwiąż dowolne sudoku online | calc-hub.eu", "d": "Darmowy solver sudoku online: wpisz znane cyfry i od razu uzyskaj pełne rozwiązanie, z objaśnieniem i wskazówkami do samodzielnego rozwiązywania."}, "fr": {"t": "Solveur de sudoku – résolvez un sudoku en ligne | calc-hub.eu", "d": "Solveur de sudoku gratuit : saisissez les chiffres connus et obtenez aussitôt la solution complète, avec explications et conseils pour résoudre à la main."}, "es": {"t": "Resolutor de sudoku – resuelve sudokus online | calc-hub.eu", "d": "Resolutor de sudoku gratuito: introduce los dígitos conocidos y obtén al instante la solución completa, con explicación y consejos para resolver a mano."}};
function applySeo(){

  document.title=m.t;
  const set=(sel,v)=>{const e=document.querySelector(sel);if(e)e.setAttribute('content',v)};
  set('meta[name="description"]',m.d);set('meta[property="og:title"]',m.t);set('meta[property="og:description"]',m.d);
  set('meta[name="twitter:title"]',m.t);set('meta[name="twitter:description"]',m.d);set('meta[property="og:url"]',u);set('meta[property="og:locale"]',OGL[lang]);
  const c=document.querySelector('link[rel="canonical"]');if(c)c.setAttribute('href',u);
  document.querySelectorAll('meta[property="og:locale:alternate"]').forEach(e=>e.remove());
  Object.keys(OGL).filter(l=>l!==lang).forEach(l=>{const e=document.createElement('meta');e.setAttribute('property','og:locale:alternate');e.setAttribute('content',OGL[l]);document.head.appendChild(e)});
}
const FT={en:['Privacy & Cookies','Privacy and cookie settings','About & contact'],sk:['Ochrana údajov a cookies','Nastavenia súkromia a cookies','O nás a kontakt'],de:['Datenschutz & Cookies','Datenschutz- und Cookie-Einstellungen','Über uns & Kontakt'],cs:['Ochrana údajů a cookies','Nastavení soukromí a cookies','O nás a kontakt'],pl:['Prywatność i cookies','Ustawienia prywatności i plików cookies','O nas i kontakt'],fr:['Confidentialité et cookies','Paramètres de confidentialité et de cookies','À propos et contact'],es:['Privacidad y cookies','Configuración de privacidad y cookies','Acerca de y contacto']};
function footLinks(){const f=document.getElementById('flinks');if(!f)return;const s='<span class="mx-2">·</span>';f.innerHTML=`<a href="about.html" class="hover:text-white">${FT[lang][2]}</a>${s}<a href="privacy.html" class="hover:text-white">${FT[lang][0]}</a>${s}<button data-cs class="hover:text-white">${FT[lang][1]}</button>`}
function propLinks(){document.querySelectorAll('a[href]').forEach(a=>{const h=a.dataset.h||(a.dataset.h=a.getAttribute('href'));if(!/^[a-z-]+\.html$/.test(h))return;a.setAttribute('href',lang==='en'?h:h+'?lang='+lang)})}
function openCs(){if(window.googlefc&&googlefc.callbackQueue&&googlefc.showRevocationMessage)googlefc.callbackQueue.push(googlefc.showRevocationMessage);else location.href='privacy.html'+(lang==='en'?'':'?lang='+lang)+'#cookies'}
document.addEventListener('click',e=>{if(e.target.closest('[data-cs]'))openCs()});
const LANGS=[['sk','Slovenčina'],['de','Deutsch'],['en','English'],['cs','Čeština'],['pl','Polski'],['fr','Français'],['es','Español']];
function syncLang(){document.getElementById('langCur').textContent=lang.toUpperCase();document.querySelectorAll('#langMenu button').forEach(b=>b.setAttribute('aria-selected',b.dataset.l===lang));footLinks();propLinks();applySeo()}
function initLang(cb){
  const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu');
  menu.innerHTML=LANGS.map(([c,n])=>`<li><button role="option" data-l="${c}"><span>${n}</span><b>${c.toUpperCase()}</b></button></li>`).join('');
  const close=()=>{menu.classList.add('hidden');btn.setAttribute('aria-expanded','false')};
  btn.addEventListener('click',e=>{e.stopPropagation();const hid=menu.classList.toggle('hidden');btn.setAttribute('aria-expanded',String(!hid))});
  menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{const u=new URL(location.href);if(lang==='en')u.searchParams.delete('lang');else u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(x){}close();cb()});
  document.addEventListener('click',close);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}

const $=id=>document.getElementById(id);
const IDX={en:0,sk:1,de:2,cs:3,pl:4,fr:5,es:6};
const L=k=>PIPE[k].split('|')[IDX[lang]];
function baseText(){const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.tagName==='UL'?e.innerHTML=v:e.textContent=v})}
function solveGrid(g){g=g.slice();const R=Array(9).fill(0),C=Array(9).fill(0),B=Array(9).fill(0);
  for(let i=0;i<81;i++){const v=g[i];if(!v)continue;const r=i/9|0,c=i%9,b=(r/3|0)*3+(c/3|0),m=1<<v;if((R[r]|C[c]|B[b])&m)return{c:1};R[r]|=m;C[c]|=m;B[b]|=m}
  let n=0,sol=null;
  function go(){let best=-1,bm=0,bc=10;
    for(let i=0;i<81;i++){if(g[i])continue;const r=i/9|0,c=i%9,b=(r/3|0)*3+(c/3|0),m=~(R[r]|C[c]|B[b])&0x3fe;let k=0,x=m;while(x){k++;x&=x-1}if(k<bc){bc=k;best=i;bm=m;if(k<2)break}}
    if(best<0){n++;if(!sol)sol=g.slice();return n>1}
    if(bc===0)return false;
    const r=best/9|0,c=best%9,b=(r/3|0)*3+(c/3|0);
    for(let v=1;v<10;v++){const m=1<<v;if(!(bm&m))continue;g[best]=v;R[r]|=m;C[c]|=m;B[b]|=m;const st=go();g[best]=0;R[r]&=~m;C[c]&=~m;B[b]&=~m;if(st)return true}
    return false}
  go();return{n,sol}}
const cells=[];let lk='hint',le=0;
function msg(k,e){lk=k;le=e||0;const m=$('msg');m.textContent=L(k);m.style.color=le?'#f87171':k==='hint'?'#8b94a7':'#2ee6a6'}
function unsolve(){cells.forEach(c=>{if(c.classList.contains('s')){c.value='';c.classList.remove('s')}})}
function solve(){unsolve();const g=cells.map(c=>+c.value||0);if(!g.some(Boolean))return msg('hint');
  const o=solveGrid(g);if(o.c)return msg('errc',1);if(!o.sol)return msg('errn',1);
  cells.forEach((c,i)=>{if(!c.value){c.value=o.sol[i];c.classList.add('s')}});msg(o.n>1?'multi':'ok')}
function fill(s){cells.forEach((c,i)=>{c.value=+s[i]?s[i]:'';c.classList.remove('s')});msg('hint')}
function build(){const b=$('board');
  for(let i=0;i<81;i++){const r=i/9|0,c=i%9,e=document.createElement('input');e.type='text';e.inputMode='numeric';e.maxLength=1;e.autocomplete='off';
    e.setAttribute('aria-label',(r+1)+'×'+(c+1));e.className=(c%3==2&&c<8?'r3 ':'')+(r%3==2&&r<8?'b3':'');e.dataset.i=i;b.appendChild(e);cells.push(e)}
  b.addEventListener('input',e=>{const t=e.target;t.classList.remove('s');t.value=t.value.replace(/[^1-9]/g,'').slice(-1);unsolve();if(lk!=='hint')msg('hint');if(t.value&&+t.dataset.i<80)cells[+t.dataset.i+1].focus()});
  b.addEventListener('focusin',e=>e.target.select());
  b.addEventListener('keydown',e=>{const i=+e.target.dataset.i,m={ArrowLeft:-1,ArrowRight:1,ArrowUp:-9,ArrowDown:9}[e.key];
    if(m!==undefined){if(i+m>=0&&i+m<81){cells[i+m].focus();e.preventDefault()}}else if(e.key==='Backspace'&&!e.target.value&&i>0)cells[i-1].focus()})}
function text(){baseText();$('bs').textContent=L('solve');$('bx').textContent=L('ex');$('bc').textContent=L('clear');msg(lk,le);syncLang()}
$('bs').onclick=solve;$('bx').onclick=()=>fill('530070000600195000098000060800060003400803001700020006060000280000419005000080079');$('bc').onclick=()=>fill('0'.repeat(81));
build();initLang(text);text();
