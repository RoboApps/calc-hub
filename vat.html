einer Steuerbehörde oder Steuerberatung."}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Kalkulačka DPH", "sub": "Přidej DPH k ceně bez DPH nebo ji odečti z ceny s DPH, s běžnými sazbami pro rok 2026.", "h1": "Co je DPH?", "p1": "Daň z přidané hodnoty (DPH) je spotřební daň přidávaná v každém kroku dodavatelského řetězce, kterou nakonec platí konečný spotřebitel. Podnikatelé účtují DPH při prodeji a odečítají DPH zaplacenou při nákupech, takže se zdaňuje jen hodnota, kterou přidají.", "h2": "Jak se DPH počítá", "p2": "Pro přidání DPH vynásob cenu bez DPH číslem (1 + sazba ÷ 100). Pro odečtení z ceny s DPH dělíš stejným číslem. Výše DPH je rozdíl mezi cenou s DPH a bez DPH.", "h4": "Dobré vědět", "lim": "<li>Sazbu neodečítej přímo od ceny s DPH: při 21 % DPH je daň asi 17,4 % z ceny s DPH, ne 21 %.</li><li>Různé zboží může mít ve stejné zemi různé sazby; kalkulačka používá sazbu, kterou zvolíš.</li><li>Sazby se mění. Předvolby ukazují základní a hlavní snížené sazby zveřejněné pro rok 2026 v době psaní; vždy si ověř u finančního úřadu.</li><li>Ceny pro spotřebitele v EU se obvykle uvádějí s DPH, ceny pro podnikatele často bez ní.</li>", "note": "Nejde o daňové poradenství. Aktuální pravidla si ověř u finančního úřadu nebo účetní."}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Kalkulator VAT", "sub": "Dodaj VAT do ceny netto lub wyodrębnij go z ceny brutto, ze standardowymi stawkami na 2026.", "h1": "Czym jest VAT?", "p1": "Podatek od wartości dodanej (VAT) to podatek konsumpcyjny naliczany na każdym etapie łańcucha dostaw, który ostatecznie płaci konsument końcowy. Przedsiębiorcy naliczają VAT od sprzedaży i odliczają VAT zapłacony przy zakupach, więc opodatkowana jest tylko wartość, którą dodają.", "h2": "Jak oblicza się VAT", "p2": "Aby dodać VAT, pomnóż cenę netto przez (1 + stawka ÷ 100). Aby wyodrębnić go z ceny brutto, podziel przez ten sam czynnik. Kwota VAT to różnica między ceną brutto a netto.", "h4": "Warto wiedzieć", "lim": "<li>Nie odejmuj stawki bezpośrednio od ceny brutto: przy VAT 23 % podatek to około 18,7 % ceny brutto, a nie 23 %.</li><li>Różne towary mogą mieć w tym samym kraju różne stawki; kalkulator używa wybranej przez Ciebie stawki.</li><li>Stawki się zmieniają. Ustawienia wstępne pokazują stawki podstawowe i główne obniżone na 2026 w chwili pisania; zawsze sprawdź w urzędzie skarbowym.</li><li>Ceny dla konsumentów w UE zwykle podaje się z VAT, a ceny dla firm często bez.</li>", "note": "To nie jest porada podatkowa. Aktualne przepisy sprawdź w urzędzie skarbowym lub u księgowego."}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calculateur de TVA", "sub": "Ajoutez la TVA à un prix HT ou retirez-la d’un prix TTC, avec les taux courants de 2026.", "h1": "Qu’est-ce que la TVA ?", "p1": "La taxe sur la valeur ajoutée (TVA) est un impôt sur la consommation ajouté à chaque étape de la chaîne d’approvisionnement et supporté in fine par le consommateur final. Les entreprises facturent la TVA sur leurs ventes et récupèrent celle payée sur leurs achats, de sorte que seule la valeur qu’elles ajoutent est taxée.", "h2": "Comment calculer la TVA", "p2": "Pour ajouter la TVA, multipliez le prix HT par (1 + taux ÷ 100). Pour la retirer d’un prix TTC, divisez par le même facteur. Le montant de la TVA est la différence entre le TTC et le HT.", "h4": "Bon à savoir", "lim": "<li>Ne soustrayez pas le taux directement du prix TTC : à 20 % de TVA, la taxe représente environ 16,7 % du prix TTC, pas 20 %.</li><li>Des biens différents peuvent avoir des taux différents dans le même pays ; ce calculateur utilise le taux que vous choisissez.</li><li>Les taux changent. Les préréglages montrent les taux normaux et principaux taux réduits publiés pour 2026 au moment de la rédaction ; vérifiez toujours auprès de l’administration fiscale.</li><li>Les prix aux consommateurs dans l’UE sont généralement affichés TTC, ceux entre professionnels souvent HT.</li>", "note": "Ceci n’est pas un conseil fiscal. Vérifiez les règles en vigueur auprès de l’administration fiscale ou d’un comptable."}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Calculadora de IVA", "sub": "Añade el IVA a un precio sin IVA o quítalo de un precio con IVA, con los tipos habituales de 2026.", "h1": "¿Qué es el IVA?", "p1": "El impuesto sobre el valor añadido (IVA) es un impuesto al consumo que se añade en cada fase de la cadena de suministro y que paga finalmente el consumidor final. Las empresas cobran IVA en sus ventas y recuperan el IVA que pagaron en sus compras, de modo que solo se grava el valor que añaden.", "h2": "Cómo se calcula el IVA", "p2": "Para añadir el IVA, multiplica el precio sin IVA por (1 + tipo ÷ 100). Para quitarlo de un precio con IVA, divide entre el mismo factor. El importe del IVA es la diferencia entre el total y la base.", "h4": "Conviene saber", "lim": "<li>No restes el tipo directamente del precio con IVA: con un 21 % de IVA, el impuesto es aproximadamente el 17,4 % del precio con IVA, no el 21 %.</li><li>Distintos bienes pueden tener tipos diferentes en el mismo país; la calculadora usa el tipo que elijas.</li><li>Los tipos cambian. Los valores predefinidos muestran los tipos general y reducidos principales publicados para 2026 al redactar esto; comprueba siempre con la administración tributaria.</li><li>Los precios al consumidor en la UE suelen mostrarse con IVA incluido, y muchos precios entre empresas sin él.</li>", "note": "No es asesoramiento fiscal. Consulta la normativa vigente con la administración tributaria o un asesor."}};

const LANGS=[['sk','Slovenčina'],['de','Deutsch'],['en','English'],['cs','Čeština'],['pl','Polski'],['fr','Français'],['es','Español']];

function initLang(cb){
  const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu');
  menu.innerHTML=LANGS.map(([c,n])=>`<li><button role="option" data-l="${c}"><span>${n}</span><b>${c.toUpperCase()}</b></button></li>`).join('');
  const close=()=>{menu.classList.add('hidden');btn.setAttribute('aria-expanded','false')};
  btn.addEventListener('click',e=>{e.stopPropagation();const hid=menu.classList.toggle('hidden');btn.setAttribute('aria-expanded',String(!hid))});
