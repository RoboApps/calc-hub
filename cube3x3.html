const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "3×3 Cube Solver", "sub": "Paint the stickers like your cube and get a short step-by-step solution.", "h1": "How to read the moves", "p1": "Hold the cube like the diagram: the face you painted on top is up and the second face of the middle row is toward you. Each letter turns one face a quarter turn clockwise as you look at that face: U up, D down, R right, L left, F front, B back. A prime (R') means counter-clockwise and a 2 (R2) means a half turn.", "h2": "How the solver works", "p2": "The solver uses a two-phase method. First it brings the cube into a smaller set of positions (all pieces correctly oriented, the middle-layer edges in the middle layer), then it finishes using only moves that keep that property. It usually finds a solution of about 20 moves in a fraction of a second; the shortest possible solution never exceeds 20 moves, but proving it for every cube takes far longer.", "note": "The first solve may take a moment while the solver prepares its tables. Everything runs in your browser and the colours you paint never leave your device. If an error appears, check that you copied the colours correctly, since a single wrong sticker makes the cube impossible.", "h4": "Good to know", "lim": "<li>Works with the 3×3 cube in any colour scheme; the centre stickers define the face colours.</li><li>Each of the 6 colours must appear exactly 9 times and the cube must be physically possible.</li><li>The solution is short but not always the shortest possible.</li>"}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Riešič kocky 3×3", "sub": "Vyfarbi nálepky podľa svojej kocky a získaj krátke riešenie krok za krokom.", "h1": "Ako čítať ťahy", "p1": "Drž kocku tak ako na schéme: stena hore je vrch a druhá stena v strednom rade smeruje k tebe. Každé písmeno otočí jednu stenu o štvrť otáčky v smere hodinových ručičiek, keď sa na ňu pozeráš: U hore, D dole, R vpravo, L vľavo, F vpredu, B vzadu. Apostrof (R') znamená proti smeru hodín a dvojka (R2) pol otáčky.", "h2": "Ako riešič funguje", "p2": "Riešič používa dvojfázovú metódu. Najprv dostane kocku do menšej množiny pozícií (všetky dieliky správne orientované, hrany strednej vrstvy v strednej vrstve) a potom ju dokončí ťahmi, ktoré túto vlastnosť zachovávajú. Zvyčajne nájde riešenie s asi 20 ťahmi za zlomok sekundy; najkratšie možné riešenie nikdy nepresiahne 20 ťahov, ale hľadať ho pre každú kocku trvá oveľa dlhšie.", "note": "Prvé riešenie môže chvíľu trvať, kým riešič pripraví svoje tabuľky. Všetko beží v tvojom prehliadači a farby, ktoré zadáš, nikdy neopustia tvoje zariadenie. Ak sa objaví chyba, skontroluj, či si farby prepísal správne, pretože jediná zlá nálepka robí kocku nemožnou.", "h4": "Dobré vedieť", "lim": "<li>Funguje pre kocku 3×3 s ľubovoľným rozložením farieb; farby stien určujú stredové nálepky.</li><li>Každá zo 6 farieb sa musí vyskytnúť presne 9-krát a kocka musí byť fyzicky možná.</li><li>Riešenie je krátke, ale nie vždy najkratšie možné.</li>"}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "3×3-Würfel-Löser", "sub": "Färbe die Felder wie deinen Würfel und erhalte eine kurze Lösung Schritt für Schritt.", "h1": "So liest du die Züge", "p1": "Halte den Würfel wie im Schema: Die oben gefärbte Fläche zeigt nach oben, die zweite Fläche der mittleren Reihe zu dir. Jeder Buchstabe dreht eine Fläche um eine Vierteldrehung im Uhrzeigersinn, wenn du auf sie schaust: U oben, D unten, R rechts, L links, F vorn, B hinten. Ein Apostroph (R') bedeutet gegen den Uhrzeigersinn, eine 2 (R2) eine halbe Drehung.", "h2": "So funktioniert der Löser", "p2": "Der Löser arbeitet in zwei Phasen. Zuerst bringt er den Würfel in eine kleinere Menge von Stellungen (alle Teile richtig orientiert, die Mittelschicht-Kanten in der Mittelschicht) und beendet ihn dann nur mit Zügen, die diese Eigenschaft erhalten. Meist findet er in Sekundenbruchteilen eine Lösung mit etwa 20 Zügen; die kürzestmögliche Lösung hat nie mehr als 20 Züge, sie für jeden Würfel zu beweisen dauert aber viel länger.", "note": "Die erste Lösung kann einen Moment dauern, während der Löser seine Tabellen vorbereitet. Alles läuft in deinem Browser, die Farben verlassen nie dein Gerät. Erscheint ein Fehler, prüfe, ob du die Farben richtig übertragen hast, denn ein einziger falscher Aufkleber macht den Würfel unmöglich.", "h4": "Gut zu wissen", "lim": "<li>Funktioniert mit dem 3×3-Würfel in jeder Farbanordnung; die Mittelfelder legen die Flächenfarben fest.</li><li>Jede der 6 Farben muss genau 9-mal vorkommen, und der Würfel muss physikalisch möglich sein.</li><li>Die Lösung ist kurz, aber nicht immer die kürzestmögliche.</li>"}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Řešič kostky 3×3", "sub": "Vybarvi nálepky podle své kostky a získej krátké řešení krok za krokem.", "h1": "Jak číst tahy", "p1": "Drž kostku jako na schématu: stěna nahoře je vršek a druhá stěna ve středním řadě míří k tobě. Každé písmeno otočí jednu stěnu o čtvrt otáčky po směru hodinových ručiček, když se na ni díváš: U nahoře, D dole, R vpravo, L vlevo, F vpředu, B vzadu. Apostrof (R') znamená proti směru hodin a dvojka (R2) půl otáčky.", "h2": "Jak řešič funguje", "p2": "Řešič používá dvoufázovou metodu. Nejprve dostane kostku do menší množiny pozic (všechny dílky správně orientované, hrany prostřední vrstvy v prostřední vrstvě) a poté ji dokončí tahy, které tuto vlastnost zachovávají. Obvykle najde řešení s asi 20 tahy za zlomek sekundy; nejkratší možné řešení nikdy nepřesáhne 20 tahů, ale hledat ho pro každou kostku trvá mnohem déle.", "note": "První řešení může chvíli trvat, než řešič připraví své tabulky. Vše běží ve tvém prohlížeči a barvy, které zadáš, nikdy neopustí tvé zařízení. Pokud se objeví chyba, zkontroluj, zda jsi barvy přepsal správně, protože jediná špatná nálepka činí kostku nemožnou.", "h4": "Dobré vědět", "lim": "<li>Funguje pro kostku 3×3 s libovolným rozmístěním barev; barvy stěn určují středové nálepky.</li><li>Každá ze 6 barev se musí vyskytnout přesně 9krát a kostka musí být fyzicky možná.</li><li>Řešení je krátké, ale ne vždy nejkratší možné.</li>"}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Solver kostki 3×3", "sub": "Pokoloruj naklejki jak na swojej kostce i uzyskaj krótkie rozwiązanie krok po kroku.", "h1": "Jak czytać ruchy", "p1": "Trzymaj kostkę jak na schemacie: ściana na górze jest górą, a druga ściana środkowego rzędu jest zwrócona do ciebie. Każda litera obraca jedną ścianę o ćwierć obrotu zgodnie z ruchem wskazówek zegara, gdy na nią patrzysz: U góra, D dół, R prawa, L lewa, F przód, B tył. Apostrof (R') oznacza obrót przeciwny, a 2 (R2) pół obrotu.", "h2": "Jak działa solver", "p2": "Solver działa dwufazowo. Najpierw sprowadza kostkę do mniejszego zbioru układów (wszystkie elementy poprawnie zorientowane, krawędzie środkowej warstwy w środkowej warstwie), a potem kończy ruchami, które tę własność zachowują. Zwykle znajduje rozwiązanie z około 20 ruchami w ułamku sekundy; najkrótsze możliwe rozwiązanie nigdy nie przekracza 20 ruchów, ale szukanie go dla każdej kostki trwa znacznie dłużej.", "note": "Pierwsze rozwiązanie może chwilę potrwać, gdy solver przygotowuje tabele. Wszystko działa w Twojej przeglądarce, a kolory nigdy nie opuszczają Twojego urządzenia. Jeśli pojawi się błąd, sprawdź, czy poprawnie przepisałeś kolory, bo jedna błędna naklejka sprawia, że kostka jest niemożliwa.", "h4": "Warto wiedzieć", "lim": "<li>Działa dla kostki 3×3 z dowolnym układem kolorów; kolory ścian wyznaczają środkowe naklejki.</li><li>Każdy z 6 kolorów musi wystąpić dokładnie 9 razy, a kostka musi być fizycznie możliwa.</li><li>Rozwiązanie jest krótkie, ale nie zawsze najkrótsze z możliwych.</li>"}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Solveur de cube 3×3", "sub": "Coloriez les autocollants comme votre cube et obtenez une solution courte, pas à pas.", "h1": "Comment lire les mouvements", "p1": "Tenez le cube comme sur le schéma : la face du haut est vers le haut et la deuxième face de la rangée du milieu vous fait face. Chaque lettre tourne une face d’un quart de tour dans le sens horaire quand on la regarde : U haut, D bas, R droite, L gauche, F avant, B arrière. Une apostrophe (R') signifie sens antihoraire et un 2 (R2) un demi-tour.", "h2": "Comment fonctionne le solveur", "p2": "Le solveur procède en deux phases. Il amène d’abord le cube dans un ensemble de positions plus petit (toutes les pièces bien orientées, les arêtes de la couche du milieu dans cette couche), puis termine avec des mouvements qui conservent cette propriété. Il trouve en général une solution d’environ 20 mouvements en une fraction de seconde ; la solution la plus courte ne dépasse jamais 20 mouvements, mais la trouver pour chaque cube prend bien plus de temps.", "note": "La première résolution peut prendre un instant, le temps que le solveur prépare ses tables. Tout s’exécute dans votre navigateur et les couleurs saisies ne quittent jamais votre appareil. En cas d’erreur, vérifiez que vous avez bien recopié les couleurs : un seul autocollant erroné rend le cube impossible.", "h4": "Bon à savoir", "lim": "<li>Fonctionne pour le cube 3×3 avec n’importe quel schéma de couleurs ; les centres définissent les couleurs des faces.</li><li>Chacune des 6 couleurs doit apparaître exactement 9 fois et le cube doit être physiquement possible.</li><li>La solution est courte, mais pas toujours la plus courte possible.</li>"}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Resolutor de cubo 3×3", "sub": "Colorea las pegatinas como tu cubo y obtén una solución corta paso a paso.", "h1": "Cómo leer los movimientos", "p1": "Sujeta el cubo como en el esquema: la cara de arriba mira hacia arriba y la segunda cara de la fila central te mira a ti. Cada letra gira una cara un cuarto de vuelta en sentido horario al mirarla: U arriba, D abajo, R derecha, L izquierda, F frente, B atrás. Un apóstrofo (R') significa sentido antihorario y un 2 (R2) media vuelta.", "h2": "Cómo funciona el resolutor", "p2": "El resolutor trabaja en dos fases. Primero lleva el cubo a un conjunto menor de posiciones (todas las piezas bien orientadas, las aristas de la capa central en la capa central) y luego lo termina con movimientos que conservan esa propiedad. Suele encontrar una solución de unos 20 movimientos en una fracción de segundo; la solución más corta nunca supera los 20 movimientos, pero hallarla para cada cubo lleva mucho más tiempo.", "note": "La primera resolución puede tardar un momento mientras el resolutor prepara sus tablas. Todo funciona en tu navegador y los colores que introduces nunca salen de tu dispositivo. Si aparece un error, comprueba que copiaste bien los colores, ya que una sola pegatina errónea hace imposible el cubo.", "h4": "Conviene saber", "lim": "<li>Funciona con el cubo 3×3 con cualquier esquema de colores; las pegatinas centrales definen los colores de las caras.</li><li>Cada uno de los 6 colores debe aparecer exactamente 9 veces y el cubo debe ser físicamente posible.</li><li>La solución es corta, pero no siempre la más corta posible.</li>"}};

const qmap=(list,mv)=>list.map((c,i)=>{if(c.p[mv.a]!==mv.s)return[i,0];const q=list.findIndex(h=>h.p.join()===mv.r(c.p).join()),rn=mv.r(c.ns[0]).join();return[q,list[q].ns.findIndex(n=>n.join()===rn)]});
const pw=(M,n)=>{let R=M.map((x,i)=>[i,0]);for(let k=0;k<n;k++)R=R.map(([q,d])=>[M[q][0],d+M[q][1]]);return R};
const CM=[],EM=[];MV.forEach(m=>{const c=qmap(CORN,m),e=qmap(EDGE,m);for(let k=1;k<4;k++){CM.push(pw(c,k));EM.push(pw(e,k))}});
function app(S,m){const cm=CM[m],em=EM[m],r={cp:[],co:[],ep:[],eo:[]};
  for(let p=0;p<8;p++){const[q,d]=cm[p];r.cp[q]=S.cp[p];r.co[q]=(S.co[p]+d)%3}
  for(let p=0;p<12;p++){const[q,d]=em[p];r.ep[q]=S.ep[p];r.eo[q]=(S.eo[p]+d)%2}return r}
function toCubie(col){const cnt=Array(6).fill(0);col.forEach(c=>cnt[c]++);if(cnt.some(n=>n!==9))return{e:'errc'};
  const cf={};FACES.forEach((f,i)=>cf[col[IX[K(f.n,f.n)]]]=i);if(Object.keys(cf).length!==6)return{e:'errn'};
  const S={cp:[],co:[],ep:[],eo:[]};
  const rd=(list,P,O)=>list.every((c,i)=>{const fs=c.ns.map(n=>cf[col[IX[K(c.p,n)]]]);
    const h=list.findIndex(h=>h.ns.length===fs.length&&h.ns.every(n=>fs.includes(fi(n))));if(h<0)return false;
    P[i]=h;O[i]=fs.indexOf(fi(list[h].ns[0]));return true});
  if(!rd(CORN,S.cp,S.co)||!rd(EDGE,S.ep,S.eo)||new Set(S.cp).size<8||new Set(S.ep).size<12)return{e:'errn'};
  const par=p=>{let s=0;for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++)if(p[j]<p[i])s++;return s&1};
  if(S.co.reduce((a,b)=>a+b)%3||S.eo.reduce((a,b)=>a+b)%2||par(S.cp)!==par(S.ep))return{e:'errn'};return S}
const twist=co=>{let t=0;for(let i=0;i<7;i++)t=t*3+co[i];return t},flip=eo=>{let t=0;for(let i=0;i<11;i++)t=t*2+eo[i];return t};
const Cb=(n,k)=>{if(k>n||k<0)return 0;let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r)};
const sliceC=ep=>{let a=0,x=0;for(let j=11;j>=0;j--)if(ep[j]>=8){a+=Cb(11-j,x+1);x++}return a};
const pe=p=>{let r=0;const n=p.length;for(let i=0;i<n;i++){let c=0;for(let j=i+1;j<n;j++)if(p[j]<p[i])c++;r=r*(n-i)+c}return r};
const pd=(r,n)=>{const d=[];for(let i=n-1;i>=0;i--){d[i]=r%(n-i);r=(r/(n-i))|0}const av=[...Array(n).keys()],p=[];for(let i=0;i<n;i++)p.push(av.splice(d[i],1)[0]);return p};
const P2=[0,1,2,9,10,11,4,7,13,16];let TB=null;
function bfs(n1,n2,t1,t2,nm){const d=new Uint8Array(n1*n2).fill(255);d[0]=0;let f=[0],k=0;while(f.length){const nf=[];k++;for(const s of f){const a=(s/n2)|0,b=s%n2;for(let m=0;m<nm;m++){const t=t1[a*nm+m]*n2+t2[b*nm+m];if(d[t]===255){d[t]=k;nf.push(t)}}}f=nf}return d}
function tables(){const TW=new Int16Array(2187*18),FL=new Int16Array(2048*18),SL=new Int16Array(495*18);
  for(let t=0;t<2187;t++){const co=[];let x=t,s=0;for(let i=6;i>=0;i--){co[i]=x%3;x=(x/3)|0;s+=co[i]}co[7]=(3-s%3)%3;
    for(let m=0;m<18;m++){const n=[];for(let p=0;p<8;p++){const[q,d]=CM[m][p];n[q]=(co[p]+d)%3}TW[t*18+m]=twist(n)}}
  for(let t=0;t<2048;t++){const eo=[];let x=t,s=0;for(let i=10;i>=0;i--){eo[i]=x%2;x>>=1;s+=eo[i]}eo[11]=s%2;
    for(let m=0;m<18;m++){const n=[];for(let p=0;p<12;p++){const[q,d]=EM[m][p];n[q]=(eo[p]+d)%2}FL[t*18+m]=flip(n)}}
  const rep=[],st=[[0,0,0,0,0,0,0,0,8,8,8,8]];rep[0]=st[0];for(let i=0;i<st.length;i++){const E=st[i];
    for(let m=0;m<18;m++){const n=[];for(let p=0;p<12;p++)n[EM[m][p][0]]=E[p];const c=sliceC(n);if(!rep[c]){rep[c]=n;st.push(n)}}}
  for(let c=0;c<495;c++)for(let m=0;m<18;m++){const n=[];for(let p=0;p<12;p++)n[EM[m][p][0]]=rep[c][p];SL[c*18+m]=sliceC(n)}
  const CPt=new Int32Array(40320*10),EPt=new Int32Array(40320*10),SPt=new Int32Array(24*10);
  for(let c=0;c<40320;c++){const p=pd(c,8);for(let i=0;i<10;i++){const m=P2[i],nc=[],ne=[];for(let k=0;k<8;k++){nc[CM[m][k][0]]=p[k];ne[EM[m][k][0]]=p[k]}CPt[c*10+i]=pe(nc);EPt[c*10+i]=pe(ne)}}
  for(let c=0;c<24;c++){const p=pd(c,4);for(let i=0;i<10;i++){const n=[];for(let k=0;k<4;k++)n[EM[P2[i]][k+8][0]-8]=p[k];SPt[c*10+i]=pe(n)}}
  TB={TW,FL,SL,CPt,EPt,SPt,pT:bfs(2187,495,TW,SL,18),pF:bfs(2048,495,FL,SL,18),pC:bfs(40320,24,CPt,SPt,10),pE:bfs(40320,24,EPt,SPt,10)}}
function solve3(S){const dl=Date.now()+1500,path=[];let best=null;
  const s2=(cp,ep,sp,d,last,out)=>{const h=Math.max(TB.pC[cp*24+sp],TB.pE[ep*24+sp]);if(h>d)return false;if(d===0)return h===0;
    for(let i=0;i<10;i++){const f=P2[i]/3|0;if(f===last||(last>=0&&f%3===last%3&&f<last))continue;
      if(s2(TB.CPt[cp*10+i],TB.EPt[ep*10+i],TB.SPt[sp*10+i],d-1,f,out)){out.push(P2[i]);return true}}return false};
  const s1=(tw,fl,sl,d,last)=>{if(best&&Date.now()>dl)return true;
    const h=Math.max(TB.pT[tw*495+sl],TB.pF[fl*495+sl]);if(h>d)return false;
    if(d===0){let C=S;for(const m of path)C=app(C,m);const lim=(best?best.length-1:30)-path.length;
      for(let d2=0;d2<=lim;d2++){const out=[];if(s2(pe(C.cp),pe(C.ep.slice(0,8)),pe(C.ep.slice(8).map(x=>x-8)),d2,last,out)){best=path.concat(out.reverse());break}}return false}
    for(let m=0;m<18;m++){const f=m/3|0;if(f===last||(last>=0&&f%3===last%3&&f<last))continue;
      path.push(m);const r=s1(TB.TW[tw*18+m],TB.FL[fl*18+m],TB.SL[sl*18+m],d-1,f);path.pop();if(r)return true}return false};
  for(let d1=0;d1<=12;d1++){if(best&&d1>=best.length)break;if(s1(twist(S.co),flip(S.eo),sliceC(S.ep),d1,-1))break}
  return best}
/*UI*/
const HEX=['#f5f5f5','#facc15','#ef4444','#22c55e','#fb923c','#3b82f6','#3a4256'],LET=['W','Y','R','G','O','B',''];
const STD=()=>ST.map((t,i)=>[0,4,3,2,5,1][(i/9)|0]);
let col=STD(),sel=0,lk='hint',le=0,sol=null;
function draw(){document.querySelectorAll('#net .st').forEach(b=>{const c=col[+b.dataset.i];b.style.background=HEX[c];b.textContent=LET[c]});
  document.querySelectorAll('#pal .st').forEach(b=>b.classList.toggle('on',+b.dataset.c===sel))}
function show(){const m=$('msg');m.textContent=lk==='ok'?'':L(lk);m.style.color=le?'#f87171':lk==='hint'||lk==='wait'?'#8b94a7':'#2ee6a6';
  $('sol').textContent=sol&&sol.length?L('solu')+' ('+sol.length+' '+L('mv')+')\n'+sol.map(m=>NM[m]).join(' '):'';$('sol').style.whiteSpace='pre-line'}
function reset(k,e){lk=k||'hint';le=e||0;sol=null;show()}
function solve(){sol=null;if(col.includes(6))return reset('errf',1);const p=toCubie(col);if(p.e)return reset(p.e,1);
  reset('wait');setTimeout(()=>{if(!TB)tables();sol=solve3(p);if(!sol)return reset('errn',1);lk=sol.length?'ok':'done';le=0;show()},40)}
function build(){const net=$('net');
  FACES.forEach((f,fi)=>{const d=document.createElement('div');d.className='face';d.style.gridColumn=f.g[0]+1;d.style.gridRow=f.g[1]+1;
    for(let k=0;k<9;k++){const b=document.createElement('button');b.className='st';b.dataset.i=fi*9+k;b.setAttribute('aria-label',(fi*9+k+1));d.appendChild(b)}net.appendChild(d)});
  net.addEventListener('click',e=>{const b=e.target.closest('.st');if(!b)return;col[+b.dataset.i]=sel;draw();reset()});
  $('pal').innerHTML=[0,1,2,3,4,5].map(c=>`<button class="st" data-c="${c}" style="background:${HEX[c]}">${LET[c]}</button>`).join('');
  $('pal').addEventListener('click',e=>{const b=e.target.closest('.st');if(b){sel=+b.dataset.c;draw()}})}
function text(){baseText();$('bs').textContent=L('solve');$('bx').textContent=L('scr');$('br').textContent=L('rst');$('bc').textContent=L('clr');show();syncLang()}
$('bs').onclick=solve;$('br').onclick=()=>{col=STD();draw();reset()};$('bc').onclick=()=>{col=ST.map(()=>6);draw();reset()};
$('bx').onclick=()=>{let c=STD();for(let i=0;i<25;i++)c=ap(c,Math.floor(Math.random()*18));col=c;draw();reset()};
build();draw();initLang(text);text();

</script>
