const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "Percentage Calculator", "sub": "Calculate percentages, increases, decreases, percentage change and more in one place.", "h1": "What is a percentage?", "p1": "A percentage expresses a number as a fraction of 100. The word comes from the Latin per centum, meaning “by the hundred”, and the symbol is %. So 25% means 25 out of 100, which is the same as 0.25 or one quarter.", "h2": "The main formulas", "p2": "Almost every percentage problem is a variation of three ideas: taking a share of a number, finding what share one number is of another, and measuring how much a value has changed. The formulas below cover all three.", "ex": "Example: 20% of 150 = 30; going from 80 to 100 is a 25% increase.", "h4": "Common pitfalls", "lim": "<li>Percentage change is not symmetric: a 50% rise followed by a 50% fall does not return to the start (100 → 150 → 75).</li><li>Percent and percentage points are different: going from 10% to 12% is +2 percentage points but a 20% relative increase.</li><li>To undo an increase, divide by (1 + P/100) instead of subtracting P%: after +25%, the original value is the value ÷ 1.25.</li><li>Percentage difference compares two numbers symmetrically using their average, while percentage change uses the starting value as the reference.</li>", "h3": "Quick mental maths", "tips": "<li>10% is the number divided by 10, and 1% is divided by 100.</li><li>50% is half, 25% is a quarter and 75% is three quarters.</li><li>5% is half of 10%, and 15% is 10% plus 5%.</li><li>20% is a fifth: divide by 5.</li>", "h5": "Markup vs margin", "p5": "Both measure profit, but against different bases. Markup compares profit with what the item cost you; margin compares profit with what you sell it for. Because the selling price is larger than the cost, the same profit always gives a smaller margin than markup.", "mm": "<li>Markup = profit ÷ cost; margin = profit ÷ selling price. Same profit, different base.</li><li>Margin can never reach 100%, while markup can be 100%, 200% or more.</li><li>Converting: margin = markup ÷ (1 + markup) and markup = margin ÷ (1 − margin). A 50% markup is only a 33.3% margin, and a 50% margin needs a 100% markup.</li><li>Common mistake: adding 30% to the cost does not give a 30% margin. For a target margin, divide the cost by (1 − margin) instead of multiplying by (1 + margin).</li><li>Use prices without VAT, so that the figures reflect your real profit.</li>"}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Kalkulačka percent", "sub": "Vypočítaj percentá, nárast, pokles, percentuálnu zmenu a ďalšie na jednom mieste.", "h1": "Čo je percento?", "p1": "Percento vyjadruje číslo ako zlomok zo 100. Slovo pochádza z latinského per centum, teda „na sto“, a značka je %. Takže 25 % znamená 25 zo 100, čo je to isté ako 0,25 alebo jedna štvrtina.", "h2": "Hlavné vzorce", "p2": "Takmer každá úloha s percentami je obmenou troch myšlienok: zistiť podiel z čísla, zistiť, aký podiel tvorí jedno číslo z druhého, a zmerať, o koľko sa hodnota zmenila. Pokrývajú ich vzorce nižšie.", "ex": "Príklad: 20 % zo 150 je 30; zmena z 80 na 100 je nárast o 25 %.", "h4": "Časté chyby", "lim": "<li>Percentuálna zmena nie je symetrická: nárast o 50 % a potom pokles o 50 % nevráti pôvodnú hodnotu (100 → 150 → 75).</li><li>Percentá a percentuálne body sú rôzne veci: zmena z 10 % na 12 % je +2 percentuálne body, ale relatívny nárast o 20 %.</li><li>Zvýšenie sa vráti späť delením číslom (1 + P/100), nie odčítaním P %: po náraste o 25 % je pôvodná hodnota hodnota ÷ 1,25.</li><li>Percentuálny rozdiel porovnáva dve čísla symetricky cez ich priemer, kým percentuálna zmena berie ako základ pôvodnú hodnotu.</li>", "h3": "Rýchle počítanie z hlavy", "tips": "<li>10 % je číslo delené 10 a 1 % je delené 100.</li><li>50 % je polovica, 25 % štvrtina a 75 % tri štvrtiny.</li><li>5 % je polovica z 10 % a 15 % je 10 % plus 5 %.</li><li>20 % je pätina: delíme 5.</li>", "h5": "Prirážka a marža: aký je rozdiel?", "p5": "Obe čísla merajú zisk, ale voči inému základu. Prirážka porovnáva zisk s tým, koľko tovar stál teba; marža porovnáva zisk s tým, za koľko ho predáš. Keďže predajná cena je vyššia ako nákupná, ten istý zisk dáva vždy nižšiu maržu ako prirážku.", "mm": "<li>Prirážka = zisk ÷ nákupná cena; marža = zisk ÷ predajná cena. Rovnaký zisk, iný základ.</li><li>Marža nikdy nedosiahne 100 %, kým prirážka môže byť 100 %, 200 % aj viac.</li><li>Prevod: marža = prirážka ÷ (1 + prirážka) a prirážka = marža ÷ (1 − marža). Prirážka 50 % je len marža 33,3 % a marža 50 % si vyžaduje prirážku 100 %.</li><li>Častá chyba: pridať k nákladom 30 % nedá maržu 30 %. Na cieľovú maržu delíme náklady číslom (1 − marža), nie násobíme (1 + marža).</li><li>Používaj ceny bez DPH, aby čísla zodpovedali skutočnému zisku.</li>"}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Prozentrechner", "sub": "Berechne Prozente, Zunahme, Abnahme, prozentuale Änderung und mehr an einem Ort.", "h1": "Was ist ein Prozent?", "p1": "Ein Prozent drückt eine Zahl als Anteil von 100 aus. Das Wort stammt vom lateinischen per centum, „pro Hundert“, das Zeichen ist %. 25 % bedeuten also 25 von 100, das ist dasselbe wie 0,25 oder ein Viertel.", "h2": "Die wichtigsten Formeln", "p2": "Fast jede Prozentaufgabe ist eine Variante von drei Grundideen: einen Anteil einer Zahl berechnen, herausfinden, welchen Anteil eine Zahl an einer anderen hat, und messen, wie stark sich ein Wert verändert hat. Die Formeln unten decken alle drei ab.", "ex": "Beispiel: 20 % von 150 sind 30; von 80 auf 100 ist eine Zunahme um 25 %.", "h4": "Häufige Fehler", "lim": "<li>Prozentuale Änderungen sind nicht symmetrisch: Eine Zunahme um 50 % und danach eine Abnahme um 50 % führt nicht zum Ausgangswert zurück (100 → 150 → 75).</li><li>Prozent und Prozentpunkte sind verschieden: Von 10 % auf 12 % sind +2 Prozentpunkte, aber ein relativer Anstieg um 20 %.</li><li>Eine Erhöhung macht man rückgängig, indem man durch (1 + P/100) teilt, nicht indem man P % abzieht: Nach +25 % ist der Ausgangswert Wert ÷ 1,25.</li><li>Der prozentuale Unterschied vergleicht zwei Zahlen symmetrisch über ihren Mittelwert, die prozentuale Änderung nutzt den Anfangswert als Bezug.</li>", "h3": "Schnell im Kopf rechnen", "tips": "<li>10 % ist die Zahl geteilt durch 10, 1 % geteilt durch 100.</li><li>50 % ist die Hälfte, 25 % ein Viertel und 75 % drei Viertel.</li><li>5 % ist die Hälfte von 10 %, und 15 % sind 10 % plus 5 %.</li><li>20 % ist ein Fünftel: durch 5 teilen.</li>", "h5": "Aufschlag oder Marge: wo liegt der Unterschied?", "p5": "Beide Kennzahlen messen den Gewinn, aber bezogen auf unterschiedliche Grundlagen. Der Aufschlag vergleicht den Gewinn mit dem, was die Ware dich gekostet hat; die Marge vergleicht ihn mit dem Verkaufspreis. Da der Verkaufspreis höher ist als der Einkaufspreis, ergibt derselbe Gewinn immer eine kleinere Marge als der Aufschlag.", "mm": "<li>Aufschlag = Gewinn ÷ Einkaufspreis; Marge = Gewinn ÷ Verkaufspreis. Gleicher Gewinn, andere Basis.</li><li>Die Marge kann nie 100 % erreichen, der Aufschlag dagegen 100 %, 200 % oder mehr betragen.</li><li>Umrechnung: Marge = Aufschlag ÷ (1 + Aufschlag) und Aufschlag = Marge ÷ (1 − Marge). Ein Aufschlag von 50 % ergibt nur 33,3 % Marge, und 50 % Marge erfordern 100 % Aufschlag.</li><li>Häufiger Fehler: 30 % auf die Kosten aufzuschlagen ergibt keine Marge von 30 %. Für eine Zielmarge teilt man die Kosten durch (1 − Marge), statt mit (1 + Marge) zu multiplizieren.</li><li>Verwende Preise ohne MwSt., damit die Zahlen deinen tatsächlichen Gewinn zeigen.</li>"}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Procentní kalkulačka", "sub": "Spočítej procenta, nárůst, pokles, procentuální změnu a další na jednom místě.", "h1": "Co je procento?", "p1": "Procento vyjadřuje číslo jako zlomek ze 100. Slovo pochází z latinského per centum, tedy „na sto“, a značka je %. Takže 25 % znamená 25 ze 100, což je totéž jako 0,25 nebo jedna čtvrtina.", "h2": "Hlavní vzorce", "p2": "Téměř každá úloha s procenty je obměnou tří myšlenek: zjistit podíl z čísla, zjistit, jaký podíl tvoří jedno číslo z druhého, a změřit, o kolik se hodnota změnila. Pokrývají je vzorce níže.", "ex": "Příklad: 20 % ze 150 je 30; změna z 80 na 100 je nárůst o 25 %.", "h4": "Časté chyby", "lim": "<li>Procentuální změna není symetrická: nárůst o 50 % a poté pokles o 50 % nevrátí původní hodnotu (100 → 150 → 75).</li><li>Procenta a procentní body jsou různé věci: změna z 10 % na 12 % je +2 procentní body, ale relativní nárůst o 20 %.</li><li>Zvýšení se vrátí zpět dělením číslem (1 + P/100), ne odečtením P %: po nárůstu o 25 % je původní hodnota hodnota ÷ 1,25.</li><li>Procentuální rozdíl porovnává dvě čísla symetricky přes jejich průměr, zatímco procentuální změna bere jako základ původní hodnotu.</li>", "h3": "Rychlé počítání z hlavy", "tips": "<li>10 % je číslo dělené 10 a 1 % je dělené 100.</li><li>50 % je polovina, 25 % čtvrtina a 75 % tři čtvrtiny.</li><li>5 % je polovina z 10 % a 15 % je 10 % plus 5 %.</li><li>20 % je pětina: dělíme 5.</li>", "h5": "Přirážka a marže: jaký je rozdíl?", "p5": "Obě čísla měří zisk, ale vůči jinému základu. Přirážka porovnává zisk s tím, kolik zboží stálo tebe; marže porovnává zisk s tím, za kolik ho prodáš. Protože je prodejní cena vyšší než nákupní, stejný zisk dává vždy nižší marži než přirážku.", "mm": "<li>Přirážka = zisk ÷ nákupní cena; marže = zisk ÷ prodejní cena. Stejný zisk, jiný základ.</li><li>Marže nikdy nedosáhne 100 %, zatímco přirážka může být 100 %, 200 % i víc.</li><li>Převod: marže = přirážka ÷ (1 + přirážka) a přirážka = marže ÷ (1 − marže). Přirážka 50 % je jen marže 33,3 % a marže 50 % vyžaduje přirážku 100 %.</li><li>Častá chyba: přidat k nákladům 30 % nedá marži 30 %. Na cílovou marži dělíme náklady číslem (1 − marže), nenásobíme (1 + marže).</li><li>Používej ceny bez DPH, aby čísla odpovídala skutečnému zisku.</li>"}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Kalkulator procentowy", "sub": "Oblicz procenty, wzrost, spadek, zmianę procentową i więcej w jednym miejscu.", "h1": "Czym jest procent?", "p1": "Procent wyraża liczbę jako ułamek ze 100. Słowo pochodzi z łacińskiego per centum, czyli „na sto”, a symbolem jest %. Zatem 25 % oznacza 25 na 100, czyli tyle samo co 0,25 albo jedna czwarta.", "h2": "Najważniejsze wzory", "p2": "Prawie każde zadanie z procentami to odmiana trzech pomysłów: obliczenia części liczby, ustalenia, jaką część jedna liczba stanowi drugiej, oraz zmierzenia, o ile zmieniła się wartość. Obejmują je poniższe wzory.", "ex": "Przykład: 20 % ze 150 to 30; zmiana z 80 na 100 to wzrost o 25 %.", "h4": "Częste błędy", "lim": "<li>Zmiana procentowa nie jest symetryczna: wzrost o 50 %, a potem spadek o 50 % nie przywraca wartości początkowej (100 → 150 → 75).</li><li>Procenty i punkty procentowe to różne rzeczy: zmiana z 10 % na 12 % to +2 punkty procentowe, ale względny wzrost o 20 %.</li><li>Wzrost cofa się dzieleniem przez (1 + P/100), a nie odejmowaniem P %: po wzroście o 25 % wartość pierwotna to wartość ÷ 1,25.</li><li>Różnica procentowa porównuje dwie liczby symetrycznie przez ich średnią, a zmiana procentowa przyjmuje za podstawę wartość początkową.</li>", "h3": "Szybkie liczenie w pamięci", "tips": "<li>10 % to liczba podzielona przez 10, a 1 % to podzielona przez 100.</li><li>50 % to połowa, 25 % to ćwierć, a 75 % to trzy czwarte.</li><li>5 % to połowa z 10 %, a 15 % to 10 % plus 5 %.</li><li>20 % to jedna piąta: dzielimy przez 5.</li>", "h5": "Narzut i marża: jaka jest różnica?", "p5": "Obie wielkości mierzą zysk, ale względem innej podstawy. Narzut porównuje zysk z tym, ile towar kosztował Ciebie; marża porównuje zysk z ceną, za którą go sprzedajesz. Ponieważ cena sprzedaży jest wyższa niż zakupu, ten sam zysk daje zawsze niższą marżę niż narzut.", "mm": "<li>Narzut = zysk ÷ cena zakupu; marża = zysk ÷ cena sprzedaży. Ten sam zysk, inna podstawa.</li><li>Marża nigdy nie osiągnie 100 %, a narzut może wynosić 100 %, 200 % i więcej.</li><li>Przeliczanie: marża = narzut ÷ (1 + narzut) oraz narzut = marża ÷ (1 − marża). Narzut 50 % to tylko marża 33,3 %, a marża 50 % wymaga narzutu 100 %.</li><li>Częsty błąd: dodanie 30 % do kosztu nie daje marży 30 %. Aby osiągnąć docelową marżę, dziel koszt przez (1 − marża), zamiast mnożyć przez (1 + marża).</li><li>Używaj cen bez VAT, aby liczby odzwierciedlały rzeczywisty zysk.</li>"}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calculateur de pourcentages", "sub": "Calculez pourcentages, hausses, baisses, variations en pourcentage et plus encore au même endroit.", "h1": "Qu’est-ce qu’un pourcentage ?", "p1": "Un pourcentage exprime un nombre comme une fraction de 100. Le mot vient du latin per centum, « par cent », et le symbole est %. Ainsi, 25 % signifie 25 sur 100, soit 0,25 ou un quart.", "h2": "Les formules principales", "p2": "Presque tous les problèmes de pourcentage sont des variantes de trois idées : prendre une part d’un nombre, trouver quelle part un nombre représente par rapport à un autre, et mesurer de combien une valeur a changé. Les formules ci-dessous les couvrent.", "ex": "Exemple : 20 % de 150 = 30 ; passer de 80 à 100 est une hausse de 25 %.", "h4": "Pièges courants", "lim": "<li>La variation en pourcentage n’est pas symétrique : une hausse de 50 % suivie d’une baisse de 50 % ne ramène pas à la valeur de départ (100 → 150 → 75).</li><li>Pourcentage et points de pourcentage sont différents : passer de 10 % à 12 %, c’est +2 points de pourcentage mais une hausse relative de 20 %.</li><li>Pour annuler une hausse, on divise par (1 + P/100) au lieu de retrancher P % : après +25 %, la valeur d’origine est la valeur ÷ 1,25.</li><li>L’écart en pourcentage compare deux nombres de façon symétrique via leur moyenne, alors que la variation prend la valeur de départ comme référence.</li>", "h3": "Calcul mental rapide", "tips": "<li>10 % c’est le nombre divisé par 10, et 1 % divisé par 100.</li><li>50 % c’est la moitié, 25 % un quart et 75 % trois quarts.</li><li>5 % c’est la moitié de 10 %, et 15 % c’est 10 % plus 5 %.</li><li>20 % c’est un cinquième : on divise par 5.</li>", "h5": "Taux de marge ou taux de marque : quelle différence ?", "p5": "Les deux mesurent le bénéfice, mais par rapport à des bases différentes. Le taux de marge (markup) compare le bénéfice au prix d’achat ; le taux de marque compare le bénéfice au prix de vente. Le prix de vente étant plus élevé que le coût, un même bénéfice donne toujours un taux de marque inférieur au taux de marge.", "mm": "<li>Taux de marge = bénéfice ÷ prix d’achat ; taux de marque = bénéfice ÷ prix de vente. Même bénéfice, base différente.</li><li>Le taux de marque ne peut jamais atteindre 100 %, alors que le taux de marge peut valoir 100 %, 200 % ou plus.</li><li>Conversion : marque = marge ÷ (1 + marge) et marge = marque ÷ (1 − marque). Un taux de marge de 50 % ne donne que 33,3 % de taux de marque, et 50 % de taux de marque exigent 100 % de taux de marge.</li><li>Erreur fréquente : ajouter 30 % au coût ne donne pas 30 % de marque. Pour viser un taux de marque, on divise le coût par (1 − marque) au lieu de multiplier par (1 + marque).</li><li>Utilisez des prix hors TVA pour que les chiffres reflètent votre vrai bénéfice.</li>"}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Calculadora de porcentajes", "sub": "Calcula porcentajes, aumentos, disminuciones, variaciones porcentuales y más en un solo lugar.", "h1": "¿Qué es un porcentaje?", "p1": "Un porcentaje expresa un número como una fracción de 100. La palabra viene del latín per centum, “por cien”, y el símbolo es %. Así, 25 % significa 25 de cada 100, es decir, 0,25 o una cuarta parte.", "h2": "Las fórmulas principales", "p2": "Casi todos los problemas de porcentajes son variantes de tres ideas: tomar una parte de un número, averiguar qué parte es un número de otro y medir cuánto ha cambiado un valor. Las fórmulas de abajo las cubren.", "ex": "Ejemplo: el 20 % de 150 es 30; pasar de 80 a 100 es un aumento del 25 %.", "h4": "Errores habituales", "lim": "<li>El cambio porcentual no es simétrico: un aumento del 50 % seguido de una bajada del 50 % no devuelve el valor inicial (100 → 150 → 75).</li><li>Porcentaje y puntos porcentuales son cosas distintas: pasar del 10 % al 12 % son +2 puntos porcentuales, pero un aumento relativo del 20 %.</li><li>Para deshacer un aumento se divide entre (1 + P/100), no se resta P %: tras un +25 %, el valor original es el valor ÷ 1,25.</li><li>La diferencia porcentual compara dos números de forma simétrica mediante su media, mientras que el cambio porcentual toma como base el valor inicial.</li>", "h3": "Cálculo mental rápido", "tips": "<li>El 10 % es el número dividido entre 10 y el 1 % entre 100.</li><li>El 50 % es la mitad, el 25 % un cuarto y el 75 % tres cuartos.</li><li>El 5 % es la mitad del 10 %, y el 15 % es el 10 % más el 5 %.</li><li>El 20 % es un quinto: se divide entre 5.</li>", "h5": "Recargo o margen: ¿cuál es la diferencia?", "p5": "Ambos miden el beneficio, pero sobre bases distintas. El recargo (markup) compara el beneficio con lo que te costó el artículo; el margen lo compara con el precio al que lo vendes. Como el precio de venta es mayor que el coste, el mismo beneficio da siempre un margen menor que el recargo.", "mm": "<li>Recargo = beneficio ÷ coste; margen = beneficio ÷ precio de venta. Mismo beneficio, base distinta.</li><li>El margen nunca puede llegar al 100 %, mientras que el recargo puede ser del 100 %, del 200 % o más.</li><li>Conversión: margen = recargo ÷ (1 + recargo) y recargo = margen ÷ (1 − margen). Un recargo del 50 % es solo un margen del 33,3 %, y un margen del 50 % exige un recargo del 100 %.</li><li>Error frecuente: añadir un 30 % al coste no da un margen del 30 %. Para un margen objetivo se divide el coste entre (1 − margen) en lugar de multiplicar por (1 + margen).</li><li>Usa precios sin IVA para que las cifras reflejen tu beneficio real.</li>"}};

|Margen", "prf": "Profit|Zisk|Gewinn|Zisk|Zysk|Bénéfice|Beneficio", "err2": "Margin must be below 100 %.|Marža musí byť pod 100 %.|Die Marge muss unter 100 % liegen.|Marže musí být pod 100 %.|Marża musi być poniżej 100 %.|Le taux de marque doit être inférieur à 100 %.|El margen debe ser inferior al 100 %."};

const BASE='https://calc-hub.eu/percentage.html',OGL={"en": "en_US", "sk": "sk_SK", "de": "de_DE", "cs": "cs_CZ", "pl": "pl_PL", "fr": "fr_FR", "es": "es_ES"},META={"en": {"t": "Percentage Calculator – Increase, Decrease, Change | calc-hub.eu", "d": "Free percentage calculator: percent of a number, increase and decrease, percentage change and difference, reverse percentages, markup and margin and more."}, "sk": {"t": "Kalkulačka percent – nárast, pokles, zmena | calc-hub.eu", "d": "Bezplatná kalkulačka percent: percento z čísla, nárast a pokles, percentuálna zmena a rozdiel, pôvodná hodnota, prirážka a marža a ďalšie."}, "de": {"t": "Prozentrechner – Zunahme, Abnahme, Änderung | calc-hub.eu", "d": "Kostenloser Prozentrechner: Prozent von einer Zahl, Zunahme und Abnahme, prozentuale Änderung, Grundwert, Aufschlag und Marge und mehr."}, "cs": {"t": "Procentní kalkulačka – nárůst, pokles, změna | calc-hub.eu", "d": "Bezplatná kalkulačka procent: procento z čísla, nárůst a pokles, procentuální změna a rozdíl, původní hodnota, přirážka a marže a další."}, "pl": {"t": "Kalkulator procentowy – wzrost, spadek, zmiana | calc-hub.eu", "d": "Darmowy kalkulator procentowy: procent z liczby, wzrost i spadek, zmiana i różnica procentowa, wartość pierwotna, narzut i marża i więcej."}, "fr": {"t": "Calculateur de pourcentages – hausse, baisse, variation | calc-hub.eu", "d": "Calculateur de pourcentages gratuit : pourcentage d’un nombre, hausse et baisse, variation et écart, valeur d’origine, taux de marge et de marque et plus encore."}, "es": {"t": "Calculadora de porcentajes – aumento, descuento, variación | calc-hub.eu", "d": "Calculadora de porcentajes gratis: porcentaje de un número, aumento y disminución, variación y diferencia, valor original, recargo y margen y más."}};
function applySeo(){
  const m=META[lang],q=new URLSearchParams(location.search).get('lang'),u=BASE+(q&&META[q]&&q!=='en'?'?lang='+q:'');
  document.title=m.t;
  const set=(sel,v)=>{const e=document.querySelector(sel);if(e)e.setAttribute('content',v)};
  set('meta[name="description"]',m.d);set('meta[property="og:title"]',m.t);set('meta[property="og:description"]',m.d);
  set('meta[name="twitter:title"]',m.t);set('meta[name="twitter:description"]',m.d);set('meta[property="og:url"]',u);set('meta[property="og:locale"]',OGL[lang]);
  const c=document.querySelector('link[rel="canonical"]');if(c)c.setAttribute('href',u);
  document.querySelectorAll('meta[property="og:locale:alternate"]').forEach(e=>e.remove());
  Object.keys(OGL).filter(l=>l!==lang).forEach(l=>{const e=document.createElement('meta');e.setAttribute('property','og:locale:alternate');e.setAttribute('content',OGL[l]);document.head.appendChild(e)});
}
const FT={en:['Privacy & Cookies','Privacy and cookie settings'],sk:['Ochrana údajov a cookies','Nastavenia súkromia a cookies'],de:['Datenschutz & Cookies','Datenschutz- und Cookie-Einstellungen'],cs:['Ochrana údajů a cookies','Nastavení soukromí a cookies'],pl:['Prywatność i cookies','Ustawienia prywatności i plików cookies'],fr:['Confidentialité et cookies','Paramètres de confidentialité et de cookies'],es:['Privacidad y cookies','Configuración de privacidad y cookies']};

function propLinks(){document.querySelectorAll('a[href]').forEach(a=>{const h=a.dataset.h||(a.dataset.h=a.getAttribute('href'));if(!/^[a-z-]+\.html$/.test(h))return;a.setAttribute('href',lang==='en'?h:h+'?lang='+lang)})}
function openCs(){if(window.googlefc&&googlefc.callbackQueue&&googlefc.showRevocationMessage)googlefc.callbackQueue.push(googlefc.showRevocationMessage);else location.href='privacy.html'+(lang==='en'?'':'?lang='+lang)+'#cookies'}
document.addEventListener('click',e=>{if(e.target.closest('[data-cs]'))openCs()});
const LANGS=[['sk','Slovenčina'],['de','Deutsch'],['en','English'],['cs','Čeština'],['pl','Polski'],['fr','Français'],['es','Español']];
function syncLang(){document.getElementById('langCur').textContent=lang.toUpperCase();document.querySelectorAll('#langMenu button').forEach(b=>b.setAttribute('aria-selected',b.dataset.l===lang));footLinks();propLinks();applySeo()}
function initLang(cb){
  const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu');
  menu.innerHTML=LANGS.map(([c,n])=>`<li><button role="option" data-l="${c}"><span>${n}</span><b>${c.toUpperCase()}</b></button></li>`).join('');
  const close=()=>{menu.classList.add('hidden');btn.setAttribute('aria-expanded','false')};
  btn.addEventListener('click',e=>{e.stopPropagation();const hid=menu.classList.toggle('hidden');btn.setAttribute('aria-expanded',String(!hid))});
  menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{const u=new URL(location.href);if(lang==='en')u.searchParams.delete('lang');else u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(x){}close();cb()});
  document.addEventListener('click',close);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}
const $=id=>document.getElementById(id);
const IDX={en:0,sk:1,de:2,cs:3,pl:4,fr:5,es:6},LOC={sk:'sk-SK',de:'de-DE',en:'en-IE',cs:'cs-CZ',pl:'pl-PL',fr:'fr-FR',es:'es-ES'};
const L=k=>PIPE[k].split('|')[IDX[lang]];
const nf=n=>new Intl.NumberFormat(LOC[lang],{maximumFractionDigits:6}).format(+(+n).toFixed(10));
const PC=()=>lang==='en'?'%':' %';
const vals={p:'20',v:'150',x:'30',y:'150',s:'80',e:'100',a:'80',b:'100',f:'125',c:'25',c1:'50',c2:'-50',k:'80',sp:'100',mu:'25',mg:'20'};
const PCT=['p','c','c1','c2','mu','mg'];
const MODES=[
 {id:'of',f:['p','v'],run:i=>({v:i.p*i.v/100,rk:'res',frm:`${nf(i.p)} % × ${nf(i.v)} ÷ 100`})},
 {id:'is',f:['x','y'],run:i=>i.y===0?{err:1}:{v:i.x/i.y*100,pc:1,rk:'pct',frm:`${nf(i.x)} ÷ ${nf(i.y)} × 100`}},
 {id:'whole',f:['x','p'],run:i=>i.p===0?{err:1}:{v:i.x*100/i.p,rk:'tot',frm:`${nf(i.x)} × 100 ÷ ${nf(i.p)}`}},
 {id:'change',f:['s','e'],run:i=>i.s===0?{err:1}:(r=>({v:r,pc:1,sign:1,rk:r>0?'inc':r<0?'dec':'same',xs:[['amt',i.e-i.s]],frm:`(${nf(i.e)} − ${nf(i.s)}) ÷ ${nf(Math.abs(i.s))} × 100`}))((i.e-i.s)/Math.abs(i.s)*100)},
 {id:'inc',f:['v','p'],run:i=>({v:i.v*(1+i.p/100),rk:'nv',xs:[['amt',i.v*i.p/100]],frm:`${nf(i.v)} × (1 + ${nf(i.p)} ÷ 100)`})},
 {id:'dec',f:['v','p'],run:i=>({v:i.v*(1-i.p/100),rk:'nv',xs:[['amt',-i.v*i.p/100]],frm:`${nf(i.v)} × (1 − ${nf(i.p)} ÷ 100)`})},
 {id:'diff',f:['a','b'],run:i=>(i.a+i.b)===0?{err:1}:{v:Math.abs(i.a-i.b)/Math.abs((i.a+i.b)/2)*100,pc:1,rk:'pd',xs:[['dif',Math.abs(i.a-i.b)]],frm:`|${nf(i.a)} − ${nf(i.b)}| ÷ |(${nf(i.a)} + ${nf(i.b)}) ÷ 2| × 100`}},
 {id:'rev',f:['f','c'],neg:1,run:i=>(1+i.c/100)===0?{err:1}:(o=>({v:o,rk:'orig',xs:[['amt',i.f-o]],frm:`${nf(i.f)} ÷ (1 + ${nf(i.c)} ÷ 100)`}))(i.f/(1+i.c/100))},
 {id:'succ',f:['c1','c2'],neg:1,run:i=>({v:((1+i.c1/100)*(1+i.c2/100)-1)*100,pc:1,sign:1,rk:'net',frm:`(1 + ${nf(i.c1)} ÷ 100) × (1 + ${nf(i.c2)} ÷ 100) − 1`})},
 {id:'mkcp',f:['k','sp'],run:i=>(i.k===0||i.sp===0)?{err:1}:(p=>({v:p/i.k*100,pc:1,rk:'mup',xs:[['mgn',p/i.sp*100,1],['prf',p]],frm:`(${nf(i.sp)} − ${nf(i.k)}) ÷ ${nf(i.k)} × 100`}))(i.sp-i.k)},
 {id:'mk',f:['k','mu'],run:i=>{const p=i.k*(1+i.mu/100);return p===0?{err:1}:{v:p,rk:'sp',xs:[['prf',p-i.k],['mgn',(p-i.k)/p*100,1]],frm:`${nf(i.k)} × (1 + ${nf(i.mu)} ÷ 100)`}}},
 {id:'mg',f:['k','mg'],run:i=>i.mg>=100?{err:2}:i.k===0?{err:1}:(p=>({v:p,rk:'sp',xs:[['prf',p-i.k],['mup',(p-i.k)/i.k*100,1]],frm:`${nf(i.k)} ÷ (1 − ${nf(i.mg)} ÷ 100)`}))(i.k/(1-i.mg/100))}
];
const cur=()=>MODES.find(m=>m.id===mode);
function buildTabs(){$('tabs').innerHTML=MODES.map(m=>`<button class="chip" role="tab" data-m="${m.id}" aria-pressed="${m.id===mode}">${L('m_'+m.id)}</button>`).join('')}
function buildFields(){
  const m=cur();
  $('fields').innerHTML=m.f.map(k=>`<div><label class="block text-sm" style="color:#8b94a7">${L(k)}</label><div class="field mt-2"><input data-f="${k}" type="number" inputmode="decimal" step="any" value="${vals[k]??''}">${PCT.includes(k)?'<span>%</span>':''}</div></div>`).join('');
  $('neg').classList.toggle('hidden',!m.neg);$('neg').textContent=L('neg');
}
function buildForm(){
  $('fbox').innerHTML=[['fc1','V × P ÷ 100'],['fc2','X ÷ Y × 100'],['fc3','(B − A) ÷ A × 100']].map(([k,f])=>`<div class="flex flex-wrap items-baseline justify-between gap-x-4"><span class="text-sm" style="color:#8b94a7">${L(k)}</span><span class="font-semibold" style="color:var(--accent)">${f}</span></div>`).join('');
}
function buildMk(){
  $('mbox').innerHTML=`<p class="text-sm" style="color:#8b94a7">${L('k')}: 80 · ${L('sp')}: 100 · ${L('prf')}: 20</p>`+[['mup','20 ÷ 80 × 100','25'],['mgn','20 ÷ 100 × 100','20']].map(([k,f,r])=>`<div class="flex flex-wrap items-baseline justify-between gap-x-4"><span class="text-sm" style="color:#8b94a7">${L(k)} = ${f}</span><span class="font-semibold" style="color:var(--accent)">${r}${PC()}</span></div>`).join('');
}
function text(){
  const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.tagName==='UL'?e.innerHTML=v:e.textContent=v});
  buildTabs();buildFields();buildForm();buildMk();syncLang();calc();
}
function calc(){
  const m=cur(),inp={};let ok=true;
  m.f.forEach(k=>{const v=vals[k];if(v===''||v===undefined||!isFinite(+v))ok=false;inp[k]=+v});
  $('res').classList.add('hidden');$('err').classList.add('hidden');$('hint').classList.toggle('hidden',ok);$('hint').textContent=L('hint');
  if(!ok)return;
  const r=m.run(inp);
  if(r.err){$('err').textContent=L(r.err===2?'err2':'err');$('err').classList.remove('hidden');return}
  $('res').classList.remove('hidden');
  $('rl').textContent=L(r.rk);
  $('big').textContent=(r.sign&&r.v>0?'+':'')+nf(r.v)+(r.pc?PC():'');
  $('xs').innerHTML=(r.xs||[]).map(([k,v,pc])=>`<div class="stat"><span>${L(k)}</span><b>${(v>0&&k==='amt'?'+':'')+nf(v)}${pc?PC():''}</b></div>`).join('');
  $('frm').textContent=`${L('frmL')}: ${r.frm} = ${nf(r.v)}${r.pc?PC():''}`;
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;buildTabs();buildFields();calc()});

initLang(text);text();
</script>
