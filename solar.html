eba × podíl k pokrytí ÷ (produkce × faktor orientace). Panely = velikost systému ÷ výkon panelu. Návratnost = cena systému ÷ roční úspora.", "h4": "Dobré vědět", "lim": "<li>Jde o hrubý odhad; návrh instalatéra zohlední stínění, sklon střechy, střídač a tvůj denní režim spotřeby.</li><li>Úspora předpokládá, že vyrobená energie nahradí elektřinu, kterou bys koupil; přebytky do sítě se obvykle platí méně.</li><li>Výkon panelů klesá přibližně o 0,5 % ročně; dotace, baterie a změny cen elektřiny nejsou zahrnuty.</li>", "note": "Pouze odhad; návrh a nabídku si vyžádej od certifikovaného instalatéra."}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Kalkulator paneli fotowoltaicznych", "sub": "Oszacuj wielkość instalacji, liczbę paneli, roczne oszczędności i czas zwrotu dla swojego domu.", "h1": "Ile paneli fotowoltaicznych potrzebujesz?", "p1": "Wielkość instalacji fotowoltaicznej zależy od zużycia energii, nasłonecznienia lokalizacji i orientacji dachu. Instalacja o mocy 1 kWp (kilowat-peak) produkuje w Europie około 850–1 400 kWh rocznie.", "h2": "Wzór", "p2": "Wielkość instalacji (kWp) = roczne zużycie × udział do pokrycia ÷ (uzysk × współczynnik orientacji). Panele = wielkość instalacji ÷ moc panelu. Zwrot = koszt instalacji ÷ roczne oszczędności.", "h4": "Warto wiedzieć", "lim": "<li>To przybliżone szacunki; projekt instalatora uwzględnia zacienienie, nachylenie dachu, falownik i Twój dzienny wzorzec zużycia.</li><li>Oszczędności zakładają, że wyprodukowana energia zastępuje kupowaną; nadwyżki oddane do sieci są zwykle opłacane niżej.</li><li>Moc paneli spada o ok. 0,5 % rocznie; dotacje, magazyny energii i zmiany cen prądu nie są uwzględnione.</li>", "note": "Tylko szacunek; projekt i ofertę zamów u certyfikowanego instalatora."}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calculateur de panneaux solaires", "sub": "Estimez la taille du système, le nombre de panneaux, les économies annuelles et le retour sur investissement pour votre maison.", "h1": "De combien de panneaux solaires avez-vous besoin ?", "p1": "La taille d’une installation photovoltaïque dépend de votre consommation d’électricité, de l’ensoleillement du lieu et de l’orientation du toit. Une installation de 1 kWc (kilowatt-crête) produit en Europe environ 850 à 1 400 kWh par an.", "h2": "Formule", "p2": "Taille du système (kWc) = consommation annuelle × part à couvrir ÷ (production × facteur d’orientation). Panneaux = taille du système ÷ puissance d’un panneau. Retour = coût du système ÷ économies annuelles.", "h4": "Bon à savoir", "lim": "<li>Il s’agit d’une estimation approximative ; l’étude d’un installateur prend en compte l’ombrage, l’inclinaison, l’onduleur et votre profil de consommation.</li><li>Les économies supposent que l’énergie produite remplace de l’électricité achetée ; le surplus injecté est généralement moins bien rémunéré.</li><li>La puissance des panneaux baisse d’environ 0,5 % par an ; aides, batteries et variations du prix de l’électricité ne sont pas inclus.</li>", "note": "Estimation uniquement ; demandez une étude et un devis à un installateur certifié."}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Calculadora de paneles solares", "sub": "Estima el tamaño del sistema, el número de paneles, el ahorro anual y el plazo de recuperación para tu casa.", "h1": "¿Cuántos paneles solares necesitas?", "p1": "El tamaño de una instalación fotovoltaica depende de cuánta electricidad usas, del sol que recibe tu ubicación y de la orientación del tejado. Una instalación de 1 kWp (kilovatio pico) produce en Europa unos 850–1400 kWh al año.", "h2": "Fórmula", "p2": "Tamaño del sistema (kWp) = consumo anual × parte a cubrir ÷ (producción × factor de orientación). Paneles = tamaño del sistema ÷ potencia del panel. Recuperación = coste del sistema ÷ ahorro anual.", "h4": "Conviene saber", "lim": "<li>Es una estimación aproximada; el proyecto de un instalador tiene en cuenta som function initLang(cb){

  menu.innerHTML=LANGS.map(([c,n])=>`<li><button role="option" data-l="${c}"><span>${n}</span><b>${c.toUpperCase()}</b></button></li>`).join('');

  btn.addEventListener('click',e=>{e.stopPropagation();const hid=menu.classList.toggle('hidden');btn.setAttribute('aria-expanded',String(!hid))});

const $=id=>document.getElementById(id);
const IDX={en:0,sk:1,de:2,cs:3,pl:4,fr:5,es:6},LOC={sk:'sk-SK',de:'de-DE',en:'en-GB',cs:'cs-CZ',pl:'pl-PL',fr:'fr-FR',es:'es-ES'};

const DEFS={sk:{EUR:1200,USD:1200,GBP:1100,CZK:30000,PLN:5200,CHF:1500},se:{EUR:.25,USD:.17,GBP:.28,CZK:5.5,PLN:1.1,CHF:.27}},YLD={n:850,c:1000,s:1400},ORI={s:1,ew:.85,n:.55};
let reg='c',ori='s';
function calcAll(){
  const ids=['sa','sc','sw','sm','sk','se'];if(ids.some(i=>$(i).value===''||!isFinite(+$(i).value)))return null;
  const a=+$('sa').value,c=+$('sc').value,w=+$('sw').value,m=+$('sm').value,k=+$('sk').value,e=+$('se').value;
  if(!(a>0&&a<=1e7&&c>0&&c<=200&&w>=100&&w<=1000&&m>0&&k>=0&&e>=0))return null;
  const y=YLD[reg]*ORI[ori],kwp=a*c/100/y,n=Math.max(1,Math.ceil(kwp*1000/w)),sys=n*w/1000,prod=sys*y,cost=sys*k,sav=Math.min(prod,a)*e;
  return {kwp:sys,n,area:n*m,prod,cost,sav,pb:sav>0?cost/sav:null};
}
function calc(){const o=calcAll();if(!showRes(o))return;
  $('big').textContent=nf(o.kwp,2)+' kWp';
  $('rows').innerHTML=rows([[L('np'),nf(o.n)],[L('ar'),nf(o.area,1)+' m²'],[L('prod'),nf(o.prod)+' kWh'],[L('tc'),money(o.cost,0)],[L('sav'),money(o.sav,0)]].concat(o.pb?[[L('pb'),nf(o.pb,1)+' '+L('yrs')]]:[]));}

}
