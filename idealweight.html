const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "Ideal Weight Calculator", "sub": "Find a healthy weight range for your height using the BMI range and four classic formulas.", "h1": "What is an ideal weight?", "p1": "There is no single ideal weight. Doctors usually look at a healthy range based on BMI (18.5 to 24.9 for adults). Classic formulas such as Devine, Robinson, Miller and Hamwi estimate a single figure from height and sex; they were created between the 1960s and 1980s, partly for medicine dosing, and give different results.", "h2": "How it is calculated", "p2": "The healthy range is the weight at which your BMI would be 18.5 to 24.9 at your height. The four formulas add a fixed number of kilograms for each inch of height above 5 feet (152.4 cm), starting from a base weight that differs for men and women.", "h4": "Good to know", "lim": "<li>Treat the result as a range, not a goal. Healthy weight depends on muscle, bone structure, age and health.</li><li>BMI does not distinguish muscle from fat, so athletes can fall outside the range while being healthy.</li><li>The formulas are less reliable for people shorter than 152 cm or much taller than about 190 cm.</li><li>The calculator is for adults and is not suitable for pregnancy, children or teenagers.</li><li>If you are worried about your weight, or thinking about food and weight causes distress, talk to a doctor or a mental health professional.</li>", "note": "For general information only; not medical advice."}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Kalkulačka ideálnej váhy", "sub": "Zisti zdravé rozpätie hmotnosti pre svoju výšku podľa BMI a štyroch klasických vzorcov.", "h1": "Čo je ideálna váha?", "p1": "Jedna ideálna váha neexistuje. Lekári zvyčajne posudzujú zdravé rozpätie podľa BMI (u dospelých 18,5 až 24,9). Klasické vzorce Devine, Robinson, Miller a Hamwi odhadujú z výšky a pohlavia jedno číslo; vznikli v rokoch 1960 – 1980, čiastočne na dávkovanie liekov, a dávajú rôzne výsledky.", "h2": "Ako sa počíta", "p2": "Zdravé rozpätie je hmotnosť, pri ktorej by tvoje BMI pri tvojej výške bolo 18,5 až 24,9. Štyri vzorce pripočítavajú pevný počet kilogramov za každý palec výšky nad 5 stôp (152,4 cm), pričom základná hmotnosť je iná pre mužov a ženy.", "h4": "Dobré vedieť", "lim": "<li>Výsledok ber ako rozpätie, nie ako cieľ. Zdravá hmotnosť závisí od svalov, stavby kostí, veku a zdravia.</li><li>BMI nerozlišuje svaly od tuku, preto môžu byť športovci mimo rozpätia a pritom zdraví.</li><li>Vzorce sú menej spoľahlivé pre ľudí nižších ako 152 cm alebo oveľa vyšších ako asi 190 cm.</li><li>Kalkulačka je pre dospelých a nie je vhodná pre tehotenstvo, deti ani dospievajúcich.</li><li>Ak sa o svoju hmotnosť obávaš alebo ti myšlienky na jedlo a váhu spôsobujú stres, porozprávaj sa s lekárom alebo odborníkom na duševné zdravie.</li>", "note": "Len na všeobecné informovanie, nie je to zdravotné poradenstvo."}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Idealgewicht-Rechner", "sub": "Finde deinen gesunden Gewichtsbereich für deine Größe mit dem BMI-Bereich und vier klassischen Formeln.", "h1": "Was ist das Idealgewicht?", "p1": "Das eine Idealgewicht gibt es nicht. Ärzte betrachten meist einen gesunden Bereich anhand des BMI (bei Erwachsenen 18,5 bis 24,9). Klassische Formeln wie Devine, Robinson, Miller und Hamwi schätzen aus Größe und Geschlecht einen einzelnen Wert; sie entstanden zwischen den 1960er- und 1980er-Jahren, teils für die Medikamentendosierung, und liefern unterschiedliche Ergebnisse.", "h2": "So wird es berechnet", "p2": "Der gesunde Bereich ist das Gewicht, bei dem dein BMI bei deiner Größe 18,5 bis 24,9 betragen würde. Die vier Formeln addieren für jeden Zoll über 5 Fuß (152,4 cm) eine feste Zahl Kilogramm zu einem Grundgewicht, das für Männer und Frauen verschieden ist.", "h4": "Gut zu wissen", "lim": "<li>Sieh das Ergebnis als Bereich, nicht als Ziel. Das gesunde Gewicht hängt von Muskeln, Knochenbau, Alter und Gesundheit ab.</li><li>Der BMI unterscheidet Muskeln nicht von Fett, daher können Sportler außerhalb des Bereichs liegen und trotzdem gesund sein.</li><li>Die Formeln sind für Menschen unter 152 cm oder deutlich über etwa 190 cm weniger zuverlässig.</li><li>Der Rechner ist für Erwachsene gedacht und nicht für Schwangerschaft, Kinder oder Jugendliche geeignet.</li><li>Wenn du dir Sorgen um dein Gewicht machst oder Gedanken an Essen und Gewicht dich belasten, sprich mit einer Ärztin, einem Arzt oder einer psychologischen Fachperson.</li>", "note": "Nur zur allgemeinen Information, keine medizinische Beratung."}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Kalkulačka ideální váhy", "sub": "Zjisti zdravé rozmezí hmotnosti pro svou výšku podle BMI a čtyř klasických vzorců.", "h1": "Co je ideální váha?", "p1": "Jedna ideální váha neexistuje. Lékaři obvykle posuzují zdravé rozmezí podle BMI (u dospělých 18,5 až 24,9). Klasické vzorce Devine, Robinson, Miller a Hamwi odhadují z výšky a pohlaví jedno číslo; vznikly v letech 1960–1980, částečně pro dávkování léků, a dávají různé výsledky.", "h2": "Jak se počítá", "p2": "Zdravé rozmezí je hmotnost, při které by tvé BMI při tvé výšce bylo 18,5 až 24,9. Čtyři vzorce přičítají pevný počet kilogramů za každý palec výšky nad 5 stop (152,4 cm), přičemž základní hmotnost je jiná pro muže a ženy.", "h4": "Dobré vědět", "lim": "<li>Výsledek ber jako rozmezí, ne jako cíl. Zdravá hmotnost závisí na svalech, stavbě kostí, věku a zdraví.</li><li>BMI nerozlišuje svaly od tuku, proto mohou být sportovci mimo rozmezí a přitom zdraví.</li><li>Vzorce jsou méně spolehlivé pro lidi nižší než 152 cm nebo mnohem vyšší než asi 190 cm.</li><li>Kalkulačka je pro dospělé a není vhodná pro těhotenství, děti ani dospívající.</li><li>Pokud se o svou hmotnost obáváš nebo ti myšlenky na jídlo a váhu způsobují stres, promluv si s lékařem nebo odborníkem na duševní zdraví.</li>", "note": "Pouze k obecné informaci, nejde o zdravotní poradenství."}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Kalkulator idealnej wagi", "sub": "Sprawdź zdrowy zakres masy ciała dla swojego wzrostu według BMI i czterech klasycznych wzorów.", "h1": "Czym jest idealna waga?", "p1": "Jedna idealna waga nie istnieje. Lekarze zwykle oceniają zdrowy zakres na podstawie BMI (u dorosłych od 18,5 do 24,9). Klasyczne wzory Devine’a, Robinsona, Millera i Hamwi szacują z wzrostu i płci jedną liczbę; powstały w latach 1960–1980, częściowo do dawkowania leków, i dają różne wyniki.", "h2": "Jak się to oblicza", "p2": "Zdrowy zakres to masa ciała, przy której Twoje BMI przy Twoim wzroście wynosiłoby od 18,5 do 24,9. Cztery wzory dodają stałą liczbę kilogramów za każdy cal wzrostu powyżej 5 stóp (152,4 cm), przy czym masa bazowa jest inna dla mężczyzn i kobiet.", "h4": "Warto wiedzieć", "lim": "<li>Traktuj wynik jako zakres, a nie cel. Zdrowa waga zależy od mięśni, budowy kości, wieku i zdrowia.</li><li>BMI nie odróżnia mięśni od tłuszczu, więc sportowcy mogą być poza zakresem i jednocześnie zdrowi.</li><li>Wzory są mniej wiarygodne dla osób niższych niż 152 cm lub znacznie wyższych niż około 190 cm.</li><li>Kalkulator jest dla dorosłych i nie nadaje się dla kobiet w ciąży, dzieci ani młodzieży.</li><li>Jeśli martwisz się o wagę lub myśli o jedzeniu i wadze powodują u Ciebie cierpienie, porozmawiaj z lekarzem lub specjalistą zdrowia psychicznego.</li>", "note": "Tylko informacyjnie, to nie jest porada medyczna."}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calculateur de poids idéal", "sub": "Trouvez votre plage de poids santé selon votre taille avec la plage d’IMC et quatre formules classiques.", "h1": "Qu’est-ce que le poids idéal ?", "p1": "Il n’existe pas un seul poids idéal. Les médecins regardent généralement une plage saine fondée sur l’IMC (18,5 à 24,9 chez l’adulte). Les formules classiques de Devine, Robinson, Miller et Hamwi estiment un chiffre unique à partir de la taille et du sexe ; elles datent des années 1960 à 1980, en partie pour le dosage des médicaments, et donnent des résultats différents.", "h2": "Comment c’est calculé", "p2": "La plage saine correspond aux poids pour lesquels votre IMC serait de 18,5 à 24,9 à votre taille. Les quatre formules ajoutent un nombre fixe de kilogrammes par pouce au-dessus de 5 pieds (152,4 cm), à partir d’un poids de base différent pour les hommes et les femmes.", "h4": "Bon à savoir", "lim": "<li>Considérez le résultat comme une plage, pas comme un objectif. Le poids sain dépend des muscles, de la structure osseuse, de l’âge et de la santé.</li><li>L’IMC ne distingue pas le muscle de la graisse ; des sportifs peuvent donc sortir de la plage tout en étant en bonne santé.</li><li>Les formules sont moins fiables pour les personnes de moins de 152 cm ou de beaucoup plus de 190 cm.</li><li>Ce calculateur s’adresse aux adultes et ne convient pas à la grossesse, aux enfants ni aux adolescents.</li><li>Si votre poids vous inquiète ou si penser à l’alimentation et au poids vous cause de la détresse, parlez-en à un médecin ou à un professionnel de la santé mentale.</li>", "note": "À titre d’information générale uniquement, pas un conseil médical."}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Calculadora de peso ideal", "sub": "Encuentra tu rango de peso saludable para tu altura con el rango de IMC y cuatro fórmulas clásicas.", "h1": "¿Qué es el peso ideal?", "p1": "No existe un único peso ideal. Los médicos suelen fijarse en un rango saludable basado en el IMC (de 18,5 a 24,9 en adultos). Las fórmulas clásicas de Devine, Robinson, Miller y Hamwi estiman una sola cifra a partir de la altura y el sexo; surgieron entre los años 60 y 80, en parte para dosificar medicamentos, y dan resultados distintos.", "h2": "Cómo se calcula", "p2": "El rango saludable es el peso con el que tu IMC sería de 18,5 a 24,9 a tu altura. Las cuatro fórmulas suman una cantidad fija de kilogramos por cada pulgada de altura por encima de 5 pies (152,4 cm), a partir de un peso base distinto para hombres y mujeres.", "h4": "Conviene saber", "lim": "<li>Considera el resultado como un rango, no como un objetivo. El peso saludable depende de los músculos, la estructura ósea, la edad y la salud.</li><li>El IMC no distingue el músculo de la grasa, por lo que los deportistas pueden quedar fuera del rango y estar sanos.</li><li>Las fórmulas son menos fiables para personas de menos de 152 cm o de mucho más de 190 cm.</li><li>La calculadora es para adultos y no es adecuada para embarazo, niños ni adolescentes.</li><li>Si te preocupa tu peso o pensar en la comida y el peso te causa malestar, habla con un médico o un profesional de salud mental.</li>", "note": "Solo con fines informativos, no es asesoramiento médico."}};
const PIPE={"sex": "Sex|Pohlavie|Geschlecht|Pohlaví|Płeć|Sexe|Sexo", "male": "Male|Muž|Männlich|Muž|Mężczyzna|Homme|Hombre", "female": "Female|Žena|Weiblich|Žena|Kobieta|Femme|Mujer", "age": "Age (years)|Vek (roky)|Alter (Jahre)|Věk (roky)|Wiek (lata)|Âge (ans)|Edad (años)", "height": "Height|Výška|Größe|Výška|Wzrost|Taille|Altura", "metric": "Metric|Metrické|Metrisch|Metrické|Metryczne|Métrique|Métrico", "imperial": "Imperial|Imperiálne|Imperial|Imperiální|Imperialne|Impérial|Imperial", "adult": "This calculator is for adults aged 18 and over.|Táto kalkulačka je určená pre dospelých od 18 rokov.|Dieser Rechner ist für Erwachsene ab 18 Jahren gedacht.|Tato kalkulačka je určena pro dospělé od 18 let.|Ten kalkulator jest przeznaczony dla dorosłych od 18 lat.|Ce calculateur s’adresse aux adultes de 18 ans et plus.|Esta calculadora es para adultos de 18 años o más.", "hint": "Fill in your details to see the result.|Vyplň údaje a zobrazí sa výsledok.|Gib deine Daten ein, um das Ergebnis zu sehen.|Vyplň údaje a zobrazí se výsledek.|Wpisz swoje dane, aby zobaczyć wynik.|Renseignez vos données pour voir le résultat.|Introduce tus datos para ver el resultado.", "range": "Healthy weight range (BMI 18.5–24.9)|Zdravé rozpätie hmotnosti (BMI 18,5 – 24,9)|Gesunder Gewichtsbereich (BMI 18,5–24,9)|Zdravé rozmezí hmotnosti (BMI 18,5–24,9)|Zdrowy zakres masy ciała (BMI 18,5–24,9)|Plage de poids santé (IMC 18,5–24,9)|Rango de peso saludable (IMC 18,5–24,9)", "formulas": "Classic formulas|Klasické vzorce|Klassische Formeln|Klasické vzorce|Klasyczne wzory|Formules classiques|Fórmulas clásicas", "short": "Formulas are less reliable at this height.|Pri tejto výške sú vzorce menej spoľahlivé.|Bei dieser Größe sind die Formeln weniger zuverlässig.|Při této výšce jsou vzorce méně spolehlivé.|Przy tym wzroście wzory są mniej wiarygodne.|À cette taille, les formules sont moins fiables.|A esta altura las fórmulas son menos fiables."};
try{const s=new URLSearchParams(location.search).get('lang')||(navigator.language||'').slice(0,2);if(T[s])lang=s}catch(e){}
const BASE='https://calc-hub.eu/idealweight.html',OGL={"en": "en_US", "sk": "sk_SK", "de": "de_DE", "cs": "cs_CZ", "pl": "pl_PL", "fr": "fr_FR", "es": "es_ES"},META={"en": {"t": "Ideal Weight Calculator – Healthy Weight Range | calc-hub.eu", "d": "Free ideal weight calculator: see your healthy weight range from BMI and the Devine, Robinson, Miller and Hamwi formulas."}, "sk": {"t": "Kalkulačka ideálnej váhy – zdravé rozpätie | calc-hub.eu", "d": "Bezplatná kalkulačka ideálnej váhy: zisti zdravé rozpätie hmotnosti podľa BMI a vzorcov Devine, Robinson, Miller a Hamwi."}, "de": {"t": "Idealgewicht-Rechner – gesunder Gewichtsbereich | calc-hub.eu", "d": "Kostenloser Idealgewicht-Rechner: dein gesunder Gewichtsbereich nach BMI und den Formeln von Devine, Robinson, Miller und Hamwi."}, "cs": {"t": "Kalkulačka ideální váhy – zdravé rozmezí | calc-hub.eu", "d": "Bezplatná kalkulačka ideální váhy: zjisti zdravé rozmezí hmotnosti podle BMI a vzorců Devine, Robinson, Miller a Hamwi."}, "pl": {"t": "Kalkulator idealnej wagi – zdrowy zakres | calc-hub.eu", "d": "Darmowy kalkulator idealnej wagi: sprawdź zdrowy zakres masy ciała według BMI i wzorów Devine, Robinson, Miller i Hamwi."}, "fr": {"t": "Calculateur de poids idéal – plage de poids santé | calc-hub.eu", "d": "Calculateur de poids idéal gratuit : votre plage de poids santé selon l’IMC et les formules de Devine, Robinson, Miller et Hamwi."}, "es": {"t": "Calculadora de peso ideal – rango saludable | calc-hub.eu", "d": "Calculadora de peso ideal gratis: tu rango de peso saludable según el IMC y las fórmulas de Devine, Robinson, Miller y Hamwi."}};
function applySeo(){
  const m=META[lang],q=new URLSearchParams(location.search).get('lang'),u=BASE+(q&&META[q]&&q!=='en'?'?lang='+q:'');
  document.title=m.t;
  const set=(sel,v)=>{const e=document.querySelector(sel);if(e)e.setAttribute('content',v)};
  set('meta[name="description"]',m.d);set('meta[property="og:title"]',m.t);set('meta[property="og:description"]',m.d);
  set('meta[name="twitter:title"]',m.t);set('meta[name="twitter:description"]',m.d);set('meta[property="og:url"]',u);set('meta[property="og:locale"]',OGL[lang]);
  const c=document.querySelector('link[rel="canonical"]');if(c)c.setAttribute('href',u);
  document.querySelectorAll('meta[property="og:locale:alternate"]').forEach(e=>e.remove());
  Object.keys(OGL).filter(l=>l!==lang).forEach(l=>{const e=document.createElement('meta');e.setAttribute('property','og:locale:alternate');e.setAttribute('content',OGL[l]);document.head.appendChild(e)});
}
const FT={en:['Privacy & Cookies','Privacy and cookie settings','About & contact'],sk:['Ochrana údajov a cookies','Nastavenia súkromia a cookies','O nás a kontakt'],de:['Datenschutz & Cookies','Datenschutz- und Cookie-Einstellungen','Über uns & Kontakt'],cs:['Ochrana údajů a cookies','Nastavení soukromí a cookies','O nás a kontakt'],pl:['Prywatność i cookies','Ustawienia prywatności i plików cookies','O nas i kontakt'],fr:['Confidentialité et cookies','Paramètres de confidentialité et de cookies','À propos et contact'],es:['Privacidad y cookies','Configuración de privacidad y cookies','Acerca de y contacto']};
function footLinks(){const f=document.getElementById('flinks');if(!f)return;const s='<span class="mx-2">·</span>';f.innerHTML=`<a href="about.html" class="hover:text-white">${FT[lang][2]}</a>${s}<a href="privacy.html" class="hover:text-white">${FT[lang][0]}</a>${s}<button data-cs class="hover:text-white">${FT[lang][1]}</button>`}
function propLinks(){document.querySelectorAll('a[href]').forEach(a=>{const h=a.dataset.h||(a.dataset.h=a.getAttribute('href'));if(!/^[a-z-]+\.html$/.test(h))return;a.setAttribute('href',lang==='en'?h:h+'?lang='+lang)})}
function openCs(){if(window.googlefc&&googlefc.callbackQueue&&googlefc.showRevocationMessage)googlefc.callbackQueue.push(googlefc.showRevocationMessage);else location.href='privacy.html'+(lang==='en'?'':'?lang='+lang)+'#cookies'}
document.addEventListener('click',e=>{if(e.target.closest('[data-cs]'))openCs()});
const LANGS=[['sk','Slovenčina'],['de','Deutsch'],['en','English'],['cs','Čeština'],['pl','Polski'],['fr','Français'],['es','Español']];
function syncLang(){document.getElementById('langCur').textContent=lang.toUpperCase();document.querySelectorAll('#langMenu button').forEach(b=>b.setAttribute('aria-selected',b.dataset.l===lang));footLinks();propLinks();applySeo()}
function initLang(cb){
  const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu');
  menu.innerHTML=LANGS.map(([c,n])=>`<li><button role="option" data-l="${c}"><span>${n}</span><b>${c.toUpperCase()}</b></button></li>`).join('');
  const close=()=>{menu.classList.add('hidden');btn.setAttribute('aria-expanded','false')};
  btn.addEventListener('click',e=>{e.stopPropagation();const hid=menu.classList.toggle('hidden');btn.setAttribute('aria-expanded',String(!hid))});
  menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{const u=new URL(location.href);if(lang==='en')u.searchParams.delete('lang');else u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(x){}close();cb()});
  document.addEventListener('click',close);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}

const $=id=>document.getElementById(id);
const IDX={en:0,sk:1,de:2,cs:3,pl:4,fr:5,es:6},LOC={sk:'sk-SK',de:'de-DE',en:'en-GB',cs:'cs-CZ',pl:'pl-PL',fr:'fr-FR',es:'es-ES'};
const L=k=>PIPE[k].split('|')[IDX[lang]];
const nf=(n,d=0)=>new Intl.NumberFormat(LOC[lang],{maximumFractionDigits:d}).format(n);
let sex='m',unit='m';
function baseText(){
  const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.tagName==='UL'?e.innerHTML=v:e.textContent=v});
  document.querySelectorAll('[data-p]').forEach(e=>e.textContent=L(e.dataset.p));
  document.querySelectorAll('[data-sx]').forEach(e=>{e.textContent=L(e.dataset.sx==='m'?'male':'female');e.setAttribute('aria-pressed',e.dataset.sx===sex)});
  document.querySelectorAll('[data-un]').forEach(e=>{e.textContent=L(e.dataset.un==='m'?'metric':'imperial');e.setAttribute('aria-pressed',e.dataset.un===unit)});
}
function showRes(o){
  $('res').classList.toggle('hidden',!o||!!o.err);$('hint').classList.toggle('hidden',!!o);$('hint').textContent=L('hint');
  $('err').classList.toggle('hidden',!(o&&o.err));if(o&&o.err)$('err').textContent=L(o.err);
  return !!o&&!o.err;
}
const getH=()=>unit==='m'?+$('h1').value:(+$('h1').value*12+(+$('h2').value||0))*2.54;
const getW=()=>unit==='m'?+$('w1').value:+$('w1').value*0.45359237;
const FM={Devine:{m:[50,2.3],f:[45.5,2.3]},Robinson:{m:[52,1.9],f:[49,1.7]},Miller:{m:[56.2,1.41],f:[53.1,1.36]},Hamwi:{m:[48,2.7],f:[45.4,2.2]}};
function calcAll(){
  const A=+$('ag').value,H=getH();
  if($('ag').value===''||$('h1').value===''||!isFinite(A+H))return null;
  if(A<18)return {err:'adult'};
  if(A>100||H<130||H>220)return null;
  const inch=H/2.54-60,m2=Math.pow(H/100,2);
  return {lo:18.5*m2,hi:24.9*m2,f:Object.entries(FM).map(([n,c])=>[n,c[sex][0]+c[sex][1]*inch]),short:H<152.4};
}
function calc(){
  const o=calcAll();if(!showRes(o))return;
  const f=unit==='m'?1:2.20462,u=unit==='m'?'kg':'lb';
  $('big').textContent=`${nf(o.lo*f,1)} – ${nf(o.hi*f,1)} ${u}`;
  $('rows').innerHTML=o.f.map(([n,v])=>`<div class="stat"><span>${n}</span><b>${nf(v*f,1)} ${u}</b></div>`).join('');
  $('lw').textContent=o.short?L('short'):'';
}
function text(){
  baseText();
  $('fbox').innerHTML=Object.entries(FM).map(([n,c])=>`<div><b style="color:var(--accent)">${n}:</b> <span style="color:#a3acbf">${c.m[0]} + ${c.m[1]} × in (${L('male')}) · ${c.f[0]} + ${c.f[1]} × in (${L('female')})</span></div>`).join('');
  $('fa').innerHTML=`<div class="stat"><span>BMI</span><b>18.5 – 24.9</b></div><p style="color:#8b94a7">in = inches above 5 ft</p>`;
  syncLang();calc();
}
function setUnit(u){
  if(u===unit)return;const H=getH();
  unit=u;$('h2w').classList.toggle('hidden',u==='m');$('u1').textContent=u==='m'?'cm':'ft';
  if(isFinite(H)&&H>0){if(u==='m')$('h1').value=Math.round(H);else{const i=H/2.54;$('h1').value=Math.floor(i/12);$('h2').value=Math.round(i%12)}}
  text();
}
document.addEventListener('click',e=>{const s=e.target.closest('[data-sx]');if(s){sex=s.dataset.sx;text();return}const u=e.target.closest('[data-un]');if(u)setUnit(u.dataset.un)});
['ag','h1','h2'].forEach(id=>$(id).addEventListener('input',calc));
initLang(text);text();
</script>
