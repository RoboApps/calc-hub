const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "Loan Payment Calculator", "sub": "Calculate the monthly payment, total interest, fees and effective annual rate (APR) of a loan.", "h1": "How a loan works", "p1": "A loan is money you borrow and repay over time with interest. Each payment covers part of the borrowed amount (the principal) and the interest on what you still owe. Fees and monthly charges raise the real cost of the loan beyond the nominal interest rate.", "h2": "Equal vs declining payments", "p2": "With equal payments (annuity) the instalment stays the same: early payments are mostly interest, later ones mostly principal. With declining payments you repay the same principal each month plus interest on the remaining balance, so payments start higher and fall over time, and total interest is lower. The APR is the yearly rate that makes all payments and fees equal to the money you actually received.", "h4": "Good to know", "lim": "<li>Compare offers by APR, not just by the nominal interest rate: it includes fees and monthly charges.</li><li>A longer term lowers the payment but increases total interest.</li><li>Check whether early repayment is free and how the bank charges for it.</li><li>Insurance and other optional products are not included here unless you enter them as a monthly fee.</li>", "note": "Results are indicative and not financial advice. The real offer of a bank may differ. Compare several offers before you decide."}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Kalkulačka splátky úveru", "sub": "Vypočítaj mesačnú splátku, celkové úroky, poplatky a ročnú percentuálnu mieru nákladov (RPMN) úveru.", "h1": "Ako funguje úver", "p1": "Úver sú peniaze, ktoré si požičiaš a splácaš v čase aj s úrokom. Každá splátka obsahuje časť požičanej sumy (istinu) a úrok z toho, čo ešte dlhuješ. Poplatky a mesačné platby zvyšujú skutočnú cenu úveru nad nominálnu úrokovú sadzbu.", "h2": "Rovnaké a klesajúce splátky", "p2": "Pri rovnakých splátkach (anuita) je splátka stále rovnaká: na začiatku tvorí väčšinu úrok, neskôr istina. Pri klesajúcich splátkach splácaš každý mesiac rovnakú istinu plus úrok zo zostatku, takže splátky začínajú vyššie a časom klesajú a celkové úroky sú nižšie. RPMN je ročná sadzba, pri ktorej sa všetky splátky a poplatky rovnajú peniazom, ktoré si skutočne dostal.", "h4": "Dobré vedieť", "lim": "<li>Ponuky porovnávaj podľa RPMN, nielen podľa nominálnej úrokovej sadzby: zahŕňa poplatky a mesačné platby.</li><li>Dlhšia doba znižuje splátku, ale zvyšuje celkové úroky.</li><li>Zisti, či je predčasné splatenie bezplatné a ako ho banka spoplatňuje.</li><li>Poistenie a iné voliteľné produkty tu nie sú zahrnuté, pokiaľ ich nezadáš ako mesačný poplatok.</li>", "note": "Výsledky sú orientačné a nie sú finančným poradenstvom. Skutočná ponuka banky sa môže líšiť. Pred rozhodnutím porovnaj viac ponúk."}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Kreditrechner", "sub": "Berechne monatliche Rate, Gesamtzinsen, Gebühren und effektiven Jahreszins eines Kredits.", "h1": "So funktioniert ein Kredit", "p1": "Ein Kredit ist geliehenes Geld, das du mit Zinsen über die Zeit zurückzahlst. Jede Rate enthält einen Teil des geliehenen Betrags (Tilgung) und die Zinsen auf die offene Schuld. Gebühren und monatliche Kosten erhöhen die tatsächlichen Kosten über den Nominalzins hinaus.", "h2": "Gleiche oder fallende Raten", "p2": "Bei gleichen Raten (Annuität) bleibt die Rate konstant: anfangs besteht sie überwiegend aus Zinsen, später aus Tilgung. Bei fallenden Raten zahlst du jeden Monat dieselbe Tilgung plus Zinsen auf die Restschuld; die Raten beginnen höher und sinken, und die Gesamtzinsen sind niedriger. Der effektive Jahreszins ist der Jahreszins, bei dem alle Zahlungen und Gebühren dem tatsächlich erhaltenen Betrag entsprechen.", "h4": "Gut zu wissen", "lim": "<li>Vergleiche Angebote über den effektiven Jahreszins, nicht nur den Nominalzins: Er enthält Gebühren und monatliche Kosten.</li><li>Eine längere Laufzeit senkt die Rate, erhöht aber die Gesamtzinsen.</li><li>Prüfe, ob eine vorzeitige Rückzahlung kostenlos ist und wie die Bank sie berechnet.</li><li>Versicherungen und andere optionale Produkte sind hier nicht enthalten, es sei denn, du gibst sie als monatliche Gebühr ein.</li>", "note": "Die Ergebnisse sind Richtwerte und keine Finanzberatung. Das tatsächliche Angebot einer Bank kann abweichen. Vergleiche vor einer Entscheidung mehrere Angebote."}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Kalkulačka splátky úvěru", "sub": "Spočítej měsíční splátku, celkové úroky, poplatky a roční procentní sazbu nákladů (RPSN) úvěru.", "h1": "Jak funguje úvěr", "p1": "Úvěr jsou peníze, které si půjčíš a splácíš v čase i s úrokem. Každá splátka obsahuje část půjčené částky (jistinu) a úrok z toho, co ještě dlužíš. Poplatky a měsíční platby zvyšují skutečnou cenu úvěru nad nominální úrokovou sazbu.", "h2": "Stejné a klesající splátky", "p2": "U stejných splátek (anuita) je splátka stále stejná: na začátku tvoří většinu úrok, později jistina. U klesajících splátek splácíš každý měsíc stejnou jistinu plus úrok ze zůstatku, takže splátky začínají výše a časem klesají a celkové úroky jsou nižší. RPSN je roční sazba, při které se všechny splátky a poplatky rovnají penězům, které jsi skutečně dostal.", "h4": "Dobré vědět", "lim": "<li>Nabídky porovnávej podle RPSN, nejen podle nominální úrokové sazby: zahrnuje poplatky a měsíční platby.</li><li>Delší doba snižuje splátku, ale zvyšuje celkové úroky.</li><li>Zjisti, zda je předčasné splacení bezplatné a jak je banka zpoplatňuje.</li><li>Pojištění a jiné volitelné produkty zde nejsou zahrnuty, pokud je nezadáš jako měsíční poplatek.</li>", "note": "Výsledky jsou orientační a nejsou finančním poradenstvím. Skutečná nabídka banky se může lišit. Před rozhodnutím porovnej více nabídek."}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Kalkulator raty kredytu", "sub": "Oblicz ratę miesięczną, łączne odsetki, opłaty i rzeczywistą roczną stopę oprocentowania (RRSO) kredytu.", "h1": "Jak działa kredyt", "p1": "Kredyt to pieniądze, które pożyczasz i spłacasz w czasie wraz z odsetkami. Każda rata zawiera część pożyczonej kwoty (kapitał) oraz odsetki od tego, co jeszcze zostało do spłaty. Opłaty i miesięczne koszty podnoszą rzeczywisty koszt kredytu ponad oprocentowanie nominalne.", "h2": "Raty równe i malejące", "p2": "Przy ratach równych (annuitetowych) rata jest stała: na początku większość stanowią odsetki, później kapitał. Przy ratach malejących co miesiąc spłacasz ten sam kapitał plus odsetki od salda, więc raty zaczynają się wyżej i spadają, a łączne odsetki są niższe. RRSO to roczna stopa, przy której wszystkie raty i opłaty równają się pieniądzom, które faktycznie otrzymałeś.", "h4": "Warto wiedzieć", "lim": "<li>Porównuj oferty według RRSO, a nie tylko oprocentowania nominalnego: uwzględnia opłaty i miesięczne koszty.</li><li>Dłuższy okres obniża ratę, ale zwiększa łączne odsetki.</li><li>Sprawdź, czy wcześniejsza spłata jest bezpłatna i jak bank ją rozlicza.</li><li>Ubezpieczenia i inne opcjonalne produkty nie są tu uwzględnione, chyba że wpiszesz je jako opłatę miesięczną.</li>", "note": "Wyniki mają charakter orientacyjny i nie stanowią porady finansowej. Rzeczywista oferta banku może się różnić. Przed decyzją porównaj kilka ofert."}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calculateur de prêt", "sub": "Calculez la mensualité, le total des intérêts, les frais et le taux annuel effectif global (TAEG) d’un prêt.", "h1": "Comment fonctionne un prêt", "p1": "Un prêt est de l’argent emprunté que vous remboursez avec des intérêts au fil du temps. Chaque mensualité comprend une part du capital emprunté et les intérêts sur ce qu’il reste à rembourser. Les frais et les charges mensuelles augmentent le coût réel du prêt au-delà du taux nominal.", "h2": "Mensualités constantes ou dégressives", "p2": "Avec des mensualités constantes (annuité), l’échéance reste identique : au début elle est surtout composée d’intérêts, ensuite de capital. Avec des mensualités dégressives, vous remboursez chaque mois le même capital plus les intérêts sur le solde ; les échéances commencent plus haut puis baissent, et le total des intérêts est plus faible. Le TAEG est le taux annuel pour lequel tous les paiements et frais égalent la somme réellement reçue.", "h4": "Bon à savoir", "lim": "<li>Comparez les offres selon le TAEG, pas seulement le taux nominal : il inclut les frais et les charges mensuelles.</li><li>Une durée plus longue réduit la mensualité mais augmente le total des intérêts.</li><li>Vérifiez si le remboursement anticipé est gratuit et comment la banque le facture.</li><li>Les assurances et autres produits optionnels ne sont pas inclus ici, sauf si vous les saisissez comme frais mensuels.</li>", "note": "Les résultats sont indicatifs et ne constituent pas un conseil financier. L’offre réelle d’une banque peut différer. Comparez plusieurs offres avant de décider."}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Calculadora de préstamo", "sub": "Calcula la cuota mensual, los intereses totales, las comisiones y la tasa anual equivalente (TAE) de un préstamo.", "h1": "Cómo funciona un préstamo", "p1": "Un préstamo es dinero que pides prestado y devuelves con intereses a lo largo del tiempo. Cada cuota incluye una parte del dinero prestado (el capital) y los intereses sobre lo que aún debes. Las comisiones y los cargos mensuales elevan el coste real del préstamo por encima del tipo nominal.", "h2": "Cuotas iguales o decrecientes", "p2": "Con cuotas iguales (anualidad) la cuota se mantiene: al principio es sobre todo interés y después sobre todo capital. Con cuotas decrecientes devuelves cada mes el mismo capital más los intereses sobre el saldo, así que las cuotas empiezan más altas y bajan, y los intereses totales son menores. La TAE es la tasa anual con la que todos los pagos y comisiones igualan el dinero realmente recibido.", "h4": "Conviene saber", "lim": "<li>Compara ofertas por la TAE, no solo por el tipo nominal: incluye comisiones y cargos mensuales.</li><li>Un plazo más largo baja la cuota pero aumenta los intereses totales.</li><li>Comprueba si la amortización anticipada es gratuita y cómo la cobra el banco.</li><li>Los seguros y otros productos opcionales no se incluyen aquí, salvo que los introduzcas como comisión mensual.</li>", "note": "Los resultados son orientativos y no constituyen asesoramiento financiero. La oferta real de un banco puede diferir. Compara varias ofertas antes de decidir."}};

function baseText(){
  const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.tagName==='UL'?e.innerHTML=v:e.textContent=v});
  document.querySelectorAll('[data-p]').forEach(e=>e.textContent=L(e.dataset.p));
}
function showRes(ok){$('res').classList.toggle('hidden',!ok);$('hint').classList.toggle('hidden',ok);$('hint').textContent=L('hint')}

const DEFS={lp:10000};
let ptype='ann',tunit='y';
function irr(target,flows){let lo=0,hi=1;for(let i=0;i<100;i++){const m=(lo+hi)/2;let s=0;for(let t=0;t<flows.length;t++)s+=flows[t]/Math.pow(1+m,t+1);if(s>target)lo=m;else hi=m}return (lo+hi)/2}
function calcAll(){
  const P=+$('lp').value,a=+$('lr').value,tv=+$('lt').value,fp=+$('lf').value||0,mf=+$('lm').value||0;
  const n=tunit==='y'?Math.round(tv*12):Math.round(tv);
  if($('lp').value===''||$('lr').value===''||$('lt').value===''||!(P>=100&&P<=1e10&&a>=0&&a<=60&&n>=1&&n<=600&&fp>=0&&fp<=20&&mf>=0))return null;
  const r=a/1200,pays=[],rows=[];let bal=P,ti=0;
  const M=r?P*r/(1-Math.pow(1+r,-n)):P/n;
  let yp=0,yi=0;
  for(let t=1;t<=n;t++){const i=bal*r,pr=ptype==='ann'?M-i:P/n,pay=pr+i;bal-=pr;ti+=i;pays.push(pay+mf);yp+=pr;yi+=i;
    if(t%12===0||t===n){rows.push([Math.ceil(t/12),yp+yi,yp,yi,Math.max(bal,0)]);yp=yi=0}}
  const fee=P*fp/100,feesTotal=fee+mf*n,total=P+ti,apr=Math.pow(1+irr(P-fee,pays),12)-1;
  return {P,n,pays,ti,fee,feesTotal,total,apr,rows};
}
function calc(){
  const o=calcAll();showRes(!!o);$('ssec').classList.toggle('hidden',!o);if(!o)return;
  $('pl').textContent=ptype==='ann'?L('pay'):L('first');
  $('big').textContent=money(o.pays[0],2);
  $('pl2').textContent=ptype==='dec'?`${L('last')}: ${money(o.pays[o.pays.length-1],2)}`:'';
  const tot=o.total,ip=o.ti/tot*100;$('bp').style.width=(100-ip)+'%';$('bi').style.width=ip+'%';
  $('rows').innerHTML=[[L('total'),money(tot+o.feesTotal)],[L('int'),money(o.ti)],[L('fees'),money(o.feesTotal)],[L('apr'),nf(o.apr*100,2)+(lang==='en'?'%':' %')]].map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');
  $('shead').innerHTML=`<tr><th>${L('cy')}</th><th>${L('cp')}</th><th>${L('cpr')}</th><th>${L('ci')}</th><th>${L('cb')}</th></tr>`;
  $('sch').innerHTML=o.rows.map(r=>`<tr><td>${r[0]}</td><td>${money(r[1])}</td><td>${money(r[2])}</td><td>${money(r[3])}</td><td>${money(r[4])}</td></tr>`).join('');
}
function buildSel(){
  $('lu').innerHTML=['y','m'].map(k=>`<option value="${k}" ${k===tunit?'selected':''}>${L(k==='y'?'yrs':'mos')}</option>`).join('');
  $('ly').innerHTML=['ann','dec'].map(k=>`<option value="${k}" ${k===ptype?'selected':''}>${L('t_'+k)}</option>`).join('');
}
function text(){baseText();buildSel();curLang(DEFS);$('slbl').textContent=L(schOpen?'schH':'sch');
  $('fbox').innerHTML=`<div><b style="color:var(--accent)">M = P × r ÷ (1 − (1 + r)<sup>−n</sup>)</b></div><div><b style="color:var(--accent)">${L('t_dec').split('(')[0].trim()}: P ÷ n + ${L('ci').toLowerCase()}</b></div>`;syncLang();calc()}
$('lu').addEventListener('change',e=>{tunit=e.target.value;calc()});$('ly').addEventListener('change',e=>{ptype=e.target.value;calc()});
['lp','lr','lt','lf','lm'].forEach(id=>$(id).addEventListener('input',calc));
curInit(DEFS,calc);

function schToggle(){schOpen=!schOpen;$('sbox').classList.toggle('hidden',!schOpen);$('sbtn').setAttribute('aria-expanded',String(schOpen));$('slbl').textContent=L(schOpen?'schH':'sch')}
$('sbtn').addEventListener('click',schToggle);
initLang(text);text();
</script>
</body>
</html>
