<script>
let lang='en',schOpen=false,cur='EUR',curTouched=false,amtTouched=false;
const T={
en:{back:'← Back to calculators',ad:'Advertisement',title:'Mortgage Calculator',sub:'Estimate your monthly payment and see how much interest you will pay over the life of the loan.',cur:'Currency',loan:'Loan amount',rate:'Interest rate (per year)',term:'Loan term',yrs:'years',hint:'Enter the loan amount, rate and term to see the result.',monthly:'Monthly payment',total:'Total repaid',intr:'Total interest',sch:'Show repayment schedule',schHide:'Hide repayment schedule',cy:'Year',cp:'Paid',cpr:'Principal',ci:'Interest',cb:'Balance',
h1:'What is a mortgage?',p1:'A mortgage is a long-term loan used to buy or renovate property, with the property itself serving as collateral for the lender. It is usually repaid in equal monthly instalments over 10 to 40 years. Each instalment covers part of the borrowed amount (the principal) and the interest charged on what is still owed.',
h2:'How the monthly payment is calculated',p2:'For a standard annuity mortgage the payment stays the same every month. Early on most of it is interest; over time the interest share shrinks and the principal share grows. M is the monthly payment, P the loan amount, r the monthly interest rate (annual rate ÷ 12) and n the number of monthly payments.',ex:'Example: {a} at 4% over 25 years → about {m} per month',
h3:'What affects the cost',lim:'<li>Interest rate: even a small difference adds up to thousands over the whole term.</li><li>Term: a longer term lowers the monthly payment but increases total interest.</li><li>Down payment: a larger own contribution means a smaller loan and usually a better rate.</li><li>Fees and insurance: processing fees, property insurance and early repayment charges are not included in this calculation.</li>',
note:'This calculator is for illustration only and assumes a fixed interest rate and equal monthly payments. The actual offer from a bank depends on your income, the property and the current rate. Compare several offers or talk to a financial advisor before deciding.'},
sk:{back:'← Späť na kalkulačky',ad:'Reklama',title:'Kalkulačka hypotéky',sub:'Vypočítaj mesačnú splátku a zisti, koľko zaplatíš na úrokoch počas celej doby splácania.',cur:'Mena',loan:'Výška úveru',rate:'Úroková sadzba (ročne)',term:'Doba splácania',yrs:'rokov',hint:'Zadaj výšku úveru, sadzbu a dobu splácania.',monthly:'Mesačná splátka',total:'Spolu zaplatíš',intr:'Zaplatené úroky',sch:'Zobraziť splátkový kalendár',schHide:'Skryť splátkový kalendár',cy:'Rok',cp:'Zaplatené',cpr:'Istina',ci:'Úrok',cb:'Zostatok',
h1:'Čo je hypotéka?',p1:'Hypotéka je dlhodobý úver na kúpu alebo rekonštrukciu nehnuteľnosti, pri ktorom nehnuteľnosť slúži banke ako záruka. Najčastejšie sa spláca rovnakými mesačnými splátkami počas 10 až 40 rokov. Každá splátka obsahuje časť požičanej sumy (istinu) aj úrok z toho, čo ešte dlhuješ.',
h2:'Ako sa počíta mesačná splátka',p2:'Pri štandardnej anuitnej hypotéke je splátka každý mesiac rovnaká. Na začiatku tvorí väčšinu úrok, postupom času podiel úroku klesá a podiel istiny rastie. M je mesačná splátka, P výška úveru, r mesačná úroková sadzba (ročná sadzba ÷ 12) a n počet mesačných splátok.',ex:'Príklad: {a} pri 4 % na 25 rokov → približne {m} mesačne',
h3:'Čo ovplyvňuje cenu hypotéky',lim:'<li>Úroková sadzba: aj malý rozdiel sa za celú dobu premietne do tisícok eur.</li><li>Doba splácania: dlhšia doba znižuje mesačnú splátku, ale zvyšuje celkové úroky.</li><li>Vlastné zdroje: vyšší vlastný vklad znamená nižší úver a zvyčajne lepšiu sadzbu.</li><li>Poplatky a poistenie: poplatky za spracovanie, poistenie nehnuteľnosti a poplatky za predčasné splatenie táto kalkulačka nezahŕňa.</li>',
note:'Kalkulačka je len orientačná a počíta s fixnou úrokovou sadzbou a rovnakými mesačnými splátkami. Skutočná ponuka banky závisí od tvojho príjmu, nehnuteľnosti a aktuálnych sadzieb. Pred rozhodnutím porovnaj viac ponúk alebo sa poraď s finančným poradcom.'},
de:{back:'← Zurück zu den Rechnern',ad:'Werbung',title:'Hypothekenrechner',sub:'Berechne deine monatliche Rate und sieh, wie viel Zinsen du über die gesamte Laufzeit zahlst.',cur:'Währung',loan:'Darlehensbetrag',rate:'Zinssatz (pro Jahr)',term:'Laufzeit',yrs:'Jahre',hint:'Darlehensbetrag, Zinssatz und Laufzeit eingeben.',monthly:'Monatliche Rate',total:'Gesamt zurückgezahlt',intr:'Zinsen gesamt',sch:'Tilgungsplan anzeigen',schHide:'Tilgungsplan ausblenden',cy:'Jahr',cp:'Gezahlt',cpr:'Tilgung',ci:'Zinsen',cb:'Restschuld',
h1:'Was ist eine Hypothek?',p1:'Eine Hypothek ist ein langfristiges Darlehen für den Kauf oder die Sanierung einer Immobilie, bei dem die Immobilie der Bank als Sicherheit dient. Meist wird sie in gleichbleibenden Monatsraten über 10 bis 40 Jahre zurückgezahlt. Jede Rate besteht aus einem Teil des geliehenen Betrags (Tilgung) und den Zinsen auf die noch offene Schuld.',
h2:'So wird die Monatsrate berechnet',p2:'Bei einem klassischen Annuitätendarlehen bleibt die Rate jeden Monat gleich. Anfangs besteht sie überwiegend aus Zinsen, mit der Zeit sinkt der Zinsanteil und der Tilgungsanteil steigt. M ist die Monatsrate, P der Darlehensbetrag, r der monatliche Zinssatz (Jahreszins ÷ 12) und n die Anzahl der Monatsraten.',ex:'Beispiel: {a} bei 4 % über 25 Jahre → rund {m} pro Monat',
h3:'Was die Kosten beeinflusst',lim:'<li>Zinssatz: Schon kleine Unterschiede summieren sich über die Laufzeit auf Tausende Euro.</li><li>Laufzeit: Eine längere Laufzeit senkt die Monatsrate, erhöht aber die Gesamtzinsen.</li><li>Eigenkapital: Mehr Eigenkapital bedeutet ein kleineres Darlehen und meist bessere Konditionen.</li><li>Gebühren und Versicherung: Bearbeitungsgebühren, Gebäudeversicherung und Vorfälligkeitsentschädigung sind in dieser Berechnung nicht enthalten.</li>',
note:'Der Rechner dient nur zur Orientierung und geht von einem festen Zinssatz und gleichen Monatsraten aus. Das tatsächliche Angebot einer Bank hängt von deinem Einkommen, der Immobilie und den aktuellen Zinsen ab. Vergleiche mehrere Angebote oder sprich vor einer Entscheidung mit einem Finanzberater.'},
cs:{back:'← Zpět na kalkulačky',ad:'Reklama',title:'Hypoteční kalkulačka',sub:'Spočítej měsíční splátku a zjisti, kolik zaplatíš na úrocích za celou dobu splácení.',cur:'Měna',loan:'Výše úvěru',rate:'Úroková sazba (ročně)',term:'Doba splácení',yrs:'let',hint:'Zadej výši úvěru, sazbu a dobu splácení.',monthly:'Měsíční splátka',total:'Celkem zaplatíš',intr:'Zaplacené úroky',sch:'Zobrazit splátkový kalendář',schHide:'Skrýt splátkový kalendář',cy:'Rok',cp:'Zaplaceno',cpr:'Jistina',ci:'Úrok',cb:'Zůstatek',
h1:'Co je hypotéka?',p1:'Hypotéka je dlouhodobý úvěr na koupi nebo rekonstrukci nemovitosti, u kterého nemovitost slouží bance jako záruka. Nejčastěji se splácí stejnými měsíčními splátkami po dobu 10 až 40 let. Každá splátka obsahuje část půjčené částky (jistinu) i úrok z toho, co ještě dlužíš.',
h2:'Jak se měsíční splátka počítá',p2:'U standardní anuitní hypotéky je splátka každý měsíc stejná. Na začátku tvoří většinu úrok, postupem času podíl úroku klesá a podíl jistiny roste. M je měsíční splátka, P výše úvěru, r měsíční úroková sazba (roční sazba ÷ 12) a n počet měsíčních splátek.',ex:'Příklad: {a} při 4 % na 25 let → přibližně {m} měsíčně',
h3:'Co ovlivňuje cenu hypotéky',lim:'<li>Úroková sazba: i malý rozdíl se za celou dobu promítne do tisíců eur.</li><li>Doba splácení: delší doba snižuje měsíční splátku, ale zvyšuje celkové úroky.</li><li>Vlastní zdroje: vyšší vlastní vklad znamená nižší úvěr a obvykle lepší sazbu.</li><li>Poplatky a pojištění: poplatky za zpracování, pojištění nemovitosti a poplatky za předčasné splacení tato kalkulačka nezahrnuje.</li>',
note:'Kalkulačka je pouze orientační a počítá s fixní úrokovou sazbou a stejnými měsíčními splátkami. Skutečná nabídka banky závisí na tvém příjmu, nemovitosti a aktuálních sazbách. Před rozhodnutím porovnej více nabídek nebo se poraď s finančním poradcem.'},
pl:{back:'← Wróć do kalkulatorów',ad:'Reklama',title:'Kalkulator kredytu hipotecznego',sub:'Oblicz miesięczną ratę i zobacz, ile odsetek zapłacisz w całym okresie kredytowania.',cur:'Waluta',loan:'Kwota kredytu',rate:'Oprocentowanie (rocznie)',term:'Okres kredytowania',yrs:'lat',hint:'Podaj kwotę kredytu, oprocentowanie i okres spłaty.',monthly:'Miesięczna rata',total:'Łącznie do spłaty',intr:'Odsetki łącznie',sch:'Pokaż harmonogram spłat',schHide:'Ukryj harmonogram spłat',cy:'Rok',cp:'Wpłacono',cpr:'Kapitał',ci:'Odsetki',cb:'Saldo',
h1:'Czym jest kredyt hipoteczny?',p1:'Kredyt hipoteczny to długoterminowy kredyt na zakup lub remont nieruchomości, w którym nieruchomość jest zabezpieczeniem dla banku. Najczęściej spłaca się go w równych ratach miesięcznych przez 10 do 40 lat. Każda rata zawiera część pożyczonej kwoty (kapitał) oraz odsetki od tego, co jeszcze zostało do spłaty.',
h2:'Jak oblicza się miesięczną ratę',p2:'W standardowym kredycie z ratami równymi rata jest co miesiąc taka sama. Na początku większość stanowią odsetki, z czasem ich udział maleje, a udział kapitału rośnie. M to miesięczna rata, P kwota kredytu, r miesięczna stopa procentowa (oprocentowanie roczne ÷ 12), a n liczba rat miesięcznych.',ex:'Przykład: {a} przy 4 % na 25 lat → około {m} miesięcznie',
h3:'Co wpływa na koszt kredytu',lim:'<li>Oprocentowanie: nawet niewielka różnica w całym okresie oznacza tysiące euro.</li><li>Okres kredytowania: dłuższy okres obniża ratę, ale zwiększa łączne odsetki.</li><li>Wkład własny: wyższy wkład to mniejszy kredyt i zwykle lepsze warunki.</li><li>Opłaty i ubezpieczenie: prowizje, ubezpieczenie nieruchomości i opłaty za wcześniejszą spłatę nie są uwzględnione w tym kalkulatorze.</li>',
note:'Kalkulator ma charakter orientacyjny i zakłada stałe oprocentowanie oraz równe raty miesięczne. Rzeczywista oferta banku zależy od Twoich dochodów, nieruchomości i aktualnych stóp procentowych. Przed decyzją porównaj kilka ofert lub skonsultuj się z doradcą finansowym.'},
fr:{back:'← Retour aux calculateurs',ad:'Publicité',title:'Calculateur de prêt immobilier',sub:'Estimez votre mensualité et voyez combien d’intérêts vous paierez sur toute la durée du prêt.',cur:'Devise',loan:'Montant du prêt',rate:'Taux d’intérêt (annuel)',term:'Durée du prêt',yrs:'ans',hint:'Saisissez le montant, le taux et la durée du prêt.',monthly:'Mensualité',total:'Total remboursé',intr:'Total des intérêts',sch:'Afficher le tableau d’amortissement',schHide:'Masquer le tableau d’amortissement',cy:'Année',cp:'Payé',cpr:'Capital',ci:'Intérêts',cb:'Solde',
h1:'Qu’est-ce qu’un prêt immobilier ?',p1:'Un prêt immobilier est un crédit à long terme destiné à acheter ou rénover un bien, le bien servant de garantie à la banque. Il est le plus souvent remboursé par mensualités constantes sur 10 à 40 ans. Chaque mensualité comprend une part du capital emprunté et les intérêts calculés sur ce qu’il reste à rembourser.',
h2:'Comment la mensualité est calculée',p2:'Pour un prêt à annuités constantes, la mensualité reste identique chaque mois. Au début, elle se compose surtout d’intérêts ; avec le temps, la part d’intérêts diminue et celle du capital augmente. M est la mensualité, P le montant emprunté, r le taux mensuel (taux annuel ÷ 12) et n le nombre de mensualités.',ex:'Exemple : {a} à 4 % sur 25 ans → environ {m} par mois',
h3:'Ce qui influe sur le coût',lim:'<li>Taux d’intérêt : même un petit écart représente des milliers d’euros sur toute la durée.</li><li>Durée : une durée plus longue réduit la mensualité mais augmente le total des intérêts.</li><li>Apport personnel : un apport plus élevé réduit le prêt et permet souvent un meilleur taux.</li><li>Frais et assurance : frais de dossier, assurance du bien et indemnités de remboursement anticipé ne sont pas inclus dans ce calcul.</li>',
note:'Ce calculateur est donné à titre indicatif et suppose un taux fixe et des mensualités constantes. L’offre réelle d’une banque dépend de vos revenus, du bien et des taux du moment. Comparez plusieurs offres ou consultez un conseiller financier avant de décider.'},
es:{back:'← Volver a las calculadoras',ad:'Publicidad',title:'Calculadora de hipoteca',sub:'Calcula tu cuota mensual y descubre cuántos intereses pagarás durante toda la vida del préstamo.',cur:'Moneda',loan:'Importe del préstamo',rate:'Tipo de interés (anual)',term:'Plazo',yrs:'años',hint:'Introduce el importe, el tipo de interés y el plazo.',monthly:'Cuota mensual',total:'Total a pagar',intr:'Total de intereses',sch:'Mostrar cuadro de amortización',schHide:'Ocultar cuadro de amortización',cy:'Año',cp:'Pagado',cpr:'Capital',ci:'Intereses',cb:'Saldo',
h1:'¿Qué es una hipoteca?',p1:'Una hipoteca es un préstamo a largo plazo para comprar o reformar una vivienda, en el que el propio inmueble sirve de garantía para el banco. Lo habitual es devolverla en cuotas mensuales iguales durante 10 a 40 años. Cada cuota incluye una parte del dinero prestado (el capital) y los intereses sobre lo que aún se debe.',
h2:'Cómo se calcula la cuota mensual',p2:'En una hipoteca de cuota constante la cuota es la misma cada mes. Al principio la mayor parte son intereses; con el tiempo baja la parte de intereses y sube la de capital. M es la cuota mensual, P el importe del préstamo, r el tipo mensual (tipo anual ÷ 12) y n el número de cuotas mensuales.',ex:'Ejemplo: {a} al 4 % a 25 años → unos {m} al mes',
h3:'Qué influye en el coste',lim:'<li>Tipo de interés: incluso una pequeña diferencia supone miles de euros a lo largo del plazo.</li><li>Plazo: un plazo más largo baja la cuota, pero aumenta los intereses totales.</li><li>Aportación inicial: una entrada mayor implica un préstamo menor y, normalmente, mejores condiciones.</li><li>Comisiones y seguros: las comisiones de apertura, el seguro del inmueble y la comisión por amortización anticipada no están incluidos en este cálculo.</li>',
note:'Esta calculadora es solo orientativa y supone un tipo de interés fijo y cuotas mensuales iguales. La oferta real de un banco depende de tus ingresos, del inmueble y de los tipos vigentes. Compara varias ofertas o consulta con un asesor financiero antes de decidir.'}
};

const $=id=>document.getElementById(id);
const LOC={sk:'sk-SK',de:'de-DE',en:'en-IE',cs:'cs-CZ',pl:'pl-PL',fr:'fr-FR',es:'es-ES'};

const pct=n=>new Intl.NumberFormat(LOC[lang],{maximumFractionDigits:0}).format(n)+' %';

const CURS=['EUR','USD','GBP','CZK','PLN','CHF'],DEF={cs:'CZK',pl:'PLN'},AMT={EUR:150000,USD:150000,GBP:130000,CZK:3500000,PLN:600000,CHF:140000};

function text(){
  const L=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=L[e.dataset.i];if(v===undefined)return;e.tagName==='UL'?e.innerHTML=v:e.textContent=v});

function calc(){
  const raw=$('lr').value,P=+$('lp').value,a=+raw,Y=+$('ly').value;
  const ok=raw!==''&&P>=100&&P<=1e10&&a>=0&&a<=30&&Y>=1&&Y<=40;
  $('res').classList.toggle('hidden',!ok);$('hint').classList.toggle('hidden',ok);$('schSec').classList.toggle('hidden',!ok);
  if(!ok)return;
  const n=Math.round(Y*12),r=a/1200;
  const M=r===0?P/n:P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  const total=M*n,inter=total-P,ip=inter/total*100;
  $('val').textContent=money(M,2);$('tot').textContent=money(total);$('int').textContent=money(inter);
  $('bp').style.width=(100-ip)+'%';$('bi').style.width=ip+'%';$('pp').textContent=pct(100-ip);$('pi').textContent=pct(ip);
  let bal=P,yp=0,yi=0,html='';
  for(let m=1;m<=n;m++){const i=bal*r,pr=M-i;bal-=pr;yp+=pr;yi+=i;
    if(m%12===0||m===n){html+=`<tr><td>${Math.ceil(m/12)}</td><td>${money(yp+yi)}</td><td>${money(yp)}</td><td>${money(yi)}</td><td>${money(Math.max(bal,0))}</td></tr>`;yp=yi=0}}
  $('sch').innerHTML=html;
}
['lp','lr','ly'].forEach(id=>$(id).addEventListener('input',calc));
