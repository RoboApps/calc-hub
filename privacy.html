e stránky (oprávnený záujem, čl. 6 ods. 1 písm. f GDPR)."], ["cookies", "Cookies a podobné technológie", "My sami neukladáme do tvojho zariadenia žiadne cookies ani iné údaje. Zvolený jazyk a mena sa uchovávajú len v adrese stránky (napríklad ?lang=de), nie v zariadení. Reklamu zabezpečuje Google AdSense. V Európskom hospodárskom priestore, Spojenom kráľovstve a Švajčiarsku sa Google v súhlasovom hlásení opýta na tvoju voľbu skôr, než sa cookies alebo podobné technológie použijú na personalizované reklamy. Voľbu môžeš kedykoľvek zmeniť alebo odvolať cez odkaz „Nastavenia súkromia a cookies“ v pätičke a cookies môžeš zmazať aj v nastaveniach prehliadača."], ["ads", "Reklama (Google AdSense)", "Google a jeho partneri môžu na zobrazovanie a meranie reklám používať cookies a identifikátory. Google pri týchto údajoch koná ako samostatný prevádzkovateľ a právnym základom je tvoj súhlas (čl. 6 ods. 1 písm. a GDPR a národné pravidlá ePrivacy). Viac nájdeš v <a class=\"underline\" style=\"color:var(--accent)\" href=\"https://policies.google.com/technologies/partner-sites\" target=\"_blank\" rel=\"noopener\">Ako Google používa informácie z webov, ktoré využívajú jeho služby</a> a nastavenia reklám spravuješ na <a class=\"underline\" style=\"color:var(--accent)\" href=\"https://adssettings.google.com\" target=\"_blank\" rel=\"noopener\">adssettings.google.com</a>."], ["third", "Služby tretích strán", "Na zobrazenie stránky tvoj prehliadač načítava štýlovací kód z cdn.tailwindcss.com. Bitcoin prevodník načítava kurzy z CoinGecko a Coinbase. Títo poskytovatelia pri načítaní stránky získavajú tvoju IP adresu a technické údaje požiadavky. Kalkulačky týmto službám nikdy neodosielajú hodnoty, ktoré zadáš."], ["rights", "Tvoje práva", "Máš právo na prístup, opravu a vymazanie údajov, na obmedzenie spracúvania alebo namietanie, na prenosnosť údajov a kedykoľvek môžeš odvolať súhlas bez vplyvu na predchádzajúce spracúvanie. Sťažnosť môžeš podať dozornému orgánu; na Slovensku je to Úrad gen löschen."], ["ads", "Werbung (Google AdSense)", "Google und seine Partner können Cookies und Kennungen verwenden, um Anzeigen auszuspielen und zu messen. Google handelt bei diesen Daten als eigenständiger Verantwortlicher, Rechtsgrundlage ist deine Einwilligung (Art. 6 Abs. 1 lit. a DSGVO und nationale ePrivacy-Vorschriften). Mehr dazu unter <a class=\"underline\" style=\"color:var(--accent)\" href=\"https://policies.google.com/technologies/partner-sites\" target=\"_blank\" rel=\"noopener\">Wie Google Informationen von Websites nutzt, die seine Dienste verwenden</a>; deine Werbeeinstellungen verwaltest du unter <a class=\"underline\" style=\"color:var(--accent)\" href=\"https://adssettings.google.com\" target=\"_blank\" rel=\"noopener\">adssettings.google.com</a>."], ["third", "Dienste Dritter", "Zur Darstellung der Seite lädt dein Browser Gestaltungscode von cdn.tailwindcss.com. Der Bitcoin-Umrechner lädt Kurse von CoinGecko und Coinbase. Diese Anbieter erhalten beim Laden der Seite deine IP-Adresse und technische Anfragedaten. Die Rechner senden die von dir eingegebenen Werte niemals an diese Dienste."], ["rights", "Deine Rechte", "Du hast das Recht auf Auskunft, Berichtigung und Löschung, auf Einschränkung der Verarbeitung oder Widerspruch, auf Datenübertragbarkeit und kannst deine Einwilligung jederzeit widerrufen, ohne dass die frühere Verarbeitung berührt wird. Du kannst dich bei einer Datenschutzaufsichtsbehörde beschweren; in der Slowakei ist das das Amt für den Schutz personenbezogener Daten der Slowakischen Republik (<a class=\"underline\" style=\"color:var(--accent)\" href=\"https://dataprotection.gov.sk\" target=\"_blank\" rel=\"noopener\">dataprotection.gov.sk</a>)."], ["changes", "Änderungen", "Wir können diese Seite aktualisieren, wenn sich die Website oder die Rechtslage ändert. Das Datum der letzten Aktualisierung steht oben."]]}, "cs": {"back": "← Zpět na kalkulačky", "title": "Ochrana údajů a cookies", "upd": "Naposledy aktualizováno", "date": "2. listopadu 2026", "sec": [["ctrl", "Kdo odpovídá", "Provozovatelem calc-hub.eu je Róbert Horváth, Poprad, Slovensko. Kontakt: <a class=\"underline\" style=\"color:var(--accent)\" href=\"mailto:info@calc-hub.eu\">info@calc-hub.eu</a>. Tato stránka vysvětluje, jak se na webu nakládá s osobními údaji a cookies."], ["data", "Jaké údaje zpracováváme", "calc-hub.eu nevyžaduje registraci a nežádá po tobě osobní údaje. Výpočty probíhají ve tvém prohlížeči a zadané hodnoty se nám neodesílají ani neukládají. Jako každý web může i náš poskytovatel hostingu v serverových záznamech zpracovávat technické údaje, například IP adresu, typ prohlížeče a čas návštěvy, což je nezbytné pro bezpečné doručení stránky (oprávněný zájem, čl. 6 odst. 1 písm. f GDPR)."], ["cookies", "Cookies a podobné technologie", "My sami neukládáme do tvého zařízení žádné cookies ani jiná data. Zvolený jazyk a měna se uchovávají jen v adrese stránky (například ?lang=de), nikoli v zařízení. Reklamu zajišťuje Google AdSense. V Evropském hospodářském prostoru, Spojeném království a Švýcarsku se Google v souhlasovém hlášení zeptá na tvou volbu dříve, než se cookies nebo podobné technologie použijí pro personalizované reklamy. Volbu můžeš kdykoli změnit nebo odvolat přes odkaz „Nastavení soukromí a cookies“ v patičce a cookies můžeš smazat i v nastavení prohlížeče."], ["ads", "Reklama (Google AdSense)", "Google a jeho partneři mohou k zobrazování a měření reklam používat cookies a identifikátory. Google u těchto údajů jedná jako samostatný správce a právním základem je tvůj souhlas (čl. 6 odst. 1 písm. a GDPR a národní pravidla ePrivacy). Více najdeš v <a class=\"underline\" style=\"color:var(--accent)\" href=\"https://policies.google.com/technologies/partner-sites\" target=\"_blank\" rel=\"noopener\">Jak Google používá informace z webů, které využívají jeho služby</a> a nastavení reklam spravuješ na <a class=\"underline\" style=\"color:var(--accent)\" href=\"https://adssettings.google.com\" target=\"_blank\" rel=\"noopener\">adssettings.google.com</a>."], ["third", "Služby třetích stran", "K zobrazení stránky tvůj prohlížeč načítá stylovací kód z cdn.tailwindcss.com. Bitcoin převodník načítá kurzy z CoinGecko a Coinbase. Tito poskytovatelé při načtení stránky získávají tvou IP adresu a technické údaje požadavku. Kalkulačky těmto službám nikdy neodesílají hodnoty, které zadáš."], ["rights", "Tvá práva", "Máš právo na přístup, opravu a výmaz údajů, na omezení zpracování nebo vznesení námitky, na přenositelnost údajů a kdykoli můžeš odvolat souhlas, aniž by tím bylo dotčeno předchozí zpracování. Stížnost můžeš podat u dozorového úřadu; v České republice je to Úřad pro ochranu osobních údajů (<a class=\"underline\" style=\"color:var(--accent)\" href=\"https://uoou.gov.cz\" target=\"_blank\" rel=\"noopener\">uoou.gov.cz</a>), na Slovensku Úřad na ochranu osobních údajů SR (<a class=\"underline\" style=\"color:var(--accent)\" href=\"https://dataprotection.gov.sk\" target=\"_blank\" rel=\"noopener\">dataprotection.gov.sk</a>)."], ["changes", "Změny", "Tuto stránku můžeme aktualizovat při změně webu nebo právních předpisů. Datum poslední aktualizace je uvedeno nahoře."]]}, "pl": {"back": "← Wróć do kalkulatorów", "title": "Prywatność i cookies", "upd": "Ostatnia aktualizacja", "date": "2 listopada 2026", "sec": [["ctrl", "Kto odpowiada", "Operatorem calc-hub.eu jest Róbert Horváth, Poprad, Słowacja. Kontakt: <a class=\"underline\" style=\"color:var(--accent)\" href=\"mailto:info@calc-hub.eu\">info@calc-hub.eu</a>. Ta strona wyjaśnia, jak w serwisie przetwarzane są dane osobowe i pliki cookies."], ["data", "Jakie dane przetwarzamy", "calc-hub.eu nie wymaga rejestracji i nie prosi o dane osobowe. Obliczenia wykonują się w Twojej przeglądarce, a wpisane wartości nie są do nas wysyłane ani zapisywane. Jak każdy serwis, nasz dostawca hostingu może przetwarzać w logach serwera dane techniczne, takie jak adres IP, typ przeglądarki i czas wizyty, co jest niezbędne do bezpiecznego dostarczenia strony (prawnie uzasadniony interes, art. 6 ust. 1 lit. f RODO)."], ["cookies", "Pliki cookies i podobne technologie", "Sami nie zapisujemy na Twoim urządzeniu plików cookies ani innych danych. Wybrany język i waluta są przechowywane tylko w adresie strony (na przykład ?lang=de), a nie na urządzeniu. Reklamy dostarcza Google AdSense. W Europejskim Obszarze Gospodarczym, Wielkiej Brytanii i Szwajcarii komunikat Google o zgodzie pyta o Twój wybór, zanim pliki cookies lub podobne technologie zostaną użyte do spersonalizowanych reklam. Wybór możesz w każdej chwili zmienić lub wycofać przez link „Ustawienia prywatności i plików cookies” w stopce, a pliki cookies możesz też usunąć w ustawieniach przeglądarki."], ["ads", "Reklamy (Google AdSense)", "Google i jego partnerzy mogą używać plików cookies i identyfikatorów do wyświetlania i mierzenia reklam. Google jest w odniesieniu do tych danych niezależnym administratorem, a podstawą prawną jest Twoja zgoda (art. 6 ust. 1 lit. a RODO i krajowe przepisy ePrivacy). Więcej w <a class=\"underline\" style=\"color:var(--accent)\" href=\"https://policies.google.com/technologies/partner-sites\" target=\"_blank\" rel=\"noopener\">Jak Google wykorzystuje informacje z witryn korzystających z jego usług</a>, a ustawienia reklam zarządzasz na <a class=\"underline\" style=\"color:var(--accent)\" href=\"https://adssettings.google.com\" target=\"_blank\" rel=\"noopener\">adssettings.google.com</a>."], ["third", "Usługi podmiotów trzecich", "Aby wyświetlić stronę, Twoja przeglądarka pobiera kod stylów z cdn.tailwindcss.com. Przelicznik Bitcoina pobiera kursy z CoinGecko i Coinbase. Ci dostawcy otrzymują przy ładowaniu strony Twój adres IP i techniczne dane żądania. Kalkulatory nigdy nie wysyłają wpisanych przez Ciebie wartości do tych usług."], ["rights", "Twoje prawa", "Masz prawo dostępu, sprostowania i usunięcia danych, ograniczenia przetwarzania lub sprzeciwu, przenoszenia danych oraz w każdej chwili możesz cofnąć zgodę bez wpływu na wcześniejsze przetwarzanie. Skargę możesz złożyć do organu nadzorczego; w Polsce jest to Prezes Urzędu Ochrony Danych Osobowych (<a class=\"underline\" style=\"color:var(--accent)\" href=\"https://uodo.gov.pl\" target=\"_blank\" rel=\"noopener\">uodo.gov.pl</a>), na Słowacji Urząd Ochrony Danych Osobowych Republiki Słowackiej (<a class=\"underline\" style=\"color:var(--accent)\" href=\"https://dataprotection.gov.sk\" target=\"_blank\" rel=\"noopener\">dataprotection.gov.sk</a>)."], ["changes", "Zmiany", "Możemy aktualizować tę stronę, gdy zmieni się serwis lub przepisy. Data ostatniej aktualizacji jest podana na górze."]]}, "fr": {"back": "← Retour aux calculateurs", "title": "Confidentialité et cookies", "upd": "Dernière mise à jour", "date": "2 novembre 2026", "sec": [["ctrl", "Responsable", "L’exploitant de calc-hub.eu est Róbert Horváth, Poprad, Slovaquie. Contact : <a class=\"underline\" style=\"color:var(--accent)\" href=\"mailto:info@calc-hub.eu\">info@calc-hub.eu</a>. Cette page explique comment les données personnelles et les cookies sont traités sur ce site."], ["data", "Données traitées", "calc-hub.eu ne demande ni inscription ni données personnelles. Les calculs s’exécutent dans votre navigateur et les valeurs saisies ne nous sont ni envoyées ni conservées. Comme tout site, notre hébergeur peut traiter dans ses journaux serveur des données techniques telles que l’adresse IP, le type de navigateur et l’heure de visite, ce qui est nécessaire pour fournir le site en toute sécurité (intérêt légitime, art. 6, par. 1, point f du RGPD)."], ["cookies", "Cookies et technologies similaires", "Nous ne stockons nous-mêmes aucun cookie ni autre donnée sur votre appareil. La langue et la devise choisies sont conservées uniquement dans l’adresse de la page (par exemple ?lang=de), pas sur votre appareil. La publicité est fournie par Google AdSense. Dans l’Espace économique européen, au Royaume-Uni et en Suisse, le message de consentement de Google vous demande votre choix avant l’utilisation de cookies ou de technologies similaires pour des annonces personnalisées. Vous pouvez modifier ou retirer votre choix à tout moment via le lien « Paramètres de confidentialité et de cookies » en bas de page, et supprimer les cookies dans les réglages de votre navigateur."], ["ads", "Publicité (Google AdSense)", "Google et ses partenaires peuvent utiliser des cookies et des identifiants pour diffuser et mesurer des annonces. Google agit comme responsable de traitement indépendant pour ces données, et la base juridique est votre consentement (art. 6, par. 1, point a du RGPD et règles nationales ePrivacy). Pour en savoir plus : <a class=\"underline\" style=\"color:var(--accent)\" href=\"https://policies.google.com/technologies/partner-sites\" target=\"_blank\" rel=\"noopener\">Comment Google utilise les informations provenant de sites qui utilisent ses services</a> ; gérez vos préférences publicitaires sur <a class=\"underline\" style=\"color:var(--accent)\" href=\"https://adssettings.google.com\" target=\"_blank\" rel=\"noopener\">adssettings.google.com</a>."], ["third", "Services tiers", "Pour afficher le site, votre navigateur charge du code de mise en forme depuis cdn.tailwindcss.com. Le convertisseur Bitcoin charge les cours depuis CoinGecko et Coinbase. Ces prestataires reçoivent votre adresse IP et des données techniques de requête au chargement de la page. Les calculateurs n’envoient jamais à ces services les valeurs que vous saisissez."], ["rights", "Vos droits", "Vous disposez d’un droit d’accès, de rectification et d’effacement, d’un droit à la limitation du traitement ou d’opposition, d’un droit à la portabilité, et vous pouvez retirer votre consentement à tout moment sans affecter les traitements antérieurs. Vous pouvez déposer une réclamation auprès d’une autorité de protection des données ; en France, il s’agit de la CNIL (<a class=\"underline\" style=\"color:var(--accent)\" href=\"https://www.cnil.fr\" target=\"_blank\" rel=\"noopener\">cnil.fr</a>), en Slovaquie de l’Office de protection des données personnelles (<a class=\"underline\" style=\"color:var(--accent)\" href=\"https://dataprotection.gov.sk\" target=\"_blank\" rel=\"noopener\">dataprotection.gov.sk</a>)."], ["changes", "Modifications", "Nous pouvons mettre à jour cette page lorsque le site ou la loi évolue. La date de dernière mise à jour figure en haut."]]}, "es": {"back": "← Volver a las calculadoras", "title": "Privacidad y cookies", "upd": "Última actualización", "date": "2 de noviembre de 2026", "sec": [["ctrl", "Responsable", "El titular de calc-hub.eu es Róbert Horváth, Poprad, Eslovaquia. Contacto: <a class=\"underline\" style=\"color:var(--accent)\" href=\"mailto:info@calc-hub.eu\">info@calc-hub.eu</a>. Esta página explica cómo se tratan los datos personales y las cookies en este sitio web."], ["data", "Qué datos tratamos", "calc-hub.eu no requiere registro ni solicita datos personales. Los cálculos se ejecutan en tu navegador y los valores que introduces no se nos envían ni se almacenan. Como en cualquier sitio, nuestro proveedor de alojamiento puede tratar en los registros del servidor datos técnicos como la dirección IP, el tipo de navegador y la hora de la visita, algo necesario para entregar el sitio de forma segura (interés legítimo, art. 6.1.f RGPD)."], ["cookies", "Cookies y tecnologías similares", "Nosotros no almacenamos cookies ni otros datos en tu dispositivo. El idioma y la moneda elegidos se conservan solo en la dirección de la página (por ejemplo ?lang=de), no en tu dispositivo. La publicidad la proporciona Google AdSense. En el Espacio Económico Europeo, el Reino Unido y Suiza, el mensaje de consentimiento de Google te pide tu decisión antes de usar cookies o tecnologías similares para anuncios personalizados. Puedes cambiar o retirar tu elección en cualquier momento con el enlace «Configuración de privacidad y cookies» del pie de página, y puedes borrar las cookies en los ajustes del navegador."], ["ads", "Publicidad (Google AdSense)", "Google y sus socios pueden usar cookies e identificadores para mostrar y medir anuncios. Google actúa como responsable independiente de estos datos y la base jurídica es tu consentimiento (art. 6.1.a RGPD y normas nacionales de ePrivacy). Más información en <a class=\"underline\" style=\"color:var(--accent)\" href=\"https://policies.google.com/technologies/partner-sites\" target=\"_blank\" rel=\"noopener\">Cómo usa Google la información de sitios que utilizan sus servicios</a>; gestiona tus preferencias de anuncios en <a class=\"underline\" style=\"color:var(--accent)\" href=\"https://adssettings.google.com\" target=\"_blank\" rel=\"noopener\">adssettings.google.com</a>."], ["third", "Servicios de terceros", "Para mostrar el sitio, tu navegador carga código de estilos desde cdn.tailwindcss.com. El conversor de Bitcoin carga las cotizaciones de CoinGecko y Coinbase. Estos proveedores reciben tu dirección IP y datos técnicos de la solicitud al cargar la página. Las calculadoras nunca envían a estos servicios los valores que introduces."], ["rights", "Tus derechos", "Tienes derecho de acceso, rectificación y supresión, a limitar el tratamiento u oponerte, a la portabilidad de los datos, y puedes retirar tu consentimiento en cualquier momento sin afectar al tratamiento anterior. Puedes presentar una reclamación ante una autoridad de protección de datos; en España es la Agencia Española de Protección de Datos (<a class=\"underline\" style=\"color:var(--accent)\" href=\"https://www.aepd.es\" target=\"_blank\" rel=\"noopener\">aepd.es</a>) y en Eslovaquia la Oficina de Protección de Datos Personales (<a class=\"underline\" style=\"color:var(--accent)\" href=\"https://dataprotection.gov.sk\" target=\"_blank\" rel=\"noopener\">dataprotection.gov.sk</a>)."], ["changes", "Cambios", "Podemos actualizar esta página cuando cambie el sitio o la normativa. La fecha de la última actualización figura arriba."]]}};
