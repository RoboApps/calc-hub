las calculadoras", "ad": "Publicidad", "title": "Calculadora de consumo de combustible", "sub": "Calcula los litros a los 100 km, conviértelos a MPG y calcula el coste de un viaje.", "h1": "Cómo se calcula el consumo de combustible", "p1": "Consumo en litros a los 100 km = combustible usado ÷ distancia × 100. Llena el depósito, anota el cuentakilómetros, conduce, vuelve a llenar y divide los litros añadidos entre los kilómetros recorridos.", "h2": "Conversiones de unidades", "p2": "mpg (US) = 235,215 ÷ (l/100 km). mpg (UK) = 282,481 ÷ (l/100 km). km/l = 100 ÷ (l/100 km). Coste del viaje = distancia × consumo ÷ 100 × precio por litro.", "h4": "Conviene saber", "lim": "<li>Mide con varios depósitos: un solo repostaje es impreciso porque las pistolas cortan en puntos distintos.</li><li>La velocidad, el frío, los trayectos cortos, la presión de los neumáticos y la carga aumentan el consumo.</li><li>El ordenador de a bordo suele ser algunos puntos optimista.</li>", "note": "Solo una estimación; el consumo real varía según las condiciones de conducción."}};

ût du trajet|Coste del viaje", "ckm": "Cost per 100 km|Náklady na 100 km|Kosten pro 100 km|Náklady na 100 km|Koszt na 100 km|Coût aux 100 km|Coste por 100 km", "mode": "Mode|Režim|Modus|Režim|Tryb|Mode|Modo"};
try{const s=new URLSearchParams(location.search).get('lang')||(navigator.language||'').slice(0,2);if(T[s])lang=s}catch(e){}
const BASE='https://calc-hub.eu/fuel.html',OGL={"en": "en_US", "sk": "sk_SK", "de": "de_DE", "cs": "cs_CZ", "pl": "pl_PL", "fr": "fr_FR", "es": "es_ES"},META={"en": {"t": "Fuel Consumption Calculator – L/100 km, MPG & Trip Cost | calc-hub.eu", "d": "Free fuel consumption calculator: litres per 100 km, km per litre, MPG (US and UK) and the fuel needed and cost of a trip."}, "sk": {"t": "Kalkulačka spotreby paliva – l/100 km, MPG a cena cesty | calc-hub.eu", "d": "Bezplatná kalkulačka spotreby paliva: litre na 100 km, km na liter, MPG (US a UK) a potrebné palivo a cena cesty."}, "de": {"t": "Spritverbrauch-Rechner – l/100 km, MPG und Fahrtkosten | calc-hub.eu", "d": "Kostenloser Spritverbrauch-Rechner: Liter pro 100 km, km pro Liter, MPG (US und UK) sowie Kraftstoffbedarf und Kosten einer Fahrt."}, "cs": {"t": "Kalkulačka spotřeby paliva – l/100 km, MPG a cena cesty | calc-hub.eu", "d": "Bezplatná kalkulačka spotřeby paliva: litry na 100 km, km na litr, MPG (US a UK) a potřebné palivo a cena cesty."}, "pl": {"t": "Kalkulator zużycia paliwa – l/100 km, MPG i koszt podróży | calc-hub.eu", "d": "Darmowy kalkulator zużycia paliwa: litry na 100 km, km na litr, MPG (US i UK) oraz potrzebne paliwo i koszt podróży."}, "fr": {"t": "Calculateur de consommation – l/100 km, MPG et coût du trajet | calc-hub.eu", "d": "Calculateur de consommation gratuit : litres aux 100 km, km par litre, MPG (US et UK), carburant nécessaire et coût d’un trajet."}, "es": {"t": "Calculadora de consumo de combustible – l/100 km, MPG y coste del viaje | calc-hub.eu", "d": "Calculadora de consumo gratis: litros a los 100 km, km por litro, MPG (US y UK), combustible necesario y coste de un viaje."}};
function applySeo(){
  const m=META[lang],q=new URLSearchParams(location.search).get('lang'),u=BASE+(q&&META[q]&&q!=='en'?'?lang='+q:'');
  document.title=m.t;
  const set=(sel,v)=>{const e=document.querySelector(sel);if(e)e.setAttribute('content',v)};
  set('meta[name="description"]',m.d);set('meta[property="og:title"]',m.t);set('meta[property="og:description"]',m.d);
  set('meta[name="twitter:title"]',m.t);set('meta[name="twitter:description"]',m.d);set('meta[property="og:url"]',u);set('meta[property="og:locale"]',OGL[lang]);
  const c=document.querySelector('link[rel="canonical"]');if(c)c.setAttribute('href',u);
  document.querySelectorAll('meta[property="og:locale:alternate"]').forEach(e=>e.remove());
  Object.keys(OGL).filter(l=>l!==lang).forEach(l=>{const e=document.createElement('meta');e.setAttribute('property','og:locale:alternate');e.setAttribute('content',OGL[l]);document.head.appendChild(e)});
}
const FT={en:['Privacy & Cookies','Privacy and cookie settings','About & contact'],sk:['Ochrana údajov a cookies','Nastavenia súkromia a cookies','O nás a kontakt'],de:['Datenschutz & Cookies','Datenschutz- und Cookie-Einstellungen','Über uns & Kontakt'],cs:['Ochrana údajů a cookies','Nastavení soukromí a cookies','O nás a kontakt'],pl:['Prywatność i cookies','Ustawienia prywatności i plików cookies','O nas i kontakt'],fr:['Confidentialité et cookies','Paramètres de confidentialité et de cookies','À propos et contact'],es:['Privacidad y cookies','Configuración de privacidad y cookies','Acerca de y contacto']};
function footLinks(){const f=document.getElementById('flinks');if(!f)return;const s='<span class="mx-2">·</span>';f.innerHTML=`<a href="about.html" class="hover:text-white">${FT[lang][2]}</a>${s}<a href="privacy.html" class="hover:text-white">${FT[lang][0]}</a>${s}<button data-cs class="hover:text-white">${FT[lang][1]}</button>`}
function propLinks(){document.querySelectorAll('a[href]').forEach(a=>{const h=a.dataset.h||(a.dataset.h=a.getAttribute('href'));if(!/^[a-z-]+\.html$/.test(h))return;a.setAttribute('href',lang==='en'?h:h+'?lang='+lang)})}
function openCs(){if(window.googlefc&&googlefc.callbackQueue&&googlefc.showRevocationMessage)googlefc.callbackQueue.push(googlefc.showRevocationMessage);else location.href='privacy.html'+(lang==='en'?'':'?lang='+lang)+'#cookies'}
document.addEventListener('click',e=>{if(e.target.closest('[data-cs]'))openCs()});
const LANGS=[['sk','Slovenčina'],['de','Deutsch'],['en','English'],['cs','Čeština'],['pl','Polski'],['fr','Français'],['es','Español']];
function syncLang(){document.getElementById('langCur').textContent=lang.toUpperCase();document.querySelectorAll('#langMenu button').forEach(b=>b.setAttribute('aria-selected',b.dataset.l===lang));footLinks();propLinks();applySeo()}
function initLang(cb){
  const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu');
  menu.innerHTML=LANGS.map(([c,n])=>`<li><button role="option" data-l="${c}"><span>${n}</span><b>${c.toUpperCase()}</b></button></li>`).join('');
  const close=()=>{menu.classList.add('hidden');btn.setAttribute('aria-expanded','false')};
  btn.addEventListener('click',e=>{e.stopPropagation();const hid=menu.classList.toggle('hidden');btn.setAttribute('aria-expanded',String(!hid))});
  menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{const u=new URL(location.href);if(lang==='en')u.searchParams.delete('lang');else u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(x){}close();cb()});
  document.addEventListener('click',close);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}

const $=id=>document.getElementById(id);
const IDX={en:0,sk:1,de:2,cs:3,pl:4,fr:5,es:6},LOC={sk:'sk-SK',de:'de-DE',en:'en-GB',cs:'cs-CZ',pl:'pl-PL',fr:'fr-FR',es:'es-ES'};
const L=k=>PIPE[k].split('|')[IDX[lang]];
const nf=(n,d=0)=>new Intl.NumberFormat(LOC[lang],{maximumFractionDigits:d}).format(n);
function baseText(){
  const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.tagName==='UL'?e.innerHTML=v:e.textContent=v});
  document.querySelectorAll('[data-p]').forEach(e=>e.textContent=L(e.dataset.p));
}
function showRes(o){$('res').classList.toggle('hidden',!o||!!o.err);$('hint').classList.toggle('hidden',!!o);$('hint').textContent=L('hint');$('err').classList.toggle('hidden',!(o&&o.err));if(o&&o.err)$('err').textContent=L(o.err);return !!o&&!o.err}
const rows=a=>a.map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');

const CURS=['EUR','USD','GBP','CZK','PLN','CHF'],DEFC={cs:'CZK',pl:'PLN'};
let cur=DEFC[lang]||'EUR',curT=false;const touched={};
try{const c=new URLSearchParams(location.search).get('cur');if(CURS.includes(c)){cur=c;curT=true}}catch(e){}
const money=(n,d=2)=>new Intl.NumberFormat(LOC[lang],{style:'currency',currency:cur,minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const sym=()=>new Intl.NumberFormat(LOC[lang],{style:'currency',currency:cur}).formatToParts(0).find(p=>p.type==='currency').value;
function setDef(defs){Object.keys(defs).forEach(id=>{if(!touched[id])$(id).value=defs[id][cur]})}
function curInit(defs,onChange){
  $('lc').innerHTML=CURS.map(c=>`<option value="${c}">${c}</option>`).join('');$('lc').value=cur;
  $('lc').addEventListener('change',e=>{cur=e.target.value;curT=true;try{const u=new URL(location.href);u.searchParams.set('cur',cur);history.replaceState(null,'',u)}catch(x){}setDef(defs);document.querySelectorAll('.cs').forEach(e=>e.textContent=sym());onChange()});
  Object.keys(defs).forEach(id=>$(id).addEventListener('input',()=>{touched[id]=true}));setDef(defs);
}
function curLang(defs){if(!curT){cur=DEFC[lang]||'EUR';$('lc').value=cur;setDef(defs)}document.querySelectorAll('.cs').forEach(e=>e.textContent=sym())}

const DEFS={fp:{EUR:1.6,USD:1.0,GBP:1.45,CZK:38,PLN:6.4,CHF:1.8}};let mode='cons';
function units(l){return [[L('kml'),nf(100/l,1)],[L('mpgus'),nf(235.215/l,1)],[L('mpguk'),nf(282.481/l,1)]]}
function calcAll(){
  const d=+$('fd').value;if($('fd').value===''||!(d>0&&d<=100000))return null;
  if(mode==='cons'){const f=+$('ff').value;if($('ff').value===''||!(f>0&&f<=10000))return null;const l=f/d*100;return {big:nf(l,2)+' L/100 km',rl:L('l100'),rows:units(l)}}
  const l=+$('fc').value,p=+$('fp').value;if($('fc').value===''||$('fp').value===''||!(l>0&&l<=100&&p>=0))return null;
  const need=d*l/100,cost=need*p;return {big:money(cost,2),rl:L('tcost'),rows:[[L('need'),nf(need,1)+' L'],[L('ckm'),money(l*p,2)]].concat(units(l))};
}
function calc(){const o=calcAll();if(!showRes(o))return;$('rl').textContent=o.rl;$('big').textContent=o.big;$('rows').innerHTML=rows(o.rows)}
function vis(){$('ffw').classList.toggle('hidden',mode!=='cons');$('fcw').classList.toggle('hidden',mode!=='trip');$('fpw').classList.toggle('hidden',mode!=='trip')}
function build(){$('fm').innerHTML=[['cons','m_cons'],['trip','m_trip']].map(([k,l])=>`<option value="${k}" ${k===mode?'selected':''}>${L(l)}</option>`).join('');vis()}
function text(){baseText();curLang(DEFS);build();$('fbox').innerHTML=`<div><b style="color:var(--accent)">L/100 km = ${L('fuel').split(' (')[0]} ÷ ${L('dist').split(' (')[0]} × 100</b></div><div><b style="color:var(--accent)">mpg US = 235.215 ÷ L/100 km · mpg UK = 282.481 ÷ L/100 km</b></div>`;syncLang();calc()}
$('fm').addEventListener('change',e=>{mode=e.target.value;vis();calc()});
['fd','ff','fc','fp'].forEach(id=>$(id).addEventListener('input',calc));
curInit(DEFS,calc);initLang(text);text();
</script>
