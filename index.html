const BASE='https://calc-hub.eu/',OGL={"en": "en_US", "sk": "sk_SK", "de": "de_DE", "cs": "cs_CZ", "pl": "pl_PL", "fr": "fr_FR", "es": "es_ES"},META={"en": {"t": "calc-hub.eu – Free online calculators", "d": "Free online calculators in one place: BMI, mortgage, Bitcoin converter, paint coverage, unit converter and more. Fast, accurate and available in 7 languages."}, "sk": {"t": "calc-hub.eu – Bezplatné online kalkulačky", "d": "Bezplatné online kalkulačky na jednom mieste: BMI, hypotéka, Bitcoin prevodník, spotreba farby, prevodník jednotiek a ďalšie. Rýchle, presné a v 7 jazykoch."}, "de": {"t": "calc-hub.eu – Kostenlose Online-Rechner", "d": "Kostenlose Online-Rechner an einem Ort: BMI, Hypothek, Bitcoin-Umrechner, Farbbedarf, Einheitenumrechner und mehr. Schnell, präzise und in 7 Sprachen."}, "cs": {"t": "calc-hub.eu – Online kalkulačky zdarma", "d": "Online kalkulačky zdarma na jednom místě: BMI, hypotéka, Bitcoin převodník, spotřeba barvy, převodník jednotek a další. Rychlé, přesné a v 7 jazycích."}, "pl": {"t": "calc-hub.eu – Darmowe kalkulatory online", "d": "Darmowe kalkulatory online w jednym miejscu: BMI, kredyt hipoteczny, przelicznik Bitcoina, zużycie farby, przelicznik jednostek i więcej. Szybkie, dokładne i w 7 językach."}, "fr": {"t": "calc-hub.eu – Calculateurs en ligne gratuits", "d": "Calculateurs en ligne gratuits au même endroit : IMC, prêt immobilier, convertisseur Bitcoin, quantité de peinture, convertisseur d’unités et plus. Rapides, précis et en 7 langues."}, "es": {"t": "calc-hub.eu – Calculadoras online gratis", "d": "Calculadoras online gratis en un solo lugar: IMC, hipoteca, conversor de Bitcoin, gasto de pintura, conversor de unidades y más. Rápidas, precisas y en 7 idiomas."}};
function applySeo(){
  const m=META[lang],q=new URLSearchParams(location.search).get('lang'),u=BASE+(q&&META[q]&&q!=='en'?'?lang='+q:'');
  document.title=m.t;
  const set=(sel,v)=>{const e=document.querySelector(sel);if(e)e.setAttribute('content',v)};
  set('meta[name="description"]',m.d);set('meta[property="og:title"]',m.t);set('meta[property="og:description"]',m.d);
  set('meta[name="twitter:title"]',m.t);set('meta[name="twitter:description"]',m.d);set('meta[property="og:url"]',u);set('meta[property="og:locale"]',OGL[lang]);
  const c=document.querySelector('link[rel="canonical"]');if(c)c.setAttribute('href',u);
  document.querySelectorAll('meta[property="og:locale:alternate"]').forEach(e=>e.remove());
  Object.keys(OGL).filter(l=>l!==lang).forEach(l=>{const e=document.createElement('meta');e.setAttribute('property','og:locale:alternate');e.setAttribute('content',OGL[l]);document.head.appendChild(e)});
}
const FT={en:['Privacy & Cookies','Privacy and cookie settings','About & contact'],sk:['Ochrana údajov a cookies','Nastavenia súkromia a cookies','O nás a kontakt'],de:['Datenschutz & Cookies','Datenschutz- und Cookie-Einstellungen','Über uns & Kontakt'],cs:['Ochrana údajů a cookies','Nastavení soukromí a cookies','O nás a kontakt'],pl:['Prywatność i cookies','Ustawienia prywatności i plików cookies','O nas i kontakt'],fr:['Confidentialité et cookies','Paramètres de confidentialité et de cookies','À propos et contact'],es:['Privacidad y cookies','Configuración de privacidad y cookies','Acerca de y contacto']};
function footLinks(){const f=document.getElementById('flinks');if(!f)return;const s='<span class="mx-2">·</span>';f.innerHTML=`<a href="about.html" class="hover:text-white">${FT[lang][2]}</a>${s}<a href="privacy.html" class="hover:text-white">${FT[lang][0]}</a>${s}<button data-cs class="hover:text-white">${FT[lang][1]}</button>`}
function propLinks(){document.querySelectorAll('a[href]').forEach(a=>{const h=a.dataset.h||(a.dataset.h=a.getAttribute('href'));if(!/^[a-z-]+\.html$/.test(h))return;a.setAttribute('href',lang==='en'?h:h+'?lang='+lang)})}
function openCs(){if(window.googlefc&&googlefc.callbackQueue&&googlefc.showRevocationMessage)googlefc.callbackQueue.push(googlefc.showRevocationMessage);else location.href='privacy.html'+(lang==='en'?'':'?lang='+lang)+'#cookies'}
document.addEventListener('click',e=>{if(e.target.closest('[data-cs]'))openCs()});
const LANGS=[['sk','Slovenčina'],['de','Deutsch'],['en','English'],['cs','Čeština'],['pl','Polski'],['fr','Français'],['es','Español']];
function syncLang(){document.getElementById('langCur').textContent=lang.toUpperCase();document.querySelectorAll('#langMenu button').forEach(b=>b.setAttribute('aria-selected',b.dataset.l===lang));footLinks();propLinks();applySeo()}
function initLang(cb){
  const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu');
  menu.innerHTML=LANGS.map(([c,n])=>`<li><button role="option" data-l="${c}"><span>${n}</span><b>${c.toUpperCase()}</b></button></li>`).join('');
  const close=()=>{menu.classList.add('hidden');btn.setAttribute('aria-expanded','false')};
  btn.addEventListener('click',e=>{e.stopPropagation();const hid=menu.classList.toggle('hidden');btn.setAttribute('aria-expanded',String(!hid))});
  menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{const u=new URL(location.href);if(lang==='en')u.searchParams.delete('lang');else u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(x){}close();cb()});
  document.addEventListener('click',close);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}

let lang='en';
try{const s=new URLSearchParams(location.search).get('lang')||(navigator.language||'').slice(0,2);if(T[s])lang=s}catch(e){}
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const $=id=>document.getElementById(id);

function render(){
  const k=IDX[lang],q=norm($('q').value.trim()),L=T[lang];
  document.documentElement.lang=lang;
  $('badge').textContent=L.badge;$('t1').textContent=L.t1;$('t2').textContent=L.t2;
  document.querySelectorAll('.ad-label').forEach(e=>e.textContent=AD[lang]);
  $('sub').textContent=L.sub;$('q').placeholder=L.p;$('emptyT').textContent=L.e;$('foot').textContent=L.foot;
  syncLang();
  let html='',total=0,cards=0;
  CATS.forEach(c=>{
    const catHit=q&&Object.values(c.n).some(n=>norm(n).includes(q));
    const items=c.i.filter(x=>!q||catHit||x.some(n=>norm(n).includes(q)));
    if(!items.length)return;
    total+=items.length;
    html+=`<article class="glass fade rounded-2xl p-6" style="animation-delay:${cards++*60}ms">
      <div class="relative flex items-center gap-3.5">
        <span class="ico flex h-11 w-11 shrink-0 items-center justify-center rounded-xl"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[c.id]}</svg></span>
        <div><h2 class="text-lg font-semibold leading-tight text-white">${c.n[lang]}</h2><p class="text-sm" style="color:#7d869a">${c.d[lang]}</p></div>
      </div>
      <ul class="relative mt-5 space-y-0.5">
        ${items.map(x=>LINKS[x[2]]?`<li><a href="${LINKS[x[2]]}" class="row"><span>${x[k]}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></li>`:`<li><span class="row soon" title="${SOON[lang]}" aria-disabled="true"><span>${x[k]}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></li>`).join('')}
      </ul></article>`;
  });
  $('cards').innerHTML=html;propLinks();
  $('adTile').classList.toggle('hidden',total===0);
  $('empty').classList.toggle('hidden',total>0);
  $('count').textContent=q?L.c(total):'';
}

initLang(render);
$('q').addEventListener('input',render);
$('grid').addEventListener('mousemove',e=>{
  const c=e.target.closest('.glass');if(!c)return;
  const r=c.getBoundingClientRect();
  c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px');
});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}
  if(e.key==='Escape'){$('q').value='';render();$('q').blur()}
});
render();
</script>
</body>
</html>
