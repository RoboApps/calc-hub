let lang='en';
const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "Volume and Surface Area Calculator", "sub": "Choose a solid, enter its dimensions and get the volume and surface area with the formula.", "h1": "How to use", "h2": "Units and rounding", "h4": "Formulas", "p1": "Choose a shape, then fill in the dimensions. All results update instantly and show the formula with your numbers substituted. Use any unit (cm, m, inches): lengths give the same unit, areas the unit squared, volumes the unit cubed.", "note": "Everything is calculated in your browser and nothing you enter is stored or sent anywhere.", "p2": "Choose the length unit once and enter all dimensions in it. Areas come out in that unit squared, volumes in that unit cubed, and the main result is also shown in other units. Results have up to six decimals; π is used at full precision. Tip: 1 dm³ = 1 litre, 1 cm³ = 1 millilitre and 1 m³ = 1000 litres.", "lim": "<li><b>Cube:</b> V = a³, S = 6·a²</li><li><b>Cuboid:</b> V = a·b·c, S = 2(a·b+b·c+a·c)</li><li><b>Cylinder:</b> V = π·r²·h, S = 2·π·r(r+h)</li><li><b>Cone:</b> V = (1/3)·π·r²·h, S = π·r(r+s), s = √(r²+h²)</li><li><b>Sphere:</b> V = (4/3)·π·r³, S = 4·π·r²</li><li><b>Hemisphere:</b> V = (2/3)·π·r³, S = 3·π·r²</li><li><b>Square pyramid:</b> V = (1/3)·a²·h, S = a²+2·a·l, l = √(h²+(a/2)²)</li><li><b>Prism:</b> V = B·h, S = 2·B+p·h</li><li><b>Truncated cone:</b> V = (1/3)·π·h(r₁²+r₁·r₂+r₂²), S = π(r₁²+r₂²+(r₁+r₂)·s)</li>", "faqh": "Frequently asked questions", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How do I calculate the volume of a cylinder?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">V = π·r²·h. Example: radius 3 and height 10 give V = π·9·10 ≈ 282.74. The surface area is S = 2·π·r(r+h) ≈ 245.04.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">What is the difference between volume and surface area?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Volume is the space inside a solid and is given in cubic units; surface area is the total area of its outer faces and is given in square units. Example: a cube with side 2 has volume 2³ = 8 and surface area 6·2² = 24.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How do I convert volume to litres?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">1 dm³ = 1 litre, 1 cm³ = 1 millilitre and 1 m³ = 1000 litres. Example: a box of 50 × 40 × 30 cm has 60,000 cm³ = 60 litres. The calculator also shows the result in other units.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How do I calculate the volume of a cone or a pyramid?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Both are one third of base area times height: cone V = (1/3)·π·r²·h, square pyramid V = (1/3)·a²·h. Example: a cone with radius 3 and height 4 has V = (1/3)·π·9·4 = 12π ≈ 37.70 and slant height s = √(3²+4²) = 5.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">How do I calculate the volume of a sphere?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">V = (4/3)·π·r³ and S = 4·π·r². Example: radius 3 gives V = 36π ≈ 113.10 and S = 36π ≈ 113.10 (for r = 3 the two numbers happen to be equal); a hemisphere has half the volume.</p></details></li>"}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Výpočet objemu a povrchu", "sub": "Vyber teleso, zadaj rozmery a získaj objem a povrch so vzorcom.", "h1": "Ako na to", "h2": "Jednotky a zaokrúhľovanie", "h4": "Vzorce", "p1": "Vyber útvar a vyplň rozmery. Všetky výsledky sa prepočítajú okamžite a ukážu vzorec s dosadenými číslami. Použi ľubovoľnú jednotku (cm, m, palce): dĺžky vyjdú v tej istej jednotke, obsahy v jednotke na druhú, objemy v jednotke na tretiu.", "note": "Všetko sa počíta v tvojom prehliadači a nič, čo zadáš, sa neukladá ani neodosiela.", "p2": "Vyber jednotku dĺžky raz a všetky rozmery zadaj v nej. Obsahy vyjdú v tejto jednotke na druhú, objemy na tretiu a hlavný výsledok sa zobrazí aj v iných jednotkách. Výsledky majú najviac šesť desatinných miest; π sa používa v plnej presnosti. Tip: 1 dm³ = 1 liter, 1 cm³ = 1 mililiter a 1 m³ = 1000 litrov.", "lim": "<li><b>Kocka:</b> V = a³, S = 6·a²</li><li><b>Kváder:</b> V = a·b·c, S = 2(a·b+b·c+a·c)</li><li><b>Valec:</b> V = π·r²·h, S = 2·π·r(r+h)</li><li><b>Kužeľ:</b> V = (1/3)·π·r²·h, S = π·r(r+s), s = √(r²+h²)</li><li><b>Guľa:</b> V = (4/3)·π·r³, S = 4·π·r²</li><li><b>Pologuľa:</b> V = (2/3)·π·r³, S = 3·π·r²</li><li><b>Štvorboký ihlan:</b> V = (1/3)·a²·h, S = a²+2·a·l, l = √(h²+(a/2)²)</li><li><b>Hranol:</b> V = B·h, S = 2·B+p·h</li><li><b>Zrezaný kužeľ:</b> V = (1/3)·π·h(r₁²+r₁·r₂+r₂²), S = π(r₁²+r₂²+(r₁+r₂)·s)</li>", "faqh": "Často kladené otázky", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ako vypočítam objem valca?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">V = π·r²·h. Príklad: polomer 3 a výška 10 dávajú V = π·9·10 ≈ 282,74. Povrch je S = 2·π·r(r+h) ≈ 245,04.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Aký je rozdiel medzi objemom a povrchom?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Objem je priestor vo vnútri telesa a udáva sa v kubických jednotkách, povrch je celková plocha jeho stien a udáva sa v štvorcových jednotkách. Príklad: kocka s hranou 2 má objem 2³ = 8 a povrch 6·2² = 24.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ako prevediem objem na litre?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">1 dm³ = 1 liter, 1 cm³ = 1 mililiter a 1 m³ = 1000 litrov. Príklad: škatuľa 50 × 40 × 30 cm má 60 000 cm³ = 60 litrov. Kalkulačka zobrazí výsledok aj v iných jednotkách.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ako vypočítam objem kužeľa alebo ihlana?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Oba majú objem tretinu plochy podstavy krát výška: kužeľ V = (1/3)·π·r²·h, štvorcový ihlan V = (1/3)·a²·h. Príklad: kužeľ s polomerom 3 a výškou 4 má V = (1/3)·π·9·4 = 12π ≈ 37,70 a dĺžku strany s = √(3²+4²) = 5.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Ako vypočítam objem gule?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">V = (4/3)·π·r³ a S = 4·π·r². Príklad: polomer 3 dáva V = 36π ≈ 113,10 a S = 36π ≈ 113,10 (pri r = 3 vyjdú obe čísla rovnaké); pologuľa má polovičný objem.</p></details></li>"}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Volumen und Oberfläche berechnen", "sub": "Wähle einen Körper, gib die Maße ein und erhalte Volumen und Oberfläche samt Formel.", "h1": "So geht’s", "h2": "Einheiten und Rundung", "h4": "Formeln", "p1": "Wähle eine Form und trage die Maße ein. Alle Ergebnisse aktualisieren sich sofort und zeigen die Formel mit deinen eingesetzten Zahlen. Verwende eine beliebige Einheit (cm, m, Zoll): Längen ergeben dieselbe Einheit, Flächen die Einheit zum Quadrat, Volumen die Einheit hoch drei.", "note": "Alles wird in deinem Browser berechnet; nichts, was du eingibst, wird gespeichert oder gesendet.", "p2": "Wähle die Längeneinheit einmal und gib alle Maße in ihr ein. Flächen ergeben diese Einheit zum Quadrat, Volumen hoch drei, und das Hauptergebnis wird auch in anderen Einheiten angezeigt. Ergebnisse haben bis zu sechs Nachkommastellen; π wird in voller Genauigkeit verwendet. Tipp: 1 dm³ = 1 Liter, 1 cm³ = 1 Milliliter und 1 m³ = 1000 Liter.", "lim": "<li><b>Würfel:</b> V = a³, S = 6·a²</li><li><b>Quader:</b> V = a·b·c, S = 2(a·b+b·c+a·c)</li><li><b>Zylinder:</b> V = π·r²·h, S = 2·π·r(r+h)</li><li><b>Kegel:</b> V = (1/3)·π·r²·h, S = π·r(r+s), s = √(r²+h²)</li><li><b>Kugel:</b> V = (4/3)·π·r³, S = 4·π·r²</li><li><b>Halbkugel:</b> V = (2/3)·π·r³, S = 3·π·r²</li><li><b>Quadratische Pyramide:</b> V = (1/3)·a²·h, S = a²+2·a·l, l = √(h²+(a/2)²)</li><li><b>Prisma:</b> V = B·h, S = 2·B+p·h</li><li><b>Kegelstumpf:</b> V = (1/3)·π·h(r₁²+r₁·r₂+r₂²), S = π(r₁²+r₂²+(r₁+r₂)·s)</li>", "faqh": "Häufige Fragen", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie berechne ich das Volumen eines Zylinders?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">V = π·r²·h. Beispiel: Radius 3 und Höhe 10 ergeben V = π·9·10 ≈ 282,74. Die Oberfläche ist S = 2·π·r(r+h) ≈ 245,04.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Was ist der Unterschied zwischen Volumen und Oberfläche?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Das Volumen ist der Raum im Inneren eines Körpers und wird in Kubikeinheiten angegeben, die Oberfläche ist die Gesamtfläche seiner Außenflächen und wird in Quadrateinheiten angegeben. Beispiel: Ein Würfel mit Kantenlänge 2 hat das Volumen 2³ = 8 und die Oberfläche 6·2² = 24.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie rechne ich Volumen in Liter um?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">1 dm³ = 1 Liter, 1 cm³ = 1 Milliliter und 1 m³ = 1000 Liter. Beispiel: Eine Kiste 50 × 40 × 30 cm hat 60.000 cm³ = 60 Liter. Der Rechner zeigt das Ergebnis auch in anderen Einheiten.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie berechne ich das Volumen von Kegel oder Pyramide?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Beide haben ein Drittel von Grundfläche mal Höhe: Kegel V = (1/3)·π·r²·h, quadratische Pyramide V = (1/3)·a²·h. Beispiel: Ein Kegel mit Radius 3 und Höhe 4 hat V = (1/3)·π·9·4 = 12π ≈ 37,70 und die Mantellinie s = √(3²+4²) = 5.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Wie berechne ich das Volumen einer Kugel?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">V = (4/3)·π·r³ und S = 4·π·r². Beispiel: Radius 3 ergibt V = 36π ≈ 113,10 und S = 36π ≈ 113,10 (bei r = 3 sind beide Zahlen zufällig gleich); eine Halbkugel hat das halbe Volumen.</p></details></li>"}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Výpočet objemu a povrchu", "sub": "Vyber těleso, zadej rozměry a získej objem a povrch se vzorcem.", "h1": "Jak na to", "h2": "Jednotky a zaokrouhlování", "h4": "Vzorce", "p1": "Vyber útvar a vyplň rozměry. Všechny výsledky se přepočítají okamžitě a ukážou vzorec s dosazenými čísly. Použij libovolnou jednotku (cm, m, palce): délky vyjdou ve stejné jednotce, obsahy v jednotce na druhou, objemy v jednotce na třetí.", "note": "Vše se počítá ve tvém prohlížeči a nic, co zadáš, se neukládá ani neodesílá.", "p2": "Vyber jednotku délky jednou a všechny rozměry zadej v ní. Obsahy vyjdou v této jednotce na druhou, objemy na třetí a hlavní výsledek se zobrazí i v jiných jednotkách. Výsledky mají nejvýše šest desetinných míst; π se používá v plné přesnosti. Tip: 1 dm³ = 1 litr, 1 cm³ = 1 mililitr a 1 m³ = 1000 litrů.", "lim": "<li><b>Krychle:</b> V = a³, S = 6·a²</li><li><b>Kvádr:</b> V = a·b·c, S = 2(a·b+b·c+a·c)</li><li><b>Válec:</b> V = π·r²·h, S = 2·π·r(r+h)</li><li><b>Kužel:</b> V = (1/3)·π·r²·h, S = π·r(r+s), s = √(r²+h²)</li><li><b>Koule:</b> V = (4/3)·π·r³, S = 4·π·r²</li><li><b>Polokoule:</b> V = (2/3)·π·r³, S = 3·π·r²</li><li><b>Čtyřboký jehlan:</b> V = (1/3)·a²·h, S = a²+2·a·l, l = √(h²+(a/2)²)</li><li><b>Hranol:</b> V = B·h, S = 2·B+p·h</li><li><b>Komolý kužel:</b> V = (1/3)·π·h(r₁²+r₁·r₂+r₂²), S = π(r₁²+r₂²+(r₁+r₂)·s)</li>", "faqh": "Časté otázky", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak vypočítám objem válce?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">V = π·r²·h. Příklad: poloměr 3 a výška 10 dávají V = π·9·10 ≈ 282,74. Povrch je S = 2·π·r(r+h) ≈ 245,04.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jaký je rozdíl mezi objemem a povrchem?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Objem je prostor uvnitř tělesa a udává se v krychlových jednotkách, povrch je celková plocha jeho stěn a udává se ve čtverečních jednotkách. Příklad: krychle s hranou 2 má objem 2³ = 8 a povrch 6·2² = 24.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak převedu objem na litry?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">1 dm³ = 1 litr, 1 cm³ = 1 mililitr a 1 m³ = 1000 litrů. Příklad: krabice 50 × 40 × 30 cm má 60 000 cm³ = 60 litrů. Kalkulačka zobrazí výsledek i v jiných jednotkách.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak vypočítám objem kužele nebo jehlanu?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Oba mají objem třetinu obsahu podstavy krát výška: kužel V = (1/3)·π·r²·h, čtyřboký jehlan V = (1/3)·a²·h. Příklad: kužel s poloměrem 3 a výškou 4 má V = (1/3)·π·9·4 = 12π ≈ 37,70 a délku strany s = √(3²+4²) = 5.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak vypočítám objem koule?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">V = (4/3)·π·r³ a S = 4·π·r². Příklad: poloměr 3 dává V = 36π ≈ 113,10 a S = 36π ≈ 113,10 (při r = 3 vyjdou obě čísla stejně); polokoule má poloviční objem.</p></details></li>"}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Obliczanie objętości i pola powierzchni", "sub": "Wybierz bryłę, wpisz wymiary i uzyskaj objętość oraz pole powierzchni wraz ze wzorem.", "h1": "Jak używać", "h2": "Jednostki i zaokrąglanie", "h4": "Wzory", "p1": "Wybierz figurę i wpisz wymiary. Wszystkie wyniki przeliczają się od razu i pokazują wzór z podstawionymi liczbami. Użyj dowolnej jednostki (cm, m, cale): długości wyjdą w tej samej jednostce, pola w jednostce do kwadratu, objętości w jednostce do sześcianu.", "note": "Wszystko jest liczone w Twojej przeglądarce, a nic, co wpiszesz, nie jest zapisywane ani wysyłane.", "p2": "Wybierz jednostkę długości raz i wpisz w niej wszystkie wymiary. Pola wyjdą w tej jednostce do kwadratu, objętości do sześcianu, a główny wynik pokazujemy też w innych jednostkach. Wyniki mają do sześciu miejsc po przecinku; π jest użyte z pełną precyzją. Wskazówka: 1 dm³ = 1 litr, 1 cm³ = 1 mililitr, a 1 m³ = 1000 litrów.", "lim": "<li><b>Sześcian:</b> V = a³, S = 6·a²</li><li><b>Prostopadłościan:</b> V = a·b·c, S = 2(a·b+b·c+a·c)</li><li><b>Walec:</b> V = π·r²·h, S = 2·π·r(r+h)</li><li><b>Stożek:</b> V = (1/3)·π·r²·h, S = π·r(r+s), s = √(r²+h²)</li><li><b>Kula:</b> V = (4/3)·π·r³, S = 4·π·r²</li><li><b>Półkula:</b> V = (2/3)·π·r³, S = 3·π·r²</li><li><b>Ostrosłup czworokątny:</b> V = (1/3)·a²·h, S = a²+2·a·l, l = √(h²+(a/2)²)</li><li><b>Graniastosłup:</b> V = B·h, S = 2·B+p·h</li><li><b>Stożek ścięty:</b> V = (1/3)·π·h(r₁²+r₁·r₂+r₂²), S = π(r₁²+r₂²+(r₁+r₂)·s)</li>", "faqh": "Najczęstsze pytania", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak obliczyć objętość walca?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">V = π·r²·h. Przykład: promień 3 i wysokość 10 dają V = π·9·10 ≈ 282,74. Pole powierzchni to S = 2·π·r(r+h) ≈ 245,04.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jaka jest różnica między objętością a polem powierzchni?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Objętość to przestrzeń wewnątrz bryły, podawana w jednostkach sześciennych, pole powierzchni to całkowite pole jej ścian, podawane w jednostkach kwadratowych. Przykład: sześcian o krawędzi 2 ma objętość 2³ = 8 i pole powierzchni 6·2² = 24.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak przeliczyć objętość na litry?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">1 dm³ = 1 litr, 1 cm³ = 1 mililitr, a 1 m³ = 1000 litrów. Przykład: pudło 50 × 40 × 30 cm ma 60 000 cm³ = 60 litrów. Kalkulator pokazuje wynik także w innych jednostkach.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak obliczyć objętość stożka lub ostrosłupa?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Oba mają objętość równą jednej trzeciej pola podstawy razy wysokość: stożek V = (1/3)·π·r²·h, ostrosłup prawidłowy czworokątny V = (1/3)·a²·h. Przykład: stożek o promieniu 3 i wysokości 4 ma V = (1/3)·π·9·4 = 12π ≈ 37,70 i tworzącą s = √(3²+4²) = 5.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Jak obliczyć objętość kuli?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">V = (4/3)·π·r³ i S = 4·π·r². Przykład: promień 3 daje V = 36π ≈ 113,10 i S = 36π ≈ 113,10 (przy r = 3 obie liczby wychodzą takie same); półkula ma połowę objętości.</p></details></li>"}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calcul de volume et d’aire", "sub": "Choisissez un solide, saisissez ses dimensions et obtenez le volume et l’aire avec la formule.", "h1": "Mode d’emploi", "h2": "Unités et arrondis", "h4": "Formules", "p1": "Choisissez une forme et remplissez les dimensions. Tous les résultats se mettent à jour instantanément et montrent la formule avec vos nombres. Utilisez n’importe quelle unité (cm, m, pouces) : les longueurs restent dans cette unité, les aires en unité au carré, les volumes en unité au cube.", "note": "Tout est calculé dans votre navigateur et rien de ce que vous saisissez n’est enregistré ni envoyé.", "p2": "Choisissez l’unité de longueur une fois et saisissez toutes les dimensions dedans. Les aires sortent en unité au carré, les volumes en unité au cube, et le résultat principal est aussi donné dans d’autres unités. Les résultats ont jusqu’à six décimales ; π est utilisé avec toute sa précision. Astuce : 1 dm³ = 1 litre, 1 cm³ = 1 millilitre et 1 m³ = 1000 litres.", "lim": "<li><b>Cube:</b> V = a³, S = 6·a²</li><li><b>Pavé droit:</b> V = a·b·c, S = 2(a·b+b·c+a·c)</li><li><b>Cylindre:</b> V = π·r²·h, S = 2·π·r(r+h)</li><li><b>Cône:</b> V = (1/3)·π·r²·h, S = π·r(r+s), s = √(r²+h²)</li><li><b>Sphère:</b> V = (4/3)·π·r³, S = 4·π·r²</li><li><b>Hémisphère:</b> V = (2/3)·π·r³, S = 3·π·r²</li><li><b>Pyramide à base carrée:</b> V = (1/3)·a²·h, S = a²+2·a·l, l = √(h²+(a/2)²)</li><li><b>Prisme:</b> V = B·h, S = 2·B+p·h</li><li><b>Tronc de cône:</b> V = (1/3)·π·h(r₁²+r₁·r₂+r₂²), S = π(r₁²+r₂²+(r₁+r₂)·s)</li>", "faqh": "Questions fréquentes", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Comment calculer le volume d’un cylindre ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">V = π·r²·h. Exemple : un rayon de 3 et une hauteur de 10 donnent V = π·9·10 ≈ 282,74. L’aire totale est S = 2·π·r(r+h) ≈ 245,04.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Quelle est la différence entre volume et aire ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Le volume est l’espace à l’intérieur d’un solide et s’exprime en unités cubes ; l’aire est la surface totale de ses faces et s’exprime en unités carrées. Exemple : un cube d’arête 2 a un volume de 2³ = 8 et une aire de 6·2² = 24.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Comment convertir un volume en litres ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">1 dm³ = 1 litre, 1 cm³ = 1 millilitre et 1 m³ = 1000 litres. Exemple : une boîte de 50 × 40 × 30 cm fait 60 000 cm³ = 60 litres. Le calculateur affiche aussi le résultat dans d’autres unités.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Comment calculer le volume d’un cône ou d’une pyramide ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Les deux valent le tiers de l’aire de la base fois la hauteur : cône V = (1/3)·π·r²·h, pyramide à base carrée V = (1/3)·a²·h. Exemple : un cône de rayon 3 et de hauteur 4 a V = (1/3)·π·9·4 = 12π ≈ 37,70 et une génératrice s = √(3²+4²) = 5.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">Comment calculer le volume d’une sphère ?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">V = (4/3)·π·r³ et S = 4·π·r². Exemple : un rayon de 3 donne V = 36π ≈ 113,10 et S = 36π ≈ 113,10 (pour r = 3, les deux nombres sont égaux par hasard) ; une demi-sphère a la moitié du volume.</p></details></li>"}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Cálculo de volumen y área", "sub": "Elige un cuerpo, introduce sus medidas y obtén el volumen y el área con la fórmula.", "h1": "Cómo se usa", "h2": "Unidades y redondeo", "h4": "Fórmulas", "p1": "Elige una figura y rellena las medidas. Todos los resultados se actualizan al instante y muestran la fórmula con tus números sustituidos. Usa cualquier unidad (cm, m, pulgadas): las longitudes salen en esa unidad, las áreas en unidad al cuadrado y los volúmenes en unidad al cubo.", "note": "Todo se calcula en tu navegador y nada de lo que introduces se guarda ni se envía.", "p2": "Elige la unidad de longitud una vez e introduce en ella todas las medidas. Las áreas salen en esa unidad al cuadrado, los volúmenes al cubo, y el resultado principal también se muestra en otras unidades. Los resultados tienen hasta seis decimales; π se usa con toda su precisión. Consejo: 1 dm³ = 1 litro, 1 cm³ = 1 mililitro y 1 m³ = 1000 litros.", "lim": "<li><b>Cubo:</b> V = a³, S = 6·a²</li><li><b>Ortoedro:</b> V = a·b·c, S = 2(a·b+b·c+a·c)</li><li><b>Cilindro:</b> V = π·r²·h, S = 2·π·r(r+h)</li><li><b>Cono:</b> V = (1/3)·π·r²·h, S = π·r(r+s), s = √(r²+h²)</li><li><b>Esfera:</b> V = (4/3)·π·r³, S = 4·π·r²</li><li><b>Hemisferio:</b> V = (2/3)·π·r³, S = 3·π·r²</li><li><b>Pirámide cuadrada:</b> V = (1/3)·a²·h, S = a²+2·a·l, l = √(h²+(a/2)²)</li><li><b>Prisma:</b> V = B·h, S = 2·B+p·h</li><li><b>Tronco de cono:</b> V = (1/3)·π·h(r₁²+r₁·r₂+r₂²), S = π(r₁²+r₂²+(r₁+r₂)·s)</li>", "faqh": "Preguntas frecuentes", "faq": "<li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Cómo calculo el volumen de un cilindro?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">V = π·r²·h. Ejemplo: radio 3 y altura 10 dan V = π·9·10 ≈ 282,74. El área total es S = 2·π·r(r+h) ≈ 245,04.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Qué diferencia hay entre volumen y área?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">El volumen es el espacio dentro de un cuerpo y se expresa en unidades cúbicas; el área es la superficie total de sus caras y se expresa en unidades cuadradas. Ejemplo: un cubo de arista 2 tiene volumen 2³ = 8 y área 6·2² = 24.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Cómo convierto un volumen a litros?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">1 dm³ = 1 litro, 1 cm³ = 1 mililitro y 1 m³ = 1000 litros. Ejemplo: una caja de 50 × 40 × 30 cm tiene 60.000 cm³ = 60 litros. La calculadora muestra el resultado también en otras unidades.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Cómo calculo el volumen de un cono o una pirámide?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">Ambos valen un tercio del área de la base por la altura: cono V = (1/3)·π·r²·h, pirámide cuadrada V = (1/3)·a²·h. Ejemplo: un cono de radio 3 y altura 4 tiene V = (1/3)·π·9·4 = 12π ≈ 37,70 y generatriz s = √(3²+4²) = 5.</p></details></li><li class=\"glass rounded-2xl p-4\"><details><summary class=\"cursor-pointer font-semibold text-white\">¿Cómo calculo el volumen de una esfera?</summary><p class=\"mt-2 leading-relaxed\" style=\"color:#a3acbf\">V = (4/3)·π·r³ y S = 4·π·r². Ejemplo: radio 3 da V = 36π ≈ 113,10 y S = 36π ≈ 113,10 (con r = 3 ambos números coinciden por casualidad); una semiesfera tiene la mitad del volumen.</p></details></li>"}};

  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.tagName==='UL'?e.innerHTML=v:e.textContent=v})}
const P=Math.PI;
const SH=[
{k:'cube',f:[['a','side']],r:[['r_vol','V = a³',v=>v.a**3],['r_surf','S = 6·a²',v=>6*v.a**2]]},
{k:'cuboid',f:[['a','side'],['b','side'],['c','side']],r:[['r_vol','V = a·b·c',v=>v.a*v.b*v.c],['r_surf','S = 2(a·b+b·c+a·c)',v=>2*(v.a*v.b+v.b*v.c+v.a*v.c)]]},
{k:'cyl',f:[['r','radius'],['h','height']],r:[['r_vol','V = π·r²·h',v=>P*v.r**2*v.h],['r_surf','S = 2·π·r(r+h)',v=>2*P*v.r*(v.r+v.h)],['r_lat','M = 2·π·r·h',v=>2*P*v.r*v.h]]},
{k:'cone',f:[['r','radius'],['h','height']],x:v=>({s:Math.sqrt(v.r**2+v.h**2)}),r:[['r_vol','V = (1/3)·π·r²·h',v=>P*v.r**2*v.h/3],['r_surf','S = π·r(r+s)',v=>P*v.r*(v.r+v.s)],['r_lat','M = π·r·s',v=>P*v.r*v.s],['r_slant','s = √(r²+h²)',v=>v.s]]},
{k:'sphere',f:[['r','radius']],r:[['r_vol','V = (4/3)·π·r³',v=>4/3*P*v.r**3],['r_surf','S = 4·π·r²',v=>4*P*v.r**2]]},
{k:'hemi',f:[['r','radius']],r:[['r_vol','V = (2/3)·π·r³',v=>2/3*P*v.r**3],['r_surf','S = 3·π·r²',v=>3*P*v.r**2]]},
{k:'pyr',f:[['a','side'],['h','height']],x:v=>({l:Math.sqrt(v.h**2+(v.a/2)**2)}),r:[['r_vol','V = (1/3)·a²·h',v=>v.a**2*v.h/3],['r_surf','S = a²+2·a·l',v=>v.a**2+2*v.a*v.l],['r_slant','l = √(h²+(a/2)²)',v=>v.l]]},
{k:'prism',f:[['B','barea'],['p','bper'],['h','height']],r:[['r_vol','V = B·h',v=>v.B*v.h],['r_surf','S = 2·B+p·h',v=>2*v.B+v.p*v.h]]},
{k:'frus',f:[['r₁','radius'],['r₂','radius'],['h','height']],x:v=>({s:Math.sqrt((v['r₁']-v['r₂'])**2+v.h**2)}),r:[['r_vol','V = (1/3)·π·h(r₁²+r₁·r₂+r₂²)',v=>P*v.h*(v['r₁']**2+v['r₁']*v['r₂']+v['r₂']**2)/3],['r_surf','S = π(r₁²+r₂²+(r₁+r₂)·s)',v=>P*(v['r₁']**2+v['r₂']**2+(v['r₁']+v['r₂'])*v.s)],['r_lat','M = π(r₁+r₂)·s',v=>P*(v['r₁']+v['r₂'])*v.s],['r_slant','s = √((r₁−r₂)²+h²)',v=>v.s]]}
];

const fmt=x=>isFinite(x)?(+x.toFixed(6)).toLocaleString(lang==='en'?'en-US':lang,{maximumFractionDigits:6}):'–';
const sub=(f,v)=>f.replace(/^[^=≈]*[=≈]/,'').trim().replace(/(?<![A-Za-z])[A-Za-zα][₁₂]?(?![A-Za-z])/g,m=>v[m]!==undefined?fmt(v[m]):m);
const UN=[['mm',.001],['cm',.01],['dm',.1],['m',1],['km',1000],['in',.0254],['ft',.3048],['yd',.9144]],PW={r_area:2,r_surf:2,r_lat:2,r_vol:3},SUP=['','','²','³'];
const EQ={2:[['mm²',1e-6],['cm²',1e-4],['dm²',1e-2],['m²',1],['ha',1e4],['km²',1e6],['in²',.0254**2],['ft²',.3048**2]],3:[['mm³',1e-9],['cm³ = ml',1e-6],['dm³ = l',1e-3],['m³',1],['in³',.0254**3],['ft³',.3048**3],['gal (US)',.003785411784]]};
const fm=x=>x.toLocaleString(lang==='en'?'en-US':lang,{maximumSignificantDigits:6}),uo=()=>UN[+$('un').value||1];
function compute(s,v){if(!s.f.every(([k])=>v[k]>0))return{e:'err'};const e=s.c&&s.c(v);if(e)return{e};
  const w={...v,...(s.x?s.x(v):{})};return{rows:s.r.map(([l,f,fn])=>({l,f,val:fn(w),s:sub(f,w)}))}}
let cur=0;
function fields(){const s=SH[cur],old={},u=uo()[0],suf=w=>w==='angle'?'°':w==='n'?'':w==='barea'?u+'²':u;document.querySelectorAll('#fl input').forEach(i=>old[i.dataset.v]=i.value);
  $('fl').innerHTML=s.f.map(([v,w])=>`<div><label class="block text-sm" style="color:#8b94a7">${L('w_'+w)} <i>${v}</i></label><div class="field mt-2"><input data-v="${v}" type="number" inputmode="decimal" min="0" step="any" value="${old[v]!==undefined?old[v]:''}"><span>${suf(w)}</span></div></div>`).join('')}
function fig(s,v){
  const g=(k,d)=>v[k]>0?v[k]:d,f=x=>x.toFixed(1),n=x=>fmt(x),cl=(x,r)=>Math.min(Math.max(x,r/4),r*4);
  const ST='stroke="rgba(255,255,255,.6)" stroke-width="1.5" stroke-linejoin="round"',FL='fill="rgba(46,230,166,.10)"',DS='stroke="var(--accent)" stroke-width="1.3" stroke-dasharray="4 3" fill="none"',HD='stroke="rgba(255,255,255,.3)" stroke-width="1.2" stroke-dasharray="3 3" fill="none"',TX='font-size="12" fill="#cbd2e0" font-family="inherit"';
  const lab=(k,x,y,an)=>`<text ${TX} x="${f(x)}" y="${f(y)}" text-anchor="${an||'middle'}">${k}${v[k]>0?' = '+n(v[k]):''}</text>`;
  const poly=(P,extra)=>`<path d="M${P.map(p=>f(p[0])+' '+f(p[1])).join('L')}Z" ${extra||FL+' '+ST}/>`;
  const line=(P,st)=>`<path d="M${P.map(p=>f(p[0])+' '+f(p[1])).join('L')}" ${st||ST} fill="none"/>`;
  // ellipse halves: front (bottom) solid, back (top) hidden
  const eF=(c,rx,ry)=>`<path d="M${f(c[0]-rx)} ${f(c[1])}A${f(rx)} ${f(ry)} 0 0 0 ${f(c[0]+rx)} ${f(c[1])}" ${ST} fill="none"/>`,eB=(c,rx,ry)=>`<path d="M${f(c[0]-rx)} ${f(c[1])}A${f(rx)} ${f(ry)} 0 0 1 ${f(c[0]+rx)} ${f(c[1])}" ${HD}/>`;
  let pts=[],draw;const k=s.k;
  if(k==='cube'||k==='cuboid'){const a=g('a',1),b=k==='cube'?a:cl(g('b',1),a),c=k==='cube'?a:cl(g('c',1),a),kk=b*.5,q=kk*.7; // width a, depth b, height c
    pts=[[0,0],[a+kk,c+q]];draw=t=>{const F0=t(0,0),F1=t(a,0),F2=t(a,c),F3=t(0,c),B0=t(kk,q),B1=t(a+kk,q),B2=t(a+kk,c+q),B3=t(kk,c+q);
      return line([F0,B0,B1],HD)+line([B0,B3],HD)+poly([F0,F1,F2,F3])+poly([F3,F2,B2,B3])+poly([F1,B1,B2,F2])+lab('a',(F0[0]+F1[0])/2,F0[1]+16)+(k==='cube'?'':lab('c',F0[0]-8,(F0[1]+F3[1])/2+4,'end')+lab('b',(F2[0]+B2[0])/2+8,(F2[1]+B2[1])/2+2,'start'))}}
  else if(k==='cyl'){const r=g('r',1),h=cl(g('h',2),r*2),ry=r*.3;pts=[[-r,-ry],[r,h+ry]];draw=t=>{const B=t(0,0),T=t(0,h),R=t(r,0),Ry=t(0,ry),rx=R[0]-B[0],ryp=B[1]-Ry[1];
      return `<path d="M${f(B[0]-rx)} ${f(T[1])}V${f(B[1])}" ${ST}/><path d="M${f(B[0]+rx)} ${f(T[1])}V${f(B[1])}" ${ST}/>`+eB(B,rx,ryp)+eF(B,rx,ryp)+`<ellipse cx="${f(T[0])}" cy="${f(T[1])}" rx="${f(rx)}" ry="${f(ryp)}" ${FL} ${ST}/><path d="M${f(T[0])} ${f(T[1])}H${f(T[0]+rx)}" ${DS}/>`+lab('r',T[0]+rx/2,T[1]-ryp-4)+lab('h',B[0]+rx+8,(B[1]+T[1])/2+4,'start')}}
  else if(k==='cone'){const r=g('r',1),h=cl(g('h',1.6),r*2),ry=r*.3;pts=[[-r,-ry],[r,h]];draw=t=>{const B=t(0,0),T=t(0,h),R=t(r,0),Ry=t(0,ry),rx=R[0]-B[0],ryp=B[1]-Ry[1];
      return `<path d="M${f(B[0]-rx)} ${f(B[1])}L${f(T[0])} ${f(T[1])}L${f(B[0]+rx)} ${f(B[1])}" ${ST} ${FL}/>`+eB(B,rx,ryp)+eF(B,rx,ryp)+`<path d="M${f(T[0])} ${f(T[1])}V${f(B[1])}M${f(B[0])} ${f(B[1])}H${f(B[0]+rx)}" ${DS}/>`+lab('r',B[0]+rx/2,B[1]+15)+lab('h',T[0]+6,(B[1]+T[1])/2,'start')}}
  else if(k==='sphere'||k==='hemi'){const r=g('r',1),ry=r*.3,hm=k==='hemi';pts=[[-r,hm?-ry:-r],[r,r]];draw=t=>{const C=t(0,0),R=t(r,0),rx=R[0]-C[0],ryp=rx*.3;
      const body=hm?`<path d="M${f(C[0]-rx)} ${f(C[1])}A${f(rx)} ${f(rx)} 0 0 1 ${f(C[0]+rx)} ${f(C[1])}Z" ${FL} ${ST}/>`:`<circle cx="${f(C[0])}" cy="${f(C[1])}" r="${f(rx)}" ${FL} ${ST}/>`;
      return body+eB(C,rx,ryp)+eF(C,rx,ryp)+`<path d="M${f(C[0])} ${f(C[1])}H${f(C[0]+rx)}" ${DS}/>`+lab('r',C[0]+rx/2,C[1]-6)}}
  else if(k==='pyr'){const a=g('a',2),h=cl(g('h',2),a*2),kk=a*.45,q=kk*.6;pts=[[0,0],[a+kk,h+q/2]];draw=t=>{const F0=t(0,0),F1=t(a,0),B1=t(a+kk,q),B0=t(kk,q),A=t((a+kk)/2,h+q/2),Cn=t((a+kk)/2,q/2);
      return line([F0,B0,B1],HD)+line([A,B0],HD)+poly([F0,F1,A])+poly([F1,B1,A])+line([F0,F1,B1])+`<path d="M${f(A[0])} ${f(A[1])}V${f(Cn[1])}" ${DS}/>`+lab('a',(F0[0]+F1[0])/2,F0[1]+16)+lab('h',A[0]-6,(A[1]+Cn[1])/2+4,'end')}}
  else if(k==='prism'){const w=1.6,h=cl(g('h',2),w*2.2),kk=1,q=.6;pts=[[0,0],[w+kk,h+q]];draw=t=>{const P0=t(0,0),P1=t(w,0),P2=t(w*.55+kk,q),Q0=t(0,h),Q1=t(w,h),Q2=t(w*.55+kk,h+q);
      return line([P0,P2,P1],HD)+poly([P0,P1,Q1,Q0])+poly([P1,P2,Q2,Q1])+poly([Q0,Q1,Q2],'fill="rgba(46,230,166,.18)" '+ST)+`<text ${TX} x="${f((Q0[0]+Q1[0]+Q2[0])/3)}" y="${f((Q0[1]+Q1[1]+Q2[1])/3+4)}" text-anchor="middle">B</text>`+lab('p',(P0[0]+P1[0])/2,P0[1]+16)+lab('h',P0[0]-8,(P0[1]+Q0[1])/2+4,'end')}}
  else if(k==='frus'){const r1=g('r₁',1.2),r2=Math.min(Math.max(g('r₂',.6),r1/5),r1*5),m=Math.max(r1,r2),h=cl(g('h',1.4),m*2);pts=[[-m,-m*.3],[m,h+m*.3]];draw=t=>{const B=t(0,0),T=t(0,h),R1=t(r1,0)[0]-B[0],R2=t(r2,0)[0]-B[0],y1=R1*.3,y2=R2*.3;
      return `<path d="M${f(B[0]-R1)} ${f(B[1])}L${f(T[0]-R2)} ${f(T[1])}L${f(T[0]+R2)} ${f(T[1])}L${f(B[0]+R1)} ${f(B[1])}Z" ${FL} ${ST}/>`+eB(B,R1,y1)+eF(B,R1,y1)+`<ellipse cx="${f(T[0])}" cy="${f(T[1])}" rx="${f(R2)}" ry="${f(y2)}" ${FL} ${ST}/><path d="M${f(T[0])} ${f(T[1])}H${f(T[0]+R2)}M${f(B[0])} ${f(B[1])}H${f(B[0]+R1)}M${f(T[0])} ${f(T[1])}V${f(B[1])}" ${DS}/>`+lab('r₂',T[0]+R2/2,T[1]-y2-4)+lab('r₁',B[0]+R1/2,B[1]+16)+lab('h',T[0]-6,(B[1]+T[1])/2,'end')}}
  else{$('fig').innerHTML='';return}
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),mx=Math.min(...xs),Mx=Math.max(...xs),my=Math.min(...ys),My=Math.max(...ys),bw=Mx-mx||1,bh=My-my||1,W=220,H=112,sc=Math.min(W/bw,H/bh),ox=64+(W-bw*sc)/2,oy=26+(H-bh*sc)/2;
  const t=(x,y)=>[ox+(x-mx)*sc,oy+(My-y)*sc];
  $('fig').innerHTML=`<svg viewBox="0 0 360 180" width="100%" style="max-height:220px" role="img" aria-label="${L('s_'+k)}">${draw(t)}</svg><p class="mt-1 text-center text-xs" style="color:#8b94a7">${L('sch')}</p>`;
}
function calc(){const s=SH[cur],v={};let full=true;
  document.querySelectorAll('#fl input').forEach(i=>{const x=parseFloat(String(i.value).replace(',','.'));if(i.value!==''&&isFinite(x))v[i.dataset.v]=x;else full=false});
  fig(s,v);const h=$('hint'),er=$('err'),rs=$('res');h.classList.add('hidden');er.classList.add('hidden');rs.classList.add('hidden');
  if(!full){h.textContent=L('hint');h.classList.remove('hidden');return}
  const o=compute(s,v);if(o.e){er.textContent=L(o.e);er.classList.remove('hidden');return}
  const [un,f]=uo();rs.innerHTML=o.rows.map((r,i)=>{const pw=PW[r.l]||1,u=un+SUP[pw];let eq='';
    if(i===0&&pw>1){const b=r.val*f**pw;eq=`<p class="mt-2 text-xs leading-relaxed" style="color:#8b94a7">${L('eq')}: ${EQ[pw].filter(e=>e[0]!==u).map(e=>fm(b/e[1])+' '+e[0]).join(' · ')}</p>`}
    return `<div class="rounded-xl p-4" style="background:rgba(255,255,255,.04)"><p class="text-sm" style="color:#8b94a7">${L(r.l)}</p><p class="${i?'text-2xl':'grad text-4xl'} font-bold">${fmt(r.val)} <span class="text-base font-semibold" style="color:#8b94a7;-webkit-text-fill-color:#8b94a7">${u}</span></p><p class="mt-1 text-xs" style="color:#667085">${r.f} = ${r.s} = ${fmt(r.val)} ${u}</p>${eq}</div>`}).join('');rs.classList.remove('hidden')}
function text(){baseText();$('pl').textContent=L('pick');$('ul').textContent=L('unit');const cu=$('un').value||'1';$('un').innerHTML=UN.map((u,i)=>`<option value="${i}">${u[0]}</option>`).join('');$('un').value=cu;$('sh').innerHTML=SH.map((s,i)=>`<option value="${i}">${L('s_'+s.k)}</option>`).join('');$('sh').value=cur;fields();calc();syncLang()}
$('sh').onchange=e=>{cur=+e.target.value;$('fl').innerHTML='';fields();calc()};
