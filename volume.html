, wpisz wymiary i uzyskaj objętość oraz pole powierzchni wraz ze wzorem.", "h1": "Jak używać", "h2": "Jednostki i zaokrąglanie", "h4": "Wzory", "p1": "Wybierz figurę i wpisz wymiary. Wszystkie wyniki przeliczają się od razu i pokazują wzór z podstawionymi liczbami. Użyj dowolnej jednostki (cm, m, cale): długości wyjdą w tej samej jednostce, pola w jednostce do kwadratu, objętości w jednostce do sześcianu.", "note": "Wszystko jest liczone w Twojej przeglądarce, a nic, co wpiszesz, nie jest zapisywane ani wysyłane.", "p2": "Wybierz jednostkę długości raz i wpisz w niej wszystkie wymiary. Pola wyjdą w tej jednostce do kwadratu, objętości do sześcianu, a główny wynik pokazujemy też w innych jednostkach. Wyniki mają do sześciu miejsc po przecinku; π jest użyte z pełną precyzją. Wskazówka: 1 dm³ = 1 litr, 1 cm³ = 1 mililitr, a 1 m³ = 1000 litrów.", "lim": "<li><b>Sześcian:</b> V = a³, S = 6·a²</li><li><b>Prostopadłościan:</b> V = a·b·c, S = 2(a·b+b·c+a·c)</li><li><b>Walec:</b> V = π·r²·h, S = 2·π·r(r+h)</li><li><b>Stożek:</b> V = (1/3)·π·r²·h, S = π·r(r+s), s = √(r²+h²)</li><li><b>Kula:</b> V = (4/3)·π·r³, S = 4·π·r²</li><li><b>Półkula:</b> V = (2/3)·π·r³, S = 3·π·r²</li><li><b>Ostrosłup czworokątny:</b> V = (1/3)·a²·h, S = a²+2·a·l, l = √(h²+(a/2)²)</li><li><b>Graniastosłup:</b> V = B·h, S = 2·B+p·h</li><li><b>Stożek ścięty:</b> V = (1/3)·π·h(r₁²+r₁·r₂+r₂²), S = π(r₁²+r₂²+(r₁+r₂)·s)</li>"}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Calculateur de volume et d’aire", "sub": "Choisissez un solide, saisissez ses dimensions et obtenez le volume et l’aire avec la formule.", "h1": "Mode d’emploi", "h2": "Unités et arrondis", "h4": "Formules", "p1": "Choisissez une forme et remplissez les dimensions. Tous les résultats se mettent à jour instantanément et montrent la formule avec vos nombres. Utilisez n’importe quelle unité (cm, m, pouces) : les longueurs restent dans cette unité, les aires en unité au carré, les volumes en unité au cube.", "note": "Tout est calculé dans votre navigateur et rien de ce que vous saisissez n’est enregistré ni envoyé.", "p2": "Choisissez l’unité de longueur une fois et saisissez toutes les dimensions dedans. Les aires sortent en unité au carré, les volumes en unité au cube, et le résultat principal est aussi donné dans d’autres unités. Les résultats ont jusqu’à six décimales ; π est utilisé avec toute sa précision. Astuce : 1 dm³ = 1 litre, 1 cm³ = 1 millilitre et 1 m³ = 1000 litres.", "lim": "<li><b>Cube:</b> V = a³, S = 6·a²</li><li><b>Pavé droit:</b> V = a·b·c, S = 2(a·b+b·c+a·c)</li><li><b>Cylindre:</b> V = π·r²·h, S = 2·π·r(r+h)</li><li><b>Cône:</b> V = (1/3)·π·r²·h, S = π·r(r+s), s = √(r²+h²)</li><li><b>Sphère:</b> V = (4/3)·π·r³, S = 4·π·r²</li><li><b>Hémisphère:</b> V = (2/3)·π·r³, S = 3·π·r²</li><li><b>Pyramide à base carrée:</b> V = (1/3)·a²·h, S = a²+2·a·l, l = √(h²+(a/2)²)</li><li><b>Prisme:</b> V = B·h, S = 2·B+p·h</li><li><b>Tronc de cône:</b> V = (1/3)·π·h(r₁²+r₁·r₂+r₂²), S = π(r₁²+r₂²+(r₁+r₂)·s)</li>"}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Calculadora de volumen y área", "sub": "Elige un cuerpo, introduce sus medidas y obtén el volumen y el área con la fórmula.", "h1": "Cómo se usa", "h2": "Unidades y redondeo", "h4": "Fórmulas", "p1": "Elige una figura y rellena las medidas. Todos los resultados se actualizan al instante y muestran la fórmula con tus números sustituidos. Usa cualquier unidad (cm, m, pulgadas): las longitudes salen en esa unidad, las áreas en unidad al cuadrado y los volúmenes en unidad al cubo.", "note": "Todo se calcula en tu navegador y nada de lo que introduces se guarda ni se envía.", "p2": "Elige la unidad de longitud una vez e introduce en ella todas las medidas. Las áreas salen en esa unidad al cuadrado, los volúmenes al cubo, y el resultado principal también se muestra en otras unidades. Los resultados tienen hasta seis decimales; π se usa con toda su precisión. Consejo: 1 dm³ = 1 litro, 1 cm³ = 1 mililitro y 1 m³ = 1000 litros.", "lim": "<li><b>Cubo:</b> V = a³, S = 6·a²</li><li><b>Ortoedro:</b> V = a·b·c, S = 2(a·b+b·c+a·c)</li><li><b>Cilindro:</b> V = π·r²·h, S = 2·π·r(r+h)</li><li><b>Cono:</b> V = (1/3)·π·r²·h, S = π·r(r+s), s = √(r²+h²)</li><li><b>Esfera:</b> V = (4/3)·π·r³, S = 4·π·r²</li><li><b>Hemisferio:</b> V = (2/3)·π·r³, S = 3·π·r²</li><li><b>Pirámide cuadrada:</b> V = (1/3)·a²·h, S = a²+2·a·l, l = √(h²+(a/2)²)</li><li><b>Prisma:</b> V = B·h, S = 2·B+p·h</li><li><b>Tronco de cono:</b> V = (1/3)·π·h(r₁²+r₁·r₂+r₂²), S = π(r₁²+r₂²+(r₁+r₂)·s)</li>"}};

function syncLang(){document.getElementById('langCur').textContent=lang.toUpperCase();document.querySelectorAll('#langMenu button').forEach(b=>b.setAttribute('aria-selected',b.dataset.l===lang));footLinks();propLinks();applySeo()}
function initLang(cb){
  const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu');
  menu.innerHTML=LANGS.map(([c,n])=>`<li><button role="option" data-l="${c}"><span>${n}</span><b>${c.toUpperCase()}</b></button></li>`).join('');
  const close=()=>{menu.classList.add('hidden');btn.setAttribute('aria-expanded','false')};
  btn.addEventListener('click',e=>{e.stopPropagation();const hid=menu.classList.toggle('hidden');btn.setAttribute('aria-expanded',String(!hid))});
  menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{const u=new URL(location.href);if(lang==='en')u.searchParams.delete('lang');else u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(x){}close();cb()});
  document.addEventListener('click',close);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}

const $=id=>document.getElementById(id);
const IDX={en:0,sk:1,de:2,cs:3,pl:4,fr:5,es:6};
const L=k=>PIPE[k].split('|')[IDX[lang]];
function baseText(){const X=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=X[e.dataset.i];if(v!==undefined)e.tagName==='UL'?e.innerHTML=v:e.textContent=v})}
const P=Math.PI;
const SH=[
{k:'cube',f:[['a','side']],r:[['r_vol','V = a³',v=>v.a**3],['r_surf','S = 6·a²',v=>6*v.a**2]]},
{k:'cuboid',f:[['a','side'],['b','side'],['c','side']],r:[['r_vol','V = a·b·c',v=>v.a*v.b*v.c],['r_surf','S = 2(a·b+b·c+a·c)',v=>2*(v.a*v.b+v.b*v.c+v.a*v.c)]]},
{k:'cyl',f:[['r','radius'],['h','height']],r:[['r_vol','V = π·r²·h',v=>P*v.r**2*v.h],['r_surf','S = 2·π·r(r+h)',v=>2*P*v.r*(v.r+v.h)],['r_lat','M = 2·π·r·h',v=>2*P*v.r*v.h]]},
{k:'cone',f:[['r','radius'],['h','height']],x:v=>({s:Math.sqrt(v.r**2+v.h**2)}),r:[['r_vol','V = (1/3)·π·r²·h',v=>P*v.r**2*v.h/3],['r_surf','S = π·r(r+s)',v=>P*v.r*(v.r+v.s)],['r_lat','M = π·r·s',v=>P*v.r*v.s],['r_slant','s = √(r²+h²)',v=>v.s]]},
{k:'sphere',f:[['r','radius']],r:[['r_vol','V = (4/3)·π·r³',v=>4/3*P*v.r**3],['r_surf','S = 4·π·r²',v=>4*P*v.r**2]]},
{k:'hemi',f:[['r','radius']],r:[['r_vol','V = (2/3)·π·r³',v=>2/3*P*v.r**3],['r_surf','S = 3·π·r²',v=>3*P*v.r**2]]},
{k:'pyr',f:[['a','side'],['h','height']],x:v=>({l:Math.sqrt(v.h**2+(v.a/2)**2)}),r:[['r_vol','V = (1/3)·a²·h',v=>v.a**2*v.h/3],['r_surf','S = a²+2·a·l',v=>v.a**2+2*v.a*v.l],['r_slant','l = √(h²+(a/2)²)',v=>v.l]]},
{k:'prism',f:[['B','barea'],['p','bper'],['h','height']],r:[['r_vol','V = B·h',v=>v.B*v.h],['r_surf','S = 2·B+p·h',v=>2*v.B+v.p*v.h]]},
{k:'frus',f:[['r₁','radius'],['r₂','radius'],['h','height']],x:v=>({s:Math.sqrt((v['r₁']-v['r₂'])**2+v.h**2)}),r:[['r_vol','V = (1/3)·π·h(r₁²+r₁·r₂+r₂²)',v=>P*v.h*(v['r₁']**2+v['r₁']*v['r₂']+v['r₂']**2)/3],['r_surf','S = π(r₁²+r₂²+(r₁+r₂)·s)',v=>P*(v['r₁']**2+v['r₂']**2+(v['r₁']+v['r₂'])*v.s)],['r_lat','M = π(r₁+r₂)·s',v=>P*(v['r₁']+v['r₂'])*v.s],['r_slant','s = √((r₁−r₂)²+h²)',v=>v.s]]}
];

const fmt=x=>isFinite(x)?(+x.toFixed(6)).toLocaleString(lang==='en'?'en-US':lang,{maximumFractionDigits:6}):'–';
const sub=(f,v)=>f.replace(/^[^=≈]*[=≈]/,'').trim().replace(/(?<![A-Za-z])[A-Za-zα][₁₂]?(?![A-Za-z])/g,m=>v[m]!==undefined?fmt(v[m]):m);
const UN=[['mm',.001],['cm',.01],['dm',.1],['m',1],['km',1000],['in',.0254],['ft',.3048],['yd',.9144]],PW={r_area:2,r_surf:2,r_lat:2,r_vol:3},SUP=['','','²','³'];
const EQ={2:[['mm²',1e-6],['cm²',1e-4],['dm²',1e-2],['m²',1],['ha',1e4],['km²',1e6],['in²',.0254**2],['ft²',.3048**2]],3:[['mm³',1e-9],['cm³ = ml',1e-6],['dm³ = l',1e-3],['m³',1],['in³',.0254**3],['ft³',.3048**3],['gal (US)',.003785411784]]};
const fm=x=>x.toLocaleString(lang==='en'?'en-US':lang,{maximumSignificantDigits:6}),uo=()=>UN[+$('un').value||1];
function compute(s,v){if(!s.f.every(([k])=>v[k]>0))return{e:'err'};const e=s.c&&s.c(v);if(e)return{e};
  const w={...v,...(s.x?s.x(v):{})};return{rows:s.r.map(([l,f,fn])=>({l,f,val:fn(w),s:sub(f,w)}))}}
let cur=0;
function fields(){const s=SH[cur],old={},u=uo()[0],suf=w=>w==='angle'?'°':w==='n'?'':w==='barea'?u+'²':u;document.querySelectorAll('#fl input').forEach(i=>old[i.dataset.v]=i.value);
  $('fl').innerHTML=s.f.map(([v,w])=>`<div><label class="block text-sm" style="color:#8b94a7">${L('w_'+w)} <i>${v}</i></label><div class="field mt-2"><input data-v="${v}" type="number" inputmode="decimal" min="0" step="any" value="${old[v]!==undefined?old[v]:''}"><span>${suf(w)}</span></div></div>`).join('')}
function calc(){const s=SH[cur],v={};let full=true;
  document.querySelectorAll('#fl input').forEach(i=>{const x=parseFloat(String(i.value).replace(',','.'));if(i.value!==''&&isFinite(x))v[i.dataset.v]=x;else full=false});
  const h=$('hint'),er=$('err'),rs=$('res');h.classList.add('hidden');er.classList.add('hidden');rs.classList.add('hidden');
  if(!full){h.textContent=L('hint');h.classList.remove('hidden');return}
  const o=compute(s,v);if(o.e){er.textContent=L(o.e);er.classList.remove('hidden');return}
  const [un,f]=uo();rs.innerHTML=o.rows.map((r,i)=>{const pw=PW[r.l]||1,u=un+SUP[pw];let eq='';
    if(i===0&&pw>1){const b=r.val*f**pw;eq=`<p class="mt-2 text-xs leading-relaxed" style="color:#8b94a7">${L('eq')}: ${EQ[pw].filter(e=>e[0]!==u).map(e=>fm(b/e[1])+' '+e[0]).join(' · ')}</p>`}
    return `<div class="rounded-xl p-4" style="background:rgba(255,255,255,.04)"><p class="text-sm" style="color:#8b94a7">${L(r.l)}</p><p class="${i?'text-2xl':'grad text-4xl'} font-bold">${fmt(r.val)} <span class="text-base font-semibold" style="color:#8b94a7;-webkit-text-fill-color:#8b94a7">${u}</span></p><p class="mt-1 text-xs" style="color:#667085">${r.f} = ${r.s} = ${fmt(r.val)} ${u}</p>${eq}</div>`}).join('');rs.classList.remove('hidden')}
function text(){baseText();$('pl').textContent=L('pick');$('ul').textContent=L('unit');const cu=$('un').value||'1';$('un').innerHTML=UN.map((u,i)=>`<option value="${i}">${u[0]}</option>`).join('');$('un').value=cu;$('sh').innerHTML=SH.map((s,i)=>`<option value="${i}">${L('s_'+s.k)}</option>`).join('');$('sh').value=cur;fields();calc();syncLang()}
$('sh').onchange=e=>{cur=+e.target.value;$('fl').innerHTML='';fields();calc()};
$('un').onchange=()=>{fields();calc()};
$('fl').addEventListener('input',calc);
initLang(text);text();

</script>
</body>
