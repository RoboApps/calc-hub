const T={"en": {"back": "← Back to calculators", "ad": "Advertisement", "title": "Wall Area Calculator", "sub": "Work out the gross and net wall area of a room or individual walls, minus doors and windows.", "h1": "How to calculate wall area", "p1": "Wall area is width × height. For a room, the four walls together equal the perimeter × height. Subtract doors, windows and other openings to get the net area you need for paint, wallpaper, plaster or insulation.", "h2": "Formulas", "p2": "Room: 2 × (length + width) × height. Gable (triangle): base × height ÷ 2. Net area = gross area − openings. A standard door is about 1.8 m² and a window about 1.4 m²; adjust to your sizes.", "h4": "Good to know", "lim": "<li>If the room is not rectangular, measure each wall separately and use the individual walls mode.</li><li>Add 5–10% to the net area when ordering materials to cover cuts and waste.</li><li>Small openings under about 1 m² are often not deducted when estimating paint, which keeps a small reserve.</li>", "note": "Estimate only; measure on site."}, "sk": {"back": "← Späť na kalkulačky", "ad": "Reklama", "title": "Kalkulačka plochy steny", "sub": "Zisti hrubú a čistú plochu stien miestnosti alebo jednotlivých stien bez dverí a okien.", "h1": "Ako sa počíta plocha steny", "p1": "Plocha steny je šírka × výška. Pri miestnosti sú štyri steny spolu obvod × výška. Odpočítaj dvere, okná a iné otvory a dostaneš čistú plochu na farbu, tapetu, omietku alebo izoláciu.", "h2": "Vzorce", "p2": "Miestnosť: 2 × (dĺžka + šírka) × výška. Štít (trojuholník): základňa × výška ÷ 2. Čistá plocha = hrubá plocha − otvory. Štandardné dvere majú asi 1,8 m² a okno asi 1,4 m²; prispôsob podľa svojich rozmerov.", "h4": "Dobré vedieť", "lim": "<li>Ak miestnosť nie je obdĺžniková, zmeraj každú stenu osobitne a použi režim jednotlivých stien.</li><li>Pri objednávke materiálu pridaj k čistej ploche 5 – 10 % na odrezky a stratu.</li><li>Malé otvory pod asi 1 m² sa pri odhade farby často neodpočítavajú, č function vis(){['a1','a2','a3'].forEach(id=>$(id+'w').classList.toggle('hidden',mode!=='room'));$('wbox').classList.toggle('hidden',mode==='room')}
function build(){$('wm').innerHTML=[['room','m_room'],['walls','m_walls']].map(([k,l])=>`<option value="${k}" ${k===mode?'selected':''}>${L(l)}</option>`).join('');vis();drawWalls()}
function text(){baseText();build();$('fbox').innerHTML=`<div><b style="color:var(--accent)">${L('m_room')}: 2 × (${L('len').split(' (')[0]} + ${L('wid').split(' (')[0]}) × ${L('hgt').split(' (')[0]}</b></div><div><b style="color:var(--accent)">${L('gab')}: ${L('gb').split(' (')[0]} × ${L('gh').split(' (')[0]} ÷ 2</b></div><div><b style="color:var(--accent)">${L('net')} = ${L('gross')} − ${L('open')}</b></div>`;syncLang();calc()}
$('wm').addEventListener('change',e=>{mode=e.target.value;vis();calc()});
$('wadd').addEventListener('click',()=>{walls.push([4,2.6]);drawWalls();calc()});
$('wlist').addEventListener('input',e=>{const i=e.target.dataset.w;if(i===undefined)return;walls[+i][+e.target.dataset.k]=+e.target.value;calc()});
$('wlist').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b||walls.length<2)return;walls.splice(+b.dataset.rm,1);drawWalls();calc()});
['a1','a2','a3','dn','dr','nn','nr','oo','gbb','ghh','gnn'].forEach(id=>$(id).addEventListener('input',calc));
initLang(text);text();
</script>
</body>
</html>
