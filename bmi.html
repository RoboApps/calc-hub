h1:'Czym jest BMI?',p1:'BMI (Body Mass Index, wskaźnik masy ciała) to prosta liczba, która wiąże masę ciała ze wzrostem. Służy jako szybki, orientacyjny przesiew, czy waga osoby dorosłej mieści się w typowym zakresie. Podstawy opracował w XIX wieku belgijski matematyk Adolphe Quetelet, a nazwę „BMI” wprowadził w 1972 roku fizjolog Ancel Keys.',
h2:'Jak oblicza się BMI',p2:'Masę ciała w kilogramach dzieli się przez kwadrat wzrostu w metrach. W jednostkach imperialnych masę w funtach mnoży się przez 703 i dzieli przez kwadrat wzrostu w calach.',f:'kg ÷ m²',ex:'Przykład: 70 kg i 175 cm → 70 ÷ 1,75² ≈ 22,9',
h3:'Kategorie WHO',h4:'Ograniczenia BMI',lim:'<li>Nie odróżnia mięśni od tłuszczu, dlatego u sportowców może wskazywać nadwagę.</li><li>Nie mówi nic o rozmieszczeniu tkanki tłuszczowej. Tłuszcz brzuszny jest groźniejszy dla zdrowia.</li><li>Dla seniorów, kobiet w ciąży i różnych grup etnicznych mogą obowiązywać inne wartości.</li><li>U dzieci i młodzieży stosuje się siatki centylowe według wieku i płci, a nie te progi.</li>',
note:'Kalkulator jest przeznaczony dla dorosłych (18+). BMI to tylko orientacyjny wskaźnik, a nie diagnoza. Stan zdrowia oceni lekarz, który weźmie pod uwagę także obwód talii, wyniki badań krwi i styl życia.'},
fr:{back:'← Retour aux calculateurs',ad:'Publicité',title:'Calculateur d’IMC',sub:'Calculez votre indice de masse corporelle et situez-le dans les catégories de l’OMS.',metric:'Métrique',imperial:'Impérial',height:'Taille',weight:'Poids',hint:'Saisissez votre taille et votre poids, le résultat s’affiche instantanément.',your:'Votre IMC',range:'Poids normal pour votre taille :',
cats:['Insuffisance pondérale','Poids normal','Surpoids','Obésité de classe I','Obésité de classe II','Obésité de classe III'],
h1:'Qu’est-ce que l’IMC ?',p1:'L’IMC (indice de masse corporelle) est un nombre simple qui met en rapport le poids et la taille d’une personne. Il sert d’outil de dépistage rapide pour savoir si le poids d’un adulte se situe dans une plage courante. L’idée vient du mathématicien belge Adolphe Quetelet au XIXe siècle, et le terme « BMI » a été introduit en 1972 par le physiologiste Ancel Keys.',
h2:'Comment calculer l’IMC',p2:'Le poids en kilogrammes est divisé par le carré de la taille en mètres. En unités impériales, le poids en livres est multiplié par 703, puis divisé par le carré de la taille en pouces.',f:'kg ÷ m²',ex:'Exemple : 70 kg et 175 cm → 70 ÷ 1,75² ≈ 22,9',
h3:'Catégories de l’OMS',h4:'Limites de l’IMC',lim:'<li>Il ne distingue pas la masse musculaire de la masse grasse et peut donc indiquer un surpoids chez les sportifs.</li><li>Il ne renseigne pas sur la répartition de la graisse. La graisse abdominale présente plus de risques pour la santé.</li><li>Des valeurs différentes peuvent s’appliquer aux seniors, aux femmes enceintes et à certains groupes ethniques.</li><li>Pour les enfants et les adolescents, on utilise des courbes de percentiles selon l’âge et le sexe, et non ces seuils.</li>',
note:'Ce calculateur s’adresse aux adultes (18 ans et plus). L’IMC n’est qu’un repère, pas un diagnostic. Pour évaluer votre état de santé, consultez un médecin, qui tiendra aussi compte du tour de taille, des analyses sanguines et du mode de vie.'},
es:{back:'← Volver a las calculadoras',ad:'Publicidad',title:'Calculadora de IMC',sub:'Calcula tu índice de masa corporal y mira en qué categoría de la OMS se encuentra.',metric:'Métrico',imperial:'Imperial',height:'Altura',weight:'Peso',hint:'Introduce tu altura y tu peso y el resultado aparece al instante.',your:'Tu IMC',range:'Peso normal para tu altura:',
cats:['Bajo peso','Peso normal','Sobrepeso','Obesidad grado I','Obesidad grado II','Obesidad grado III'],
h1:'¿Qué es el IMC?',p1:'El IMC (índice de masa corporal) es un número sencillo que relaciona el peso con la altura de una persona. Se usa como cribado rápido y orientativo para saber si el peso de un adulto está en un rango habitual. La idea es del matemático belga Adolphe Quetelet, del siglo XIX, y el nombre «BMI» lo acuñó en 1972 el fisiólogo Ancel Keys.',
h2:'Cómo se calcula el IMC',p2:'El peso en kilogramos se divide entre la altura en metros al cuadrado. En unidades imperiales, el peso en libras se multiplica por 703 y se divide entre la altura en pulgadas al cuadrado.',f:'kg ÷ m²',ex:'Ejemplo: 70 kg y 175 cm → 70 ÷ 1,75² ≈ 22,9',
h3:'Categorías de la OMS',h4:'Límites del IMC',lim:'<li>No distingue la masa muscular de la grasa, por lo que puede indicar sobrepeso en deportistas.</li><li>No dice nada sobre dónde se acumula la grasa. La grasa abdominal supone más riesgo para la salud.</li><li>Para personas mayores, embarazadas y distintos grupos étnicos pueden aplicarse otros valores.</li><li>En niños y adolescentes se usan gráficas de percentiles por edad y sexo, no estos umbrales.</li>',
note:'Esta calculadora es para adultos (18+). El IMC es solo una referencia, no un diagnóstico. Para valorar tu salud, consulta con un médico, que también tendrá en cuenta el perímetro de cintura, los análisis de sangre y tu estilo de vida.'}
});
let lang='en',unit='m',cur=-1;
const BASE='https://calc-hub.eu/bmi.html',OGL={"en": "en_US", "sk": "sk_SK", "de": "de_DE", "cs": "cs_CZ", "pl": "pl_PL", "fr": "fr_FR", "es": "es_ES"},META={"en": {"t": "BMI Calculator – Body Mass Index | calc-hub.eu", "d": "Calculate your BMI in seconds with metric or imperial units. See your WHO category, a healthy weight range for your height and learn what BMI really means."}, "sk": {"t": "BMI kalkulačka – index telesnej hmotnosti | calc-hub.eu", "d": "Vypočítaj svoje BMI za pár sekúnd v metrických aj imperiálnych jednotkách. Zisti kategóriu podľa WHO, rozsah normálnej hmotnosti pre svoju výšku a čo BMI znamená."}, "de": {"t": "BMI-Rechner – Body-Mass-Index | calc-hub.eu", "d": "Berechne deinen BMI in Sekunden, metrisch oder imperial. Sieh deine WHO-Kategorie, den Normalgewichtsbereich für deine Größe und erfahre, was der BMI aussagt."}, "cs": {"t": "BMI kalkulačka – index tělesné hmotnosti | calc-hub.eu", "d": "Spočítej si své BMI během pár sekund v metrických i imperiálních jednotkách. Zjisti kategorii podle WHO, rozsah normální hmotnosti pro svou výšku a co BMI znamená."}, "pl": {"t": "Kalkulator BMI – wskaźnik masy ciała | calc-hub.eu", "d": "Oblicz swoje BMI w kilka sekund w jednostkach metrycznych lub imperialnych. Sprawdź kategorię WHO, prawidłowy zakres wagi dla swojego wzrostu i co oznacza BMI."}, "fr": {"t": "Calculateur d’IMC – indice de masse corporelle | calc-hub.eu", "d": "Calculez votre IMC en quelques secondes en unités métriques ou impériales. Découvrez votre catégorie OMS, le poids normal pour votre taille et ce que signifie l’IMC."}, "es": {"t": "Calculadora de IMC – índice de masa corporal | calc-hub.eu", "d": "Calcula tu IMC en segundos en unidades métricas o imperiales. Consulta tu categoría de la OMS, el peso normal para tu altura y qué significa el IMC."}};
function applySeo(){
  const m=META[lang],q=new URLSearchParams(location.search).get('lang'),u=BASE+(q&&META[q]&&q!=='en'?'?lang='+q:'');
  document.title=m.t;
  const set=(sel,v)=>{const e=document.querySelector(sel);if(e)e.setAttribute('content',v)};
  set('meta[name="description"]',m.d);set('meta[property="og:title"]',m.t);set('meta[property="og:description"]',m.d);
  set('meta[name="twitter:title"]',m.t);set('meta[name="twitter:description"]',m.d);set('meta[property="og:url"]',u);set('meta[property="og:locale"]',OGL[lang]);
  const c=document.querySelector('link[rel="canonical"]');if(c)c.setAttribute('href',u);
  document.querySelectorAll('meta[property="og:locale:alternate"]').forEach(e=>e.remove());
  Object.keys(OGL).filter(l=>l!==lang).forEach(l=>{const e=document.createElement('meta');e.setAttribute('property','og:locale:alternate');e.setAttribute('content',OGL[l]);document.head.appendChild(e)});
}
const FT={en:['Privacy & Cookies','Privacy and cookie settings','About & contact'],sk:['Ochrana údajov a cookies','Nastavenia súkromia a cookies','O nás a kontakt'],de:['Datenschutz & Cookies','Datenschutz- und Cookie-Einstellungen','Über uns & Kontakt'],cs:['Ochrana údajů a cookies','Nastavení soukromí a cookies','O nás a kontakt'],pl:['Prywatność i cookies','Ustawienia prywatności i plików cookies','O nas i kontakt'],fr:['Confidentialité et cookies','Paramètres de confidentialité et de cookies','À propos et contact'],es:['Privacidad y cookies','Configuración de privacidad y cookies','Acerca de y contacto']};
function footLinks(){const f=document.getElementById('flinks');if(!f)return;const s='<span class="mx-2">·</span>';f.innerHTML=`<a href="about.html" class="hover:text-white">${FT[lang][2]}</a>${s}<a href="privacy.html" class="hover:text-white">${FT[lang][0]}</a>${s}<button data-cs class="hover:text-white">${FT[lang][1]}</button>`}
function propLinks(){document.querySelectorAll('a[href]').forEach(a=>{const h=a.dataset.h||(a.dataset.h=a.getAttribute('href'));if(!/^[a-z-]+\.html$/.test(h))return;a.setAttribute('href',lang==='en'?h:h+'?lang='+lang)})}
function openCs(){if(window.googlefc&&googlefc.callbackQueue&&googlefc.showRevocationMessage)googlefc.callbackQueue.push(googlefc.showRevocationMessage);else location.href='privacy.html'+(lang==='en'?'':'?lang='+lang)+'#cookies'}
document.addEventListener('click',e=>{if(e.target.closest('[data-cs]'))openCs()});
const LANGS=[['sk','Slovenčina'],['de','Deutsch'],['en','English'],['cs','Čeština'],['pl','Polski'],['fr','Français'],['es','Español']];
function syncLang(){document.getElementById('langCur').textContent=lang.toUpperCase();document.querySelectorAll('#langMenu button').forEach(b=>b.setAttribute('aria-selected',b.dataset.l===lang));footLinks();propLinks();applySeo()}
function initLang(cb){
  const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu');
  menu.innerHTML=LANGS.map(([c,n])=>`<li><button role="option" data-l="${c}"><span>${n}</span><b>${c.toUpperCase()}</b></button></li>`).join('');
  const close=()=>{menu.classList.add('hidden');btn.setAttribute('aria-expanded','false')};
  btn.addEventListener('click',e=>{e.stopPropagation();const hid=menu.classList.toggle('hidden');btn.setAttribute('aria-expanded',String(!hid))});
  menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{const u=new URL(location.href);if(lang==='en')u.searchParams.delete('lang');else u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(x){}close();cb()});
  document.addEventListener('click',close);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}

try{const s=new URLSearchParams(location.search).get('lang')||(navigator.language||'').slice(0,2);if(T[s])lang=s}catch(e){}
const $=id=>document.getElementById(id);
const fmt=(n,d=1)=>n.toFixed(d).replace('.',lang==='en'?'.':',');

function text(){
  const L=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=L[e.dataset.i];if(v===undefined)return;e.tagName==='UL'?e.innerHTML=v:e.textContent=v});
  syncLang();
  $('tbl').innerHTML=CATS.map((c,i)=>`<tr class="${i===cur?'on':''}" style="border-top:${i?'1px solid rgba(255,255,255,.06)':'0'}"><td class="px-4 py-3"><span class="mr-2 inline-block h-2.5 w-2.5 rounded-full" style="background:${c.c}"></span>${L.cats[i]}</td><td class="px-4 py-3 text-right" style="color:#8b94a7">${lang==='en'?c.r.replace(/,/g,'.'):c.r}</td></tr>`).join('');
  calc();
}
function setUnit(u){
  unit=u;$('um').setAttribute('aria-pressed',u==='m');$('ui').setAttribute('aria-pressed',u==='i');
  $('h2w').classList.toggle('hidden',u==='m');
  $('u1').textContent=u==='m'?'cm':'ft';$('uw').textContent=u==='m'?'kg':'lb';
  ['h1','h2','w1'].forEach(id=>$(id).value='');calc();
}
function calc(){
  let h,w;
  if(unit==='m'){h=+$('h1').value/100;w=+$('w1').value}
  else{h=(+$('h1').value*12+(+$('h2').value||0))*0.0254;w=+$('w1').value*0.45359237}
  const ok=h>=1&&h<=2.5&&w>=20&&w<=400;
  $('res').classList.toggle('hidden',!ok);$('hint').classList.toggle('hidden',ok);
  if(!ok){if(cur!==-1){cur=-1;text()}return}
  const bmi=w/(h*h),i=CATS.findIndex(c=>bmi<c.max),L=T[lang];
  $('val').textContent=fmt(bmi);
  $('cat').textContent=L.cats[i];$('cat').style.cssText=`color:${CATS[i].c};border-color:${CATS[i].c}66;background:${CATS[i].c}1a`;
  $('mark').style.left=Math.min(100,Math.max(0,(bmi-15)/25*100))+'%';
  const k=unit==='m'?1:1/0.45359237,u=unit==='m'?'kg':'lb';
  $('rng').textContent=`${fmt(18.5*h*h*k,0)} – ${fmt(24.9*h*h*k,0)} ${u}`;
  if(cur!==i){cur=i;text()}
}
initLang(text);
['h1','h2','w1'].forEach(id=>$(id).addEventListener('input',calc));
$('um').onclick=()=>setUnit('m');$('ui').onclick=()=>setUnit('i');
setUnit('m');text();
</script>
