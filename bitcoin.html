const BASE='https://calc-hub.eu/bitcoin.html',OGL={"en": "en_US", "sk": "sk_SK", "de": "de_DE", "cs": "cs_CZ", "pl": "pl_PL", "fr": "fr_FR", "es": "es_ES"},META={"en": {"t": "Bitcoin Converter – BTC, sats and fiat | calc-hub.eu", "d": "Convert BTC, mBTC, bits and satoshis and see the value in EUR, USD or other currencies at the live rate. Includes a simple guide to Bitcoin units."}, "sk": {"t": "Bitcoin prevodník – BTC, satoshi a meny | calc-hub.eu", "d": "Prepočítaj BTC, mBTC, bity a satoshi a zisti hodnotu v EUR, USD či iných menách podľa aktuálneho kurzu. S jednoduchým vysvetlením jednotiek bitcoinu."}, "de": {"t": "Bitcoin-Umrechner – BTC, Satoshi und Währungen | calc-hub.eu", "d": "Rechne BTC, mBTC, Bits und Satoshi um und sieh den Wert in EUR, USD oder anderen Währungen zum aktuellen Kurs. Mit einfacher Erklärung der Bitcoin-Einheiten."}, "cs": {"t": "Bitcoin převodník – BTC, satoshi a měny | calc-hub.eu", "d": "Přepočítej BTC, mBTC, bity a satoshi a zjisti hodnotu v EUR, USD či jiných měnách podle aktuálního kurzu. S jednoduchým vysvětlením jednotek bitcoinu."}, "pl": {"t": "Przelicznik Bitcoina – BTC, satoshi i waluty | calc-hub.eu", "d": "Przelicz BTC, mBTC, bity i satoshi oraz sprawdź wartość w EUR, USD lub innych walutach według aktualnego kursu. Z prostym wyjaśnieniem jednostek bitcoina."}, "fr": {"t": "Convertisseur Bitcoin – BTC, satoshis et devises | calc-hub.eu", "d": "Convertissez BTC, mBTC, bits et satoshis et obtenez la valeur en EUR, USD ou autres devises au cours actuel. Avec un guide simple des unités du Bitcoin."}, "es": {"t": "Conversor de Bitcoin – BTC, satoshis y divisas | calc-hub.eu", "d": "Convierte BTC, mBTC, bits y satoshis y consulta su valor en EUR, USD u otras monedas al cambio actual. Con una guía sencilla de las unidades de bitcoin."}};
function applySeo(){
  const m=META[lang],q=new URLSearchParams(location.search).get('lang'),u=BASE+(q&&META[q]&&q!=='en'?'?lang='+q:'');
  document.title=m.t;
  const set=(sel,v)=>{const e=document.querySelector(sel);if(e)e.setAttribute('content',v)};
  set('meta[name="description"]',m.d);set('meta[property="og:title"]',m.t);set('meta[property="og:description"]',m.d);
  set('meta[name="twitter:title"]',m.t);set('meta[name="twitter:description"]',m.d);set('meta[property="og:url"]',u);set('meta[property="og:locale"]',OGL[lang]);
  const c=document.querySelector('link[rel="canonical"]');if(c)c.setAttribute('href',u);
  document.querySelectorAll('meta[property="og:locale:alternate"]').forEach(e=>e.remove());
  Object.keys(OGL).filter(l=>l!==lang).forEach(l=>{const e=document.createElement('meta');e.setAttribute('property','og:locale:alternate');e.setAttribute('content',OGL[l]);document.head.appendChild(e)});
}
const FT={en:['Privacy & Cookies','Privacy and cookie settings','About & contact'],sk:['Ochrana údajov a cookies','Nastavenia súkromia a cookies','O nás a kontakt'],de:['Datenschutz & Cookies','Datenschutz- und Cookie-Einstellungen','Über uns & Kontakt'],cs:['Ochrana údajů a cookies','Nastavení soukromí a cookies','O nás a kontakt'],pl:['Prywatność i cookies','Ustawienia prywatności i plików cookies','O nas i kontakt'],fr:['Confidentialité et cookies','Paramètres de confidentialité et de cookies','À propos et contact'],es:['Privacidad y cookies','Configuración de privacidad y cookies','Acerca de y contacto']};
function footLinks(){const f=document.getElementById('flinks');if(!f)return;const s='<span class="mx-2">·</span>';f.innerHTML=`<a href="about.html" class="hover:text-white">${FT[lang][2]}</a>${s}<a href="privacy.html" class="hover:text-white">${FT[lang][0]}</a>${s}<button data-cs class="hover:text-white">${FT[lang][1]}</button>`}
function propLinks(){document.querySelectorAll('a[href]').forEach(a=>{const h=a.dataset.h||(a.dataset.h=a.getAttribute('href'));if(!/^[a-z-]+\.html$/.test(h))return;a.setAttribute('href',lang==='en'?h:h+'?lang='+lang)})}
function openCs(){if(window.googlefc&&googlefc.callbackQueue&&googlefc.showRevocationMessage)googlefc.callbackQueue.push(googlefc.showRevocationMessage);else location.href='privacy.html'+(lang==='en'?'':'?lang='+lang)+'#cookies'}
document.addEventListener('click',e=>{if(e.target.closest('[data-cs]'))openCs()});
const LANGS=[['sk','Slovenčina'],['de','Deutsch'],['en','English'],['cs','Čeština'],['pl','Polski'],['fr','Français'],['es','Español']];
function syncLang(){document.getElementById('langCur').textContent=lang.toUpperCase();document.querySelectorAll('#langMenu button').forEach(b=>b.setAttribute('aria-selected',b.dataset.l===lang));footLinks();propLinks();applySeo()}
function initLang(cb){
  const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu');
  menu.innerHTML=LANGS.map(([c,n])=>`<li><button role="option" data-l="${c}"><span>${n}</span><b>${c.toUpperCase()}</b></button></li>`).join('');
  const close=()=>{menu.classList.add('hidden');btn.setAttribute('aria-expanded','false')};
  btn.addEventListener('click',e=>{e.stopPropagation();const hid=menu.classList.toggle('hidden');btn.setAttribute('aria-expanded',String(!hid))});
  menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{const u=new URL(location.href);if(lang==='en')u.searchParams.delete('lang');else u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(x){}close();cb()});
  document.addEventListener('click',close);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}
const $=id=>document.getElementById(id);
const LOC={sk:'sk-SK',de:'de-DE',en:'en-IE',cs:'cs-CZ',pl:'pl-PL',fr:'fr-FR',es:'es-ES'};
const nf=(n,d)=>new Intl.NumberFormat(LOC[lang],{maximumFractionDigits:d}).format(n);
const money=(n,d)=>{const f=d??(n>=100?0:2);return new Intl.NumberFormat(LOC[lang],{style:'currency',currency:cur,minimumFractionDigits:f,maximumFractionDigits:f}).format(n)};

function buildUnit(){$('fu').innerHTML=['BTC','mBTC','µBTC','sats','FIAT'].map(u=>`<option value="${u}">${u==='FIAT'?cur:u}</option>`).join('');$('fu').value=from;document.querySelectorAll('.cur').forEach(e=>e.textContent=cur)}
function text(){
  const L=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=L[e.dataset.i];if(v!==undefined)e.textContent=v});
  if(!curTouched){cur=DEF[lang]||'EUR';$('fc').value=cur}
  buildUnit();
  $('utbl').innerHTML=[['BTC',1],['mBTC',1e-3],['µBTC (bits)',1e-6],['sat',1e-8]].map(([u,v])=>`<tr><td>${u}</td><td>${nf(v,8)}</td></tr>`).join('');
  syncLang();ui();
}
function ui(){
  const L=T[lang],r=rates[cur];
  $('dot').style.background=status==='ok'?'var(--accent)':status==='loading'?'#fbbf24':'#ef4444';
  $('rf').firstElementChild.classList.toggle('spin',status==='loading');
  $('rl').textContent=r?`1 BTC = ${money(r,0)}`+(ts?` · ${L.upd} ${ts.toLocaleTimeString(LOC[lang],{hour:'2-digit',minute:'2-digit'})}`:''):(status==='loading'?L.loading:L.err);
  $('mbox').classList.toggle('hidden',!!r||status==='loading');
  calc();
}
function calc(){
  const L=T[lang],raw=$('fa').value,a=+raw,rate=rates[cur]||+$('mr').value||0;
  const valid=raw!==''&&isFinite(a)&&a>=0&&(from!=='FIAT'||rate>0);
  $('res').classList.toggle('hidden',!valid);$('hint').classList.toggle('hidden',valid);
  $('hint').textContent=(raw!==''&&from==='FIAT'&&!rate)?L.err:L.hint;
  if(!valid)return;
  const btc={BTC:a,mBTC:a/1e3,'µBTC':a/1e6,sats:a/1e8,FIAT:rate?a/rate:0}[from];
  $('val').textContent=rate?money(btc*rate):'—';
  $('vl').textContent=L.val+' ('+cur+')';
  $('oB').textContent=nf(btc,8);$('oM').textContent=nf(btc*1e3,5);$('oU').textContent=nf(btc*1e6,2);$('oS').textContent=nf(btc*1e8,0);
}
async function getJSON(url){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}
async function load(){
  status='loading';ui();
  const got={};
  try{const d=await getJSON('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies='+CURS.map(c=>c.toLowerCase()).join(','));CURS.forEach(c=>{const v=+d.bitcoin[c.toLowerCase()];if(v>0)got[c]=v})}catch(e){}
  if(!Object.keys(got).length){try{const d=await getJSON('https://api.coinbase.com/v2/exchange-rates?currency=BTC');CURS.forEach(c=>{const v=+d.data.rates[c];if(v>0)got[c]=v})}catch(e){}}
  if(Object.keys(got).length){Object.assign(rates,got);ts=new Date();status='ok'}else status='error';
  ui();
}
$('fc').innerHTML=CURS.map(c=>`<option>${c}</option>`).join('');$('fc').value=cur;
$('fa').addEventListener('input',calc);$('mr').addEventListener('input',calc);
$('fu').addEventListener('change',e=>{from=e.target.value;calc()});
$('fc').addEventListener('change',e=>{cur=e.target.value;curTouched=true;buildUnit();ui()});
$('rf').addEventListener('click',load);
initLang(text);text();load();
setInterval(()=>{if(!document.hidden)load()},60000);
</script>
