a.", "h4": "Dobré vedieť", "lim": "<li>Pravouhlý trojuholník: zadaj ľubovoľné dve strany (odvesna a, odvesna b, prepona c).</li><li>Súčet uhlov trojuholníka je vždy 180°.</li><li>Dve strany s uhlom, ktorý nie je medzi nimi (SSU), nie je podporované, lebo môže mať dve riešenia.</li>"}, "de": {"back": "← Zurück zu den Rechnern", "ad": "Werbung", "title": "Satz des Pythagoras und Dreiecksrechner", "sub": "Berechne fehlende Seiten und Winkel eines rechtwinkligen oder beliebigen Dreiecks, samt Formeln.", "h1": "Der Satz des Pythagoras", "p1": "In einem rechtwinkligen Dreieck ist das Quadrat der Hypotenuse gleich der Summe der Quadrate der Katheten: a² + b² = c². Aus zwei beliebigen Seiten folgt die dritte, die Winkel ergeben sich aus dem Sinus: α = arcsin(a/c).", "h2": "Beliebiges Dreieck", "p2": "Für jedes Dreieck liefern der Kosinussatz c² = a² + b² − 2ab·cos γ und der Sinussatz a/sin α = b/sin β = c/sin γ die fehlenden Seiten und Winkel. Wähle drei Seiten, zwei Seiten mit dem eingeschlossenen Winkel oder zwei Winkel und eine Seite.", "note": "Winkel sind in Grad. Seite a liegt gegenüber von Winkel α, b gegenüber von β und c gegenüber von γ. Alles wird in deinem Browser berechnet; nichts, was du eingibst, wird gespeichert oder gesendet.", "h4": "Gut zu wissen", "lim": "<li>Rechtwinkliges Dreieck: gib zwei beliebige Seiten ein (Kathete a, Kathete b, Hypotenuse c).</li><li>Die Winkel eines Dreiecks ergeben stets 180°.</li><li>Zwei Seiten mit nicht eingeschlossenem Winkel (SsW) sind nicht enthalten, da sie zwei Lösungen haben können.</li>"}, "cs": {"back": "← Zpět na kalkulačky", "ad": "Reklama", "title": "Pythagorova věta a kalkulačka trojúhelníka", "sub": "Dopočítej chybějící strany a úhly pravoúhlého nebo libovolného trojúhelníku, se vzorci.", "h1": "Pythagorova věta", "p1": "V pravoúhlém trojúhelníku se čtverec přepony rovná součtu čtverců odvěsen: a² + b² = c². Ze dvou libovolných stran vyjde třetí a úhly vyplynou ze sinu: α = arcsin(a/c).", "h2": "Libovolný trojúhelník", "p2": "Pro libovolný trojúhelník dají chybějící strany a úhly kosinová věta c² = a² + b² − 2ab·cos γ a sinová věta a/sin α = b/sin β = c/sin γ. Vyber tři strany, dvě strany s úhlem mezi nimi nebo dva úhly a stranu.", "note": "Úhly jsou ve stupních. Strana a leží proti úhlu α, b proti β a c proti γ. Vše se počítá ve tvém prohlížeči a nic, co zadáš, se neukládá ani neodesílá.", "h4": "Dobré vědět", "lim": "<li>Pravoúhlý trojúhelník: zadej libovolné dvě strany (odvěsna a, odvěsna b, přepona c).</li><li>Součet úhlů trojúhelníku je vždy 180°.</li><li>Dvě strany s úhlem, který není mezi nimi (Ssu), není podporováno, protože může mít dvě řešení.</li>"}, "pl": {"back": "← Wróć do kalkulatorów", "ad": "Reklama", "title": "Twierdzenie Pitagorasa i kalkulator trójkąta", "sub": "Oblicz brakujące boki i kąty trójkąta prostokątnego lub dowolnego, ze wzorami.", "h1": "Twierdzenie Pitagorasa", "p1": "W trójkącie prostokątnym kwadrat przeciwprostokątnej jest równy sumie kwadratów przyprostokątnych: a² + b² = c². Z dowolnych dwóch boków wynika trzeci, a kąty z sinusa: α = arcsin(a/c).", "h2": "Dowolny trójkąt", "p2": "Dla dowolnego trójkąta brakujące boki i kąty dają twierdzenie cosinusów c² = a² + b² − 2ab·cos γ i twierdzenie sinusów a/sin α = b/sin β = c/sin γ. Wybierz trzy boki, dwa boki z kątem między nimi lub dwa kąty i bok.", "note": "Kąty są w stopniach. Bok a leży naprzeciw kąta α, b naprzeciw β, a c naprzeciw γ. Wszystko jest liczone w Twojej przeglądarce, a nic, co wpiszesz, nie jest zapisywane ani wysyłane.", "h4": "Warto wiedzieć", "lim": "<li>Trójkąt prostokątny: wpisz dowolne dwa boki (przyprostokątna a, przyprostokątna b, przeciwprostokątna c).</li><li>Suma kątów trójkąta zawsze wynosi 180°.</li><li>Dwa boki i kąt nieleżący między nimi (BBK) nie są obsługiwane, bo mogą mieć dwa rozwiązania.</li>"}, "fr": {"back": "← Retour aux calculateurs", "ad": "Publicité", "title": "Théorème de Pythagore et calculateur de triangle", "sub": "Trouvez les côtés et angles manquants d’un triangle rectangle ou quelconque, avec les formules.", "h1": "Le théorème de Pythagore", "p1": "Dans un triangle rectangle, le carré de l’hypoténuse est égal à la somme des carrés des cathètes : a² + b² = c². Deux côtés quelconques donnent le troisième, et les angles découlent du sinus : α = arcsin(a/c).", "h2": "Triangle quelconque", "p2": "Pour un triangle quelconque, la loi des cosinus c² = a² + b² − 2ab·cos γ et la loi des sinus a/sin α = b/sin β = c/sin γ donnent les côtés et angles manquants. Choisissez trois côtés, deux côtés et l’angle compris, ou deux angles et un côté.", "note": "Les angles sont en degrés. Le côté a est opposé à l’angle α, b à β et c à γ. Tout est calculé dans votre navigateur et rien de ce que vous saisissez n’est enregistré ni envoyé.", "h4": "Bon à savoir", "lim": "<li>Triangle rectangle : saisissez deux côtés quelconques (cathète a, cathète b, hypoténuse c).</li><li>La somme des angles d’un triangle vaut toujours 180°.</li><li>Deux côtés avec un angle non compris (CCA) ne sont pas gérés, car il peut y avoir deux solutions.</li>"}, "es": {"back": "← Volver a las calculadoras", "ad": "Publicidad", "title": "Teorema de Pitágoras y calculadora de triángulos", "sub": "Calcula los lados y ángulos que faltan de un triángulo rectángulo o cualquiera, con las fórmulas.", "h1": "El teorema de Pitágoras", "p1": "En un triángulo rectángulo, el cuadrado de la hipotenusa es igual a la suma de los cuadrados de los catetos: a² + b² = c². Con dos lados cualesquiera se obtiene el tercero, y los ángulos salen del seno: α = arcsin(a/c).", "h2": "Triángulo cualquiera", "p2": "Para cualquier triángulo, el teorema del coseno c² = a² + b² − 2ab·cos γ y el del seno a/sin α = b/sin β = c/sin γ dan los lados y ángulos que faltan. Elige tres lados, dos lados con el ángulo comprendido, o dos ángulos y un lado.", "note": "Los ángulos están en grados. El lado a es opuesto al ángulo α, b a β y c a γ. Todo se calcula en tu navegador y nada de lo que introduces se guarda ni se envía.", "h4": "Conviene saber", "lim": "<li>Triángulo rectángulo: introduce dos lados cualesquiera (cateto a, cateto b, hipotenusa c).</li><li>Los ángulos de un triángulo suman siempre 180°.</li><li>Dos lados con un ángulo no comprendido (LLA) no está incluido, porque puede tener dos soluciones.</li>"}};

];
function compute(m,v,bad){if(bad)return{e:'err'};if(!m.ok(v))return{h:1};return m.run(v)}
const gfx=(mode,v,w,un)=>{const W=420,H=260,pl=100,pr=100,py=48,f=x=>(+x.toFixed(3)).toLocaleString(lang==='en'?'en-US':lang,{maximumFractionDigits:3}),val=k=>w&&w[k]!==undefined?w[k]:v[k];
  let A,B,C,ang={};
  if(mode==='right'){let a=4,b=3;const ka=val('a'),kb=val('b');if(ka&&kb){a=ka;b=ka*Math.max(.3,Math.min(3.3,kb/ka))}
    const s=Math.min((W-pl-pr)/a,(H-2*py)/b),x0=pl+(W-pl-pr-a*s)/2,yb=(H+b*s)/2;C=[x0,yb];B=[x0+a*s,yb];A=[x0,yb-b*s];
    if(w)ang={'α':Math.asin(Math.min(1,w.a/w.c))*R2D,'β':Math.asin(Math.min(1,w.b/w.c))*R2D}}
  else{const al=(w?w['α']:50)*D2R,c=w?w.c:1,b=w?w.b:Math.sin(60*D2R)/Math.sin(70*D2R),cx=b*Math.cos(al),cy=b*Math.sin(al),mn=Math.min(0,cx),mx=Math.max(c,cx),
      s=Math.min((W-pl-pr)/(mx-mn),(H-2*py)/cy),ox=pl+(W-pl-pr-(mx-mn)*s)/2-mn*s,oy=(H+cy*s)/2;A=[ox,oy];B=[ox+c*s,oy];C=[ox+cx*s,oy-cy*s];if(w)ang={'α':w['α'],'β':w['β'],'γ':w['γ']}}
  const G=[(A[0]+B[0]+C[0])/3,(A[1]+B[1]+C[1])/3],nrm=(p,q)=>{const d=Math.hypot(p[0]-q[0],p[1]-q[1])||1;return[(p[0]-q[0])/d,(p[1]-q[1])/d]},
    tx=(x,y,s,col,anc)=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" fill="${col}" text-anchor="${anc}" font-size="12.5" font-weight="600">${s}</text>`;
  const lab=(k,isA)=>{let x=val(k);if(x===undefined&&isA)x=ang[k];const col=v[k]!==undefined?'#ffffff':x===undefined?'#8b94a7':'#2ee6a6';return[x===undefined?k:`${k} = ${f(x)}${isA?'°':' '+un}`,col]};
  let o=`<polygon points="${A.map(x=>x.toFixed(1))} ${B.map(x=>x.toFixed(1))} ${C.map(x=>x.toFixed(1))}" fill="rgba(46,230,166,.08)" stroke="#2ee6a6" stroke-width="2.5" stroke-linejoin="round"/>`;
  for(const[P,Q,k]of[[B,C,'a'],[C,A,'b'],[A,B,'c']]){const m=[(P[0]+Q[0])/2,(P[1]+Q[1])/2],n=nrm(m,G),[s,col]=lab(k,false);
    o+=tx(m[0]+n[0]*12,m[1]+n[1]*12+(n[1]>.35?10:n[1]<-.35?-2:4),s,col,n[0]<-.35?'end':n[0]>.35?'start':'middle')}
  for(const[V,k]of[[A,'α'],[B,'β'],[C,'γ']]){if(mode==='right'&&k==='γ')continue;const n=nrm(V,G),[s,col]=lab(k,true);
    o+=tx(V[0]+n[0]*16,V[1]+n[1]*16+(n[1]>.35?11:n[1]<-.35?-2:4),s,col,n[0]<-.35?'end':n[0]>.35?'start':'middle')}
  if(mode==='right'){const u=nrm(B,C),q=nrm(A,C),p=(a,b)=>[C[0]+u[0]*a+q[0]*b,C[1]+u[1]*a+q[1]*b];o+=`<path d="M${p(14,0).map(x=>x.toFixed(1))} L${p(14,14).map(x=>x.toFixed(1))} L${p(0,14).map(x=>x.toFixed(1))}" fill="none" stroke="#8b94a7" stroke-width="1.5"/>`}
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="triangle" style="width:100%;max-width:420px;display:block;margin:0 auto">${o}</svg>`};
/*UI*/
let cur=0;const uo=()=>UN[+$('un').value||1];
function fields(){const m=MODES[cur],old={},u=uo();document.querySelectorAll('#fl input').forEach(i=>old[i.dataset.v]=i.value);
  $('fl').innerHTML=m.f.map(([v,w])=>`<div><label class="block text-sm" style="color:#8b94a7">${L('w_'+w)} <i>${v}</i></label><div class="field mt-2"><input data-v="${v}" type="number" inputmode="decimal" min="0" step="any" value="${old[v]!==undefined?old[v]:''}"><span>${w==='ang'?'°':u}</span></div></div>`).join('')}
function calc(){const m=MODES[cur],v={};let bad=false;
  document.querySelectorAll('#fl input').forEach(i=>{if(i.value==='')return;const x=parseFloat(String(i.value).replace(',','.'));if(isFinite(x)&&x>0)v[i.dataset.v]=x;else bad=true});
  const h=$('hint'),er=$('err'),rs=$('res');h.classList.add('hidden');er.classList.add('hidden');rs.classList.add('hidden');
  const o=compute(m,v,bad);$('gfx').innerHTML=gfx(m.k,v,o.w,uo());
  if(o.h){h.textContent=L(m.k==='right'?'hintr':'hint');h.classList.remove('hidden');return}
  if(o.e){er.textContent=L(o.e);er.classList.remove('hidden');return}
  const un=uo();rs.innerHTML=o.rows.map((r,i)=>{const u=r.t==='g'?'°':r.t==='s'?un+'²':un;
    return `<div class="rounded-xl p-4" style="background:rgba(255,255,255,.04)"><p class="text-sm" style="color:#8b94a7">${L(r.l)} ${r.x}</p><p class="${i?'text-2xl':'grad text-4xl'} font-bold">${fmt(r.val)} <span class="text-base font-semibold" style="color:#8b94a7;-webkit-text-fill-color:#8b94a7">${u}</span></p><p class="mt-1 text-xs" style="color:#667085">${r.f} = ${sub(r.f,o.w)} = ${fmt(r.val)} ${u}</p></div>`}).join('');rs.classList.remove('hidden')}
function text(){baseText();$('pl').textContent=L('pick');$('ul').textContent=L('unit');const cu=$('un').value||'1';$('un').innerHTML=UN.map((u,i)=>`<option value="${i}">${u}</option>`).join('');$('un').value=cu;
  $('sh').innerHTML=MODES.map((s,i)=>`<option value="${i}">${L('m_'+s.k)}</option>`).join('');$('sh').value=cur;fields();calc();syncLang()}
$('sh').onchange=e=>{cur=+e.target.value;$('fl').innerHTML='';fields();calc()};
$('un').onchange=()=>{fields();calc()};
$('fl').addEventListener('input',calc);
initLang(text);text();

</script>
</body>
